            'Tanto la Luna astrológica, como la del arcano mayor asociado, nos recuerdan la inmensa emocionalidad y sensibilidad de estos arquetipos. Como resultado, tendrá que aprender a fortalecer su carácter y a filtrar energías, palabras y emociones de los demás.',
            'Sus síntomas se deben, de tanto en tanto, a un pasado doloroso aún no sanado: por lo tanto, para curarse, tendrá que volver al pasado, al momento del choque emocional y resolverlo o, como alternativa, simplemente desinstalar las creencias relacionadas con ese momento, utilizando las herramientas terapéuticas que hoy tenemos a nuestra disposición, suelen ser opciones excelentes para recuperar la armonía perdida. Los Registros Akáshicos, suponen una excelente herramienta terapéutica para un 18.',
            'En sus aspectos más extremos, cuando no se desconecta por completo de la magia y de la espiritualidad, puede llegar a conectar con fuerzas oscuras, magia negra o vudú.',
            'En su estructura energética, sus puntos débiles serán probablemente el sexto y séptimo chakra, pero, en general, tendrá que cuidar de su estructura en su totalidad, ya que suele estar sujeto a ataques psíquicos por las energías del bajo astral y del inconsciente colectivo.'
        ],
        astrologia: [
            'En Astrología, el Arquetipo 18 y el arcano mayor, La Luna, coinciden con el elemento planetario Luna y con el signo de Cáncer, que representan al ser interior y toda su emotividad. De alguna manera, este arquetipo nos lleva a la parte más profunda del ser humano y a las emociones más invisibles, escondidas y relegadas en nuestro inconsciente.'
        ],
        hebrea: [
            'La letra hebrea TZADÈ es la encargada de enseñarnos la diferencia entre la justicia humana y la justicia divina. Gracias a la meditación con esta letra, reforzamos nuestra práctica espiritual para elevarnos por encima del caos y del desorden que gobierna, aparentemente, el plano terrenal. Comprender y manifestar la verdadera justicia nos ayuda a poner orden en este mundo, corrigiendo así el error que estamos llamados a corregir. Al mismo tiempo, nos recuerda la importancia de la piedad y de la misericordia entre todos los hermanos, especialmente hacia los colectivos más débiles: los enfermos, los huérfanos, los pobres.'
        ]
    },
    19: {
        nombre: 'El Sol',
        hebreo: 'Qof',
        imagen: 'Cartas Tarot/19.png',
        positivas: ["Luz", "Paz", "Armonía", "Sol", "Iluminar", "Guía", "Modelo ejemplar", "Referente", "Visibilidad", "Transparencia", "Día", "Padre", "Coherencia", "Ejemplar", "Líder"],
        negativas: ["Prepotencia", "Arrogancia", "Problemas con la autoridad", "Falta de armonía", "Ruidos", "Mediocridad", "Caos", "Narcisismo", "Dictadura", "Déspota", "Incoherencia", "Ambigüedad", "Desvalorización", "Falta de moral", "Baja vibración"],
        descripcion: [
            'Así como al final de la noche amanece la luz del día, el 18 se retira para dar paso al número 19, cuyo arquetipo, el sol, está destinado a brillar en todo su esplendor. Con la energía de este número nos quedamos, a diferencia de su predecesor, en pleno día. Cualquier actividad funcionará mejor durante las horas de luz.',
            'Así como el 18 resuena con las fases y los ciclos lunares, el 19 se mantendrá en equilibrio siempre y cuando respete los movimientos solares. Esto se traduce en la necesidad inconsciente de concentrar, en la medida de lo posible, sus actividades diarias de mayor gasto energético —sea físico o intelectual— entre el amanecer y el atardecer.',
            'A nivel simbólico, es fundamental que, lo que haga, sea siempre "a la luz del sol", es decir, visible, transparente y dentro de los márgenes de la legalidad. En otras palabras, sus tendencias y necesidades le llevarán a ser un modelo ejemplar de comportamiento, ya que, entre sus valores están la transparencia y la coherencia.',
            'En este arquetipo, podemos observar que su comportamiento ejemplar podrá provocar cierta admiración a su alrededor. Las personas de su entorno comenzarán a proyectar en él, a menudo, la figura paterna. Así como el número 18 encarnaba el arquetipo materno, el 19 representa el arquetipo paterno. De hecho, el sol es el astro alrededor del cual todos los planetas orbitan, siendo el centro del sistema solar del que todos dependen. Esto significa que, en muchos casos, se encontrará iluminando, simbólica y generosamente, el camino de sus amigos, vecinos y compañeros, teniendo muchos "hijos simbólicos" que verán en él (o ella) al padre que nunca tuvieron.',
            'Gracias a esta manifestación tan peculiar, el 19 parece saber cosas que, para los demás, son vitales, por lo que será buscado, naturalmente, para dar consejos, recomendaciones, explicaciones y enseñanzas sobre los temas más variados. Esta habilidad, quizás, le venga del 9, que tiene incorporado en su interior como el gran sabio y confesor, y del 1, que simboliza guía y liderazgo. Ante un 19, la gente se abre, se confiesa y se hace transparente de inmediato, ya que las cualidades del sabio anacoreta del 9 se exaltan en este arquetipo, convirtiéndolo en el padre confesor. En su más alto estadio de consciencia, no hay nada que quede oculto a los ojos de un 19, porque la luz del sol, ilumina cada rincón oscuro.',
            'A nivel biológico, el padre es el encargado de romper el Complejo de Edipo entre la madre y el hijo en un momento determinado de la infancia. El 19 encarnará este rol en sus relaciones, con el objetivo de enseñar cómo funciona el mundo fuera de casa y lejos de los brazos seguros y confortantes de mamá. Esto ocurre en su estado natural del ser y, por esta razón, es importante entender que, si en una relación de pareja surge este arquetipo, los roles de "padre" y "modelo" pueden ir intercambiándose según sea necesario. En sus relaciones, además, suele ser un caballero, noble, generoso y protector.',
            'Adicionalmente, el rol del padre nos lleva también a la figura de la autoridad ejemplar. En armonía, puede ser un buen director o un excelente ejecutivo: puede, así, poseer un rol de mando en una comunidad, asociación o colectividad, e incorporar modelos y sistemas de comportamiento para mejorar operaciones y dinámicas. Además, sabe manifestar grandes dones de liderazgo heredados del 1, empatía y compañerismo legados por el 9, y encarnar la figura del padre protector del 10.',
            'Otro aspecto importante de este número es la luz, tanto real como simbólica. Si el reino del 18 era el inconsciente, el 19 tiene la capacidad de convertir el inconsciente en consciente, la oscuridad en luz y, lo olvidado, en recordado. En este sentido, puede tener intereses o profesiones relacionadas con terapias para el crecimiento personal o profesional, enseñanza y acompañamiento. Técnicas como hipnosis, regresiones, constelaciones familiares o todo tipo de terapia que haga luz en la oscuridad, que lleve a la luz algún recuerdo reprimido, algún secreto o que ilumine simbólicamente, pertenece al reino del sol. Además, tiene un don para decirles a los demás, con las palabras y tonos adecuados, cómo comportarse y cómo mantener su coherencia emocional para que puedan conseguir paz y armonía en sus vidas. De hecho, la gente suele buscarle inconscientemente como un referente, guía o consejero. Otros oficios pueden tener que ver con iluminar los espacios o las personas para llevarlos a un nivel superior, sacando todo su potencial y aprovechando los recursos internos de cada uno. Un 19 suele mejorar lo que toca y la vibración del lugar donde entra. Es luz, y tan sólo con su propia vibración, está cambiando el entorno.',
            'Asimismo, podríamos encontrar profesiones en el sector eléctrico, en el cual, a nivel inconsciente, se repara o se busca la figura paterna. Todo lo relacionado con la electricidad, habla de mi relación con el padre y con la luz. El perfil ideal será, posiblemente, como autónomo, emprendedor o freelance: un 19 no ama mucho tener a alguien por encima de él y, si lo tiene, es muy importante que mantenga su autonomía dentro de su departamento. El sol no es subordinado de nadie, ama iluminar a los planetas, pero no gira alrededor de ellos. Esto también se aplica a las amistades y todas sus relaciones: un 19 estará siempre ahí para ti, pero nunca detrás de ti. Tiene un profundo sentimiento de amor propio y, si su luz no es apreciada y valorada, no tarda nada en ir a iluminar otro pedacito de universo que permanezca, quizás, aún inexplorado.',
            'Haga lo que haga, un 19 siempre buscará la excelencia. En el Tarot, El Sol es símbolo de energía y calor. Cuando este arquetipo está en armonía, suele tener mucha energía e ideas, transmitiendo paz y armonía en su entorno (de ahí el símbolo de la bombilla encendida, asociado a una buena idea). La luz del sol da vida a un universo entero y, de la misma manera, la energía que desprende un 19, sobre todo en su mayor estado de consciencia, influye positivamente en las personas y lugares, generando una onda energética vibracional a su alrededor.',
            'Cabe añadir que la paz y armonía que este arquetipo transmite también son necesarias para él mismo. Disfruta de la soledad, ama el silencio, el orden y la tranquilidad. Si fuera música, sería instrumental, sin palabras que contaminen la melodía. Es sensible a los gritos y ruidos, eligiendo espacios tranquilos en su trabajo, casa o vida social. Necesita aislarse para recargarse y puede desaparecer un tiempo, para luego volver a amanecer. Recordemos que ambos números, el 18 y el 19, han absorbido ciertos aspectos del 9, y el retiro en la cueva simbólica es recurrente en ellos. Ambos, el sol y la luna, aparecen y desaparecen todos los días.',
            'El arcano asociado de El Sol nos presenta dos gemelos que representan la dualidad del ser humano en perfecto equilibrio y armonía. Estos elementos evocan las polaridades de lo femenino y lo masculino, de la Luz y la Sombra, que se encuentran en equilibrio en nuestro interior. Aquella personalidad con un 19 en su Mapa estará llamada a fusionar estos opuestos para transformarse en un ser humano ideal, recordando su origen divino plasmado en la Tierra. Iluminar su propio lado oscuro es uno de los objetivos principales para esta personalidad que, con el tiempo tendrá, que aprender que con la oscuridad no hay que luchar sino, más bien, será necesario iluminarla.',
            'El 19 ha venido a enseñarnos a que nos convirtamos en el centro de nuestro propio universo, así como a ser los protagonistas y cocreadores de nuestra propia vida. La Cábala nos recuerda, a través de este arquetipo, que el Ser Humano es el último de las creaciones de Dios y que tiene el dominio sobre todo lo que fue creado antes que él: tierras, mares, plantas, animales e incluso los planetas, están por debajo de su dominio. El problema es que hemos olvidado quiénes somos realmente — herederos de Dios— y que toda la creación nos pertenece y está sujeta a nuestra voluntad. El 19, nos recuerda nuestra herencia divina y nos invita a mantener un modelo de comportamiento ejemplar e impecable, que refleje, lo más posible, a la divinidad de la cual provenimos.',
            'Si seguimos con el análisis de este arquetipo, encontramos una energía solar muy potente, pero mejor gestionada y más armoniosa que la del Arquetipo 15, más bien instintiva y terrenal. Esa esfera de energía primitiva que ardía en el interior del arquetipo del Diablo, en el del Sol ha, finalmente, madurado. De una manera muy parecida al proceso de creación de la piedra filosofal, esta energía ha pasado por todas las etapas necesarias: estalló a través de la Torre del 16, dando un salto hacia la luz de las estrellas del arquetipo 17, se refinó en la luz de la luna del 18 y siguió su ruta exaltando su poder y potencial, finalmente fusionados en la luz del 19. Por esta razón, es imperativo que este número encuentre formas de descargar su energía, ya sea a través de actividades físicas que fusionen fuerza, técnica, resistencia y autocontrol, como por ejemplo, las artes marciales, la natación, el atletismo o la calistenia. Este tipo de actividades deportivas genera, al mismo tiempo, una mezcla de fuerza y armonía, que son típicas de esta vibración. Mantener una disciplina constante en el tiempo y afinar alguno de estos deportes, le permitirá conectar con la vibración del perfeccionamiento de uno mismo. Mejorando la técnica, poniéndose a prueba cada día más, en realidad está perfeccionando su propio modelo de comportamiento.'
        ],
        sombra: [
            'Cuando se activa la Máscara del 19, es porque no se ha respetado el modelo de comportamiento que proviene de su sistema de creencias y valores. Una gran incoherencia o varias pequeñas incoherencias se han apoderado del control de la personalidad y, la luz del sol, que suele brillar y calentar, de repente comienza a quemar por dentro y por fuera.',
            'Todas aquellas cualidades que hemos visto en su estado armonioso desaparecen en el caso de una desarmonía, convirtiendo a este arquetipo en un déspota insensible, un padre castrador y autoritario, o bien un modelo disfuncional de comportamiento. La falta de paz interior se proyectará hacia fuera, generando caos y dolor en su entorno o atrayéndolos hacia sí mismo.',
            'La Sombra, en el 19, puede llegar a ser muy densa, porque la falta de la más mínima luz genera, siempre, la más profunda oscuridad. Por esta razón, hay que recordar, en todo momento, que también es cierto lo contrario: la llama más pequeña es capaz de iluminar los espacios más oscuros. Este será el recurso más valioso para este arquetipo cuando no esté en armonía.',
            'Como consecuencia, cuando el dolor o la resistencia aparecen en la vida del 19, puede que estén relacionados con temas de autoridad, conflictos con la figura paterna real o simbólica — como un jefe o un tutor—, o cierta dificultad para seguir los ciclos solares naturales —como en el caso de un trabajador nocturno. Además, como hemos visto antes, puede ser muy sensible a la falta de armonía, orden y tranquilidad en aquel espacio donde pasa más tiempo. Recuerda que este arquetipo es muy sensible al ruido, al desorden y a la desorganización. Para estar bien, necesita paz, armonía y tranquilidad en todo momento.',
            'Quizás, sufra por la falta de luz, de transparencia, o por tener que vivir una relación secreta, debido a temas de mentiras o engaños, circunstancias poco claras o conflictos de visibilidad (como hablar en público o delante de las cámaras). En estos casos, siempre será importante investigar los patrones heredados por su lado paterno y liberarlos.',
            'Es importante recordar que nuestro sol ilumina al mundo entero y a todos los planetas. Por lo tanto, podría haber cierta dificultad o algún bloqueo en encontrar el valor necesario para brillar a esos niveles y presentarse en un escenario. Un 19 conlleva un poco de 10 (1+9) y puede tener cierto miedo a manifestar la grandeza en su interior, creyéndose que, efectivamente, es el centro del sistema solar.',
            'En la Sombra, su altruismo y generosidad también desaparecen, dando lugar a una personalidad egoísta, arrogante, presuntuosa o narcisista. Además, pueden surgir conflictos con la autoridad, la policía o el estado (que simbólicamente representa la figura paterna), así como con aquellas personas en posiciones de superioridad en el ámbito laboral o social.',
            'En la Máscara pueden surgir actitudes paternalistas, controladoras o carentes de ética. La excelencia se transforma en mediocridad y, consciente o inconsciente, de su papel como centro del universo, podrá manifestar su inseguridad buscando constantemente atención y aprobación, o, por el contrario, sentirse superior a los demás.',
            'Dado que son muy sensibles a los ruidos, a los sonidos altos o estridentes y a los espacios caóticos, en caso de algún bloqueo, pueden atraer precisamente estas circunstancias, lo que les invita a tomar conciencia de algún tema no respetado propio de este arquetipo. Así que, pueden experimentar problemas de audición o estrés debido a la falta de un espacio tranquilo donde poder descansar y recargarse.',
            'La inactividad, el sedentarismo y el agotamiento pueden aparecer cuando hay bloqueos o resistencias, por lo que es fundamental identificar rápidamente la causa para trascenderla y recuperar la armonía. Las posibles patologías que podría desarrollar alguien con este arquetipo están más relacionadas con cambios en el comportamiento o también con relaciones desarmónicas, más que con síntomas físicos en sí.',
            'Lo más rápido, para volver a recuperar su armonía, es alejarse hacia un lugar tranquilo, volver a "su cueva" un momento para conectar otra vez con su paz interior y también, empezar a practicar algún deporte o actividad física, para poder salir de su estado de estaticidad.',
            'El chakra más sensible suele ser el cuarto (el chakra del corazón), ya que es el centro operativo de su luz interior.'
        ],
        astrologia: [
            'Entre los planetas astrológicos, el 19 es representado evidentemente por el Sol —igual que en los arcanos— y su signo zodiacal asociado es Leo. Este signo y su regente, nos hablan de la excelencia, del liderazgo, de la capacidad de brillar y hacer brillar a los demás: sin la luz del sol, no hay vida.'
        ],
        hebrea: [
            'La Cábala, a través de la letra hebrea QOF asociada a este arquetipo, nos enseña la necesidad de tomar consciencia de que estamos hechos a imagen y semejanza de Dios. Solo recordando nuestro origen divino podemos generar abundancia y prosperidad, creando un verdadero paraíso en la Tierra. Esta letra significa "mono", un animal que imita al ser humano, invitándonos a imitar al Creador, abandonando nuestros instintos animales y elevando nuestra consciencia a un nivel superior. Meditando con esta letra, nos acercamos a este objetivo y equilibramos el arquetipo en nuestra estructura, moldeando nuestro comportamiento hacia la excelencia.'
        ]
    },
    20: {
        nombre: 'El Juicio',
        hebreo: 'Reish',
        imagen: 'Cartas Tarot/20.png',
        positivas: ["Reconocimiento", "Personaje público", "Escenario", "Colectividad", "Valoración", "Visibilidad", "Redes sociales", "Exponerse", "Seguidores", "Público", "Audiencia", "Descubrimientos", "Misterios", "Enigmas", "Transparencia"],
        negativas: ["Juicio", "Críticas", "Desvalorización", "Maltrato", "Abuso", "Inseguridades", "Inexistencia", "Manipulable", "Falta de reconocimiento", "Querer demostrar", "Secretos familiares", "Baja autoestima", "Problemas de imagen", "Conspiraciones", "Problemas en articulaciones"],
        descripcion: [
            'Con este número, empezamos una nueva serie, abandonando el ciclo del 1 (del 10 al 19) y entrando en los dominios del 2.',
            'Antes de todo, debemos recordar los temas principales del segundo arquetipo que aquí se exaltan y serán siempre presentes: la valorización, la sensibilidad al juicio de los demás y los grandes misterios. Sin embargo, a diferencia del 2, aquí nos encontramos con un nuevo cero. Si en el décimo arquetipo se resaltaba la conexión del individuo con Dios, aquí el cero enfatiza la conexión del individuo con la colectividad y los grupos. Por lo tanto, su armonía no dependerá del juicio u opinión de una sola persona, sino de grandes grupos. Así, observamos que, como el 2 necesita que el otro le diga quién es, el 20 necesita que los otros le digan quién es. Ahora que el 19 ha hecho visible lo invisible, los arquetipos que nacen a partir del 20 en adelante vibran con el todo, con las masas, con la multitud y con la colectividad. Con este arquetipo nos encontramos en un mundo global, no local.',
            'El 20 suele ser un personaje público, acostumbrado a estar frente a multitudes y a relacionarse con las masas. Su arquetipo anterior, el 19, ya se encargó de iluminar el mundo entero y, ahora que todo y todos son visibles, esta esencia está llamada a relacionarse, con su totalidad, desde un escenario real o simbólico.',
            'Esta personalidad tiende a buscar a un público en todo momento, a hablarle a las masas, a ponerse en el centro de atención, habiendo integrado a la perfección el arquetipo de la visibilidad heredado por su antecesor. Cuando se encuentra delante de la multitud, en su inconsciente, está buscando un reconocimiento que nunca tuvo en su familia. Igual que el 2 del cual proviene, solo se conoce a sí mismo a través de los demás. Por esta razón, el juicio de las personas a su alrededor tendrá el poder de exaltarlo o hundirlo, según el caso. Su mayor reto es aprender, igual que el 2, que tiene un valor inestimable que nadie le puede cambiar para mejor o peor, porque su propio valor viene de adentro, no del juicio o percepciones de los demás. Una vez comprendido esto, el 20 puede ser una fuente de gran inspiración. Cuando se encuentre en un escenario o en un escaparate real o simbólico, se le invita a recordar que lo que ve su público y sus seguidores, solo es la interpretación de un fragmento de una percepción de una mínima parte de lo que realmente es. Su valor y su propio significado, se lo tendrá que dar uno mismo, sin la tendencia a fluctuar según los juicios de la gente.',
            'El arcano del Tarot que se presenta ahora, El Juicio, ya no es individual como hemos dicho antes, sino universal. Observando esta figura, evocamos de inmediato al dictamen bíblico del fin del mundo y el momento de la resurrección de los muertos. Lejos de ser así en la realidad, el significado es más complejo de lo que parece. En el Juicio Universal que conocemos —y que quizás algún día nos espera— todos seremos juzgados por Dios por nuestros pecados. Sin embargo, este arquetipo nos recuerda que somos una expresión de Dios juzgándonos a nosotros mismos y que algo como el juicio divino, tal y como nos han contado, no existe. Dios no juzga, Dios/Universo/Consciencia/Amor solo ama. Lo que nos queda claro es que el único juicio que hay es aquel emitido desde la noche de los tiempos por el ser humano, hacia sí mismo y sus hermanos, en todo momento.',
            'El Juicio Final que describe este arquetipo es aquel hábito disfuncional que hemos heredado, una vez encarnados en el mundo físico. Parece que casi no hay manera de no juzgar a nuestro prójimo, ni a nosotros mismos. Este arquetipo nos recuerda que el ego necesita juzgar para fortalecerse y sobrevivir: este requiere juzgar la realidad que crea real cuando, en verdad, lo que observamos afuera de nosotros solo es un reflejo de lo que llevamos en nuestro interior. Este arquetipo ha venido a enseñarnos que, en el momento en que caemos en la trampa del ego, y creemos lo que nos están diciendo o lo que estamos viviendo, nos hemos equivocado otra vez y que tenemos que corregir el error cometido. El error que el 20 ha venido a reparar es, justamente, recordar que, si queremos conocer el valor que nos damos a nosotros mismos, solo hay que observar el mundo físico y la realidad aparente que proyectamos. Los juicios, los halagos, las críticas y las opiniones de la gente son justamente el punto débil de este arquetipo. Tendrá que estar alerta en todo momento a estos factores, sin caer en la trampa.',
            'En este sentido, el desafío de este arquetipo es recordar que es perfecto tal y como es, en lugar de buscar constantemente la valoración y el reconocimiento de los demás. Su objetivo es liberarse finalmente de la creencia de que necesita ser visto y ser juzgado para existir, que solo si la gente le da valor y le aprecia podrá conocerse a sí mismo y merecer un sitio en este mundo. Su sitio en el mundo lo heredó en el momento de su propia concepción, y se reafirmó el día de su nacimiento, sea o no sea reconocido por sus padres o familia.',
            'Si observamos bien la carta del arcano asociado, veremos la imagen de una familia —padre, madre, hijo— que nos habla sobre un renacimiento, pero en el espíritu. Si nos fijamos en la mirada de la mujer hacia el hombre y de la mirada del hombre hacia el ángel del Juicio, nos damos cuenta de que la validación para el resurgimiento de ese hijo no le viene de los padres, sino de ese poder superior divino del cual proviene. Por esta razón, este arquetipo tendrá que aprender a deshacerse de toda creencia relacionada con su necesidad de ser validado por los demás y, únicamente, podrá lograrlo recordando su origen divino.',
            'La sensibilidad que tiene este arquetipo con la opinión pública deriva, sin duda, de una memoria transgeneracional o, de su proyecto sentido, con relación a una profunda falta de reconocimiento que será preciso investigar, comprender, sanar y liberar. Su proceso de sanación, antes o después, le llevará a curar las heridas heredadas de aquellos antepasados que, quizás, fueron exiliados, juzgados, apartados, desterrados u olvidados, o de aquellos que nacieron de manera "ilegítima" fuera del matrimonio y que nunca recibieron ese tipo de validación. Cuando un hijo no es reconocido por su padre o por su madre, emprenderá una búsqueda constante para satisfacer ese vacío que afectará todas las áreas de su vida, especialmente en las relaciones. Tendrá que descubrir que, en realidad, ese vacío solo puede ser colmado por sí mismo, tomando consciencia de que, en el momento en que el soplo de la Vida le trajo a este mundo, hubo una fuerza poderosa, misteriosa y divina que así lo quiso. Vino al mundo porque fue deseado y creado por la Consciencia Divina, y es amado y reconocido de manera incondicional en todo momento. Nada más importa.',
            'Continuando con el análisis, aparte de ser un personaje público, el 20 representa el gran investigador de los arquetipos. Para esta personalidad, investigar es sinónimo de reconocer, es decir, de "conocer de nuevo". Seguimos con la misma búsqueda, pero en un sentido más profundo. El potencial heredado del 2 es el de desvelar secretos y misterios, descubrir lo que aún queda oculto bajo la superficie del mar, en la profundidad de los océanos, donde la luz del sol del 19 no llega. En ocasiones, se sentirá atraído hacia aquellas circunstancias donde sea preciso descubrir algo oculto o resolver un enigma gracias a su profunda capacidad de discernir lo real de la mentira. Por un lado, se puede convertir en un amante de la navegación, del buceo, de los enigmas y misterios de las profundidades marinas. Un 20 es el Capitán Nemo de los arquetipos, el Marco Polo de la Numerología y el Cristóbal Colón de las personalidades. Se trata de un excelente descubridor, un extraordinario explorador y asombroso investigador. Todos los misterios y secretos del arquetipo 2, en el 20, explotan hacia fuera. Nada se quedará oculto, nunca más, cuando un 20 desate todo su potencial. Por otro lado, representa, también, la resurrección de nuestro pasado, de nuestro origen. Ha venido aquí y ha traído consigo mismo el "Apocalipsis", la revelación. El Libro de los Misterios que custodiaba celosamente la Sacerdotisa del arcano número 2, ahora está puesto a disposición de toda la humanidad. Ya no hay enigmas, todo conocimiento está al alcance de todos: ahora todo es visible y es para todos.',
            'En un nivel más mundano, un 20 puede disfrutar de los populares escape rooms, de los juegos de acertijos, adivinanzas y enigmística, porque estimulan todos estos aspectos. Por otro lado, sus intereses podrían llevarle a resolver los misterios de su árbol genealógico y de las historias de sus antepasados. Su sistema se relaja y se equilibra gracias a la investigación, a los descubrimientos y a la resolución de los grandes enigmas de la humanidad. Por esta razón, no será difícil encontrar personalidades fascinadas por los misterios de las pirámides de Egipto, por las historias sobre el Triángulo de las Bermudas, por las antiguas civilizaciones de Atlántida, Lemuria o Agartha, o por la arquetípica búsqueda del Santo Grial.',
            'En las relaciones amorosas, será importante, igual que para el número 2, la validación mutua y la importancia de los pequeños detalles y de los mínimos gestos que alimenten, y reafirmen, el afecto y el aprecio recíproco. Habrá que tener en cuenta su sensibilidad con las palabras utilizadas en las conversaciones, ya que estas pueden tener el poder de exaltarlo, o hundirlo, con solo un par de sílabas. Sin embargo, un 20 bien equilibrado podrá aprovechar cada juicio o comentario, recordando que, su valor, nadie se lo da, ni nadie se lo quita. Además, puede ser importante para este arquetipo que la pareja sea visible y que sea "reconocida" en la sociedad o en las redes sociales. En ningún caso, soportaría una relación secreta o a la que no se le dé el "justo" valor, nombre o etiqueta.',
            'Con respecto a otros posibles intereses o profesiones, pueden darse arqueólogos, inspectores de policía, conferenciantes, actores, bailarines, marineros, políticos, publicistas y todo lo que tenga que ver con tener un gran público delante, o un misterio por resolver. Hoy en día, las redes sociales son su medio favorito para alcanzar visibilidad y conseguir seguidores. De hecho, muchos influencers o youtubers pueden tener más de un 20 en sus esquemas, puesto que un seguidor equivale a un "validador" y, cuanto más tiene, más reconocido se sentirá. Sin duda, siempre se tratará de personas muy sociables y que inspiran confianza, siempre y cuando el arquetipo esté en armonía y no esté sujeto a ningún bloqueo.',
            'Si nos quedamos con el mayor potencial que este arquetipo tiene, es el de llevar a la gente a un nuevo despertar, a un beneficioso renacimiento. Para hacer esto, tendrá que llegar a comprender que, en la figura del arcano del Juicio, él no solo es el niño que renace, sino también sus padres, e incluso el mismo ángel del paraíso que lleva la trompa del despertar. Se trata de invertir el significado del arcano y comprender que ya no necesita ser juzgado ni valorado por nadie, que Dios lo ama tal y como es. Su misión, una vez comprendido esto, es conseguir que todos los demás recuerden quiénes son, que se reconozcan y valoren a sí mismos, que se observen y se investiguen, para recordar finalmente que el juicio universal del fin del mundo de eso trata: el fin del juicio y el renacimiento a una nueva vida. El potencial del 20 es integrar que todos somos el espejo de todos, que todos somos uno y que si juzgamos o creemos en el juicio de los demás, nos estamos engañando a nosotros mismos. La media naranja del 2 que llevaba a la unidad, aquí es transformada en el espejo universal. No solo tú y yo somos uno, sino tú, yo y todos los demás. Este es su objetivo final.'
        ],
        sombra: [
            'Las dificultades de este arquetipo aparecen, naturalmente, en torno a la falta o búsqueda de reconocimiento y a los sentimientos de profunda desvalorización. Como podemos intuir, le dolerán mucho las críticas de los demás, y su mecanismo de defensa podría llevarlo a moverse en el mundo de las críticas, de los juicios y de los insultos.',
            'Cuando sufre, puede ser por su autoestima muy baja, por sentirse insuficiente o por no estar a la altura. Puede que sufra al no poder descubrir la causa de sus problemas y patrones recurrentes, y por no poder resolver un determinado misterio. En ocasiones, puede tener miedos o resistencias por hablar en público, o todo lo contrario: convertirse en un adicto a los escenarios y a las redes sociales, buscando constantemente reconocimiento por no haber sanado su herida paterna o materna. En todo caso, será una persona muy influenciable y extremadamente sensible.',
            'Entre los comportamientos de defensa típicos de la Máscara, pueden surgir deseos o miedos de no querer ser visto, conflictos de visibilidad o invisibilidad heredados del arquetipo 19, o incluso conflictos de inexistencia y creencias de "no merecer vivir". También pueden presentarse los opuestos, es decir, conflictos de superego con programas de megalomanía o histrionismo.',
            'Para sanarse y volver a equilibrar su sistema, puede empezar con algo muy sencillo, como recoger todos los premios, medallas, diplomas y reconocimientos que haya conseguido a lo largo de su vida y exponerlos en lugares visibles de la casa o del trabajo. A nivel inconsciente, el estímulo de ver a menudo esos "reconocimientos" le hará bien al alma, y le aportará serenidad y armonía. Las medallas y los premios, símbolos de valoración por parte de los demás, estimulan la vibración del reconocimiento en nuestro inconsciente, puesto que la mente funciona con símbolos, asociaciones mentales, metáforas y analogías.',
            'Un 20 es la energía de la colectividad, por eso tiene que aprender a elegir las compañías con las cuales suele pasar su tiempo. Si se rodea de personas que, no solo no le valoran, sino que viven en la crítica y el juicio constantes, tarde o temprano, su alma estará tan envenenada que se cargará todo su sistema emocional. A este propósito, se dice que somos el promedio de las personas con las cuales nos relacionamos. Somos el resultado de la mezcla de nuestras relaciones. Por esto te invito a observar las personas con las cuales sueles relacionarte, y preguntarte entonces, si te gusta lo que ves, o quieres cambiar algo.',
            'La recomendación que le quiero hacer a este arquetipo es reflexionar —y actuar— sobre esta perla de sabiduría atribuida al filósofo chino Confucio:',
            'Si eres la persona más inteligente en una habitación, entonces estás en la habitación equivocada.',
            'Puedes cambiar ese "más inteligente" por aquello que necesitas poner en orden o aprender. Evidentemente, si te rodeas de catetos, tu inteligencia se verá afectada, y bastante. Lo mismo ocurre si te rodeas de personas que comparten hábitos negativos o limitantes. La vibración del grupo, determinará tu vibración personal. Por esta razón, es fundamental que este arquetipo —en realidad todos— comprenda que si de verdad quiere aprender a valorarse y a evolucionar, se tendrá que rodear de personas que admira y que son un referente para él. Si queremos aprender algo, lo ideal es rodearnos de personas que dominen ese algo, que sean maestros en esa disciplina, habilidad o talento. Si queremos que nuestra vida sea inundada por el amor incondicional, por paz y prosperidad, tendremos que alejar toda vibración de miedo, carencia y pobreza de nuestra vida, empezando por apagar el televisor y dejar ir a personas, hábitos y circunstancias que ya no tienen nada que ver con nosotros y con aquella persona en la que nos queremos convertir.',
            'En determinadas ocasiones, he visto algunos 20 que estaban influenciados, no solo por memorias familiares de injusticias y marginación, sino también por karma de vidas pasadas relacionado con juicios injustos. Temas como los juicios por herejía, brujería, Inquisición o cruzadas, pueden estar aún activos y haber dejado huellas en el alma de esta personalidad. Un miedo a ser visto, reconocido, a salir al escenario, a hablar en público de sus propias ideas o habilidades, puede estar relacionado con memorias asociadas a algunos de los peores capítulos de la humanidad. Recuerdos antiguos de hogueras, máquinas de torturas, exterminio en campos de concentración, pueden estar resonando ahora mismo, limitando y condicionando la vida actual de una persona. Como ya sabemos, el tiempo no existe, no es lineal, ni para el alma, ni para el inconsciente. Todo ocurre en el momento presente. El tiempo como tal, lo percibimos en la tercera dimensión como lineal, sin embargo, el alma vive fuera del tiempo y está conectada con el continuo momento presente.',
            'En la juventud de un número 20, pueden presentarse problemas en la piel y en la cara, agudizándose los síntomas naturales de la pubertad. La adolescencia es la época en la que nos separamos de nuestros padres y renacemos según nuestra propia identidad que, aún frágil, puede ser muy sensible a las críticas y juicios de la gente. La cara es la imagen social que damos a los demás, el símbolo del reconocimiento a nivel biológico y que habla de nuestra identidad. En la edad adulta, pueden aparecer patologías relacionadas con huesos, músculos y articulaciones debido a la relación inconsciente con la valorización y la desvalorización personal. Entre sus dientes, los más sensibles serán los incisivos superiores, relacionados con la imagen que proyectamos hacia fuera, o con los incisivos inferiores, que están asociados a conflictos emocionales que tienen que ver con nuestra propia imagen en la intimidad.',
            'Para equilibrarse, este arquetipo deberá investigar y sanar todas aquellas heridas de reconocimiento de su árbol genealógico que aún lo condicionan. En el caso de que haya heredado memorias de ancestros excluidos, olvidados, marginados, de hijos ilegítimos y de gente que ha sido tachada de inmoral por algún motivo, tendrá que ponerse a sanar y a liberar toda aquella carga. Sea quien sea el ancestro en cuestión, tendrá que sentarse en el asiento que le corresponde dentro de su historia familiar.',
            'Deberá aprender a soltar la necesidad de demostrar algo a los demás, y comprender que el único juicio influyente es el suyo propio hacia sí mismo.',
            'Juegos muy sencillos como de enigmística, pueden relajar su sistema. Exponer sus logros, como antes comentamos, también suele hacerle bien al corazón. Aprender a valorar su imagen personal, desde un corte de pelo a la ropa que lleva puesta, le puede ayudar a sentirse mejor. Cambiar de amigos, de pareja, de trabajo —en caso de necesidad— puede transformar muchísimo la calidad de su vida para mejor.',
            'Si tienes un 20 en tu Mapa, tienes que deshacerte de toda relación basada en el maltrato, la crítica, el menosprecio. Quien no te valora, no valora tu tiempo, tu espacio, tu opinión, tu talento, se tiene que quedar fuera de tu vida. Cuando hagas ese cambio, empezando finalmente a valorarte y a decir que no a esos abusos y sentimientos de carencias, verás milagros.',
            'Otro tipo de terapia, para un 20, es la investigación. No importa que se trate de artículos, libros, videos o podcasts, sino que en tu vida haya espacio para la investigación y para el descubrimiento de los temas que más te puedan interesar. Investiga tu pasado, tu árbol genealógico, la historia de algún personaje que estimes o admires. Lee la biografía de un personaje que admiras mucho y que es un modelo para ti. Haz una lista de todo lo que has logrado este último año y que te parecía imposible, o impensable, hace un tiempo. Lo más importante, recuerda, es tocar y estimular la vibración del arquetipo en cuestión, desde sus aplicaciones más mundanas hasta sus expresiones más existenciales y abstractas.',
            'A nivel energético, los chakras relacionados con el arquetipo 20 suelen ser el tercero, el quinto y el sexto. Equilibrarlos, le ayudará a resolver buena parte de sus bloqueos.',
            'Ahora te dejo aquí unas preguntas para que reflexiones un poco, antes de seguir con el arquetipo 21:',
            '● ¿Te aprecias a ti mismo? ● ¿Te valoras? ● ¿Aprecias lo que haces? ● ¿Conoces tu valor real? ● ¿Cómo te hablas a ti mismo/a en tu cabeza? ● ¿Cuál es el nivel de asertividad que tienes en tu vida?',
            '● ¿Valoras/valoran tu trabajo? ● ¿Sabes defender tus opiniones? ● ¿Sueles hacer lo que te gusta a ti o lo que le gusta a los demás? ● ¿Sabes hacer respetar tu espacio personal? ● ¿Sabes hacer respetar tu tiempo? ● ¿Llegas/llegan en hora a las citas y quedadas? ● ¿Celebras tus logros? ● ¿Qué contestas cuando te dan las gracias por algo?'
        ],
        astrologia: [
            'En el plano astrológico, el arquetipo del juicio nos conecta con la necesidad de sentirse importante y de ser alabado, típica del signo de Leo, pero también con la capacidad investigativa de Escorpio para ir en las profundidades del mar y del alma humana, para descubrir todos sus secretos y misterios. Además, Plutón nos habla de la habilidad de regeneración y resurrección que también pertenecen a este arquetipo.'
        ],
        hebrea: [
            'REISH es la letra hebrea que desprende este arquetipo. Meditando con ella, entrenamos nuestra mente para llegar a ser más espiritual y a funcionar de una manera más arquetípica que lógico-racional. Gracias a esta letra, acercamos nuestra mente a la mente de Dios para obtener las mismas cualidades divinas que "perdimos" durante el proceso de encarnación en el mundo físico. Es una invitación al estudio e investigación constantes de nuestra alma, con el objetivo de afinar nuestro poder de visualización que precede al de materialización.'
        ]
    },
    21: {
        nombre: 'El Mundo',
        hebreo: 'Shin',
        imagen: 'Cartas Tarot/21.png',
        positivas: ["Mundo", "Mundano", "Grupos", "Relaciones públicas", "Vida social", "Aristocracia", "Intelectual", "Cultura", "Élite", "Riqueza", "Colectividad", "Lujo", "Calidad", "Ecologista", "Animalista"],
        negativas: ["Apegos materiales", "Vulgaridad", "Desconexión de la realidad", "Mundanidad", "Superficialidad", "Frivolidad", "Chismes", "Soberbia", "Clasismo", "Conflicto de extranjero", "Destierro", "Exilio", "Huida a otro mundo", "Clausura", "Cárcel"],
        descripcion: [
            'Si desde el 1 hasta el 20, hemos analizado la escalada en consciencia, desde la individualidad del Mago hasta la universalidad del Juicio, ahora, con la vibración del 21, cerramos el círculo que abrimos con el arquetipo 1, y entramos en un nuevo espacio, donde la individualidad se confunde con la totalidad.',
            'El Mundo es el arcano del Tarot asociado a este arquetipo y, en este espacio, que es hijo del arquetipo 3 (2+1), solo pueden reinar belleza, nobleza, elegancia y cultura. Por lo tanto, estas personalidades vibrarán con dichos elementos en todo momento, encarnándolos en sí mismos o proyectándolos hacia afuera, dependiendo del Pilar en el que este número aparezca. Lo que queda claro es que, cuando hay un 21, todo tiene que ser hermoso, bello y de la mejor calidad, porque para este arquetipo no hay lugar para la vulgaridad, la mediocridad y la fealdad. También hay que aclarar que cada uno de nosotros le damos un significado subjetivo a la belleza y a la hermosura, con lo cual, siempre habrá que tener en cuenta la perspectiva personal de cada individuo.',
            'Por un lado, si fusionamos sus dígitos, evocamos ciertos aspectos comunes, como ya hemos dicho, con el número 3 de la Emperatriz. En este sentido, nos encontramos con una personalidad con un gran don para la comunicación, sin duda inteligente y amante de los ambientes intelectuales y mundanos, pero también nobles, aristocráticos o exclusivos. El 21 suele amar todo lo que es sinónimo de lujo y opulencia, ya que son símbolos de realeza y riqueza.',
            'En un nivel más terrenal, este arquetipo suele valorar mucho su bienestar y su comodidad material. Suele identificarse con sus bienes, posesiones y estatus social, lo que, a menudo, le lleva a confundir su sentido del "yo", basándose más en lo que tiene que a lo que es en esencia. En este nivel de conciencia, la vibración predominante está asociada a la riqueza material y mundana, al sentido de abundancia y opulencia basado en las comodidades o en la apariencia. Al fin y al cabo, el 21 es hijo de una Emperatriz: por lo tanto, podría tener la tendencia a ver la vida a través del filtro heredado de esta monarca. Siempre que este aspecto sea vivido con naturalidad, y no desde la necesidad, el miedo o el apego, no habrá que verlo como un problema, sino, más bien, como una característica natural de esta personalidad.',
            'De todos los arquetipos, este es sin duda el que mejor refleja el dicho:',
            'En esta vida no hemos venido a sufrir.',
            'El dinero es un medio para conseguir un estatus de vida cómodo, digno y que no sea simple "supervivencia". Lo material es importante, las cosas terrenales son fundamentales, porque representan un reflejo de su interior. Si yo me amo y me valoro, no aceptaré algo que no esté a mi altura. Todo lo que consiga para mí, una casa, un coche, un portátil, etc., tendrá que tener una vibración en resonancia con mi esencia.',
            'Si recordamos, en el arquetipo 20, su necesidad y sus luchas para ser reconocido, veremos que, en el 21, este aspecto está más que integrado. Por esta razón, suele llevarse todos los honores sin mucho esfuerzo, ya que sabe que vale mucho y no suele tener problemas de autoestima, a no ser que haya algún bloqueo en el Pilar correspondiente. Si este fuera el caso, podríamos encontrarnos con un profundo problema de desvalorización. Sin embargo, cuando este arquetipo está en armonía, refleja posiblemente una personalidad con mucho amor propio y un sentido de identidad bien definido, ya que suele tener muy claro que se merece lo mejor que la vida le pueda ofrecer. Por esta razón, siempre buscará la mejor calidad en todos los ámbitos de la vida: las mejores marcas de ropa, los más suntuosos hoteles y restaurantes, los productos o servicios más selectos. Para este número, la calidad es sinónimo de valor.',
            'En otro nivel de consciencia, la riqueza asociada a este arquetipo, no sólo se quedará anclada al plano de la materia, puesto que el 21 tiene el potencial y la capacidad para comprender que la riqueza, en el plano terrenal, solo es un reflejo de la riqueza en el plano espiritual: sin esta última, no hay prosperidad en el mundo de la materia. Su gran potencial es encontrar el equilibrio entre lo uno y lo otro. Su objetivo es comprender que la abundancia brota desde dentro y se manifiesta en todos los aspectos de la vida: dinero, salud, relaciones, profesión, pasiones, etc. Para llegar a esto, la vida le enseñará el camino que tendrá que recorrer para descubrirlo y necesitará actualizar sus creencias al respecto para poder crecer en este sentido.',
            'Si observamos los ambientes favoritos en los que le gusta moverse, veremos que estos varían dependiendo de su estado de conciencia. Por un lado, se sentirá atraído hacia ambientes intelectualmente estimulantes o elitistas, donde la cultura y el conocimiento sean protagonistas. En otros estados, sentirá la llamada hacia círculos sociales más mundanos y festivos. En otros niveles, su interés irá hacia grupos de matiz más espiritual. Lo que es, siempre, una constante es que el 21 es un ser muy social y ama crear, alimentar y mantener activos muchos tipos de grupos diferentes, pudiendo moverse desde un mundo a otro con mucha facilidad, tanto en la vida real como en el mundo virtual, tecnológico o en las redes sociales.',
            'Cuando miramos el arcano del Mundo, podemos ver claramente una figura dentro de un círculo. Este círculo representa, entre otras interpretaciones, los diferentes círculos sociales y grupos de personas que hacen vibrar este arquetipo.',
            'Por lo tanto, entre sus capacidades o tendencias, veremos que tiene cierto don para las relaciones públicas. Habiendo heredado del 3 el don de la comunicación, en el 21 esta se elevará a un plano más global y masivo, generando dones naturales para hablar con todo el mundo, crear y gestionar grupos de actividades o proyectos de naturaleza mundana, intelectual o espiritual.',
            'Si seguimos profundizando más, observamos que este arquetipo tiene un don para la visión global (globo = mundo), es decir, tiene la capacidad para ver el bosque entero, pero no necesariamente el árbol solo. Su visión no se fija tanto en los detalles —como, por ejemplo en su arquetipo espejo, el 12, que es literalmente un 21 al revés— sino, más bien, en el diseño completo, en el objetivo final, en el bien común. Consigue comprender más fácilmente que, por ejemplo, el bien de la comunidad es superior al bien del individuo y que, para hacer una tortilla, a veces, es necesario romper más de un huevo. Este aspecto también aparece cuando un 21 entra en una casa: el impacto que tendrá la visión global de la casa tendrá más efecto e importancia que los detalles de la misma.',
            'Además, si entramos en la casa de un 21 —sobre todo si este número aparece en el lado izquierdo del Mapa— veremos, muy posiblemente, una casa en la que se manifiesten todos o la mayoría de sus aspectos: cultura, arte, belleza, calidad, prosperidad, literatura, viajes y, casi seguramente, un lugar para almacenar miles de libros, ya que, al igual que el arquetipo 3, suele amar profundamente la información, el conocimiento y las bibliotecas.',
            'Algo que ama —y necesita profundamente— el arquetipo 21 es viajar y visitar nuevas tierras y países. Recordemos que cualquier cosa que nos evoque la palabra "mundo" pertenece al reino de este arquetipo. En este caso, el término se entiende en un sentido geográfico, un lugar para ser descubierto y con el que conectar. Sin embargo, su compañero de viaje ideal no será seguramente el arquetipo 9 (otro gran amante de los viajes), ya que sus escapadas son más organizadas, planificadas, cómodas y cortas.',
            'Mientras que un 9 preferirá alojarse en una cabaña en medio de la selva, con gente local y compartiendo espacios, un 21, posiblemente, optará por un resort con piscina y habitación privada: el confort, ante todo. Para el 21, la comodidad es sinónimo de abundancia y merecimiento, y el dinero es un recurso para manifestarla tanto en la vida material como en la espiritual. Atraído por todo lo relacionado con lo aristocrático y lo mundano, suele disfrutar las visitas en los palacios reales, y aquellos lugares que sean símbolo de opulencia y prosperidad.',
            'El arquetipo 21 proviene del 3, que es mental, racional e intelectual, mientras que el 9 es puro sentimiento, emoción y empatía. Además, el 21 vibra con la comodidad de la aristocracia, mientras que el 9 suele ser un ermitaño desapegado, austero y frugal que no necesita más que su propia piel para viajar. Por estas razones, a diferencia del 9, que ama viajar con un billete solo de ida porque desconoce su retorno (si es que vuelve), y que disfruta ensuciándose y experimentando por el camino, alojándose donde pueda, viviendo al día y organizándose sin mucha planificación, el 21 es todo lo contrario. Sus billetes son de ida y vuelta (posiblemente con mucha antelación y planificación), y viaja para contemplar la belleza o por un objetivo concreto relacionado con sus intereses específicos o culturales.',
            'Gracias a su amor por los viajes y otras culturas, este arquetipo siempre será identificado como "extranjero" o "forastero". Quienes lo conocen, pueden no tener muy claro de dónde es, ya que quizás nació en un lugar, pero vive en otro, o proviene de una familia extranjera. Puede tener rasgos muy diferentes o, incluso, carecer de un hogar fijo. Para él, el mundo es su casa, y la vida le enseñará que su identidad no está determinada por lo que dice en sus documentos, sino por lo que crece en su corazón.',
            'Cuando el 21 está en perfecto equilibrio, genera una personalidad cuya mirada inocente hacia el planeta es de extrema devoción. A menudo, la Tierra será percibida como un bebé, una madre o una hermana, y podrá tener un lazo muy profundo y delicado con el mundo, sintiendo en su propia piel su sufrimiento. Por esta razón, dañar al planeta será como dañarse a sí mismo, y difícilmente tolerará la violencia y el maltrato que muchas veces nuestro mundo sufre. Debido a su profunda sensibilidad, tendrá que evitar, si es posible, el exceso de información de los medios de comunicación, especialmente de los boletines informativos, descartando temas ecologistas, animalistas y humanitarios. No tolera bien el dolor que estas noticias le provocan.',
            'Dependiendo de su nivel de consciencia, el 21 no solo tendrá una conexión profunda con la Tierra, sino que también irá más allá de este mundo. Esto significa que su personalidad podrá desarrollar intereses en temas relacionados con otros mundos, otros planetas, multiversos y metaversos, así como desarrollar capacidades relacionadas con viajes astrales, meditaciones guiadas y recordar (o acceder a) vidas pasadas (de manera similar al 13 y al 18). A menudo, le pueden interesar temas relacionados con el gran potencial de los seres humanos: telepatía, teletransporte, habilidades especiales, ovnis, extraterrestres y seres de otras dimensiones, con los que quizás pueda, incluso, entrar en contacto: pleyadianos, espíritus, hadas y duendes. Lo que para muchas personas sería ciencia ficción, para este arquetipo podría ser algo natural en su vida diaria. De hecho, los niños 21 (e incluso muchos adultos) pueden tomar como referentes en valores y modelos de vida a algunos superhéroes del cine o de los cómics, pero también a santos, maestros ascendidos o personajes legendarios. Los límites de su "mundo" los pondrá su nivel de consciencia.',
            'Un aspecto relevante de esta personalidad es su profundo sentimiento de tener un propósito de vida, una misión que cumplir. El arcano del Mundo representa el fin máximo del camino de iniciación, la llegada a Santiago de Compostela después de un largo y venturoso camino, la realización del ser humano en su totalidad. Después de este arcano, solo queda el arquetipo del fin y del origen de todo, el caos primigenio después de la plenitud, el Big Bang, el Alfa y el Omega: el arcano 22. Por esta razón, es muy importante, para mantener una vida en armonía, salud y plenitud, que esta personalidad sienta en todo momento que está cumpliendo una misión: haga lo que haga, que siempre tenga un sentimiento de cumplir con ella y manifestar en este mundo su vocación, aportando su granito de arena. En caso contrario, podría tener graves problemas.',
            'Las profesiones u oficios para este arquetipo pueden estar relacionados con todo lo mencionado anteriormente. En el aspecto sentimental, sus amores potenciales tendrán que estimular algunos de esos intereses y tener en cuenta sus pequeñas —o, a veces, grandes— excentricidades.'
        ],
        sombra: [
            'Las resistencias y dolores que este arquetipo puede llegar a tener, estarán asociados, posiblemente, a viajes obligados, idiomas, geografía, propósito de vida o a dificultades para las relaciones interpersonales. Ocasionalmente, puede sufrir por sentirse extranjero o no tener un lugar con el cual sentirse identificado. Por lo tanto, es posible que surjan conflictos de pertenencia, integración o identidad.',
            'Siendo hijo del arquetipo 3, también podría haber heridas relacionadas con la integración o expresión de lo femenino, o bien con problemas de comunicación. Además, puede caer víctima de decepciones y desilusiones por un exceso de ingenuidad o inocencia y, a menudo, como ya hemos anticipado antes, será muy sensible hacia aquellos temas relacionados con desastres naturales, situaciones humanitarias de emergencia, miseria o pobreza.',
            'Por un lado, el 21 en su Sombra se puede convertir en una personalidad excesivamente mundana, superficial, frívola y chismosa. Puede haber echado tan profundamente sus raíces en la tierra que habrá olvidado su origen celestial. Cuando sea así, tendremos a personalidades más terrenales, mundanas y apegadas a los frutos de la tierra, a su identidad personal, profesional o social y a sus bienes y posesiones materiales. Podrá ser una persona soberbia, altiva y clasista. En estos casos, es recomendado aprender a integrar, poco a poco, la práctica de la meditación, especialmente con la letra Shin, para que se pueda equilibrar el arquetipo dentro de uno mismo. Toda terapia energética es bienvenida, con el fin de equilibrar todos los chakras, conteniendo los excesos de los inferiores y desbloqueando los superiores para una mayor actividad.',
            'Por otro lado, este mismo arquetipo puede querer huir de este mundo terrenal por no ser capaz de aceptarlo, queriendo desconectar de la realidad y de todo lo mundano, encerrándose en su mundo de fantasía o escapándose a otros mundos, dimensiones o planos de la consciencia: mentales, virtuales, astrales o energéticos. En este sentido, es imperativo que comprenda que no hemos encarnado en este mundo para huir o desconectar de él, sino, más bien, para "espiritualizarlo", para traer el Cielo a la Tierra, y viceversa. En estos casos, lo ideal es practicar todo lo que ayude a anclar las raíces a tierra: ejercicios físicos, manuales o visualizaciones.',
            'Si observamos atentamente el arcano del Mundo percibiremos varios simbolismos, en positivo o en negativo, según nuestra mirada. Esa figura que se encuentra en el centro del óvalo puede sentirse en su refugio, en su elemento y bien cuidada por los cuatro protectores de las esquinas, quizás amigos o seres interdimensionales, ángeles o guías. Sin embargo, ese círculo también puede representar la prisión en la que uno se esté sintiendo atrapado, y esa persona podrá percibir su vida como una cárcel, con los cuatro guías convirtiéndose de pronto en carceleros, dependiendo de la herida o memoria que se haya activado. Como consecuencia, habrá siempre que tener en cuenta de que, lo que miramos, habla más de nosotros que del objeto, sujeto o situación observada. En este nivel de consciencia, puede experimentar claustrofobia y experiencias asociadas a sentimientos de "encarcelamiento", reales o simbólicos.',
            'Algo con lo cual este arquetipo armoniza fácilmente es haciendo pequeños viajes y escapadas: es fundamental que salga de su "dimensión" diaria para recargarse, sin importar mucho que sus viajes sean geográficos, mentales o astrales. Leer un libro, para un 21 es "hacer un viaje". Una meditación guiada, también es como un viaje. Así como un viaje astral, también es otro tipo de viaje.',
            'A nivel biológico, nos puede causar ciertas disfunciones hormonales, más comúnmente un aumento de los niveles de estrógenos. Como es uno de los arquetipos más femeninos, siendo una Emperatriz del Mundo, puede haber alguna memoria o trauma no sanado con la figura materna. Puede haber un "exceso o una ausencia de madre", una identificación con esta figura en alguna área de la vida. Sin darme cuenta, quizás esté ejerciendo el rol de madre con alguien (o con algún grupo en concreto) para compensar alguna herida de mi pasado, no sanada. Esto le puede estar ocurriendo tanto a una mujer como a un hombre, ya que sabemos que los arquetipos pueden ser encarnados por ambos géneros, indistintamente.',
            'El Complejo de Edipo, puede ser, también, una de las manifestaciones de este arquetipo cuando no está en armonía. Lo que no he sanado con mi madre, lo buscaré y proyectaré en mis relaciones.',
            'Además, no hay que olvidar el 1 y 2 que lo componen— respectivamente principio masculino y femenino que, en el 21, se fusionan en un ser andrógino. Por un lado, tendrá que estar alerta en el caso de aparición de aislamiento y soledad, o por falta de un grupo de amigos, mientras, por otro lado, tendrá que cuidar sus apegos y dependencias y, además, hacerle mucho caso a la intuición.',
            'Una personalidad en desarmonía también puede querer aislarse en otra dimensión, huir de la realidad y hacerse adicta a los viajes fuera del cuerpo. Además, su predisposición natural a conectarse con otros planos y con otros seres, unida a la capacidad de crear y guiar grupos, también puede atraer situaciones delicadas, vinculadas al fanatismo, al proselitismo, a dinámicas sectarias o a la influencia de falsos gurús.',
            'Para relajarse y equilibrarse, también puede aprender e investigar más sobre el juego del Tarot, que representa la comunicación con otras dimensiones, planos y mundos con los cuales puede conectar muy fácilmente. El uso de otros tipos de barajas o juegos parecidos puede aliviar su estrés conectando con el mundo de los arquetipos de la personalidad.'
        ],
        astrologia: [
            'Los planetas Urano y Neptuno pueden describir astrológicamente la mayoría de aspectos de esta personalidad, y los signos asociados de Acuario y Piscis, reafirman, sin duda, sus cualidades, intereses y habilidades. Un 21, como hemos visto, es un personaje que ama profundamente los placeres del mundo y, en esta manifestación, muchos de los elementos del signo de Tauro también aparecen.'
        ],
        hebrea: [
            'La letra hebrea SHIN representa este arquetipo. Su imagen evoca las raíces invertidas de un árbol y nos recuerda que el ser humano es como un árbol, cuyas verdaderas raíces penetran en el Cielo, no en la Tierra. Si nuestras raíces son fuertes, estables y profundas, transitaremos este mundo sostenidos por su fortaleza y estabilidad. Cuando esta letra y este arquetipo aparezcan en nuestra vida, estamos invitados a trasladar nuestras raíces del mundo terrenal al mundo celestial, recordando que el verdadero mundo del cual provenimos está en el Cielo, no en la Tierra. La realeza y la nobleza que este arquetipo desprende son fragmentos de la verdadera realeza y nobleza del plano divino del cual descendemos. Cada vez que observamos y meditamos con esta letra, podremos percibir la imagen de la corona que representa la realeza del Creador a la cual aspiramos. Asimismo, es una invitación para vivir la vida como un viaje en búsqueda de nuestra alma a través del estudio del Árbol de la Vida, desde sus raíces hasta sus ramas y frutos.'
        ]
    },
    22: {
        nombre: 'El Loco',
        hebreo: 'Tav',
        imagen: 'Cartas Tarot/0.png',
        positivas: ["Creatividad", "Genio", "Visionario", "Extravagancia", "Excentricidad", "Rebeldía", "Romper reglas", "Arquitectura", "Creación", "Arte", "Anticonformismo", "Grandes proyectos", "Estructura", "Materialización", "Plano mental"],
        negativas: ["Ansiedad", "Trastornos mentales", "Locura", "Estrés mental", "Migrañas", "Psiquiatría", "Bloqueo creativo", "Falta de creatividad", "Falta de imaginación", "Falta de fantasía", "Exceso de reglas y normas", "Falta de estructura", "Exceso de estructura", "Miedo a volverse loco", "Miedo a perder el control"],
        descripcion: [
            'Con el número 22, llegamos al arquetipo de la máxima creatividad. Al analizar su núcleo más profundo, descubrimos que esta vibración posee un potencial creativo y creador enorme, una imaginación extraordinaria y grandes dones artísticos. En su mejor punto, la mente de un 22 se convierte en una inmensa fábrica de ideas y proyectos que parecen provenir de las más altas esferas. La grandeza es sinónimo de este arquetipo; aquí no hay lugar para nada pequeño, contenido o limitado. Nos encontramos frente a un gran visionario cuyas ideas, una vez materializadas, tienen un impacto gigantesco en su entorno y a nivel masivo.',
            'Ante todo, podemos decir que, para que este arquetipo esté siempre en equilibrio, debe realizar sus grandes proyectos, sean cuales sean, materializándolos en el plano físico. De este modo, la energía creadora y creativa generada o canalizada a través de su mente genial, puede ser descargada finalmente en el mundo terrenal. Por lo tanto, es imperativo que un 22 consiga, siempre, canalizar y dar forma a sus ideas plasmándolas en el plano físico. De hecho, la única manera de que siga en equilibrio es creando. Este arquetipo se manifiesta en las artes más variadas y en artistas visionarios de diferentes calibres.',
            'La pregunta que debemos hacernos es:',
            '¿Cuáles de los proyectos que tengo en mi cabeza, aún no he materializado?',
            'A diferencia del número 15, cuyo exceso de energía necesitaba descargarse a través de la sexualidad o de una actividad física intensa, en el caso del 22 esa energía es llevada a un plano superior. Mientras que, en el Diablo, la energía se encuentra aún en el cuerpo físico, en el 22 —El Loco, último (o primero) de los Arcanos Mayores del Tarot— ha subido al plano mental. Este personaje, si lo observamos atentamente, está emprendiendo un nuevo viaje y, al mismo tiempo, acaba de terminar un ciclo de vida. Con esta figura recordamos que el principio y el fin, a menudo, son lo mismo. En este arcano, así como en nuestro Mapa, el 22 y el 0 son exactamente lo mismo. Nada nuevo puede empezar si algo antiguo no termina, y la idea que se refuerza es que, para comenzar un nuevo camino o proyecto, necesitamos una buena dosis de locura y valentía. De hecho, si nos fijamos bien, en la imagen del Tarot, no encontraremos ningún número, porque este arcano no sigue ningún orden, ninguna regla.',
            'La personalidad del Loco rompe la monotonía de una vida ordinaria con su genio y creatividad. Destruye los esquemas convencionales de la sociedad en la que vive y toda la materia se plasma en sus manos. Es un personaje excéntrico, extravagante, un poco caótico en sus formas e, incluso, en su estado natural de armonía y equilibrio, reflejará la complejidad de su mente. Quizás se le reconozca por su manera de vestir, de llevar el pelo, por su comportamiento atípico o su estilo de vida o por la forma de pensar.',
            'Un 22 no sigue las normas; de hecho, ha nacido para romperlas y renovarlas. Siendo heredero del 4, la materia y la estructura se convierten en sus dominios, y sus grandes dones creativos los usará para pensar "fuera de la caja", fuera del cuadrado tradicional del 4 y de todos los esquemas posibles. Por esta razón, será capaz de forjar la materia a su antojo, algo que un 4 se vería incapaz de hacer. Su doble 2 le infunde el soplo de extraordinarias intuiciones, ya que no una, sino dos Sacerdotisas se esconden dentro de él.',
            'Recordemos que el 11, aparte de ser el primer número maestro, representa al arquetipo del canalizador. Con el 22 (un doble 11), nos encontramos cara a cara con un nuevo número maestro y con otro tipo de canalización. Mientras el 11 tiene matices más espirituales y sutiles debido a su conexión con la Sacerdotisa del Arcano 2, el 22 nos conecta especialmente con el Emperador del Arcano 4, que reina sobre el mundo de la materia, llegando a ser un gran transformador del plano material y del mundo físico. De hecho, podríamos decir que un 22 es un Emperador que se ha permitido volverse Loco, y que su locura no es más que ese fragmento incomprendido de la genialidad de la que proviene. A través del Loco, el Emperador está finalmente preparado para crear un imperio de la nada, desde cero.',
            'Por ser también el segundo número maestro, la vida le llevará a descubrir que todos los maestros que encuentre en su camino, solo serán un reflejo de aquel gran guía que tiene en su interior. Este será uno de sus objetivos principales y una importante toma de conciencia al final de su viaje: conectar con su maestro y creador interior.',
            'Para entender mejor este arquetipo, basta evocar a los grandes genios, artistas e inventores que la historia nos ha dado y observar cómo, en todos los casos, ese gran talento y esa extraordinaria capacidad de crear siempre han estado acompañados por pinceladas de extravagancia, excentricidad y rareza. Todos —o casi todos— los artistas y creativos que han emergido a lo largo del tiempo han sido grandes rompedores de reglas, esquemas y estructuras. Por lo tanto, una de las llamadas a las que estas personalidades deben responder es la de crear nuevas estructuras, renovarlas o transformarlas utilizando su gran talento innato. De lo contrario, esa inmensa energía creadora y creativa se volverá destructora y destructiva, llevando a la persona a los límites de la locura.',
            'Este arquetipo simboliza el final de un proceso de transformación de la estructura que empezó en el 4 (la casa), se dobló en el 8 (los inmuebles), se expandió en el 16 (los grandes edificios, las torres) y finalmente se exalta en el 22: la magnificación de la arquitectura.',
            'Si ponemos este personaje del arcano sin número a lado de la figura del arcano sin nombre —el 13—, nos daremos cuenta de que tienen muchos más puntos en común de lo que parece. Ambos, hablan de un nuevo comienzo, de un nuevo viaje, de un proceso de transformación profundo. En estos dos arquetipos la estructura está destinada a cambiar, pero en diferentes niveles. Ambos arquetipos esconden, en su profundidad, la vibración del 4, que será transformada y expresada a través de matices y tonos diferentes. Puede, incluso, que el Loco sea el resultado final de ese cuerpo en transformación que observamos en el arcano sin nombre o que, este último, represente el fin del viaje iniciático, creativo y creador de ese Loco.',
            'Profundizando más en su análisis, observamos que este arquetipo también encarna el comienzo y el fin de un viaje iniciático. Sin embargo, su trayecto es muy diferente de los del 9 y del 21. En su caso, se trata de un Camino de Santiago cíclico. A menudo se sentirá atraído por lo desconocido y en ocasiones sentirá una llamada en la que se le pedirá dejarlo todo para permitirse un tiempo de reflexión, con el fin de aclarar sus ideas, que son muchas y muy intensas, para conocerse a sí mismo en profundidad. Este tipo de experiencia nos recuerda al clásico viaje del héroe: todos los cuentos de la tradición folclórica mundial son un ejemplo. En este recorrido, el protagonista es llamado a dejar su mundo ordinario, superar ciertas pruebas y encontrar mentores (y desafíos) por el camino. En su largo recorrido, tendrá que aclarar todas las dudas, superar todas sus resistencias, miedos y obstáculos para finalmente resolver los enigmas encontrados, matar al dragón, liberar a la doncella en la torre y volver a casa. Solo al final de su viaje y de sus peripecias, recibirá un premio o un objeto sagrado, símbolo de un renovado despertar o de una toma de conciencia importante.',
            'El arquetipo 22 lo encontramos en el viaje de Ulises en su Odisea y en el de Jasón en sus Argonáuticas, en los cuales ambos protagonistas están llamados a un viaje arquetípico, donde aprenderán a aceptar su destino y a reconciliarse con la realidad, pero solo después de una gran transformación.',
            'La imagen del Loco, según cómo la miremos, puede ser la fotografía de un hombre que acaba de emprender un viaje y estar en el comienzo de su aventura, pero también puede describir a alguien que vuelve a casa después de un largo y duro camino. En este arquetipo, el comienzo y el fin coinciden y, como veremos más tarde, descubrimos que el 22 y el 0, son exactamente lo mismo.',
            'Sin duda, podemos afirmar que, cuando el 22 aparece, un gran proyecto ha de ponerse en marcha. Puede ser un proyecto de vida, familiar, sentimental o, incluso, profesional, dependiendo del Pilar donde se encuentre. Entre sus mayores proyectos estará el de fusionar el Cielo con la Tierra, y la Tierra con el Cielo. Sus dones innatos le llevarán a conseguirlo, siempre y cuando continúe canalizando su creatividad de manera productiva y equilibrada, y siga haciéndole caso a su poderosa intuición, en todo ese caos interior que a veces parece contener.',
            'Un aspecto crucial que hay que considerar en las personalidades donde aparece este arquetipo, es la importancia de investigar y comprender su proyecto más grande: el Proyecto',
            'Sentido. La concepción y nacimiento de un ser humano representan el proyecto más significativo, por lo que es vital volver a esa etapa de la vida en la que fuimos ideados, proyectados, concebidos, gestados y traídos al mundo. Actualmente, sabemos que, durante ese periodo, se forman todos los aspectos de nuestra personalidad, y nuestro inconsciente recibe y graba todos los datos necesarios para funcionar en este mundo. Así, este arquetipo también es invitado a investigar sus orígenes, para comprender de dónde viene, y descubrir que es el resultado de la suma de las experiencias de sus ancestros y de sus vidas pasadas.',
            'En las profesiones, el 22 puede manifestarse en grandes arquitectos, excelentes emprendedores, artistas visionarios o creadores de grandes cadenas hoteleras o multinacionales. Cuando aparece, existe la posibilidad, y necesidad, de acceder a un inmenso almacén creativo interior y proyectarlo sin resistencias ni miedos. Una vocación que le permita trabajar con creatividad, con estructuras fluidas, dejando de lado las normas preconcebidas de la sociedad. El 22 es sinónimo de libertad de expresión.',
            'En los Pilares de la intimidad, se pueden esperar relaciones sin reglas tradicionales o conservadoras, quizás relaciones poco comunes con gran espacio para el arte, la extravagancia y la creatividad.'
        ],
        sombra: [
            'Ahora, después de haber conocido al genio, al buscador y al visionario, nos toca conocer el otro lado de la moneda. La historia nos enseña que, allí donde reside una pizca de genio, también existe un componente de locura.',
            'Una de las grandes dificultades del 22 es causada por la intensidad de su energía mental y creativa, la cual, si no es canalizada o expresada de algún modo en el plano terrenal, podrá causar desequilibrios profundos, inseguridades internas e incluso trastornos mentales. Además, mientras en el 11 la maestría es casi un don natural innato, en el 22 es muy probable que esa personalidad tenga que dejarse esculpir por las circunstancias de la vida para poder encontrar su propio don y su propia maestría. Cuanto menos se resista a las llamadas internas, antes encontrará su camino.',
            'La Sombra del Loco aparecerá cuando su intuición no sea escuchada, y cuando su proyecto no haya sido realizado. Como hemos anticipado anteriormente, si no se descarga la energía mental y visionaria de esta personalidad, puede haber serios problemas comportamentales y mentales.',
            'Lo que no es creado, destruye.',
            'Esto lo sabe muy bien nuestro loco, con lo cual, si hay algún bloqueo o herida que impida la realización de un proyecto o de un viaje importante, los primeros síntomas aparecerán en la mente en forma de dolores de cabeza, migrañas, faltas de concentración y memoria. Y, es más, ya que, en su extremo, podrá manifestar brotes de delirios, trastornos del comportamiento, miedo a perder el juicio, manías de persecución y otros desórdenes psiquiátricos. Su desequilibrio podrá dar la vida a vagabundos, bipolares, personas con síndromes maníaco-depresivos, delirios de grandeza, personalidades múltiples, disociación de la realidad y posible alienación. Con el 22, hay que estar muy alerta cuando aparezcan los primeros síntomas, y actuar rápido. Habrá que retroceder hasta el momento antes de la aparición del problema, y localizar la contradicción interna que hemos experimentado, aquella incoherencia que nos ha alejado del camino de la serenidad.',
            'Todos los síntomas asociados a la mente pertenecen al campo del 22. Más allá de los que ya hemos nombrado, el Alzheimer y la demencia, son dos manifestaciones de la Sombra que suelen aparecer en casos límites. Nuestra mente tiene una excelente capacidad de almacenamiento y procesamiento de datos; sin embargo, si estos datos, ideas, visiones, memorias y proyectos no se usan para algún propósito, el cerebro, de manera natural, los borra. Todo lo que no es usado, se atrofia o es eliminado. Así funciona nuestro organismo. En el caso del 22 —pero también de aquellos arquetipos más mentales— olvidar algo que no usamos, o que nos hizo sufrir, es la mejor herramienta que puede encontrar nuestra mente para sobrevivir. Olvidar nos permite no sufrir: este es el beneficio indirecto de estas dos terribles enfermedades.',
            'Muchas veces este loco no será capaz de controlar su ira y proyectará hacia fuera su rabia, culpando a todo el mundo por sus desgracias, siendo extremadamente difícil que se responsabilice por sus actos y por las circunstancias que ha traído a su vida.',
            'Un 22 demasiado estructurado, o sin estructura, es un 22 enfermo o infeliz.',
            'Un 22 que sigue demasiadas reglas y normas, es un 22 enfermo o infeliz.',
            'Un 22 con demasiadas responsabilidades que no le corresponden, también es un 22 enfermo o infeliz.',
            'Un 22 que no se rebela al sistema, es un 22 muerto. Para armonizar este arquetipo, lo más inmediato es que se lance hacia algo creativo, que pinte, escriba, o practique con algún instrumento musical. De igual forma, que cree una nueva receta, o practique manualidades; esto es, que modifique y plasme la materia entre sus manos, de la manera en que más le apetezca. Que emprenda ese viaje soñado que se dejó en el olvido, o que materialice en el mundo físico aquel proyecto que ha tenido en la mente durante mucho tiempo, y que jamás se ha atrevido a realizar. No necesariamente tiene que ser un propósito enorme, sino un proyecto "importante" para él. A lo mejor, es algo tan simple como cambiar el color de las paredes de su casa, comprar un nuevo cuadro, decorar el jardín o apuntarse a un curso de macramé o de baile. Todas las ideas que están colgadas en su mente y no se descargan, generarán un gran estrés.',
            'Cuando su base es estable, su más elevado potencial se manifiesta. Necesita confiar en sí mismo, ya que la falta de confianza es, en muchos casos, la causa de sus bloqueos mentales. Un 22 es algo grande, nunca es algo pequeño. Su base, el 4, le pide que tenga una estructura, que sienta que tiene unos cimientos y una tierra estable debajo de sus pies. Cuando siente la llamada de un viaje iniciático, cuando la vida le pide que lo deje todo y se lance al vacío confiando en la Providencia, es muy probable que entre en conflicto con la pérdida de su base 4: casa, estructura, estabilidad. Sin embargo, la Providencia cuidará de este valiente personaje y le demostrará, a través de infinitas sincronicidades, que nada tiene que temer.',
            'Una manera de equilibrarlo a través de terapias energéticas será prestando atención a los nudos posibles entre los chakras 1º y 7º, o bien, entre 2º y 6º.'
        ],
        astrologia: [
            'La Astrología nos habla del Loco, a través de las cualidades de Neptuno, Urano y Marte. Cuando estos tres planetas están alineados, pueden generar una excelente locura de ideas innovadoras, rompedoras y bellas. Piscis, Acuario y Aries, suelen ser los signos a él asociados.'
        ],
        hebrea: [
            'La letra hebrea TAV nos trae la enseñanza que este arquetipo nos invita a integrar. A través de ella, somos llamados a buscar nuestro propósito y alcanzar nuestro mayor objetivo, recordando nuestra naturaleza inocente, y tomando consciencia de la pérdida de talentos y habilidades del alma durante el camino de encarnación en la Tierra. Nuestro camino ahora es de "retorno a casa". En el viaje iniciático con este arquetipo, refinamos nuestra alma, elevando nuestro nivel de conciencia y despertando del sueño en el que caímos nada más nacer.'
        ]
    },
    26: {
        nombre: 'Salud y Bienestar (26/8)',
        hebreo: null,
