<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de los Arquetipos de la Personalidad</title>
    <link rel="icon" type="image/png" href="Numerología Cabalistica.png">
    <style>
        :root {
            --gold: #d4a853;
            --gold-light: #f0d68a;
            --bg: #0f0f1a;
            --card-bg: #1a1a2e;
            --text: #e8e8e8;
            --text-dim: #8a8a9a;
            --border: #2a2a3e;
            --espejo-accent: #3a7bd5;
            --mascara-accent: #c0392b;
            --especial: #9b59b6;
            --line-color: rgba(180, 180, 200, 0.25);
            --node-size: 58px;
            --tri-size: 52px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            padding: 30px 20px 10px;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: var(--gold);
            text-transform: uppercase;
        }

        header p {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-top: 6px;
            font-style: italic;
        }

        .input-section {
            display: grid;
            grid-template-columns: repeat(3, minmax(150px, 1fr));
            gap: 14px 18px;
            align-items: end;
            max-width: 780px;
            margin: 24px auto 32px;
            padding: 22px 26px 20px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(212, 168, 83, 0.18);
            border-radius: 12px;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.25);
        }

        .input-section .campo {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .input-section .campo-fecha {
            grid-column: 1 / 3;
        }

        .input-section .campo-botones {
            grid-column: 3 / 4;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            align-items: flex-end;
        }

        .input-section label {
            font-size: 0.78rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            font-weight: 500;
        }

        .input-section input {
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--card-bg);
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s;
            width: 100%;
            box-sizing: border-box;
        }

        .input-section input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(212, 168, 83, 0.12);
        }

        .input-section button {
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--gold), #b8922e);
            color: #1a1a2e;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
            white-space: nowrap;
        }

        .input-section button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(212, 168, 83, 0.3);
        }

        .input-section button.secundario {
            background: transparent;
            color: var(--gold);
            border: 1px solid rgba(212, 168, 83, 0.55);
        }

        .input-section button.secundario:hover {
            background: rgba(212, 168, 83, 0.12);
            box-shadow: 0 0 12px rgba(212, 168, 83, 0.2);
        }

        .input-section button[hidden] { display: none; }

        @media (max-width: 640px) {
            .input-section {
                grid-template-columns: 1fr;
            }
            .input-section .campo-fecha,
            .input-section .campo-botones {
                grid-column: 1 / -1;
            }
            .input-section .campo-botones { justify-content: stretch; }
            .input-section button { flex: 1; }
        }

        #mapa-container {
            display: none;
            width: 100%;
            max-width: 800px;
            padding: 0 15px 40px;
        }

        .mapa-titulo {
            text-align: center;
            margin-bottom: 20px;
        }

        .mapa-titulo .nombre-persona {
            font-family: 'Cinzel', serif;
            font-size: 1.35rem;
            color: var(--gold);
            letter-spacing: 1px;
            margin-bottom: 4px;
            text-shadow: 0 0 10px rgba(212, 168, 83, 0.25);
        }

        .mapa-titulo .nombre {
            font-size: 0.95rem;
            color: var(--gold-light);
            letter-spacing: 0.5px;
        }

        /* --- MAPA VISUAL --- */
        .mapa {
            position: relative;
            width: 100%;
            max-width: 680px;
            margin: 0 auto;
            aspect-ratio: 1 / 1.42;
        }

        /* SVG de lineas */
        .mapa svg.lineas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .mapa svg.lineas line {
            stroke: var(--line-color);
            stroke-width: 0.4;
        }

        .mapa svg.lineas line.rect-line {
            stroke-width: 0.6;
            stroke: rgba(180, 180, 200, 0.35);
        }

        .mapa svg.lineas line.mid-line {
            stroke-width: 0.5;
            stroke: rgba(212, 168, 83, 0.3);
        }

        /* Nodos */
        .node {
            position: absolute;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            z-index: 2;
        }

        .node .circle {
            width: var(--node-size);
            height: var(--node-size);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            font-weight: 700;
            border: 2px solid;
            background: var(--bg);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .node .circle:hover {
            transform: scale(1.12);
            box-shadow: 0 0 20px rgba(212, 168, 83, 0.25);
        }

        .node .lbl {
            font-size: 0.55rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: center;
            max-width: 80px;
            line-height: 1.2;
            white-space: nowrap;
            cursor: pointer;
            transition: color 0.25s, text-shadow 0.25s;
        }
        .node .lbl:hover {
            color: var(--gold) !important;
            text-shadow: 0 0 8px rgba(212, 168, 83, 0.6);
        }

        /* Triangulos */
        .node.tri .circle {
            width: var(--tri-size);
            height: var(--tri-size);
            border-radius: 0;
            border: none;
            background: transparent;
            position: relative;
        }

        /* El texto del número debe quedar por encima de las capas */
        .node.tri .circle span {
            position: relative;
            z-index: 2;
        }

        /* Capa exterior: triángulo sólido (color del borde) */
        .node.tri .circle::before {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--espejo-accent);
            z-index: 0;
        }

        /* Capa interior: triángulo más pequeño (color de fondo) = efecto borde */
        .node.tri .circle::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: var(--bg);
            z-index: 1;
        }

        .node.tri-down .circle::before {
            clip-path: polygon(0% 0%, 100% 0%, 50% 100%);
        }
        .node.tri-down .circle::after {
            clip-path: polygon(5% 5%, 95% 5%, 50% 93%);
        }

        .node.tri-up .circle::before {
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
        }
        .node.tri-up .circle::after {
            clip-path: polygon(50% 8%, 95% 95%, 5% 95%);
        }

        /* Color de borde para triángulos máscara */
        .node.mascara.tri .circle::before {
            background: var(--mascara-accent);
        }

        /* Color de borde para triángulos especiales */
        .node.especial.tri .circle::before {
            background: var(--especial);
        }

        /* En triángulos, el box-shadow rectangular del hover muestra un cuadrado
           detrás del triángulo. Usamos drop-shadow que respeta el clip-path. */
        .node.tri .circle:hover {
            box-shadow: none;
            filter: drop-shadow(0 0 6px rgba(212, 168, 83, 0.55));
        }

        /* Espejo */
        .node.espejo .circle {
            border-color: var(--espejo-accent);
            color: #7ab3ff;
        }

        .node.espejo .lbl { color: #5a9ae0; }

        /* Mascara */
        .node.mascara .circle {
            border-color: var(--mascara-accent);
            color: #e87c70;
        }

        .node.mascara .lbl { color: #c0605a; }

        /* Especial */
        .node.especial .circle {
            border-color: var(--especial) !important;
            box-shadow: 0 0 10px rgba(155, 89, 182, 0.2);
        }

        /* Responsive */
        @media (max-width: 550px) {
            :root {
                --node-size: 44px;
                --tri-size: 40px;
            }
            header h1 { font-size: 1.2rem; }
            .node .circle { font-size: 0.85rem; }
            .node .lbl { font-size: 0.45rem; max-width: 60px; }
        }

        /* Leyenda */
        .leyenda {
            max-width: 680px;
            margin: 20px auto 0;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--card-bg);
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .leyenda-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            color: var(--text-dim);
        }

        .leyenda-dot {
            width: 12px; height: 12px;
            border-radius: 50%;
            border: 2px solid;
        }

        .leyenda-dot.e { border-color: var(--espejo-accent); }
        .leyenda-dot.m { border-color: var(--mascara-accent); }
        .leyenda-dot.s { border-color: var(--especial); }

        /* Tabla resumen */
        .resumen {
            max-width: 680px;
            margin: 24px auto 0;
            width: 100%;
        }

        .resumen h3 {
            font-size: 0.9rem;
            color: var(--gold);
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .resumen-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1px;
            background: var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .resumen-col { background: var(--card-bg); }

        .resumen-col h4 {
            padding: 10px;
            text-align: center;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .resumen-col.ec h4 { color: var(--espejo-accent); }
        .resumen-col.mc h4 { color: var(--mascara-accent); }

        .resumen-row {
            display: flex;
            justify-content: space-between;
            padding: 7px 12px;
            border-top: 1px solid var(--border);
            font-size: 0.8rem;
        }

        .resumen-row .rl { color: var(--text-dim); }
        .resumen-row .rv { font-weight: 600; }
        .ec .rv { color: #7ab3ff; }
        .mc .rv { color: #e87c70; }
        .resumen-row .rv.especial-num { color: var(--especial); }

        /* --- MODAL ARQUETIPO --- */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-overlay.active {
            display: block;
        }

        .modal {
            background: var(--card-bg);
            min-height: 100vh;
            animation: modalIn 0.25s ease;
            padding: 0 0 40px;
        }

        @keyframes modalIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-close {
            position: fixed;
            top: 16px;
            right: 24px;
            background: rgba(30,30,50,0.8);
            border: 1px solid var(--border);
            border-radius: 50%;
            width: 40px; height: 40px;
            color: var(--text-dim);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s, background 0.2s;
            line-height: 1;
            z-index: 1001;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-close:hover { color: var(--text); background: rgba(50,50,70,0.9); }

        /* Titulo arriba */
        .modal-title-bar {
            padding: 28px 40px 20px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, rgba(212,168,83,0.08), transparent);
        }

        .modal-title-bar h2 {
            font-size: 1.6rem;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 4px;
        }

        .modal-title-bar .modal-sub {
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .modal-title-bar .modal-sub span {
            color: var(--gold-light);
            font-weight: 500;
        }

        .modal-pilar-badge {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 4px;
            font-size: 0.75rem;
            background: rgba(212, 168, 83, 0.15);
            color: var(--gold-light);
            margin-left: 8px;
            cursor: pointer;
            transition: background 0.25s, box-shadow 0.25s, transform 0.25s;
        }
        .modal-pilar-badge:hover {
            background: rgba(212, 168, 83, 0.35);
            box-shadow: 0 0 10px rgba(212, 168, 83, 0.5);
            transform: translateY(-1px);
        }

        /* Modal de pilar: estilos del contenido */
        #pilar-modal-cont {
            font-size: 0.97rem;
            padding: 4px 8px;
        }
        #pilar-modal-cont p {
            margin: 0 0 18px 0;
            line-height: 1.8;
            color: var(--text);
            text-align: justify;
            hyphens: auto;
        }
        #pilar-modal-cont p:first-child {
            margin-top: 0;
        }
        #pilar-modal-cont h3.pilar-seccion {
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-size: 1.25rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin: 36px 0 20px 0;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(212, 168, 83, 0.35);
            text-shadow: 0 0 12px rgba(212, 168, 83, 0.35);
            text-align: center;
        }
        #pilar-modal-cont h3.pilar-seccion:first-child {
            margin-top: 8px;
        }
        #pilar-modal-cont h4.pilar-subseccion {
            color: var(--gold-light);
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.6px;
            margin: 24px 0 12px 0;
            padding-left: 12px;
            border-left: 2px solid rgba(212, 168, 83, 0.5);
            text-transform: uppercase;
        }
        #pilar-modal-cont ul.pilar-ul,
        #pilar-modal-cont ol.pilar-ol {
            margin: 8px 0 22px 0;
            padding: 0 0 0 8px;
            list-style: none;
            counter-reset: pilar-counter;
        }
        #pilar-modal-cont ul.pilar-ul li,
        #pilar-modal-cont ol.pilar-ol li {
            position: relative;
            padding: 8px 0 8px 34px;
            line-height: 1.75;
            color: var(--text);
            border-bottom: 1px solid rgba(212, 168, 83, 0.08);
        }
        #pilar-modal-cont ul.pilar-ul li:last-child,
        #pilar-modal-cont ol.pilar-ol li:last-child {
            border-bottom: none;
        }
        #pilar-modal-cont ul.pilar-ul li::before {
            content: '◆';
            position: absolute;
            left: 8px;
            top: 8px;
            color: var(--gold);
            font-size: 0.75rem;
            line-height: 1.75;
        }
        #pilar-modal-cont ol.pilar-ol li {
            counter-increment: pilar-counter;
        }
        #pilar-modal-cont ol.pilar-ol li::before {
            content: counter(pilar-counter);
            position: absolute;
            left: 0;
            top: 6px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(212, 168, 83, 0.15);
            border: 1px solid var(--gold);
            color: var(--gold);
            font-family: 'Cinzel', serif;
            font-size: 0.78rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #pilar-modal-overlay .modal {
            max-width: 960px;
        }

        /* Contenido principal: info a la izq, carta+letra a la der */
        .modal-content {
            display: flex;
            gap: 36px;
            padding: 28px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .modal-left {
            flex: 1;
            min-width: 0;
        }

        .modal-right {
            display: flex;
            align-items: flex-start;
            gap: 20px;
            flex-shrink: 0;
        }

        .modal-right img {
            width: 160px;
            height: auto;
            border-radius: 10px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s, filter 0.3s;
        }

        .modal-right img:hover {
            transform: scale(1.06);
            box-shadow: 0 0 24px rgba(212, 168, 83, 0.45);
        }

        .modal-right .modal-hebrew-img {
            width: 120px;
            height: auto;
            filter: invert(1);
            opacity: 0.9;
            border: none;
        }

        /* Para la letra hebrea, drop-shadow respeta la silueta del trazo
           (no es un cuadrado), y combinamos con invert para mantenerla blanca */
        .modal-right .modal-hebrew-img:hover {
            box-shadow: none;
            transform: scale(1.08);
            filter: invert(1) drop-shadow(0 0 10px rgba(212, 168, 83, 0.7));
            opacity: 1;
        }

        .modal-section {
            margin-bottom: 22px;
        }

        .modal-section h3 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border);
        }

        .modal-section h3.luz { color: #5a9ae0; }
        .modal-section h3.sombra { color: #e87c70; }
        .modal-section h3.sintesis-h { color: var(--gold); }

        .modal-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .modal-tag {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            border: 1px solid;
        }

        .modal-tag.luz {
            border-color: rgba(90, 154, 224, 0.3);
            color: #7ab3ff;
            background: rgba(90, 154, 224, 0.08);
        }

        .modal-tag.sombra {
            border-color: rgba(232, 124, 112, 0.3);
            color: #e87c70;
            background: rgba(232, 124, 112, 0.08);
        }

        .modal-sintesis {
            font-size: 0.92rem;
            line-height: 1.75;
            color: var(--text);
            text-align: justify;
        }

        .modal-sintesis p {
            margin: 0 0 14px 0;
        }

        .modal-sintesis p:last-child {
            margin-bottom: 0;
        }

        .modal-bloque {
            margin-bottom: 26px;
        }

        .modal-bloque:last-child {
            margin-bottom: 0;
        }

        .modal-bloque h4 {
            font-size: 1rem;
            font-weight: 700;
            color: var(--gold);
            margin: 0 0 12px 0;
            letter-spacing: 0.5px;
        }

        .modal-bloque .modal-sintesis {
            font-size: 0.92rem;
            line-height: 1.75;
        }

        @media (max-width: 768px) {
            .modal-content {
                flex-direction: column-reverse;
                padding: 20px 20px;
                gap: 20px;
            }
            .modal-right {
                justify-content: center;
            }
            .modal-title-bar { padding: 20px 20px 14px; }
            .modal-title-bar h2 { font-size: 1.3rem; }
        }

        @media (max-width: 480px) {
            .modal-right img { width: 110px; }
            .modal-right .modal-hebrew-img { width: 80px; }
        }

        /* ===================== BIBLIOTECA ===================== */
        .biblio-toggle {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 80;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            background: rgba(20, 20, 40, 0.92);
            border: 1px solid rgba(212, 168, 83, 0.4);
            color: var(--gold);
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.88rem;
            font-family: inherit;
            letter-spacing: 0.5px;
            transition: all 0.25s;
            backdrop-filter: blur(6px);
        }
        .biblio-toggle:hover {
            background: rgba(212, 168, 83, 0.15);
            box-shadow: 0 0 16px rgba(212, 168, 83, 0.25);
        }
        .biblio-toggle .icono { font-size: 1.05rem; }

        .biblio-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 90;
        }
        .biblio-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .biblio-panel {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 340px;
            max-width: 90vw;
            background: linear-gradient(180deg, #15152a 0%, #0f0f1e 100%);
            border-right: 1px solid rgba(212, 168, 83, 0.25);
            box-shadow: 4px 0 30px rgba(0, 0, 0, 0.5);
            transform: translateX(-100%);
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100;
            display: flex;
            flex-direction: column;
        }
        .biblio-panel.active { transform: translateX(0); }

        .biblio-header {
            padding: 22px 22px 16px;
            border-bottom: 1px solid rgba(212, 168, 83, 0.2);
            display: flex;
            align-items: center;
            justify-content: space-between;

        descripcion: [
            'El número 2, al llegar al mundo, es recibido por su número anterior, el 1: y por esta razón, su personalidad vibra especialmente con el recibir, la receptividad y la necesidad de complementación con otra persona. El 2 es un número que recibe, y la intuición es la forma más pura y sutil con la que se manifiesta la recepción. Esto significa que, para estar siempre en armonía, este arquetipo deberá escucharse a sí mismo y seguir sus propias intuiciones en todo momento. También tiene la capacidad de guardar y revelar secretos: todo lo que el 1 sabe y le cuenta, el 2 lo guarda en su interior para, posiblemente, revelarlo en el momento adecuado. Tiene el don especial de descubrir o manifestar lo que está oculto y de detectar mentiras, lo cual puede cambiar potencialmente el rumbo de muchas historias.',
            'Entre los dones que posee están sus grandes capacidades de escucha y silencio, altamente valoradas y fundamentales en cualquier relación. Sin embargo, su desafío es aplicar estos talentos a sí mismo, es decir, aprender a escucharse a sí mismo y a callar su mente y sus palabras en el momento oportuno. Además, el 2 es conocido por tener mucha paciencia y sus procesos internos y externos suelen ser bastante lentos, reflexivos. Nada que ver con el 1. Sabiendo esto, deberá reconocer y respetar estos tiempos y no compararse con personalidades más activas y de acción, como pueden ser el 1 o el 7.',
            'Otras capacidades importantes de este arquetipo son la imaginación y la reflexión, ambas derivadas de la intuición. En el Tarot, su representante es el arcano de La Sacerdotisa, un personaje místico que guarda secretos y cuya capacidad de observación va más allá del mundo físico. Su mundo es interior, su energía es femenina, pasiva y receptiva, muy distinta a la del número 1.',
            'Si la tendencia del 1 era de ir hacia el exterior y avanzar, el 2, al contrario, invita a la reflexión, a parar y a ir hacia dentro. Su vibración inspira ternura y apertura, ya que suele reflejar una personalidad tranquila y transparente, a veces tímida, pero con cualidades de calidez que invitan a desvelarse y desnudarse simbólicamente. La papisa del arcano que lo representa, tiene habilidades para encantar e, igualmente, para deshacer todo encantamiento. No la podemos engañar, porque encontrará todas nuestras debilidades y nuestras máscaras fácilmente. Es el símbolo del autoconocimiento y de una profunda introspección.',
            'Cuando Dios simbólicamente da a luz el 2, este llega en un mundo en el cual lo primero que ve es al 1 —su hermano mayor — y por este motivo su concepto de identidad personal estará ligado a la relación o dinámica con el otro. Para conocerse a sí mismo, necesita a alguien que le diga quién es. Su concepto del "yo soy" está profundamente ligado a la experiencia con otro ser, "tú y yo somos". Esta necesidad de verse reflejado en otra persona es una característica natural del 2, que solo se conoce a sí mismo a través del otro. Esto lo hace muy sensible al juicio de los demás, ya que piensa de manera automática y natural que necesita a alguien todo el tiempo para sentirse completo.',
            'Cuando el 2 se enamora, por ejemplo, se sentirá entero al encontrar a esa otra persona especial, pues, mientras el 1 vibra en la unidad, el 2 vibra en la dualidad. En la pareja, se sentirá incompleto y, a menudo, buscará esa otra mitad que lo completará: a su alma gemela o alma llama.',
            'Si, por ejemplo, un 1 y un 2 decidieran tener una relación, será imprescindible entender y respetar estas dinámicas y necesidades mutuas, para que la relación tenga éxito. El 1, que es muy independiente y tiene una vida más allá de su pareja, tendrá que encontrar la manera de gestionar la necesidad de ese 2 con el que se está relacionando y que se identifica mucho con "la pareja". El 2, por su parte, tendrá que suavizar esa necesidad e identificación con el otro, porque el 1 no le responderá de la misma manera. Es muy probable que un 1 quiera hacer muchas cosas fuera de la pareja y que necesite espacio para poder expresar su individualidad, mientras un 2 querrá hacer quizás todo en pareja y compartir más tiempo juntos.',
            'Situaciones de este tipo son muy comunes y, si se desarrollan desde la inconsciencia, llevan a una lucha de poder constante y a un sufrimiento y desgaste innecesarios. Si se diera el caso de que dos elementos, aparentemente tan diferentes como estos dos arquetipos, se juntan, en todos esos escenarios, habrá una oportunidad de crecimiento, evolución, sanación o trascendencia. No nos juntamos para sufrir, sino para crecer.',
            'Si el arquetipo 2 lo encontráramos en el área del Mapa relacionada con la esfera profesional, preferiría probablemente tener un socio o un colaborador, trabajar junto con su pareja o con alguien cercano. Quizás se sienta más cómodo como dependiente o subordinado, en lugar de tener un perfil de mando o de ejecutivo. Sin duda alguna, para que esté siempre en armonía en esta área, tendrá que escucharse a sí mismo y siempre hacerle caso a su intuición.',
            'En otra área del Mapa, como por ejemplo la de la familia, un 2 podría depender de la compañía u opinión de sus familiares para sentirse validado o en paz; o, también al revés, sentir la necesidad de otro de ser acompañado o validado.',
            'Además, si el 1 es el líder natural, el 2 es el seguidor o follower natural. En este sentido, es importantísimo respetar el rol y perfil que la Consciencia nos ha dado. Una cosa no es mejor que la otra. Las capacidades, habilidades, talentos y superpoderes que tiene cada uno de los arquetipos, son dones particulares que la Consciencia nos dio el día de nuestro nacimiento para ponerlos al servicio de la humanidad. Si ahí afuera vieras a personas y personajes que son muy diferentes de ti, la invitación es que los observes y te dejes inspirar por ellos, pero en ningún momento deberías sentir la obligación de convertirte en la copia del otro, o de hacer todo lo que la otra persona hace. Recuerda que, si naciste verde, tu desafío en esta encarnación es descubrir y manifestar todos los tonos infinitos de este verde. No has venido aquí a ser rojo o azul. Cada uno de nosotros ha nacido con una misión especial, un mandato particular o un rol bien definido. No vamos a ser todos arquitectos o todos bailarines. Estamos aquí, en este teatro cósmico, con un papel y un personaje (o más de uno), que vamos descubriendo por el camino.',
            'Como podemos observar, estamos aprendiendo a ver la realidad a través de los ojos de cada arquetipo, una realidad que no es la realidad real, sino la percepción de esa realidad. Cada uno de nosotros ve el mundo según la percepción que tenemos de él y con base en la estructura de nuestra personalidad.',
            'En este sentido, La Sacerdotisa tiene en la mano el Libro de la Verdad, una verdad que es, en realidad, la suya propia y que está destinada a descubrir por sí misma a través de un viaje en su interior. Este personaje nos invita a ir detrás de las cortinas del escenario, detrás del velo de la realidad aparente, para poder recibir los misterios sagrados y que la verdad nos sea revelada.',
            'El arquetipo 2 es el primer número de la serie que nos habla de la canalización a través de la intuición. Por lo tanto, el chakra relacionado con él será el chakra corona, que nos permite conectar con un plano superior y acceder a los misterios de la vida. Si este chakra se encontrase débil o disarmónico, evidentemente nuestra capacidad de conectar con nuestra intuición y expresar todas las cualidades del 2 se verían comprometidas.',
            'Continuando con el análisis del 2, será fundamental recordar que el objetivo principal de este arquetipo es su trabajo constante para equilibrar el tema de la valorización y la validación por parte del otro. Es imprescindible que se sienta valorado y validado en todo momento. Para este número, lo que le diga la persona que tiene delante es "la verdad". Por esta razón, puede sentirse valorado o desvalorizado según los comentarios y juicios que reciba, los cuales pueden llevarlo a los niveles más altos de autoestima o hundirlo en la miseria, con solo unas pocas palabras.',
            'Dile "tonto" a un 2 y se lo creerá, dile "hermoso" a un 2 y también se lo creerá.',
            'Debido a todos estos elementos, uno de sus retos será aprender a valorarse a sí mismo, a pesar del juicio y las opiniones de los demás. Tendrá que aprender a ser más independiente y a aceptar que no todos funcionan como funciona él.'
        ],
        sombra: [
            'El número 2 puede sufrir por varias razones: la separación de su ser amado, la obligación de mantener un secreto que no desea o no puede guardar, o el anhelo de encontrar a su alma gemela, su pareja ideal, un tema muy importante y a menudo presente para este número.',
            'Quizás su dolor se manifiesta por no escucharse a sí mismo y no seguir su intuición, o por impedir que su imaginación vuele. Esto suele ocurrir cuando en su entorno se valoran en exceso la racionalidad, la lógica y el pragmatismo. Además, si se le menosprecia, se le quita importancia o se le hacen comentarios mezquinos, todo su sistema emocional se verá afectado, minando profundamente su autoestima. En estos casos, lo ideal es que se mire en un espejo, observe su reflejo y recuerde que el único valor real es el que se da a sí mismo. Las opiniones de los demás son solo eso, opiniones.',
            'Su desafío será dejar de buscar la aprobación y la validación de los demás, y redescubrir su valor innato e inmutable. Cuando esto ocurra, las circunstancias externas reflejarán ese mismo valor en las palabras y acciones de la gente. Nunca hay que olvidar que solo vemos y escuchamos en el mundo externo lo que nos decimos a nosotros mismos en nuestro interior. Cambiando ese discurso y dándonos más valor, cambiamos nuestra realidad.',
            'Por otro lado, en su Sombra podrían aparecer todas las clases de dependencias emocionales y de sustancias tóxicas. Podría convertirse fácilmente en pura necesidad y desarrollar problemas con el apego y las adicciones, llegando a pensar que su vida no tiene sentido sin una determinada persona, hábito o sustancia.',
            'Además, podría tener memorias familiares heredadas relacionadas con infidelidades, atrayendo experiencias de engaños amorosos que le servirían —como siempre digo— para comprender, sanar, crecer y evolucionar.',
            '¡Siempre hay una razón cósmica para todo! En los Pilares de tensión y dolor, un 2 suele tener problemas en diversos escenarios: cuando no sigue su intuición y cuando se dan temas de cosas no dichas y secretos (incluso familiares). También sucedería en casos en los que aparezcan apegos y dependencias o, asimismo, en contextos en los cuales las memorias no sanadas de su árbol genealógico lo condicionan a estar sin pareja para sobrevivir.',
            'En cuanto a su comportamiento, podríamos ver, además, una personalidad muy callada, hipócrita, con una doble cara o una doble vida. En otras ocasiones puede haber un apego o un miedo profundo asociado a la necesidad de tener muchos seguidores —tanto en la vida real como en las redes sociales— o de excederse en querer seguir a alguien. En este último caso podría haber personalidades que rozan el fanatismo o el acoso hacia otra persona. Un ejemplo podría ser el personaje interpretado por Kathy Bates en la película Misery (1990).',
            'Como puedes ver, cada uno de nuestros arquetipos nos puede mostrar muchísimas cualidades y diferentes matices, dependiendo del grado de armonía y desarmonía con el que esté vibrando. Cuanto más mantengamos una coherencia emocional con nuestro verdadero ser, los aspectos que se manifestarán serán, sin duda, más armónicos y empoderantes. En caso contrario, o si llegamos a los extremos, podemos llegar a expresar hasta el punto más oscuro de nuestra personalidad, nuestro potencial en la Sombra.'
        ],
        astrologia: [
            'En Astrología, el 2 lo podemos asociar con la Luna, que refleja el mundo interior, pero también con el planeta Neptuno y con el signo de Piscis, por su capacidad de canalización y habilidades intuitivas.'
        ],
        hebrea: [
            'La letra hebrea asociada a este arquetipo es la BEITH, que nos invita a aprovechar la dualidad para nuestro crecimiento y evolución. Nos recuerda que solo a través de la misericordia seremos capaces de unir el mundo celestial con el mundo material. Visualizar o meditar con esta letra nos ayudará a comprender e integrar sus enseñanzas y a equilibrar el Pilar en el que se encuentra este arquetipo.'
        ]
    },
    3: {
        nombre: 'La Emperatriz',
        hebreo: 'Ghimel',
        imagen: 'Cartas Tarot/3.png',
        positivas: ["Comunicación", "Expresión", "Mente concreta", "Inteligencia", "Racionalidad", "Lógica", "Cerebro izquierdo", "Explicación", "Aprendizaje", "Entendimiento", "Estudio", "Información", "Intercambio de datos", "Informática", "Tecnología"],
        negativas: ["Racionalidad en exceso", "Rigidez mental", "Logorrea", "Bloqueo expresivo", "Mutismo", "Disco rayado", "Miedo a hablar", "Tecnología", "Informática", "Electricidad", "Infertilidad", "Maternidad forzada", "Maternidad imposible", "Desvalorización", "No sentirse a la altura"],
        descripcion: [
            'Cuando el 1 —principio vital masculino— y el 2 —principio receptivo femenino— se encuentran, dan a luz el arquetipo siguiente: el número 3. Este número, cuyo dominio es el plano de la mente concreta, se manifiesta a través del conocimiento intelectual, la lógica y la comunicación. Para este arquetipo, el único filtro para interpretar y conocer el mundo es la mente racional, con la cual podrá comprenderlo todo. La razón y la lógica son las herramientas favoritas para entender la realidad que le rodea.',
            'El 3 se nutre de conocimientos de todo tipo y es atraído por libros, bibliotecas, conferencias, seminarios y cualquier lugar donde pueda absorber información. Una de sus mayores habilidades es la comunicación, manifestándose a través de la expresión escrita o verbal: periódicos, radio, Internet y todos aquellos medios que amplifican su capacidad de recibir y transmitir información, son ideales para que este arquetipo se pueda expresar.',
            'Naturalmente, el número 3 describe una personalidad que habla mucho, vive y se desvive para comunicar: este es su don principal. A menudo, se siente atraído por la tecnología y la informática, que representan niveles superiores de información y comunicación. La necesidad profunda del 3 es la de aprender, procesar e intercambiar la información y los datos que recibe. Si no entiende algo, puede sufrir y darles vueltas a las cosas en su cabeza. Su necesidad básica es comprender con precisión el significado de la realidad y de los eventos, con todo tipo de detalles minuciosos y lógicos. Para el 3, pues, todo debe tener un sentido, una causa y un efecto, aunque no siempre es tan sencillo.',
            'De los siete chakras del cuerpo humano, lo asociaremos fácilmente con el 5º chakra, el de la garganta, que rige la comunicación y la expresión del Ser, mientras que, en la baraja del Tarot, el 3 lo encontraremos personificado en el arcano de La',
            'Emperatriz, una figura que simboliza prosperidad, inteligencia y maternidad.',
            'El 3 suele tener una rica vida social que se desarrolla, a menudo, en ambientes intelectuales que le permiten compartir sus intereses y satisfacer sus necesidades mentales. Además, la belleza y la elegancia suelen ser elementos importantes para el 3, y necesitará encarnarlos en su propia persona o buscar estos atributos en los demás. No olvidemos que la Emperatriz es una figura aristocrática y puede sentirse fácilmente atraída por las posesiones materiales, el lujo y la prosperidad. Este noble arquetipo seduce a través de sus conocimientos y a través de sus conocimientos, valorando profundamente las relaciones, con un diálogo profundo y una comunicación fluida.',
            'Si observamos atentamente el arcano de la Emperatriz, vemos que esta mujer, sentada en un trono, tiene su mano izquierda apoyada en su vientre, que parece abultado, como si estuviera al principio de un embarazo. Por esta razón, un nuevo elemento que puede aparecer en los dominios del 3 es el tema de la maternidad, de la fertilidad y del deseo natural de procreación. Este aspecto se da por la fusión de los principios masculino y femenino, unión que genera dicho arquetipo. Dependiendo del Pilar en el que se encuentre en el Mapa de la personalidad, puede haber una historia relacionada, quizás, con una necesidad de ser madre (real o simbólica) o algún tema de fertilidad.',
            'Por último, es necesario mencionar, además, algunos de los rasgos muy comunes de esta personalidad: la alegría, el entusiasmo y el optimismo estarán presentes frecuentemente en su carácter. Nuestra Emperatriz es una persona positiva y suele llevar el espíritu de la primavera allá donde vaya. El pintor renacentista Sandro Botticelli (siglo XV), inmortalizó este arquetipo en su Primavera y también en Nacimiento de Venus, obras que suponen símbolos de fertilidad y fecundidad.'
        ],
        sombra: [
            'Cuando el 3 tiene una herida, sufre o se enfrenta a sus mayores resistencias, suele ser en esos momentos en que se empeña en entender ciertos aspectos de la vida únicamente con su mente racional y lógica. Por lo tanto, puede tener dificultad en aceptar que muchos de estos aspectos pueden pertenecer al terreno de lo emocional o del alma, y no pueden ser comprendidos a través del canal de la razón o de la mente concreta. En consecuencia, el 3 debe aprender que algunas cosas se entienden con el corazón, con el sentimiento o simplemente, a través de una experiencia espiritual, que no puede ser procesada a través de la mente racional.',
            'Igualmente, al estar en conexión directa con el plano mental concreto, el 3 puede utilizar todo su potencial en los asuntos de la mente. Sin embargo, esa mente que en armonía representa un don para el Ser, en su Sombra se puede convertir en una prisión. Su mayor problema suele surgir por un exceso de racionalidad que, con frecuencia se expresa a través de una voz incansable en su cabeza que habla sin descanso, como un disco rayado. El resultado será, posiblemente, un gran desgaste energético, un cansancio constante, ansiedad o insomnio. Cuando esta voz interna se expresa verbalmente, se convierte en verborrea y, como un loro, repetirá la misma historia una y otra vez, con una cantidad infinita e innecesaria de detalles queriendo siempre tener la última palabra.',
            'La mente y la comunicación, que en el Espejo son su mayor regalo, en la Máscara se convierten en elemento de tortura para sí mismo y los demás.',
            'Si este arquetipo escribiera una canción desde la Sombra, la letra sonaría más o menos así:',
            'No entiendo cómo... no entiendo por qué... y si hubiera dicho... y si hubiera hecho... pero si tal vez... si esto hubiera pasado de otra manera... si esto fuera así... si esto fuera asá... tiene por qué ser así... tiene porqué ser asá... quizás sea por esto o por lo otro...',
            'De todas maneras, lo contrario también es muy probable que ocurra, cuando nos encontramos en el mecanismo de supervivencia. Este arquetipo, en defecto, puede contarnos historias de mutismo, bloqueos en la comunicación, miedo o imposibilidad para expresarse, escribir, hablar, así como malentendidos con las palabras o los tonos.',
            'Si investigamos más en sus resistencias o dolores, un tema que a menudo aparece es el de la maternidad, del embarazo y de la posibilidad o imposibilidad de tener hijos. Como ya dijimos antes, cuando consideramos el 3 como la fusión del principio activo y masculino (1) con el principio pasivo y femenino (2), obtenemos la creación simbólica del hijo: la multiplicación de Adán y Eva, del Mago y de la Sacerdotisa. Por lo tanto, podrían aparecer historias de dolor asociadas a temas de embarazos y fertilidad.',
            'Si apareciera un 3 en el mecanismo de supervivencia, podría haber dificultades, dolores y resistencias en el mundo de la lógica, en el proceso del habla, en el intercambio de datos (informática, tecnología, electricidad) y posibles conflictos con estos elementos. Si en una personalidad observaras una resistencia profunda para aprender o gestionar la tecnología, el mundo de la informática o Internet, es muy probable que haya un 3 disarmónico y memorias transgeneracionales relacionadas con la "comunicación con papá". En mi experiencia, este tipo de tikún, suele asociarse a menudo con programas heredados relacionados con la relación con el padre y, en general, con el linaje paterno.',
            'Más dolores también, podrían estar asociados con el aprendizaje y el estudio: querer y no poder estudiar, o no querer estudiar y verse obligados a hacerlo por presiones familiares o sociales. Hay que tener cuidado siempre con el quiero y no puedo o no quiero y me obligan, que es la base de toda incoherencia.',
            'Un gran desafío para el 3 —dependiendo del tipo de desequilibrio— será aprender a hablar, o a callar, en el momento que corresponda. Recuerda que la desarmonía del arquetipo en un Pilar podría darse por una vibración en exceso o en defecto.',
            'En el mundo de las sombras, la "información" puede convertirse en un arma o ser amenazante, mientras que una nueva información, como un posible virus, puede desatar miedos ancestrales y causar fobias a enfermedades infecciosas y virales. Los virus son siempre portadores de nuevas informaciones para el organismo, pero, en este caso esa información puede ser perjudicial a nivel biológico.',
            'Asimismo, en el reino de la Máscara, el 3 puede experimentar crisis cíclicas de prosperidad y carencia, no solo económicas. A la noble Emperatriz le costará vivir por debajo de sus medios. En este sentido, se le recomienda investigar su árbol transgeneracional para identificar patrones familiares y sanar heridas del pasado relacionadas, quizás, con fracasos económicos y pérdidas de dinero.',
            'En la dimensión de la Sombra, la Emperatriz puede adaptar sus armas de seducción, volviéndose coqueta, frívola, femme fatale o manipuladora sexual, en casos extremos, mientras que, en un nivel más biológico, sus síntomas más comunes pueden manifestarse en cuello, garganta o en la zona genital.'
        ],
        astrologia: [
            'En Astrología, el 3 lo asociamos, por un lado, al planeta Mercurio y al signo de Géminis, con los cuales comparte la dimensión de la comunicación, de la racionalidad y del plano mental. Por otro lado, la necesidad de belleza, cultura y elegancia, no puede más que evocar las cualidades de Venus.'
        ],
        hebrea: [
            'GHIMEL es la letra hebrea asociada a este arquetipo. Meditar con ella ayuda a integrar sus significados más profundos, como dar, ofrecer, fecundar e inseminar. La Emperatriz es un símbolo de abundancia, prosperidad y fertilidad: no solo en el ámbito de lo físico, sino también en el espiritual, desde el cual provienen las verdaderas causas. En el plano físico, solo se muestran los efectos de esas causas. Trabajar con esta letra sagrada nos facilita alcanzar la abundancia que deseamos, ayudándonos a comprender que dar es lo mismo que recibir y que, cuando damos a los demás, nos proporcionamos bienestar a nosotros mismos.'
        ]
    },
    4: {
        nombre: 'El Emperador',
        hebreo: 'Daleth',
        imagen: 'Cartas Tarot/4.png',
        positivas: ["Estabilidad", "Responsabilidad", "Orden", "Normas", "Reglas", "Raíces", "Tradición", "Familia", "Conservador", "Ciencia exacta", "Metodología", "Medición", "Jefe", "Derecho", "Etiquetas"],
        negativas: ["Rigidez física y mental", "Severidad", "Mente cuadriculada", "Autoridad", "Rutina", "Monotonía", "Aburrimiento", "Exceso/defecto de normas", "Apego familiar", "Burocracia", "Materialismo", "Falta de estructura", "Falta de fantasía", "Tiranía", "Intransigencia"],
        descripcion: [
            'Desde el plano mental del número 3, pasamos, finalmente, al plano físico y a la estructura del mundo tal como lo conocemos. Dejamos el reino de la Emperatriz y entramos en los dominios de El Emperador: arquetipo número 4.',
            'Si para el 3 el mundo es "pensamiento", para el 4 el mundo es "materia". Durante el análisis de este arquetipo, esto lo tendremos que tener siempre en consideración. Para el Emperador no hay nada más importante que su imperio, sus tierras. Basta con observar la figura del arcano que lo representa. Está sentado en un trono de piedra cuadrado y, de ahí, no se mueve, no necesita levantarse o entrar en acción. Manda desde su trono.',
            'El 4 representa al gran ingeniero, al constructor y medidor del mundo, necesitando datos claros y concretos para estructurar y estructurarse a sí mismo. Vibra con la racionalidad en su estado más puro y terrenal. Su mente tiene que ser práctica, pragmática y al uso.',
            'Este arquetipo, al igual que el Emperador del Tarot al que está asociado, manda sobre el mundo físico; dirige, clasifica, ordena, esclarece y da forma a las ideas. No se queda en el plano mental dando vueltas. Puede ser un jefe o un responsable a cargo de un grupo reducido de personas, pero como la inteligencia emocional o la creatividad no están entre sus dones innatos, aún no alcanza a ser el gran y sabio líder. Como, naturalmente, se enfoca solo en el mundo terrenal y en las cosas de la tierra, su desafío es abrirse a la creatividad, investigar el mundo emocional, crecer en este sentido para poder llegar a ser el más grande de los gobernantes.',
            'Su reino es la tierra y ese cuadrado en el que se encuentra, un pequeño territorio donde mandar y donde vivir. Lo que el 4 dice es ley para los demás. Necesita una metodología exacta y no se pierde en filosofías y misticismos. Para él, la vida es aquí y ahora, y solo cree en lo que puede tocar con la mano, en la ciencia exacta, en la física newtoniana o cartesiana de causa y efecto. Es el gran escéptico: cualquier cosa que no se pueda medir u observar en el mundo material carece de relevancia o, simplemente, no existe. Representa al ingeniero arquetípico, al gran conocedor de la materia como del mundo físico. A través de él se construyen planos, Mapas, casas, edificios y ciudades, pero no se le pedirá ir más allá de sus numerosos talentos. Este Emperador construye estructuras tangibles en la materia, pero no las llena. Se encarga del esqueleto de la casa, pero no de su decoración. Se identifica con el cuerpo físico y con sus posesiones, pero el reino del alma y de las emociones a veces le resulta incomprensible: cómo el espíritu y los sentimientos no se pueden observar, medir, pesar o calcular, no son tan importantes como las cosas del mundo tangible.',
            'Para entender mejor esta personalidad y sus polaridades, podemos utilizar las figuras de los emperadores romanos Nerón y Marco Aurelio, en sus dos extremos. Si este último reinó desde la suavidad de su estructura y de sus normas, el primero es recordado por su extrema rigidez y falta de empatía. Ambos personajes manifiestan las dos polaridades del mismo arquetipo. Por esta razón, si te encuentras con un 4 en tu Mapa de la personalidad, pregúntate qué tipo de emperador quieres ser y qué tipo de imperio quieres construir.',
            'Aparte de esto, entre otras características del 4 encontramos la necesidad constante de estabilidad, ya sea material, profesional, económica o sentimental. Su vida está entregada a las ciencias exactas, a las leyes, a los marcos, a las normas y a las tradiciones. El orden y la rutina son la expresión de esa estructura interna y son los símbolos, por excelencia, de su estabilidad y confort. Un 4 sin estructura, estabilidad y rutina podría sufrir mucho.',
            'No es un gran amante de las sorpresas ni de lo original y creativo, porque en su materia no hay fantasía, sino funcionalidad y practicidad. El 4 en el Espejo es perfecto así, no hay que cambiarle nada.',
            'Con este arquetipo estamos aún en el plano de la racionalidad y esto lo debemos entender y aceptar. No le podemos exigir mucho arte y creatividad porque las desconoce, y si las conociera, no tendrían utilidad en su mundo. Su mente es aún concreta —es el esposo de la Emperatriz— y sus ideas y pensamientos están al servicio de la tierra, de lo cotidiano, del momento presente: casa, trabajo, comida, dinero y poca cosa más. El Emperador suele ser un gran trabajador, una persona firme, responsable y con un don para el mando y cargos intermedios.',
            'Esta personalidad puede sentirse atraída por los uniformes, ya que encarna el arquetipo de la autoridad, especialmente los de policía, militares y guardias civiles. Muchas veces, suele haber vocación para este tipo de profesiones. Las normas y el orden son de extrema importancia aquí.',
            'En la esfera profesional, el 4 puede ser, por ejemplo, un jefe de departamento, un trabajo rutinario, una profesión de ingeniero más que de arquitecto. Si el ingeniero construye la base, la estructura y los cimientos, el arquitecto —que veremos más adelante— se encuentra en un nivel superior de la mente y juega con la estructura a través de la creatividad.',
            'En la vida de pareja, este arquetipo suele ser tradicional, monógamo y fiel a su emperatriz —o sea, nada de poliamor, o parejas abiertas, o experimentos extraños— y su objetivo suele ser el matrimonio, una casa o una familia estable en el tiempo.',
            'Otra cosa sería si se encontrara en la Sombra. ¡Ojo con los excesos o defectos de todos los arquetipos!',
            'Siempre será una persona extremadamente organizada y ordenada. Basta con mirar sus armarios y los cajones de sus calcetines y calzoncillos bien doblados para darse cuenta. ¿Has mirado el orden en la despensa de la cocina, en las carpetas de su despacho o de su portátil? Cada cosa tiene su sitio porque, si no hay orden, reina el caos: tanto dentro de los armarios, como en la vida misma. Controlar el orden exterior le hará sentirse mejor, porque inconscientemente sabe que lo de afuera y lo de adentro, son lo mismo. Y eso está bien, es natural para él, siempre y cuando no se obsesione.',
            'A nivel inconsciente, los marcos, los cuadros y los cuadrados, le relajan, tanto en las paredes de su casa como en la ropa que lleva puesta.',
            'Te propongo un juego: ¡busca a un 4 entre tus amigos y familiares y cuenta todos los 4 que encuentras en él o en ella! Sin embargo, si el 4 eres tú… observa tu vida, tu casa, tus cajones y tu ropa.',
            '¿Cuántos cuatros/cuadrados/cuadros descubres?',
            'Lo mismo puedes hacer con todos los demás arquetipos. Con el tiempo y la práctica, podrás localizar fácilmente los arquetipos que conforman la personalidad de las personas que te rodean y serás capaz de entenderlas mejor y, también, de reírte un poco y burlarte con humor, junto a ellas, de sus excentricidades y excesos. En mi vida personal y en mi entorno, el humor nunca falta, y el lenguaje astrológico y numerológico, nos permite identificar nuestras peculiaridades con facilidad y reírnos de nosotros mismos.',
            'Cuando a la vida le quitamos el drama y le añadimos un poco de humor, ¡la vida cambia a mejor!',
            'Volviendo ahora a nuestro Emperador… Este monarca, a veces tan serio, necesitará tener un calendario y una agenda, siempre a mano, para apuntar cosas y organizarse. Sus sueños, si los tiene, son clásicos, tradicionales y bastante conservadores. ¡Y eso está bien! Su mayor don es su profundo sentido del deber, pero hay que tener mucho cuidado con las obligaciones y posibles incoherencias: siempre debería primar la responsabilidad hacia uno mismo.',
            'Uno de los aspectos más importantes de este arquetipo es el lazo profundo que tiene con sus raíces. Para un 4, es extremadamente importante su origen, su tierra, su linaje y sus tradiciones familiares. Los domingos en familia son sagrados. La cercanía con sus padres y con su tierra es insustituible. Lejos de su hogar, puede llegar a sufrir.',
            'Por todo ello, es muy probable que a un 4 le guste estudiar su árbol genealógico, no tanto por su comprensión profunda y simbolismo de los patrones familiares o de la herencia transgeneracional, como, más bien, por su propia estructura: organizar y ordenar nombres, fechas y datos será un excelente medio para relajar su mente. Y, si aún no lo ha hecho, sería una buena terapia el día que se anime a hacerlo. Poner en orden su propio árbol será como poner en orden su familia: le sentará muy bien, a nivel psíquico, para equilibrar eventuales desórdenes, dentro del mismo clan familiar y dentro de sí mismo. Poniendo orden en el árbol, pondrá orden dentro de sí mismo.',
            'Para estar en armonía o volver a ella, cualquier 4 necesita construir o volver a una estructura, ya sean las cuatro paredes de su casa, donde se recarga y se siente seguro, o también en una estructura más simbólica, como una rutina diaria o semanal de actividades o trabajo. Sin estructura o con problemas en ella',
            '(invasión, pérdida, derrumbamiento), podría sufrir o desarrollar síntomas físicos, emocionales o psíquicos.'
        ],
        sombra: [
            'Cuando un 4 sufre, quizás sea por su incapacidad de encontrar estabilidad: una pareja estable, un territorio estable, un trabajo estable. Su reto consiste en dejar de ser tan rígido e inflexible y aprender nuevas formas de estructurarse, comprendiendo que rutina e inmovilidad no necesariamente son sinónimos de estabilidad, sino también de estancamiento. El ser humano está en constante evolución y los cambios son parte de la vida. El 4 necesita encontrar armonía en los cambios y buscar su propia manera de estabilizarse en el movimiento, adaptando y actualizando sus estructuras en las diferentes áreas de la vida.',
            'Debido a su necesidad de estabilidad y rutina, puede sufrir por un exceso de rigidez física, emocional o mental. Sus heridas pueden doler por la obligación de respetar normas equivocadas o que no le son afines, por estar lejos de su tierra, de sus orígenes o de su familia. En ocasiones, puede enfermar por haber perdido su casa, su territorio o su rutina. Por lo tanto, se le recomienda cuidar mucho el orden en su espacio privado físico y emocional.',
            'El 4 es la familia —de origen o la que estoy formando— y por esta razón, cabe tener mucho cuidado, también, en el caso de apegos familiares o separaciones.',
            'En la Sombra, la rutina de este arquetipo puede convertirse en monotonía o aburrimiento, y las normas que se ve obligado a seguir pueden ser asfixiantes. Por consiguiente, es imprescindible que aprenda a seguir sus propias normas y las de nadie más: sus horarios, sus valores, sus mandamientos, sus tiempos. Si empieza a seguir normas y reglas de otros, tarde o temprano, la enfermedad, el dolor, la amargura y el estrés aparecerán en su vida. El exceso de normas o la falta de normas, suelen ser una causa bastante común de dolor.',
            'La creatividad y la imaginación, que incluso en su estado natural no suelen estar muy presentes, en la Sombra de un 4 terminan por desaparecer por completo, lo que puede generar una real dificultad para acceder al reino de la fantasía, a la expresión creativa y a la visualización. Cualquier terapia que ayude a canalizar la creatividad será más que bienvenida para restablecer el orden y armonizar el Pilar donde se encuentre este bloqueo.',
            'En caso de una herida no sanada y un desequilibrio interior, puede parecer un déspota, un tirano, una persona obstinada, autoritaria o intransigente. No olvides cómo el emperador Marco Aurelio puede transformarse fácilmente en un Nerón, una vez que se aleja del sendero de la coherencia emocional.',
            'Así, en su mecanismo de defensa, querrá imponer sus normas rígidas a los demás, pero su aprendizaje consistirá en suavizar los ángulos de su cuadrado y pensar fuera de los esquemas tradicionales. Su mejor medicina será rodearse de artistas, creativos y místicos para descubrir nuevas formas de funcionar y asomarse a universos diferentes al suyo. Una gran oportunidad de crecimiento le espera cuando decida incorporar algún nuevo componente a su estructura rutinaria y obsoleta.',
            'Un ulterior elemento de dolor es el exceso de responsabilidad. Hay que vigilar que nuestro Emperador no quiera hacerse cargo de imperios que no le corresponden y quiera mandar sobre territorios ajenos, pero también, que no se exceda en hacerse cargo de su imperio él solito. Un verdadero emperador no se hace cargo de todo, sino que aprende a delegar, a elegir buenos generales y a entregar los poderes ejecutivos a sus representantes. ¡Que aprenda a relajarse, por favor!',
            'Como hemos mencionado antes, el 4 es la materia, y más específicamente es el cuerpo que habitamos. Esto significa que, en caso de posibles enfermedades, el punto débil de este arquetipo suele ser la estructura de este cuerpo, que es donde suele somatizar sus incoherencias emocionales: huesos, articulaciones, ligamentos, tendones y el esqueleto en general.',
            'Su rigidez mental se traslada a su cuerpo, y la cura para una pronta recuperación será incorporar una mezcla de flexibilidad, adaptación y suavidad, físicas y mentales.',
            'A nivel energético, deberá cuidar, sobre todo, el primer y el sexto chakra: uno, por exceso de energía, y el otro, por carencia de ella.'
        ],
        astrologia: [
            'En Astrología, el 4 lo podemos relacionar fácilmente con el planeta Saturno y el signo de Capricornio, tan pragmáticos, pero también con el signo de Leo, por su autoridad y su capacidad de liderazgo.'
        ],
        hebrea: [
            'En cuanto a la letra hebrea correspondiente a este arquetipo, tenemos a DALETH, que nos enseña el arte de recibir, desde los planos superiores y espirituales, hacia los planos del mundo material. El Emperador tiene que aprender que la materia nace del espíritu y no al revés, que las causas se encuentran en el plano superior, mientras que en la tierra solo observamos sus efectos.'
        ]
    },
    5: {
        nombre: 'El Papa',
        hebreo: "He'",
        imagen: 'Cartas Tarot/5.png',
        positivas: ["Espacio", "Valores", "Principios de vida", "Magnetismo terrestre", "Alma", "Creencias", "Territorio", "Casa", "Hogar", "Jefe", "Manager", "Manos", "Terapias manuales", "Decoración", "Feng Shui"],
        negativas: ["Invasión de territorio", "Pérdida de territorio", "Extremismo", "Terquedad", "Soberbia", "Mente cerrada", "Idealismo", "Dogma", "Problemas de útero", "Problemas de vejiga", "Problemas de riñones", "Fanatismo", "Arrogancia", "Presunción", "Doble moral"],
        descripcion: [
            'Si el número 4 representa el cuerpo físico y la estructura de la casa, el 5, simboliza el alma y su espacio interior, es decir, lo que hay dentro de la casa. Es en la tierra inanimada del arquetipo 4, donde empieza a nacer la vida.',
            'Las personas con este número en su Mapa natal poseen una extrema sensibilidad hacia el espacio que les rodea. Sienten la fuerza de la tierra y las energías que de esta emanan. En este nivel, la materia empieza a tener un alma.',
            'Además, uno de los aspectos más relevantes de este arquetipo es la necesidad de cuidar y organizar su propio espacio, interior y exterior, ya sea real o simbólico. Un 5 es extremadamente territorial y no permitirá la entrada a su espacio sagrado a cualquiera. Estará alerta con respecto a su hogar, trabajo o relación dependiendo del área del Mapa donde el 5 aparezca.',
            'Esta sensibilidad se refleja, además, en el espacio físico, pero también en el emocional y el intelectual. Por un lado, observaremos a personas que tienen barreras invisibles alrededor de sus corazones y, por lo tanto, no será tan fácil que se abran enseguida a una amistad o una relación profunda. Un 5 necesita de mucho más tiempo para observar, sentir y procesar la información que se mueve en el espacio para, finalmente, desactivar las barreras y dejar entrar una nueva emoción. Sin embargo, si se le respeta este tiempo y este proceso, aunque al principio parezcan más territoriales o distantes, una vez dentro de su corazón te darán toda su alma. Por otro lado, a nivel intelectual les pasa lo mismo. La presencia de sus barreras invisibles no facilita darle la bienvenida a una nueva información, a una nueva idea o concepto. Al principio rechazará lo nuevo porque sus ideas y conceptos de lo que es el mundo y la vida, para ellos, son tan claros y verdaderos, que necesitarán mucho más tiempo para aceptar, procesar e integrar una nueva verdad.',
            'En sus hogares, tienen un talento especial para la decoración y el orden, eligiendo colores y formas con gran acierto. Todo lo que tenga que ver con la organización y remodelación de un espacio, es su dominio.',
            'Una forma efectiva de cuidar su salud emocional, física y psíquica es mantener y ordenar su casa, organizándola y renovándola con el tiempo. Cuando un 5 está estresado o estancado emocionalmente, puede armonizar su espacio interior simplemente armonizando el espacio en el que vive. Para su inconsciente, si todo está en orden afuera, estará en orden adentro y viceversa. Su hogar es un reflejo profundo de su estado interno, especialmente si este arquetipo se encuentra en el Nudo Emocional, en el Pilar del Día o en la Personalidad Profunda.',
            'Profesionalmente, un ejemplo clásico de una persona con este número podría ser un decorador de espacios con el feng shui, la técnica de colocar cada objeto, color y forma según su energía específica, para facilitar los flujos energéticos del hogar. Esta misma dinámica se puede aplicar a las relaciones de pareja, familia o profesión, dependiendo de dónde se sitúe este aspecto. De alguna manera, el 5 tiene una sensibilidad afín al feng-shui: siente la energía de los espacios y es sensible al magnetismo terrestre.',
            'En otro nivel, podría ser un excelente renovador de estructuras, no solo físicas (edificios) sino también simbólicas o empresariales (organigramas). Cambiar estructuras es similar a cambiar creencias, por lo que también podría ser un buen terapeuta, acompañando a las personas en sus procesos de cambio y crecimiento personal. Su objetivo más noble en un nivel más elevado será el de perfeccionar el mundo físico y espiritualizar la materia, llevando el cielo a la tierra y viceversa.',
            'Este arquetipo también nos invita a contar los dedos de nuestras manos —cinco en cada una— para ver todo lo que podemos hacer con ellas. Las manos, para este arquetipo, son un canal de transformación y transmutación de la materia. Son las manos de Jesús y de los santos de la Iglesia que obran milagros, que sanan a los enfermos y que bendicen cada lugar y cada espacio, alejando y transmutando las energías más densas.',
            'Gracias a las manos de este arquetipo podrán aparecer oficios, intereses o habilidades relacionados con manualidades, artesanía, terapias manuales, energéticas y similares. Si, por un lado, el 5 lo asociamos a la energía del cuerpo, podemos encontrar estas personalidades practicando reiki, reflexología plantar, medicina china y acupuntura. Por otro lado, si lo relacionamos con la energía de la tierra y de la materia, nos podemos encontrar frente a elementos de la geometría sagrada, que es literalmente "espiritualidad en la materia", o de los movimientos telúricos y sismología.',
            'Un 5 ha heredado ciertas cualidades de mando del número 4 y puede llegar a ser un buen director de empresas y equipos, un excelente manager, pero siempre y cuando se respeten (y haga respetar) sus tiempos, sus espacios y su autoridad. Asimismo, podrá armonizar su día a día ampliando su capacidad de delegar, compartir espacios, saber separarlos cuando sea necesario y no confundir su casa con su trabajo, y viceversa.',
            'Entre los arcanos del Tarot encontramos a este arquetipo en El Papa, la autoridad moral que manda ya no en la tierra —como hacía el Emperador— sino en el alma de quien la habita. Para esta figura, el alma de la que hablamos está aún vinculada a un aspecto religioso y moral, a un sistema de creencias dogmáticas que todavía se queda en un nivel mental e intelectual. El alma del Papa no es aún el verdadero Ser. Esta figura nos habla de la importancia de los valores y de los principios de vida, de las creencias más profundas de nuestra alma. Igualmente, aquello que él considere "verdad", será una verdad absoluta que proyectará automática y universalmente en el mundo que le rodea. Para el Papa, lo que él piense es sagrado, sus ideas son intocables, sus verdades son absolutas y todo el mundo debería opinar igual que él. En este arcano, la vibración permanente nos habla de una religión impuesta, una única manera de ver el mundo: la suya.',
            'Por estas razones, el 5 suele proyectar hacia fuera sus ideas, principios y creencias, dando por sentado que todos percibimos o deberíamos percibir el mundo del mismo modo. Su visión de la vida suele ser la más importante y la más verdadera. Sus ideas y su estructura mental no le permiten, a menudo, reconocer que hay otras maneras de percibir el mundo y que puede haber otras creencias y valores igualmente válidos. Este aspecto se suele extremar, sobre todo en el mecanismo de supervivencia, que veremos después. Lo que hay que tener claro es que nunca tendremos que empezar una discusión con un 5, porque nunca la ganaremos. Es casi imposible hacerle cambiar de idea a un 5, por muchas pruebas que aportemos en sostén de nuestras verdades u opiniones. No va a cambiar fácilmente su forma de pensar: tendremos que darle el tiempo necesario para que reflexione, pero sin quedarnos ahí esperando. ¡Suele tardar mucho!',
            'Un 5 ha venido aquí a aprender a ser flexible, a abrirse a nuevas realidades, a cambiar su sistema de creencias y a actualizarse en todo momento para que no se quede obsoleto. Un 5 es como un excelente Windows 98, pero si vivimos en el 2024, este sistema de funcionamiento solo queda excelente dentro de un museo.',
            'Un 5 representa las normas morales, los dogmas, y las escrituras sagradas comunes en la Biblia y la Torá. En el mundo del Ser, no hay espacio para dogmas, y el 5 debe aprender a cuestionar y actualizar sus creencias constantemente. Su gran desafío es comprender que su percepción del mundo es solo una entre muchas.',
            'Cuando el 5 está en armonía, se convierte en un gran maestro, un sabio, y tiene un talento excelente para mejorar los lugares donde se encuentra. Cuando este arquetipo aprenda a fluir con la vida, se lance en el proceso evolutivo y deje de proyectar su Mapa del mundo hacia fuera, se alejará finalmente de los aspectos más dogmáticos del Papa, para encarnar la verdadera esencia del arcano y transformarse en un verdadero guía espiritual. El 5 tiene como misión, en este mundo, la de mejorarlo y espiritualizarlo.',
            'Otro elemento de gran importancia para este arquetipo es el valor de la familia —también heredado por el 4— siendo este un número que se recarga en su hogar y con sus seres queridos. Para un 5 la casa, el hogar y la familia son lo más importante.',
            'No hay lugar como el hogar... …diría Dorothy en el Mago de Oz.'
        ],
        sombra: [
            'Para un 5 que esté sufriendo, solo hay dos curas: aceptación y flexibilidad. Estos recursos son imprescindibles para mantener la estructura siempre estable. Cuando el 5 aprende a actualizar sus creencias y a deshacerse de las que ya no le son útiles, logra armonizarse y, por último, sanarse.',
            'El dolor de este arquetipo surge cuando se aferra a creencias antiguas que ya no son prácticas. A veces, le cuesta aceptar nueva información en su espacio mental, que suele estar bien delimitado, como las paredes de su casa. Por ello, puede percibir un dato nuevo como una amenaza a sus valores, lo que puede desencadenar defensas ideológicas, políticas y sociales. Tendrá que aprender y aceptar que está bien tener opiniones e ideas diferentes, que todos podemos coexistir y que no pasa nada si pensamos y sentimos diferente. Lo más importante es que cada uno aprenda a vivir basándose en sus propios valores y principios de vida, sin querer imponerlos a los demás.',
            'A veces, esta personalidad enfrenta engaños y traiciones para aprender a suavizar o actualizar sus creencias, que pueden ser demasiado estrictas u obsoletas. En el caso del engaño, para que quede claro, esto suele ser vivido como una traición a los principios. Más adelante veremos cómo el engaño, por ejemplo, en los arquetipos 11 o 18, puede ser vivido más como una mentira o una ambigüedad.',
            'Otros aspectos negativos del 5 se manifiestan a través de la soberbia, la altivez y el orgullo: puede creerse superior a los demás (más importante, más inteligente, etc.). Recordemos que, si con un 5 en armonía, es complicado hacerle cambiar de idea, en desarmonía es prácticamente imposible: se vuelve terco, testarudo, cerrado de mente. Es como un burro que se planta en el camino y es imposible hacerle avanzar.',
            'Con un 5, es crucial tener paciencia y respetar sus tiempos para que pueda procesar una nueva información, pero tampoco debemos quedarnos ahí esperando eras geológicas para que cambie. Lo importante no es tener razón, sino vivir en armonía y coherencia cada uno con sus propios valores y sentimientos, respetando a los demás, por muy diferentes que sean. Para un 5, esto puede resultar un poco complicado cuando esté en la Sombra, pero hay esperanza.',
            'En su punto más extremo, puede rechazar totalmente ideas o pensamientos diferentes y volverse racista, misógino, asocial o arrogante, dependiendo de la creencia que le estés tocando. También puede volverse muy dictatorial y aplastar con su autoridad moral. A menudo, puede sufrir o causar sufrimiento debido a sus manías de perfeccionismo, o porque nadie está a su altura, nadie hace las cosas tan bien como él las hace. En el trabajo, este aspecto puede resultar muy desgastante para él mismo, así como para todos aquellos que lo rodean.',
            'En algunos casos, los aspectos negativos del Papa se manifiestan por su juicio moral, exceso de rigor, fanatismo, intolerancia, extremismo, y un riguroso sentido del deber.',
            'Los síntomas que pueden desarrollarse cuando este arquetipo se resiste al cambio, afectan órganos relacionados con el espacio biológico vital, como los pulmones, los riñones (especialmente cálculos), la vejiga o el sistema urinario. La infección urinaria es muy común en conflictos de "invasión o pérdida de territorio" que puede estar ligada, también a la adicción al tabaco. En mujeres, puede haber síntomas en el sistema reproductor como fibromas, miomas, quistes, problemas de fertilidad y abortos, ya que el útero representa la primera casa habitada, el primer hogar simbólico. Evidentemente, cada uno de estos síntomas, tendrá su propio matiz y habría que ser investigado singularmente.',
            'Cuando un 5 aparece en el Pilar de Resistencia o en el Tema Central, puede haber dificultad para hacer respetar sus valores, deseos, tiempos y espacios. Atraerá circunstancias donde los demás le impondrán su visión del mundo, convirtiéndose en víctima de los deseos de los otros. Para evitar esto y mantenerse alejado del dolor y la enfermedad, deberá cuidar su territorio sagrado, marcarlo y repetir este poderoso mantra:',
            'Yo hago lo que quiero, cuando quiero y como quiero.',
            'En lugar de imponer su visión del mundo, podría terminar atrapado en los universos de otras personas y olvidar sus propias necesidades emocionales. Este mantra le ayudará a empoderarse y a restablecer el orden.',
            'Sin embargo, es cierto también todo lo contrario. Es decir, que puede encontrarse completamente encerrado en sus ideas y espacios, y no respetar las ideas de nadie. En este caso, tendrá que respirar hondo, "aflojar las tuercas" y abrirse al cambio, a la flexibilidad y la aceptación.',
            'El desequilibrio de este arquetipo podría afectar al segundo o al sexto chakra, dependiendo de si el dolor se manifiesta por una invasión de territorio real o simbólica (segundo chakra) o por un problema de percepción del mundo y cambios de creencias (sexto chakra). Metodologías como la PNL o el Psych-K pueden ser de gran ayuda para restablecer la armonía de un 5. Las enseñanzas y los libros del Dr. David Hawkins, especialmente Trascendiendo los niveles de consciencia (1995) y Dejar ir (2012), son muy recomendables a la hora de querer transformar el Papa en un verdadero guía espiritual.'
        ],
        astrologia: [
            'En cuanto a la resonancia con las estrellas, la constelación astrológica de Tauro es la que más vibra con las características del número 5. Aquí, es donde encontramos sus grandes capacidades de perfeccionamiento y cuidado de los detalles terrenales. Los tiempos lentos que requiere procesar la información pertenecen tanto a este signo, como a este arquetipo. El cuidado del cuerpo —que ya no es solo materia, sino el templo en el que el alma habita— es otro aspecto que se refleja en esta personalidad y, además, nos recuerda su capacidad y necesidad de organización desde el plano mental, hacia lo emocional.'
        ],
        hebrea: [
            'La letra hebrea HE\' nos recuerda la importancia de ser como un "anfibio espiritual", estando siempre en coherencia con nuestros valores más profundos, para desplazarnos fácilmente entre diferentes dimensiones. Esto se logra liberándonos de creencias antiguas y alineando nuestros pensamientos, sentimientos, palabras y acciones en la misma dirección.'
        ]
    },
    6: {
        nombre: 'El Enamorado',
        hebreo: 'Vav',
        imagen: 'Cartas Tarot/6.png',
        positivas: ["Infancia", "Niño interior", "Juego", "Risa", "Diversión", "Placer", "Bromas", "Alegría", "Seducción", "Adolescencia", "Juventud", "Movimiento", "Amante", "Tríos", "Circo"],
        negativas: ["Inmadurez", "Caprichos", "Traumas en la infancia", "Niño reprimido", "Tristeza", "Apatía", "Distracción", "Síndrome de Peter Pan", "Promiscuidad", "Don Juan", "Disfunciones sexuales", "Prohibición del placer", "Aburrimiento", "Confusión", "Duda"],
        descripcion: [
            'Después de haber asistido a las clases de responsabilidad y de seriedad del número 4, y haber comprendido también las normas morales del 5, finalmente llegamos a la hora del recreo y del juego, con el número 6. Gracias a este arquetipo, nos volvemos todos niños, y durante todo su análisis, la vibración predominante será siempre asociada a la infancia y a la diversión.',
