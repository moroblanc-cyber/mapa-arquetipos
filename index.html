            'Aunque el 6 no es el último de los números, es ciertamente el más joven y "menor" de todos. Aquellas personas que lo tengan en su estructura reflejarán esa eterna juventud, tanto en el cuerpo como en el alma. El niño interior toma el mando de esta personalidad, cuyo rostro, cuerpo y energía, reflejarán siempre una perenne juventud. Lo repito de manera más clara y fuerte: quien tenga algún 6 en su Mapa (especialmente en la Personalidad Profunda o en el Nudo Emocional) expresará muchos menos años de los que tenga, y poseerá la capacidad de envejecer más lentamente que los demás. Este es uno de los superpoderes del arquetipo 6: el elixir de la eterna juventud.',
            'Este número brilla con todas las características típicas de los niños: inocencia, curiosidad, entusiasmo, risas, juego, movimiento e inquietud. A esta personalidad, no solo le disgustan las responsabilidades y los dramas, sino que se siente atraída, en todo momento, por la diversión, los placeres y las actividades lúdicas. Su aprendizaje se desarrolla gracias a sus pasiones y juegos. Su lema favorito es:',
            '¡Hemos venido a esta vida a jugar!',
            'Para que un 6 evolucione y esté siempre en armonía, necesita conectar con su niño interior todo el tiempo y, haga lo que haga, debe disfrutar del momento presente, igual que los pequeños. Como la mejor forma de aprender es a través del juego, este arquetipo percibirá el mundo como un inmenso parque infantil. Es extremadamente importante que el niño que lleva dentro se exprese durante todas las etapas de la vida y que todos sus aspectos estén en equilibrio. No importa la edad que tenga, siempre encontrará una oportunidad para sacar a relucir aquellos aspectos infantiles, chistosos y juguetones que lo distinguen de los demás.',
            'Un 6 tiene su manera única de integrar el sentido de responsabilidad de una forma más creativa que tradicional. Este personaje, al igual que un niño pequeño, es casi imposible que se quede sentado y callado durante mucho tiempo. Su cuerpo físico, emocional y mental están en constante movimiento, expuestos a múltiples estímulos y distracciones: es labor de nuestro número 6 el equilibrarlos e integrarlos continuamente. Su cerebro y mente se comportan como los de un niño en fase de aprendizaje: cuando aprenden a caminar, ya quieren correr. De la misma manera que un niño pasa de un juguete a otro, el 6 tiene la tendencia a buscar y querer satisfacer placeres uno tras otro, ya que es puramente sensorial.',
            'Estamos hablando de un ser incansable que parece tener una fuente inagotable de energía. Por lo tanto, es fundamental que este niño sienta que puede expresarse libremente en cada momento; de lo contrario, podría sufrir mucho.',
            'Muchos adultos y personas mayores pueden manifestar las cualidades positivas de este arquetipo tan infantil, no obstante su edad y, además, se reconocen enseguida por su comportamiento alegre o apariencia un poco extravagante. Un 6 es un "pequeño carnaval" andante y evoca colores, alegrías y risas. No sería raro verle llevar dos zapatos (o su par de calcetines) de colores diferentes, o vestir alguna prenda muy llamativa. Esta vibración se esconde también detrás de aquel abuelo que se mueve por la ciudad en patinete, o se encuentra en aquellos funámbulos, acróbatas y malabaristas callejeros que parecen recién salidos del circo. Los 6 son personalidades que se ríen y hacen reír, son chistosos y un poco traviesos. No tienen mucho sentido del pudor y no aman los protocolos y las formalidades. A menudo los reconocemos por sus grandes ojos brillantes, por sus sonrisas o su sentido del humor. Otras veces se revelan por su inagotable energía y entusiasmo, que ponen en todas las cosas que hacen. Igual que nos pasa con los niños pequeños, son personalidades que nos inspiran ternura, nos atrae su forma de ser y suelen transmitir un aura de jovialidad en el ambiente en el que se encuentren. Un 6 siempre será el alma de la fiesta, el más divertido y juguetón de todos.',
            'Un elemento interesante de este número 6 es la seducción y el encanto que transmite, una seducción típica de los niños cuando quieren que sus padres les compren un nuevo juguete o les dejen hacer algo prohibido. En esta etapa de la vida, la infancia, aún no estamos en la esfera de la sexualidad, pero ya se puede apreciar la capacidad de cautivar de estos niños, que derriten con una sola mirada, obteniendo casi siempre lo que quieren.',
            'Otra capacidad del número 6 es su profunda habilidad para comprender a los demás niños. Se siente atraído por ellos porque no se ve diferente de ellos, tenga la edad que tenga. Si no suele rodearse de niños de manera activa, estos son atraídos por él porque reconocen y perciben su inocencia, su pureza en el corazón.',
            'En los arcanos del Tarot, el 6 está representado por El Enamorado, que nos muestra varias dimensiones de este arquetipo. Por un lado, tenemos la seducción ingenua y sin malicia, los placeres de la vida, los triángulos amorosos, como sugiere la figura del arcano (un hombre dubitativo entre dos mujeres) revelan una profunda indecisión que le suele acompañar toda su vida. Por otro lado, evoca una intensa vida social: todos lo buscan, todos lo quieren cerca, es el alma de la fiesta. Su alegría y simpatía son su mayor atractivo. En este sentido, es bastante natural ver a esta personalidad siempre rodeada de gente y de amigos, y las relaciones públicas le dan la vida. Este Enamorado atrae y enamora a todo el mundo, suele caer bien de inmediato, y es muy fácil llevarse bien con él porque todos disfrutan de su compañía.',
            'Asimismo, uno de los personajes de la cultura popular que evoca este arquetipo es el de Peter Pan, el niño que nunca quiso crecer y que habitaba en un mundo donde todos eran chiquillos como él. En este sentido, también encontramos al personaje de Lancelot, el primer caballero de la mesa redonda del legendario Rey Arturo: sincero y siempre fiel a su rey pero, al mismo tiempo, atormentado por su amor por la reina Ginebra. Este fragmento de la leyenda describe a la perfección el amor puro de Lancelot por su rey y su reina, sincero, mas también angustiado, porque, igual que la figura del arcano del Tarot, no sabe a quién ama más.',
            'Este arquetipo difícilmente sigue los consejos que se le dan, pues suele mostrarse impulsivo y tiene necesidad de seguir sus instintos.',
            'En el plano terrenal, el desafío de este arquetipo es aprender a conocer y gestionar sus emociones, sus instintos y sus necesidades básicas. Su reto es madurar, pero sin perder su inocencia. Volverse adulto sin dejar escapar la magia de la infancia. Deberá, por tanto, aprender a comprometerse, a no huir de sus responsabilidades, siempre recordando que no todos a su alrededor son como él, ni perciben el mundo como él lo percibe.',
            'Un 6 en la pareja no quiere dramas, sino juegos, risas y diversión. En una relación —si es que llega a comprometerse de verdad— busca un compañero de vida que se suba a la montaña rusa con él, al patinete, a los coches de choque. No podemos pedirle que se comporte como una persona adulta tradicional: gracias a esa relación, aprenderá, a su propio ritmo, a ser el adulto en el cual necesita transformarse.',
            'Todo esto ocurre porque, donde hay un 6, hay un niño herido, una inocencia interrumpida y traumas no sanados en sus primeros años de vida. La edad emocional de un 6, incluso siendo adulto, será siempre la de un niño pequeño, porque es con esa vibración y gracias a ese rol, por lo que ha venido a este mundo a sanar, crecer, integrar y trascender.',
            'En la esfera profesional, un 6 quizás trabaje con niños o adolescentes, o sea un terapeuta que ayude a sanar el niño interior de un adulto. Tal vez sea uno de esos médicos-payasos o un malabarista de circo, un comediante o el propietario de una tienda de juguetes. También puede resonar con profesiones que requieran mucho movimiento, como la danza, las acrobacias o actividades lúdicas y recreativas. Es fundamental recordar que su energía inagotable le exigirá movimiento y actividad. No puede quedarse quieto mucho tiempo, y no aceptará fácilmente trabajos muy estáticos o de gran responsabilidad. Cualquier actividad que desarrolle en su profesión tiene que gustarle y se tiene que divertir. Si no siente placer o pasión con lo que hace, es muy probable que se aburra y se irá pronto a hacer otra cosa.',
            'En resumen, siempre que la vibración de este arquetipo esté presente, nunca deberán faltar el placer y la diversión: en el hogar, en la pareja, en el trabajo, según el Pilar del Mapa en el que aparezca.'
        ],
        sombra: [
            'Lo primero que veremos cuando un 6 esté vibrando desde su Sombra, es la desaparición de su sonrisa. Su rostro es lo primero que se ensombrece, las risas se hacen siempre menos frecuentes y las bromas desaparecen por completo. Se convierte en la máscara del payaso triste y del Pierrot italiano.',
            'En los Pilares de Resistencia o de Dolor, este arquetipo suele manifestar características propias del lado oscuro de los niños: inmadurez, mentira, manipulación, irresponsabilidad, rabietas y egoísmo, solo por citar algunos ejemplos. Además, debido a su innata inocencia, no se verá capaz de superar o gestionar dramas, discordias y dificultades. Emocionalmente, podrá sentirse inmaduro o incapaz de hacer y gestionar las cosas como los adultos. Un 6 que nunca sonríe, ríe o cuenta chistes, nos habla de una herida profunda, un bloqueo o una castración parental en vigor. Quizás una figura materna, o paterna, demasiado presente haya anulado por completo su auténtica personalidad. Un 6 inmerso en los dramas de la vida está a un paso de la tumba, ya que necesita siempre armonía a su alrededor. Las discordias, los conflictos y las peleas pueden afectarle mucho.',
            'Cuando esté vibrando en el dolor, puede conectar con la crueldad de los pequeños, porque habrá olvidado la diferencia entre el bien y el mal. Los niños, cuando son crueles entre ellos, todavía no han desarrollado el don de la empatía o tienen bloqueado ese canal de conexión emocional con los demás.',
            'La seriedad no forma parte de su ser; no es un 4 y nunca lo será. Por esta razón, siempre que veamos a un 6 serio, nos acercaremos a él como si fuera un niño, para poderle acompañar en ese proceso. También debemos estar alerta con otras polaridades negativas del arquetipo, como en el caso de personas que no saben prescindir de la "máscara" del payaso, actuando siempre bajo esa actitud. Este mecanismo de defensa lo lleva a no tomar nada en serio, a hacer bromas y chistes en todo momento, incluso fuera de lugar y sin tacto alguno, porque "hay que reírse sí o sí". Es su manera de huir de los problemas por no querer o saber afrontarlos. Es el "alma de la fiesta" que nunca descansa, incluso sin fiesta. Cuando su sonrisa es exagerada, el personaje que encarna es el del Joker de Batman, una máscara creada por el rencor y el dolor de su mundo interior. El Joker es la encarnación perfecta de la Sombra de un 6 en su extremo.',
            'Con un 6 en el Pilar del Mes, quizás haya venido a este mundo a trabajar el compromiso, el sentido de responsabilidad o los abusos (y traumas) de la infancia. En este caso, es imprescindible volver a la niñez para comprender y sanar los dolores emocionales que se vivieron en ese momento y que aún influyen en el presente, para darles un nuevo significado. Un 6 en este Pilar o en la Resistencia, nos habla de un niño que no pudo ser niño, de una infancia interrumpida o rota por un trauma importante. Cuando el niño o el adolescente no pueden expresarse en las etapas que les corresponden, suelen quedarse durante toda la vida llevando sus emociones bloqueadas y sus heridas no sanadas al momento presente.',
            'El síndrome de Peter Pan aparecerá si alguno de los Pilares del dolor vibra con este arquetipo: el egocentrismo, el narcisismo y la rebeldía pueden ser sus mecanismos de defensa cuando no quiera o pueda aprender a gestionar el sufrimiento. Esta coraza encubre su inseguridad y sus creencias profundas por no sentirse querido o aceptado. Su comportamiento puede enmascarar un miedo a la soledad o a su baja autoestima. Quizás la razón por la cual siempre se rodee de gente sea, precisamente, el miedo de estar a solas consigo mismo. Sabemos que lo único que se mueve en la Máscara siempre es miedo, culpa y poco más.',
            'Michael Jackson, en su Mapa, tenía un 6 en el Pilar de su Personalidad Profunda. Un Pilar que, como describiré más adelante, nos cuenta los aspectos positivos y negativos del arquetipo que ahí aparece. En esta posición, Jackson encarna a la perfección muchas de las manifestaciones del número 6. Este eterno "Peter Pan" construyó un parque entero para que todos los niños del mundo pudieran visitarlo y lo llamó Neverland (el País de Nunca Jamás). Un personaje complejo, y también atormentado, que siempre fue asociado al arquetipo del niño que nunca quiso crecer.',
            'Aparte de esto, en la Sombra, asimismo,, el divertido comunicador y seductor se transforma en un incansable donjuán incapaz de elegir entre un placer y otro, terminando por elegirlos a todos y cayendo en la promiscuidad. Además, si se enamora, será un amor estilo Casanova: aparentemente profundo, verdadero, intenso y romántico, pero de muy corta duración. La figura del arcano del Enamorado podrá plasmar en la vida real la vibración del "trío" en las relaciones amorosas y podría atraer, una y otra vez, el dolor de Lancelot por un corazón partido entre dos personas amadas.',
            'Por su falta de constancia, disciplina y madurez emocional, puede llegar a decepcionar fácilmente a los demás. La palabra "compromiso" desaparece de su vocabulario y los juegos, con los que tanto se entretiene en el Espejo, se pueden volver adictivos en su Sombra.',
            'Las enfermedades o síntomas de este arquetipo podrían aparecer en aquellos tejidos que nuestro inconsciente relaciona con el movimiento, el valor y la dirección: músculos, tendones, ligamentos, tobillos, rodillas y piernas en general. Si tiene dificultad para gestionar la ira, podría somatizar sus frustraciones en el sistema gastrointestinal. Si su creatividad se ve afectada o cohibida, probablemente esto impacte en los tejidos del aparato reproductor.',
            'Si investigamos sus memorias transgeneracionales, podríamos encontrar historias relacionadas con el programa "prohibición del placer" o ausencia y represión de la sexualidad: en la infancia, la sexualidad no está presente aún. Por lo tanto, podría haber problemas de disfunción eréctil, ausencia de pareja o exceso de promiscuidad. Hay que recordar que, para el inconsciente, "todo" y "nada" coinciden. Una cantidad excesiva de sexo (o de placer) o su total ausencia, forman parte del mismo programa heredado.',
            'La falta de placer no solo se puede reflejar en su vida sexual, sino también en otras áreas de su vida. El placer, en la máscara, puede desaparecer progresivamente. Actividades lúdicas, pasiones o intereses que este 6 antes disfrutaba, ahora no le generan ningún estímulo. La apatía, el aburrimiento o el hastío, pueden lentamente invadir su vida.',
            'A nivel energético, todo esto se traduce en posibles desequilibrios en el segundo o tercer chakra.',
            'Para que un 6 vuelva a la armonía, necesitará conectar y expresar el dolor de ese niño interior. Lo más adecuado es empezar un proceso terapéutico con un profesional para descodificar y liberar los traumas del pasado.'
        ],
        astrologia: [
            'En el plano astrológico, está fuertemente asociado a Mercurio, el planeta de la juventud, de la sociabilidad, del movimiento constante y del sentido del humor, entre otras cosas. El signo correspondiente será el de Géminis, también asociado a varios elementos de este arquetipo. Las cualidades de Venus, también las encontraremos en el encanto que suelen irradiar estas personalidades y, además, en su heterogénea vida social.'
        ],
        hebrea: [
            'La letra VAV del alfabeto hebreo nos recuerda que el mundo fue formado en seis días y, por este motivo, el poder de este arquetipo evoca el poder de la creación y la creatividad. El ser humano, el último producto de Dios, tiene el poder y el dominio sobre todas las demás criaturas: plantas, animales, montañas y planetas. Este es su verdadero potencial. Cuando deje de ser víctima del mundo y de las circunstancias, recordará que es señor y dominador del Universo entero.',
            'Le dirás a la montaña: muévete de aquí para allá, y ella se moverá. Mateo, 17 : 20.',
            'Una afirmación que la física cuántica ya demostró hace tiempo: el observador influye en la realidad que lo rodea. Cuando alineamos todos los cuerpos de nuestro Ser — pensamiento, sentimiento y acción— modificamos nuestra realidad y atraemos a nosotros aquellas circunstancias afines a nuestra vibración.',
            'Este es, nada más ni nada menos, el potencial máximo de este arquetipo.'
        ]
    },
    7: {
        nombre: 'El Carro',
        hebreo: 'Zayn',
        imagen: 'Cartas Tarot/7.png',
        positivas: ["Control", "Acción", "Independencia", "Autonomía", "Análisis", "Tensión", "Perfeccionismo", "Revisión", "Auditoría", "Mental", "Automóvil", "Iniciativa", "Liderazgo", "Organización", "Gestión"],
        negativas: ["Exceso/pérdida de control", "Dependencia", "Manipulación", "Apego", "Alejamiento", "Migrañas", "Parálisis", "Narcisismo", "Dominación", "Exceso de análisis", "Fibromialgia", "Interrupción", "Monólogos", "Problemas de dirección", "Problemas de piernas"],
        descripcion: [
            'Con la llegada del número 7, termina la hora del recreo y de los juegos: comienza la productividad. Este arquetipo nos lleva de nuevo al plano mental, pero de una forma diferente a la mente concreta del número 3, que solo desea aprender por el puro placer del conocimiento. En el caso del 7, la mente se vuelve inquieta y encarnará el arquetipo del control, del análisis y de las reflexiones constantes. Esta personalidad también quiere aprender, pero con el objetivo de dominar mejor su entorno: cuanto más detalles e información posee sobre un tema, mejor puede gestionarlo.',
            'El 7 analiza todo el tiempo, incluso mientras duerme, y no puede quedarse quieto durante mucho tiempo. A diferencia del 6, que manifiesta la energía incontrolable y desordenada de la niñez, el 7 expresa su necesidad de acción constante. Es una personalidad de pura acción; la falta de esta podría causarle problemas.',
            'En el ámbito académico, puede ser el estudiante que constantemente interrumpe la clase, o levanta la mano para hacer preguntas o dar ejemplos, con el objetivo de comprender y analizar cada detalle. También podría ser representado por aquel alumno que toma notas meticulosamente, por miedo a perder cualquier dato, lo que le permite controlar mejor la información y revisarla en cualquier momento. Su metodología de estudio, a menudo, incluye el uso de varios marcadores fluorescentes para subrayar casi todo el texto o para hacer esquemas y resúmenes. Un 7 necesita desmenuzar, triturar, desglosar y dividir la información para analizarla en cada detalle con el fin de sentirse con mayor control.',
            'Además de hacer muchas preguntas y tomar abundantes apuntes, un 7 tiende a revisar minuciosamente aquello que está observando o escuchando y tiene un gran talento para encontrar errores fácilmente, lo que lo convierte en un excelente revisor, supervisor, inspector o auditor. Estos detallados trabajos son perfectos para dicho arquetipo.',
            'En el ámbito profesional, el 7 prefiere oficios que le permitan autonomía e independencia, donde no tenga un superior que le diga constantemente qué hacer. Necesita expresar su gran don organizativo, ya sea controlando la contabilidad, los elementos químicos de un laboratorio, los ingredientes de una cocina, o manejando un departamento de personas y recursos. A diferencia del 6, el 7 puede pasar horas revisando y controlando números e informes en busca de errores. Es un excelente organizador, y también le irían bien los roles de director o ejecutivo, siempre y cuando el entorno sea armonioso.',
            'El 7 tiene una gran capacidad para memorizar, pues le encanta almacenar conocimiento. Puede recordar frases, palabras y hechos pasados con gran facilidad y detalle. Es interesante observar cómo desmenuza cualquier información para entender o analizar, profundamente, cada aspecto y posibilidad. Su principal desafío es aprender a soltar el control y confiar en el proceso de la vida, comprendiendo que no hay decisiones incorrectas, solo oportunidades de aprendizaje.',
            'Un mantra que recomiendo a los 7 es:',
            'Nada está bajo control, y eso está bien.',
            'Este aprendizaje es crucial para ellos: deben ser como un río que fluye hacia el mar, sin esfuerzo, transformando los obstáculos en marcadores para su camino. Aprender a flotar y dejarse llevar por la corriente es esencial para su bienestar. Tiene que aprender a fluir con la vida, soltando el control y dejando de analizar tanto las cosas.',
            'Un 7 inmaduro puede frustrarse al darse cuenta de que, en este universo, nada está bajo control, lo que lo convierte en un número tensional, necesitando cierta actividad o estrés para vivir. Comparando la inquietud del 6 y del 7, vemos que los movimientos del primero pueden parecer más caóticos y espontáneos, mientras que los del 7 son activos, concretos, directos y resolutivos.',
            'El exceso de análisis del 7 es una herencia del arquetipo 6: la duda. Sin embargo, mientras el 6 vive la duda de manera irresponsable o inconsciente, el 7 la lleva a otro nivel, compensándola con un exceso de responsabilidad. Suele tener la tendencia de querer encargarse de todo y querer controlar en exceso su alrededor, incluso a las demás personas.',
            'Un 7 puede emprender múltiples tareas a la vez. Su lema es:',
            'Cuanto más puedo controlar, mejor estoy.',
            'La diosa hindú Kali, con sus múltiples brazos, representa perfectamente este potencial: la capacidad de hacer mil cosas a la vez.',
            'El arcano del Tarot asociado a este arquetipo es El Carro, símbolo de acción y movimiento. En esta carta vemos a un príncipe sujetando las riendas de sus caballos. Esas bridas representan la tensión necesaria para avanzar. Tirando y aflojando, soltando y apretando, consigue avanzar en armonía hacia su destino. Esta es una de las enseñanzas principales de este arquetipo. Comprender cuándo hay que controlar y cuándo no, cuándo hay que soltar y cuándo hay que mantener las riendas de la vida bien agarradas. Gracias a este arquetipo, un 7 aprende que, entre el jinete y los caballos, el que tiene que dominar el carro es el joven conductor. Estos animales, en otro nivel, representan la mente descontrolada, el exceso de análisis y demasiada racionalización. El jinete simboliza el Ser Superior, en pleno control de sus facultades. En este caso es un príncipe, no un plebeyo. El Ser es el que está al mando del carro, guía y educa su mente tirando y aflojando, con severidad y misericordia, con rigor y piedad.',
            'El carro, hoy en día, es representado por el coche que conducimos. Conducir un coche es muy terapéutico para este número, ya que le permite expresar su autocontrol y reducir su nivel de estrés. Conduciendo su carro siente, sin darse cuenta, que puede dirigir su vida.',
            'Cuanto más sabe la mente de un 7, más analiza y mejor puede controlar. Por ello, su sistema cognitivo siempre está en acción, incansable y atento a todos los detalles. Incluso, cuando resuelve finalmente un problema, no tarda en encontrar otro en busca de una nueva solución.',
            'Este arquetipo también es sinónimo de autonomía e independencia, similar al número 1. Si observamos el trazado del número 7 y del 1, cuando los dibujamos en un papel, vemos que se parecen mucho. La única diferencia es el grado de inclinación del trazo superior. Esto se traduce con un 7 que se cree un 1, pero no lo es. El 1 es independiente de verdad, el 7 se cree independiente, pero depende constantemente de su necesidad de controlar y analizar.',
            'Cuando está en equilibrio, el 7 es un gran guerrero que puede con todo, solo y sin ayuda. Pero si no se encuentra en su centro, puede crear nuevos problemas en lugar de resolverlos. Los héroes del pasado que nos evoca este arquetipo son, sin duda, Aquiles y Hércules, y también superhéroes más recientes como Wonder Woman o Xena, la princesa guerrera.',
            'Aunque el 7 suele hablar mucho, a diferencia del 3, sus conversaciones pueden convertirse en monólogos o interrogatorios, si no está en equilibrio. Para que el 7 esté en armonía, es importante darle explicaciones claras, responder a sus preguntas, permitirle tomar notas y darle tiempo para reflexionar. No se le debe exigir tomar decisiones apresuradamente, pues esto puede estresarle mucho. Se le puede invitar a aprender el arte de delegar y soltar lo que no es necesario controlar.',
            'En este sentido, el número 7 es como la cuerda de un violín: si está demasiado floja, no generará ninguna melodía, y si está demasiado tensa, se romperá. La tensión de la cuerda debe estar en su punto exacto para producir una armoniosa melodía. Del mismo modo, el 7 se asemeja a las manos que sujetan a un pajarito: si aprieta demasiado, el animal morirá, pero si no lo hace lo suficiente, se escapará.',
            'Algunas preguntas clave para mantener este número en armonía son las siguientes:',
            '● ¿Es necesario controlar esto ahora? ● ¿Me estoy olvidando de controlar algo en mi vida? ● ¿Estoy conduciendo mi coche yo o lo está conduciendo alguien que no soy yo? ● ¿Le he entregado mi poder a alguien o tengo yo las riendas de mi vida?',
            'En el área amorosa, el 7, cuando se enamora, tiende a "tirar del carro", a ser la persona con más iniciativa, con más ideas, inquietudes y propuestas, y que a menudo decide el qué, el cómo y el cuándo de los planes. Es crucial que estos aspectos estén en equilibrio para que la relación sea armoniosa y no caiga en la dominación, manipulación o sumisión, que son aspectos que suelen aparecer en su Sombra.',
            'Algo curioso que he observado cuando este arquetipo se encuentra sobre todo en el Pilar de la Personalidad Profunda o en el Nudo Emocional, es que, a nivel vibracional, los demás reconocen que el 7 sabe (o se supone que sabe) lo que hay que hacer en todo momento. Si un 7 le dice al pueblo que hay que ir a la derecha, todos irán a la derecha; si le dice al pueblo que habrá que ir a la izquierda, todos irán a la izquierda. Cuando este arquetipo está en orden y en armonía, es improbable que alguien ponga en discusión su capacidad de liderazgo. Aunque lo que diga a veces pueden ser burradas, eso no importa. La gente responde a la vibración, no a las palabras. Por lo tanto, esta dinámica la podemos ver con líderes con diferentes grados de consciencia e inconsciencia. El pueblo responderá al líder según su conciencia, sin importar lo que diga.',
            'Moisés, que es una de las encarnaciones del 7, le dijo a una nación entera que lo siguiera a través de un desierto y que cruzara un mar aparentemente imposible de cruzar. La muerte era muy probable en ambos casos, pero la historia ya la conocemos.'
        ],
        sombra: [
            'En el mecanismo de supervivencia, el 7 tiende a separarse o aislarse de los demás, de manera similar al 1. Cuando experimenta dolor, rechaza la ayuda de cualquiera y se convence de que "no necesita a nadie", ya que cree poder manejar todo solito. Esta es una de las mentiras que se dice a sí mismo para no enfrentar su mayor miedo: perder el control.',
            'Siendo un número tensional y mental, cuando no puede controlar lo que desea o necesita, puede intentar controlar cosas y personas. Para reducir el estrés, necesita delegar, aprender a planificar y a comprender sus dinámicas internas que, a menudo, difieren de las de los demás.',
            'A veces, con las mejores intenciones, trata de controlar a otros diciéndoles qué hacer, olvidando que cada persona tiene su propio proceso y tiempo para crecer y sanar. En estos casos, debería preguntarse:',
            '¿Qué necesidad quiero satisfacer diciéndoles a los demás lo que tienen que hacer?',
            'Si eres un 7 y te haces un momento de autoanálisis, pregúntate cuántas veces les dices a las personas a tu alrededor lo que deben, o no, hacer. Siempre que lo hagas, observa cuál es la necesidad detrás de ese consejo, recomendación u orden. Por muy buenas intenciones que haya, siempre habrá esa necesidad encubierta de controlar a los demás. Pregúntate:',
            '¿Cuál es mi necesidad emocional real que quiero satisfacer diciéndoles a los demás lo que tienen o no tienen que hacer?',
            'Frecuentemente, cuando un 7 no sabe qué hacer o qué dirección tomar, proyecta esta necesidad en los demás, tratando de dirigir sus vidas. Aunque sus motivaciones sean nobles, es importante que examine si hay alguna herida interna que necesita sanar. Si hay un bloqueo o desequilibrio, este comportamiento puede indicar frustración o conflicto interno.',
            'La mejor manera de ayudar es recordar que la persona frente a él es perfecta tal como es y no necesita cambiarle nada. Todo lo que la Consciencia presenta es para observar y comprendernos mejor, generando el cambio en nosotros mismos. Ayudar a alguien en su proceso debe hacerse con el ejemplo, respetando los tiempos de cada uno.',
            'Cuando en un Pilar aparece un 7 sin armonía, lo primero que hay que hacer es salir del análisis, dejar literalmente de pensar, dejar de dudar o de ver los pros y contras de una situación. Lo único que nos salva del análisis, es la toma de acción, sin importar la dirección. Lo primero que el príncipe del carro tiene que hacer, es volver a tomar el control de los caballos descontrolados para no caerse o accidentarse. Luego ya verá hacia dónde dirigir ese carro. Una mente descontrolada es uno de sus peores enemigos.',
            'Un 7 en equilibrio evita extremos de manipulación, dominación, narcisismo o, en su opuesta polaridad, sumisión y autoanulación.',
            'Sus patologías pueden incluir problemas del sistema nervioso, como esclerosis múltiple, Parkinson, parálisis, fibromialgia, tetania, patologías de la cabeza, de las articulaciones inferiores (cadera, rodilla, tobillo) y de las manos (artritis). En la boca, puede somatizar en los dientes su incapacidad de "analizar, moler y desmenuzar" la información, especialmente en los molares, por su función de demoler y desmenuzar la comida. La periodontitis, que es la pérdida progresiva de todos los dientes, suele aparecer cuando el 7 se queda atascado en el análisis y tiene una gran dificultad para tomar una decisión. También pueden surgir síntomas estomacales e intestinales, que representan la digestión simbólica de alimentos emocionales y cognitivos, así como problemas de taquicardia o arritmia cardíaca.',
            'La salvación de un 7 en la Sombra es la toma de acción inmediata. Tiene que salir de su cabeza y del campo mental y actuar cuanto antes. Tomar una decisión, una dirección y seguir por ese camino, comprendiendo que todos los caminos son válidos y que cualquier decisión que tome, lo llevará, siempre, a una oportunidad de crecimiento y expansión.',
            'Cuando se queda atascado mucho tiempo analizando los pros y los contras de una situación, generará siempre una cantidad de estrés importante. Ese carro del cual lleva las riendas, tiene que hacerlo avanzar para que esos caballos puedan coger velocidad y finalmente empezar a volar.',
            'Querido 7, recuerda:',
            'Allí no es mejor que aquí, esto no es mejor que aquello. Todo lugar y todo momento son perfectos para manifestar lo divino que hay en ti.',
            'En su estructura energética, los chakras afectados suelen ser el primero, el tercero o el cuarto.'
        ],
        astrologia: [
            'En Astrología, podemos encontrar esta vibración en los dominios de Marte y de Aries, un planeta y un signo que también se relacionan con el fuego, la acción y la lucha por la individualidad. La esencia de Sagitario la encontramos también en su etapa más madura, con un fuego más calmado pero enfocado a la superación de sus propios límites y su afán por las aventuras.'
        ],
        hebrea: [
            'Por otro lado, la Cábala nos habla del potencial de este arquetipo a través de ZAYN, su letra hebrea asociada. Esta letra nos recuerda al bastón del ya mencionado Moisés, con el que obró milagros y con el cual ayudó al pueblo judío durante su liberación de la esclavitud de Egipto hacia la Tierra Prometida. Profundamente, esta historia trata sobre la liberación de las cadenas del Ego (el Faraón) hacia el despertar de la conciencia espiritual (la Tierra Prometida). Además, este bastón también evoca al órgano sexual masculino y a la semilla espiritual generada durante la unión con su complemento femenino. Por lo tanto, es una invitación a unificar nuestras polaridades y fragmentos para transformarnos en recipientes del divino y obrar milagros, como hizo Moisés. Cuanto menos fragmentados estemos, más luz podemos recibir en nuestro interior.'
        ]
    },
    8: {
        nombre: 'La Justicia',
        hebreo: 'Heith',
        imagen: 'Cartas Tarot/8.png',
        positivas: ["Poder", "Justicia", "Fuerza", "Infinito", "Magnetismo", "Imán", "Poder de Atracción", "Sexualidad", "Marcaje de Territorio", "Dinero", "Estrategia", "Planificación", "Organización", "Ajedrez", "Vista a largo plazo"],
        negativas: ["Desvalorización", "Incapacidad", "Arrogancia", "Crueldad", "Narcisismo", "Frialdad", "Sumisión", "Invasión de territorio", "Disfunciones sexuales", "Pérdidas de dinero", "Mala gestión del tiempo", "Barreras", "Dominación", "Cierre", "Problemas de pulmón"],
        descripcion: [
            'Con este arquetipo empezamos a despegarnos un poco más de la tierra y comenzamos a elevarnos de este plano terrenal al espiritual. Por esta razón, nos encontramos con una personalidad que tiene la capacidad de desplazarse desde las dimensiones más profundas de la tierra y del inframundo para, a partir de ahí, ascender lentamente a los planos más sutiles de la existencia. La palabra clave que más lo describe es poder.',
            'Los dos círculos que forman su trazado, uno sobre el otro, hablan de un poder que le permite viajar de arriba a abajo y viceversa, un movimiento natural entre el plano terrenal y el celestial, o entre el celestial y el inframundo. Esta personalidad suele estar familiarizada con las altas vibraciones del mundo espiritual y, al mismo tiempo, puede dominar el plano terrenal y más mundano, sabiendo gestionar energías y vibraciones más densas, pertenecientes al mundo de la materia o del plano astral. Dependiendo de su armonía o de su nivel de conciencia, se sentirá llamado hacia un plano u otro. Esto se traduce en personalidades capaces de dominar a la perfección las leyes del mundo físico y las leyes del mundo espiritual.',
            'Un 8 nos recuerda el viaje de Dante en su obra literaria la Divina Comedia, un camino de elevación espiritual desde el Infierno, pasando por el Purgatorio y alcanzando las más altas esferas del Paraíso.',
            'Al igual que Plutón, regente astrológico natural de la casa 8, este arquetipo está muy familiarizado con las energías más densas y tabúes del inframundo y de la Sombra, pero también tiene un gran potencial para las vibraciones más altas de los planos espirituales. Lleva dentro de sí un conocimiento profundo de las leyes del Universo, pero depende de él tomar conciencia y querer acceder a ello. No es casualidad que el trazado de este número esté hecho con el símbolo del infinito. De ahí proviene su complejidad y, por eso, simboliza la misma información del infinito, con la única diferencia de que su reino es todavía finito y tiene límites bien marcados.',
            'Con el número 8, observamos el nacimiento de uno de los arquetipos más complejos, representado por un infinito de pie. A diferencia del 7, que es un número de acción, y del 6, que es un número de movimiento, esta personalidad, cuando es consciente de su poder, puede atraer lo que desea simplemente estando sentado en su trono. El superpoder que está destinado a desarrollar es el de obtener lo que quiere con, únicamente, su vibración. Gracias a este poder de atracción y materialización, atraerá, consciente o inconscientemente, según su vibración. Su fortaleza interior actúa como un imán que atrae cualquier cosa que se proponga, pues ha integrado la enseñanza de su predecesor, el arquetipo 7: la unificación de sus fragmentos para obrar milagros. Esta habilidad se manifiesta con mayor facilidad en el arquetipo 8: mientras que el 7 tiene que generar una acción para materializar y producir algo, el 8 puede hacerlo estando sentado cómodo en el sofá de su casa, puesto que no necesita moverse mucho o hacer demasiado. Un imán simplemente atrae; lo que no hace un imán es desear. El deseo implica querer algo que no se tiene y, si estoy vibrando en "no tener", atraeré más "no tener" en mi vida. Lo que nos viene a enseñar este arquetipo es que multiplicamos, literalmente, la realidad a la que estamos prestando atención.',
            'Así que, uno de los objetivos que tiene este número, es descubrir que no hay que hacer nada más que vibrar y atraer según su vibración.',
            'Si quieres saber cómo estás vibrando, simplemente observa las circunstancias que estás atrayendo a tu vida.',
            'Continuando con el análisis, observamos que el tema del "marcaje" es uno de los aspectos sobresalientes del 8, ya que necesita vigilar el perímetro de su espacio personal en todo momento: en su espacio no entra cualquiera. Este arquetipo aprendió del 5 la importancia de cuidar el espacio, convirtiéndose junto a él, en el número más territorial de la serie. Un 8 que no cuide su propio espacio personal puede tener graves problemas.',
            'Cuando conocemos a un 8, no debemos tocarlo ni abrazarlo: es muy sensible con el tema de sentirse invadido en diversos sentidos, ya sea corporal, emocional o espacialmente. Este número, si está en armonía, no se dejará acercar fácilmente; más bien, necesitará cierta distancia para poder relacionarse con los demás números. No invadiremos su casa ni su espacio emocional, mas dejaremos que sea él quien, cuando lo sienta, abra la puerta de su casa y de su corazón. Aunque a veces no lo parezca, el 8 también tiene un corazón muy grande y un mundo emocional inmenso. Sin embargo, su aparente frialdad y seriedad ocultan esos tesoros.',
            'El marcaje de territorio de un 8, y el del 5 difieren esencialmente por sus diferentes polaridades. Por un lado, el 8 es un arquetipo con energía yang, activa y masculina: por lo tanto, su sensibilidad se da sobre todo desde el perímetro hacia fuera. Puede percibir el peligro y los enemigos "reales o simbólicos" desde muy lejos, mientras se acercan. Su capacidad visual —no únicamente referida al sentido físico— y su oído están muy desarrollados, y su vista a largo plazo le es de gran ayuda cuando siente que un peligro se está acercando. Cruzar ese perímetro físico, mental o emocional le pondrá en alerta en todo momento, incluso cuando el peligro no ha cruzado aún esa barrera. El 5, por otro lado, tiene una energía yin, femenina y pasiva. Su sensibilidad se da, especialmente, todo desde el perímetro hacia dentro. Un 5 se entera del peligro, cuando ya está dentro de la casa. No tiene tanta capacidad para prever su llegada. Lo que más le duele a un 5 será la alteración del orden dentro de la casa, del espacio, como vimos anteriormente.',
            'Por su territorialidad, podría crear profesiones o negocios relacionados con tierras, terrenos, inmuebles, pequeños edificios, pequeños hoteles o agencias inmobiliarias. A nivel emocional, el 8 no se entrega a todo el mundo como un 6, y es raro verle derramar una lágrima en público. Si lo hace, será un verdadero evento. Ha conquistado el dominio de las emociones y no se dejará dominar por ellas, o eso cree. Cuando está en armonía, ha conseguido su equilibrio interno y es un maestro en gestionar las emociones humanas, sobre todo si lo encontramos en el Nudo Emocional o en la Personalidad Profunda de nuestro Mapa.',
            'Su representante en la baraja del Tarot es La Justicia: una mujer sentada nos mira de frente, lleva una balanza en una mano y una espada en la otra, instrumentos de gran sabiduría e imparcialidad. La balanza de la Justicia hace del 8 el más imparcial y justo de los números, integrando los conceptos de diplomacia, estrategia y planificación. Donde hay discordias, un 8 llevará la razón con la balanza o con la espada sin pestañear, y con esa misma espada cortará cabezas todas las veces que sea necesario.',
            'Este número, cuando habla, lo hace fuerte, claro y directo. No le gusta perder el tiempo con personas que se quedan atascadas en la semántica o en patrones limitantes repetitivos. La paciencia infinita no es su virtud, la justicia sí lo es. Por esta razón, no te sorprendas si un 8 que te ha dicho algo una vez y te lo ha repetido en una segunda ocasión, a la tercera… ¡te corte la cabeza!',
            'Un antiguo proverbio italiano dice:',
            'Hombre avisado, medio salvado.',
            'Un 8 te avisa, te explica pacientemente sus ideas, sus necesidades o sus consejos —si se les pide—, pero no ama repetir las cosas más de una vez. Se asombra cuando alguien no las entiende a la segunda y, aun así, es probable que llegue a repetir sus ideas una vez más, pero, en esta circunstancia, ya estarás jugando con fuego. No existirá una cuarta ocasión, porque el 8 te habrá hecho desaparecer de su vida en un instante y habrá cortado lazos de forma inmediata y definitiva. Por muy extremo que parezca este comportamiento, en la mayoría de los casos es lo más sano que pueda hacer, y es una gran enseñanza que todos podemos aprender de él. Es decir, esta dinámica nos enseña el amor propio, la coherencia emocional, nos ayuda a respetar nuestros tiempos, nuestro espacio y a que los demás nos respeten también. Un 8 que ha perdido su severidad, puede experimentar graves problemas físicos y emocionales. No puede permitirse ser complaciente y demasiado permisivo.',
            'Cuando hablamos de la Justicia y de la sabiduría de este arquetipo, no podemos dejar de mencionar la figura bíblica del Rey Salomón. El monarca, ante una disputa entre dos madres que afirmaban, a su vez, que el niño que iba con ellas era su hijo y que la otra mentía, les anunció la sabia y justa decisión de mandar a dividir en dos al chico, para que ambas madres tuvieran cada una su mitad. Una vez pronunciada esta sentencia, la verdadera madre renunció, con dolor, a la disputa, con el fin de mantener a su hijo con vida. Gracias a esto, el Rey pudo conocer la identidad de la auténtica progenitora.',
            'Esta historia nos recuerda que el potencial de justicia del número 8 es divino, y que no tiene nada que ver con la justicia de los seres humanos aquí en la Tierra.',
            'Otro aspecto interesante de este arquetipo es la seguridad que exhibe en sus decisiones, porque están bien procesadas y analizadas. Una vez que las toma, difícilmente hay vuelta atrás. Mientras otros números giran página en sus vidas, el 8 arranca la página por completo del libro. Cuando hemos perdido su amistad, su amor o su estima, lo hemos perdido para siempre.',
            'El símbolo por excelencia de este número es el Alfa, entendido como "Hombre Alfa" o "Mujer Alfa" (dejando de lado los sexismos): es el líder que no es segundo a nadie, protector y guía de la manada. Es liderazgo, poder y presencia.',
            'Si observamos de cerca este número, vemos que esconde un doble 4, un 4 que ha aprendido a suavizar los ángulos de su cuadrado, formando dos círculos: los círculos del trazado del 8.',
            'Su necesidad no es solo terrenal, sino también espiritual, y es en la espiritualidad donde este personaje puede desarrollar su gran potencial. En el 8, la autoridad del 4 se multiplica, dando vida al gran jefe, al general militar con excelentes capacidades para la estrategia y visión a largo plazo. En su mente se manifiestan todas las posibilidades potenciales de una decisión o acción, anticipando todos los posibles desenlaces, como un experto jugador de ajedrez.',
            'Símbolo también de gran fuerza interior, sabiduría, planificación y organización, es un gran buscador del equilibrio, resonando con la vibración del arcano de La Justicia y del elemento de la balanza de esta lámina. En este sentido pueden darse, por un lado, estudiantes de derecho, excelentes jueces, abogados o mediadores. Por otro lado, si encarnase este elemento en su interior, la búsqueda del equilibrio será emocional y espiritual, desarrollando intereses en disciplinas como la meditación, el yoga, el mindfulness o las terapias holísticas.',
            'Otros dos elementos fundamentales del 8 son la sexualidad y el dinero. Por un lado, su gran magnetismo le proporciona un poder de atracción y, a nivel inconsciente, el poder más grande que hay es el de la creación. Este personaje, en su estado armonioso, necesita tener una vida sexual activa y equilibrada. Ha trascendido lo tradicional y conservador del 4, y no suele tener muchos tabúes respecto a la sexualidad, que puede expresarse con fines más reproductivos o lúdicos que amorosos o pasionales.',
            'Por otro lado, en cuanto al dinero, este arquetipo suele tener un flujo constante en su bolsillo. Si no es así, puede haber una herida no sanada o algún bloqueo. Para el 8, perder el tiempo es sinónimo de perder dinero. Por ello, se le recomienda una buena gestión del tiempo en sus actividades diarias —laborales, sociales o personales— y que aprenda a gestionarlo de una manera sana y productiva. Un 8 suele manejar el dinero con gran habilidad, y muchas veces tiene capacidades e intereses en sectores financieros, bancos o, incluso, bancos de esperma (símbolos de dinero y sexualidad a la vez).',
            'Después de este análisis, podemos observar que los ejes fundamentales alrededor de los cuales gira este arquetipo son tres: territorio, sexualidad y dinero, que funcionan como las tres patas de una mesa. Si una de estas cojea, puede afectar a las otras dos y a la mesa entera. Afortunadamente, se influyen mutuamente de manera positiva también. Si hay algún bloqueo en una de estas tres áreas, una forma de equilibrarlas es ajustando y reforzando conscientemente las otras dos.',
            'Una vez más, el símbolo del infinito que lo representa, no solo evoca el fluir del tiempo y del dinero, sino también el fluir de la sangre familiar. Al igual que los números 4 y 5, el 8 valora profundamente la familia y necesita su propio clan. Si no siente pertenencia a uno, puede enfrentar graves problemas. Por esta razón, le beneficia investigar su árbol genealógico y conocer los lazos de sangre e inconscientes con sus ancestros. Al fin y al cabo, el 8 es el resultado de todas esas experiencias. Sin embargo, mientras el 4 se equilibra creando y ordenando la estructura de su árbol, un 8 no solo lo construye, sino que lo investiga: lo quiere comprender profundamente para trascender todos los patrones limitantes heredados y, finalmente, sanar.'
        ],
        sombra: [
            'Cuando el 8 experimenta dolor y se resiste a un cambio necesario, los temas a sanar casi siempre están relacionados con la tríada territorio-sexualidad-dinero. Su aspecto en la Sombra se vuelve frío, calculador, extremadamente riguroso, inflexible e injusto.',
            'El comportamiento del Alfa, tanto macho como hembra, se hace más contundente, pudiendo llegar a pisotear los derechos de los demás en su expresión más extrema. Podría manifestar elementos de autoridad militar como frialdad, severidad en exceso e intransigencia. En el plano emocional, cerrará progresivamente sus puertas a cualquier expresión o acercamiento emocional, construyendo altos muros alrededor de su corazón. La arrogancia y la soberbia aparecen progresivamente y su ego puede volverse cruel y narcisista.',
            'Su carisma y su magnetismo, en la Sombra, se convierten en armas para manipular sutilmente a los demás por sus propios deseos e intereses personales. Una manera de manipular que es, sin duda, más insidiosa y maquiavélica, que la que usa más descarada, y menos hábilmente, el arquetipo 7.',
            'Los recursos para armonizarse los encontrará en sus propios dominios: su árbol genealógico, su espiritualidad, su búsqueda de equilibrio entre el cielo y la tierra, y cuidando su territorio, su vida sexual, su dinero y su tiempo. Un 8 en el Pilar de Resistencia o en el Mes puede dar lugar a personas extremadamente desvalorizadas, incapaces de valerse por sí mismas o de decir "no" cuando lo sienten. Para estas personas se recomienda el siguiente mantra:',
            'Yo hago lo que quiero, cuando quiero y como quiero.',
            'Es fundamental recordar que, un dolor o resistencia, pueden manifestarse en un arquetipo por exceso o por defecto. Las patologías que este arquetipo podría desarrollar incluyen problemas en órganos relacionados con el espacio (bronquios y pulmones), el marcaje de territorio (sistema urinario), el útero (la casa simbólica) y los huesos (rigidez o desvalorización).',
            'La ira también puede ser algo que un 8 en desarmonía, a menudo, podría tener cierta dificultad en gestionar. A este propósito, me recuerda a veces al personaje de Hades en la película de animación de Disney Hércules (1997), o el de Ira, en la más reciente Inside Out (2015). En su Sombra, tendrá que aprender a canalizar esta energía.',
            'La adicción al tabaco suele ser un síntoma de conflictos de "invasión o peleas en el territorio". Una vez descubierta y liberada la causa, dejar de fumar será más fácil, ya que este hábito permitía inconscientemente la expansión de los bronquios y pulmones, simulando la ampliación de su espacio vital personal. Este espacio personal y el aire que respira, real o simbólico, están asociados a la respiración y a los pulmones. Al resolver el conflicto de invasión o peleas en su territorio, la necesidad de estimular los bronquios con tabaco disminuirá considerablemente.',
            'Desde su árbol genealógico, este personaje suele heredar ocasionalmente las heridas de injusticia y humillación vividas por sus ancestros y, probablemente, atraiga a su vida circunstancias relacionadas para poder sanarlas. Un 8, en estos casos, deberá comprender la causa profunda de su indignación y frustración constantes.',
            'A nivel energético, sus desequilibrios podrían localizarse en el cuarto chakra, que representa el punto de unión entre los tres superiores y los tres inferiores.'
        ],
        astrologia: [
            'En el plano astrológico, algunos de estos aspectos los encontramos, además que en el ya mencionado planeta Plutón, en el signo de Escorpio. Una de las características de este signo y de este arquetipo, es que, por muy intensas y profundas que sean sus emociones, no serán fácilmente visibles por los demás, puesto que no suele, o no sabe, expresarlas. Con total facilidad, un 8 puede estar intensamente enamorado de ti, o estar deseando matarte de las peores maneras, pero su cara de póker no dejará delatar ninguna sospecha. Las energías del planeta Venus también están presentes en algunas de sus manifestaciones, sobre todo con el poder de atracción y de seducción que tiene, con su magnetismo y carisma, y en su Sombra también, con su capacidad de manipular sutilmente a los demás. Finalmente, el símbolo de Libra —una balanza— que tiene en común con el arcano mayor, se le asocia por sus profundos sentimientos de justicia.'
        ],
        hebrea: [
            'A través de la letra hebrea HEITH, la Cábala nos enseña que la unión de la espiritualidad y la materia se encuentra en el punto de intersección de los dos círculos del 8, equilibrando ambos reinos y encontrando la luz y la oscuridad. Nos recuerda que nuestra fragmentación se debe a errores pasados que aún influyen en la humanidad. Para corregir esto, debemos aplicar los principios universales de la Cábala y meditar con esta letra, lo que nos ayudará a alcanzar este propósito.'
        ]
    },
    9: {
        nombre: 'El Ermitaño',
        hebreo: 'Teth',
        imagen: 'Cartas Tarot/9.png',
        positivas: ["Empatía", "Filosofía", "Experimentar", "Explorar", "Imaginación", "Conexión", "Naturaleza", "Idiomas", "Mente Abstracta", "Hemisferio derecho", "Viajes lejanos", "Tribus", "Etnias", "Códigos", "Turismo"],
        negativas: ["Desconexión", "Aburrimiento", "Apatía", "Depresión", "Trastorno de personalidad", "Hastío", "Sentir en exceso", "No sentir nada", "Falta de imaginación", "Síndrome de Diógenes", "Delirio", "Aislamiento", "Encierro", "Falta de estímulos", "Claustrofobia"],
        descripcion: [
            'Desde el infinito del 8, damos un salto cuántico hacia la totalidad del Universo, representado por el número 9. Esta cifra, siendo la última de la serie primigenia, nace con ocho hermanos mayores que le dan la bienvenida y en los cuales siempre se reflejará. Por esta razón, el sentimiento de hermandad lo acompañará constantemente. El 9 es la suma de todos los números anteriores y, por ende, lleva en su interior muchos elementos y cualidades del 1 al 8. Gracias a esto, entre todos los números, es el que mejor sabe comprender, por sentirse conectado a nivel emocional con cada uno de ellos. Entre sus grandes dones se encuentra, sin lugar a dudas, la empatía.',
            'Así pues, el 9 comprende muy bien a cada uno de sus predecesores y, al nacer —justo después de nueve meses de gestación—, lo primero que verá serán sus hermanos y tendrá la tendencia a identificarse naturalmente con cada uno de ellos. Su sensibilidad y empatía se manifiestan en un intenso amor hacia toda la humanidad, la naturaleza, el planeta y el Universo completo, con los cuales se siente siempre en estrecha comunión. Se dice que, cuando una estrella muere en el espacio profundo, el 9 puede llegar a sentir ese dolor en el pecho. Cuando un ser humano sufre, el 9 comprende ese dolor como nadie más.',
            'Representado en el Tarot como El Ermitaño, este viejo sabio nos narra su historia desde una gruta ancestral que recuerda la matriz de donde todos venimos. Esta cueva evoca tanto las experiencias prenatales en el útero materno, como las memorias inconscientes que influyen y condicionan su vida. Las experiencias emocionales y psíquicas vividas durante esa etapa, tanto propias como de su madre, tendrán un impacto significativo en su desarrollo, afectando muchos aspectos de su personalidad. Por ello, cuando aparece este arquetipo, se nos invita a regresar cíclicamente a esa cueva para investigar y comprender plenamente nuestro proyecto sentido y nuestra propia personalidad.',
            'Profundizando en la etimología de la palabra "ermitaño", encontramos conceptos como "soledad" o "desierto". Sin embargo, al observar el nombre original del arcano L\'Hermite en francés, notamos una H muda que evoca el silencio, un elemento familiar y buscado por esta personalidad durante sus retiros lejos de la sociedad y del ruido de la "civilización". Además, esa H nos habla de un hermitaño, una palabra que también evoca "hermano" y "hermético". Así, este arquetipo refleja una necesidad de hermandad y compañerismo y, al mismo tiempo, describe habilidades "herméticas". De hecho, dependiendo de su nivel de conciencia, este arquetipo puede alcanzar el mismo potencial de Hermes Trismegisto, el enigmático alquimista que difundió las leyes herméticas.',
            'Como ya habrás aprendido hasta ahora, los números nos hablan, incluso, por su manera de ser trazados. ¿Cuántas veces, jugando al bingo habrás confundido un 9 con un 6, y viceversa? Estos dos números son prácticamente idénticos, con la única excepción de que, si le damos la vuelta a uno, encontramos el otro. Por lo tanto, cuando le damos la vuelta al 6, que representa, entre otras cosas, al niño, a la inquietud, al movimiento y a la impaciencia, nos encontramos con el 9, que es el viejo sabio, la calma, la tranquilidad y la profundidad. Se trata de una carta que, según cómo la miremos, en un sentido veremos el niño interior y, si le damos la vuelta, distinguiremos al viejo sabio interior.',
            'El número 9 también cuenta con el don de la comunicación: es un tres veces 3. Su mente ya no es concreta, sino más bien abstracta, y su lenguaje ya no es verbal, sino simbólico, metafórico, codificado. Por lo tanto, tiene un don excelente, no solo para los idiomas en general; también lo posee para la traducción, la interpretación y la descodificación de códigos y lenguajes de cualquier tipo. Su reino es el de la mente abstracta, las ideas, las filosofías, las religiones y las reflexiones constantes. Tiene una gran habilidad para comprender arquetipos y símbolos, códigos y analogías. Su mundo es una dimensión en la que la fantasía y la imaginación predominan. La racionalidad y la lógica, en este lugar, no tienen cabida, y sus pensamientos y conversaciones provienen, casi todas, del hemisferio derecho de su cerebro.',
            'Por estas razones resulta siempre muy interesante ver cómo interactúan una personalidad 9 con una personalidad 4, ya que tienen características aparentemente en antítesis. El hemisferio izquierdo del 4, junto con el hemisferio derecho del 9, en realidad, tienen el potencial de crear una inmensa y compleja red neuronal capaz de obrar verdaderos milagros, debido a que se complementan.',
            'Muchas veces me he encontrado con casos de personas que tienen más de un 9 en su Mapa natal, con la dificultad de comprender a personas con varios 4 en su estructura. Lo que ocurre es que cada uno percibe el mundo y la vida de una manera muy diferente. Cuando nos encontramos con personalidades tan diferentes a nosotros, es porque hay una enseñanza mutua para todos. El Universo siempre busca equilibrar los opuestos y, donde hay un exceso de un rasgo, en ese escenario le será situada su polaridad opuesta, con el objetivo de integrar cada uno de los extremos.',
            'Esta dinámica la podemos observar cuando, por ejemplo, aparecen dos números aparentemente antitéticos como el 4 y el 9 en la misma área del Mapa. Por muy diferentes que puedan parecer, veremos cómo se las apañarán para poder manifestar, en armonía, algunas de las cualidades propias de cada uno. Si tuvieras ambos arquetipos en la esfera profesional, podrían equilibrarse, quizás, expresando la necesidad de orden, rutina y estabilidad del 4 en el horario semanal de trabajo, en un contrato fijo o en un empleo relacionado con la construcción o la ingeniería. Al mismo tiempo, el 9 podría expresar su necesidad de manifestarse en un sector internacional, hablando otros idiomas o relacionándose con otras culturas. Cuando permitimos al Ser expresarse de manera libre, veremos cómo, de manera natural, dos elementos aparentemente tan diferentes, encuentran siempre un modo para relacionarse desde el amor y la armonía.',
            'En el análisis de este arquetipo, observamos cómo este sabio ermitaño sale cíclicamente de su refugio para explorar, experimentar y compartir sus investigaciones y experimentos. Aun así, en algún momento volverá a retirarse en la cueva, hacia dentro, como las mareas.',
            'Asociado simbólicamente con la casa astrológica 9, relacionada con filosofía, viajes lejanos y estudios superiores, este arquetipo nos habla de una personalidad extremadamente social, estudiosa y viajera. Aunque periódicamente oiga la llamada de la cueva y se aleje del mundo durante un tiempo, volverá a él renovado y evolucionado. Si no respetara sus ciclos y sus ritmos, podría sufrir, sin duda alguna. Además, se le conoce porque brilla por su amabilidad, sensibilidad y tacto, y ama compartir sus conocimientos sobre las leyes del Universo heredados por el 8.',
            'El arquetipo 9 tiene, entonces, una gran conexión con la figura misteriosa de Hermes Trismegisto, cuyas enseñanzas y leyes herméticas se consideran el oro del conocimiento para este arquetipo. Esta conexión le dota de una profunda comprensión y transmisión de los misterios del Universo. La búsqueda constante de conocimiento y la necesidad de explorar el mundo físico y espiritual son características inherentes de su personalidad. El 9 es, en esencia, un buscador incansable, un sabio que, a través de sus viajes y experiencias, busca el entendimiento profundo de la vida y el Cosmos.',
            'Sus necesidades son sensoriales: si no experimenta, sufre; si no siente a través de sus cinco sentidos, sufre. Si no explora, sufre. Si no ha experimentado en su propia persona algo, difícilmente lo acepta. Es inspirado e inspiró al mismísimo Santo Tomás a tocar con la mano su realidad para poder creer; con lo cual, no será fácil convencerlo de nada, a no ser que lo experimente en su propia piel. Un 9 es naturalmente atraído por nuevas informaciones y nuevos descubrimientos —el nueve evoca lo nuevo— pero su escepticismo es puramente investigativo. Solo si ha podido sentir, explorar o experimentar algo en su vida, aceptará esa nueva información.',
            'La luna es aquel lugar donde la mente de este filósofo pasa la mayoría del tiempo. En este astro lo concreto se disuelve, la materia se derrite, la magia y la fantasía se asoman y se expanden. De hecho, esta personalidad pasa más tiempo en la luna que en la Tierra porque suele mal soportar estar en el plano físico y en el cuerpo físico. Es un ser vibracional, siente las energías y suele tener atisbos de la vida fuera del cuerpo físico, por esta razón, uno de sus dolores, como veremos más adelante, es el de sentirse atrapado en su cuerpo y en el mundo.',
            'Con este arquetipo nos alejamos de los reinos de la mente, de la materia y de la moral de los primeros arcanos, y empezamos a volar, a viajar lejos de la Tierra hacia nuevos horizontes lejanos y aventuras estelares. El 9 es el viajero por excelencia, el que sale con un billete de solo ida y nunca sabremos hasta dónde llegará, cuándo o si volverá. En sus viajes se mezcla con las diferentes tribus, se viste como ellas, come como ellas, busca nuevos sabores y nuevas fragancias todo el tiempo. Lo encontraremos, muy probablemente, entre montañas y lagos, ríos y bosques, y lo más seguro es que esté abrazando a un árbol o trepándolo o viviendo encima de él. Sus viajes son de mochila en la espalda y naturaleza salvaje, de aventuras místicas y de viajes estelares. La Providencia y las sincronicidades son sus fieles compañeras, y nada más le importa. Su planificación es básica porque sabe que el camino se hace caminando. En sus viajes hablará todos los idiomas del mundo, incluido el del amor. Y cuando vuelva, si es que vuelve, ya no será el mismo; su naturaleza habrá cambiado unas cuantas veces antes de su retorno.',
            'El 9 representa también el gran destructor y constructor de universos, del suyo propio y de los que se encuentre por el camino. Por esta razón, suele tener muchas vidas en una, muchas identidades en una y será llamado a terminar ciclos y empezar nuevos.',
            'La vibración de este número la encontramos en la frase de Jesús:',
            'Destruid este templo y yo lo levantaré de nuevo en tres días.',
            'Los templos que el 9 es capaz de destruir son las realidades efímeras del ego y, las identidades que destruye, solo son débiles máscaras comparadas con las nuevas que es capaz de construir.',
            'También es cierto que el que entre en contacto con un 9 en su plenitud, sentirá su propio universo temblar y desintegrarse sin poder volver atrás, ya que tiene la habilidad de desmontar las realidades de los demás como la suya propia, pero no de manera intencional, más sin querer, sin darse cuenta, simplemente vibrando. Esto significa que, no solo es capaz de reinventarse a sí mismo todas las veces que haga falta, sino que también tiene la habilidad de inspirar en los demás una conexión más profunda con ellos mismos, que a menudo puede provocar ciertas crisis interiores necesarias. Por este motivo, su esencia la encontramos también en la sagrada trinidad hinduista: Brahma, Visnú y Shiva (respectivamente: creador, preservador y destructor del Universo).',
            'Su capacidad de crear se puede leer en varios niveles: si puede crear una nueva identidad en este mundo, también puede crear un nuevo perfil en un mundo ficticio, imaginario o virtual. En este sentido, puede tener capacidades para crear un universo entero a través de la literatura, los videojuegos, los juegos de rol o dentro de series televisivas y películas. Este arquetipo, como todos los arquetipos, tiene infinitas claves de lectura, inagotables tonos y matices, desde el plano más mundano y superficial, hasta el más sutil, mental o metafísico.',
            'El número 9 nos puede contar, también, historias de autismo, ya que las personas con esta condición suelen vivir en un mundo muy diferente al de los demás, un escenario creado por su mente neurodivergente. La mente de una persona con autismo decodifica la realidad de una manera única y, a menudo, estos individuos se comunican con un lenguaje atípico que es, cuanto menos, asombroso.',
            'Su capacidad de reinventarse y renacer le viene de la integración de los secretos de la gestación durante los nueve meses de experiencias en el útero, la primera de sus "cuevas". En ese espacio sin tiempo se convirtió, él mismo, en el Señor del Tiempo y, en ocasiones, podrá percibir sus días y sus años de una manera muy diferente a cómo los perciben los demás. Para él, un día podrá tener más de 24 horas, y tendrá la habilidad de comprimir diez años en uno en su mejor estado de consciencia. Todo esto le viene por la herencia del infinito 8 y por su comprensión del tiempo, que en el 9 se ha integrado a la perfección. Si el 8 tenía el gran reto de equilibrar lo finito con lo infinito, el 9 se hace dueño y amo del tiempo, rompiendo las barreras de esto a su antojo. Uno de sus potenciales es, de hecho, la capacidad de viajar en el tiempo con la consciencia, con el corazón y con su cuerpo astral. Quizás solo es cuestión de tiempo que algún día, incluso, lo haga con el cuerpo físico.',
            'Otro gran elemento de este hermano de la humanidad es la salida de la Matrix y el despertar espiritual. Se dará cuenta, progresivamente, de que su objetivo final es volver al útero, a la cueva primigenia, a la unidad y la fuente, junto con todos sus hermanos.',
            'Místico, químico, mago, cocinero, viajero, soñador, son más rostros con los cuales lo identificamos. Su arquetipo evoca la figura del legendario mago Merlín en todas sus caricaturas: históricas, filosóficas y mágicas. Él ha venido a este mundo para experimentar y para hacer sus "magias", y lo hará en todos los contextos posibles de la vida, o más bien, según la posición donde este arquetipo aparezca en el Mapa.',
            'Capaz de sacrificarse para los demás, o de regalar todo el dinero que reciba sin acumularlo, este filósofo austero sabe muy bien que el universo es abundancia y la escasez es solo una ilusión. Nos invita también a la entrega total e incondicional al amor, como San Francisco de Asís, que es una de las manifestaciones del 9. De hecho, muy a menudo lo encontraremos en un monasterio, dentro de una hermandad o al servicio de alguna organización humanitaria. Sin ir muy lejos, la Madre Teresa de Calcuta tenía un 9 en su Personalidad Profunda y un 19 (arquetipo de la paz y del amor) en su Nudo Emocional.',
            'Este arquetipo representa también el inconsciente colectivo y, de hecho, tiene más consciencia colectiva que individual, hasta el extremo de perderse en ella, cosa que podría causarle algunos problemas de identidad (si ya no los tuviera). Sus sentimientos no son tanto hacia el individuo, sino hacia el ser humano como especie. Mientras que el 8 piensa "primero yo y luego los demás", el 9 se polariza en su opuesto "primero los demás y luego yo". Ambas posiciones, son extremos de un mismo programa que necesitará ser equilibrado en su aprendizaje, en el caso de un Pilar en desarmonía.',
            'Asimismo, este arquetipo define a un espíritu libre: no tiene miedo a la soledad −¡por algo es un eremita!− sino que, más bien, la ama profundamente, porque sabe que realmente es imposible estar solo en este universo. Aprecia el amor libre y al aire libre, y no tiene tabúes ni pudor porque están todos trascendidos ya. Para él, la vida es un experimento que hay que llevar a cabo, y el mundo entero es, al mismo tiempo, su laboratorio y su casa.',
            'En muchas ocasiones, encarnará la figura del confesor y su entorno lo percibirá como tal de manera natural. Por esto, nada más conocerle, muchos le abrirán sus corazones, y terminarán contando secretos y asuntos de extrema intimidad: tanta es la confianza que llega a generar cuando el arquetipo está en equilibrio.',
            'En el campo profesional, tendremos personas que se dediquen a la filosofía, a las ciencias, a la química, al mundo de la cocina, de los viajes, de los idiomas, al turismo en general o a la traducción de textos o códigos. Buscarán oficios relacionados con la naturaleza, con la ecología, con las ONGs y, si no los encontrasen, los crearán ellos mismos. Por otro lado, podríamos tener también excelentes profesionales de Astrología, Numerología, descodificación biológica o enseñanzas afines, ya que se trata, en cierto sentido, de descifrar e interpretar lenguajes especiales. También hay que recordar la importancia que este número le da al compañerismo y a la experimentación: por esto, trabaje donde trabaje, es importante que en su entorno laboral se sienta como con sus hermanos simbólicos y que no se aburra; en caso contrario, no durará mucho y se irá hacia nuevos viajes y experiencias.'
        ],
        sombra: [
            'Sus miedos, bloqueos y resistencias se manifiestan principalmente en el plano mental y psicológico. Un 9 puede sufrir crisis de identidad periódicas por esa sensibilidad especial que tiene en el identificarse con otros, que le lleva, a veces, a olvidarse de sí mismo y de sus propias necesidades emocionales. También es cierto que, debido a su conexión profunda con el inconsciente colectivo, puede experimentar sentimientos y pensamientos que no necesariamente sean suyos pero, debido a su extrema empatía, los puede absorber y vivirlos en su persona como si lo fueran. Esto le podría causar cierta desorientación y sufrimiento si no aprende a filtrar (y a reconocer) sus propias emociones respecto de las de los demás.',
            'En sus momentos más extremos, puede desarrollar trastornos bipolares o delirios al desconectarse demasiado de la realidad por querer refugiarse en "la luna". Un 9 puede tener la tendencia a distanciarse de sus emociones y quedarse atrapado en el plano mental. Además, lo más probable es que caiga en depresión por haber perdido simbólicamente sus capacidades sensoriales y emocionales, o por haber sido reprimido por una figura parental demasiado autoritaria.',
            'Un 9 en la Resistencia o en el Tema Central, puede sufrir por sentir demasiado o por no sentir absolutamente nada. Por lo tanto, si experimentara un bloqueo significativo, podría llegar a perder su capacidad para sentir, empatizar y experimentar, convirtiendo su aburrimiento en hastío o apatía profunda. La rutina y la monotonía podrían oxidar todo su sistema psicoemocional en cuestión de días. Para sanar y recuperar su armonía, tendrá que investigar y comprender qué memorias e informaciones inconscientes se están activando en esos momentos, para poder trascenderlas.',
            'He visto a más de un 9 sufrir por no haber podido, o querido, retirarse a un espacio seguro para poder regenerarse. Es fundamental que respete sus mecanismos internos y que se vaya a su "cueva" a procesar todo lo almacenado y experimentado en el mundo exterior: tiene que respetar sus ciclos de sociabilidad y aislamiento al pie de la letra. En ocasiones puede ocurrir todo lo contrario, quedándose atrapado en su gruta sin querer salir a experimentar afuera, debido a algún bloqueo o herida inconsciente. A menudo se sentirá atrapado en un lugar, una relación o una profesión de la que necesita desprenderse. Su asma podría reflejar su conflicto interior por sentirse asfixiado, por no tener suficiente oxígeno o por respirar aire tóxico.',
            'El sentimiento de libertad profundo, que es un Pilar importantísimo para este arquetipo, si se ve reprimido o amenazado, puede generar miedos profundos que podrían evocar memorias de asfixia, encarcelamientos o ahogos. Así pues, el miedo a quedarse atrapado y no poder salir, es bastante común en este arquetipo, y es preciso recordar los varios niveles de interpretación con respecto a lo real y simbólico. El mismo miedo puede generarse por no poder salir de un ascensor bloqueado, o bien ser incapaz de huir de una relación o trabajo asfixiante.',
            'En la Sombra, este sabio se convierte en un personaje enigmático, excéntrico y asocial. Su desapego se transforma en austeridad y su incapacidad de recibir, se acentúa. En muchas ocasiones, podría desarrollar personalidades con un síndrome de Diógenes, acumuladores compulsivos, vagabundos o víctimas de desastres financieros. En este sentido, podría haber un exceso en el "dar o recibir" que habrá que equilibrar.',
            'A los niños que nazcan con este arquetipo en su Mapa, se les atribuye, a menudo, déficit de atención, Asperger o autismo, debido a su excesiva timidez, soledad o introversión. Estos niños —e incluso adultos— muchas veces prefieren crearse un mundo paralelo donde vivir, flotar en las nubes, evadirse, viajar con su mente a otros reinos imaginarios. Recuerda que son creadores y destructores y tienen la capacidad de crear realidades imaginarias o virtuales para aislarse en ellas. Asimismo, pueden buscar la huida del mundo a través del uso de sustancias como cannabis y similares: la desconexión del cuerpo físico y del mundo terrenal puede ser percibida como única vía de salvación.',
            'Si la conexión profunda es su gran potencial en el Espejo, la desconexión total es su contraparte en el reino de la Sombra.',
            'Un ulterior problema que puede aparecer cuando un mecanismo de la Máscara se activa, es su dificultad para permanecer en el momento presente, por lo que la vida en la Tierra podría resultarle muy difícil. Si no llegara a armonizar su gran don de "viajero del tiempo", las memorias almacenadas en su interior podrían llevarle a añorar lugares, eventos y personas de un pasado o un futuro lejano activando emociones y traumas innecesarios. Esto podría generar un hundimiento de las emociones, una melancolía constante y una desconexión total de la realidad presente.',
            'Sabiendo que el 9 está asociado al mundo de los sentidos, todo lo que no tenga sentido le podría causar cierto dolor. Las cosas sin sentido y sin lógica alguna, por ejemplo, tienen el poder de activar una parte de su Sombra y sacarle de quicio. A un 9, le basta con asomarse por la ventana de su casa para ver un mundo sin sentido a su alrededor: los sistemas disfuncionales en los cuales se basa la sociedad moderna hoy en día, sin ir más lejos. Por este motivo, podría llegar a estresarse mucho cuando choque con las leyes del mundo actual y sus sistemas de funcionamiento, como en el caso de la burocracia. En mi camino recuerdo haberme encontrado con más de un 9 que les tenía terror o fobia a los mundos kafkianos. En sus obras, el escritor checo Franz Kafka describe a la perfección el tipo de sociedad que podría acabar en dos días con la vida de un 9.',
            'En realidad, la depresión se asomará a la vida de este arquetipo cuando perciba que su existencia no tiene sentido. De hecho, el tema del propósito de vida, para un 9, es de extrema importancia. Como, normalmente, ya le cuesta estar en el mundo físico, si además no le encuentra un propósito, es muy probable que se quiera ir de aquí cuanto antes. Por consiguiente, tiene que estar muy alerta a los primeros síntomas de depresión, apatía y aburrimiento e investigar qué está pasando y desde cuándo está pasando aquello. En cuanto localice el momento exacto en el que salió del sendero de la coherencia emocional, tendrá que volver a corregir el error cometido.',
            'La comunicación es un elemento que también puede estar en riesgo si existe una herida no sanada, lo que podría causar dificultades cognitivas, del habla y problemas de comunicación con algún hermano real o simbólico. La hermandad tan sentida en el Espejo puede volverse dolorosa en la Máscara. Para restablecer el orden y la armonía, este arquetipo deberá sanar su relación con sus hermanos, comprendiendo la raíz profunda e inconsciente de esa herida o conflicto. A lo mejor podría haber experimentado una desconexión profunda con un hermano que no supo gestionar. Si nos fijamos en los términos en que nuestro inconsciente escoge para describir nuestra personal manera de percibir un dolor o una circunstancia externa, seremos capaces de localizar las palabras clave de este arquetipo —y, en realidad, de todos— para descodificar el significado profundo del evento. La Programación Neurolingüística, nos puede ayudar muchísimo con esto.',
            'Los chakras que suelen verse afectados en caso de resistencias son el primero, por hipoactividad, y el séptimo, por hiperactividad. La mejor terapia para él es aquella que le ayude a conectarse con la tierra, a trabajar con la materia y el cuerpo físico, en el cual a veces puede sentirse atrapado. La experiencia le está invitando a amar a su cuerpo físico y la materia, y su objetivo es volver a conectar, desde el amor, con su propia "humanidad" y con este mundo.',
            'También se le recomienda que pase mucho tiempo en la naturaleza, para poder volver a conectar con ella a través de la tierra, los árboles, las aguas y las montañas, desprendiéndose de la identidad en la que se ha quedado atascado y creando una nueva, quizá en otro lugar.',
            'A lo mejor ha llegado el momento de decirle adiós a una identidad que tan duramente se ha empeñado en construir para poder sacar un "nuevo yo" que está a punto de nacer. El 9 nos invita a renacer cíclicamente y a darle un nuevo significado a nuestra personalidad, quizás a través de unos cambios importantes externos o internos: una mudanza, una nueva profesión, un nuevo talento o un nuevo proyecto pueden ser el principio de una extraordinaria transformación.'
        ],
        astrologia: [
