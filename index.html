            'Finalmente, en el mundo astrológico, podemos notar cómo este arquetipo, que engloba en sí mismo la esencia de cada uno de sus hermanos anteriores, refleja esa variedad de niveles e interpretaciones. En su manifestación más espiritual, sacerdotal y casta, nos conectará con el signo de Virgo. Su profundidad y su amplia conexión con el mundo de la mente abstracta y de las ideas, nos llevarán a los dominios de Mercurio, mientras que los aspectos más saturninos, se revelarán en la encarnación del viejo sabio y confesor. Su insaciable deseo de conquista del conocimiento humano a través de la constante exploración y experimentación, lo conecta, por otro lado, con el reino de Júpiter y con el signo de Sagitario.'
        ],
        hebrea: [
            'A través de la Cábala, la letra TEITH asociada a este arquetipo, nos recuerda que la función del mal en la Tierra tiene un sentido y un significado dentro del diseño divino y que, gracias a su meditación, podemos llegar a comprender esta función. Esta letra nos enseña a vencer el mal en nosotros mismos, empezando a dominar nuestros instintos animales y carnales, para que no nos sometan. Nos ayuda a transformar nuestro corazón en pureza y a desprendernos del peor de los males, el miedo, para sustituirlo con el amor divino e incondicional.'
        ]
    },
    10: {
        nombre: 'La Rueda de la Fortuna',
        hebreo: 'Yod',
        imagen: 'Cartas Tarot/10.png',
        positivas: ["Espiritualidad", "Religión", "Movimiento", "Cambio", "Ruedas", "Fortuna", "Destino", "Dios", "Lugares energéticos", "Aventura", "Bohemio", "Originalidad", "Sorpresas", "Flexibilidad", "Providencia"],
        negativas: ["Inseguridad", "Fragilidad", "Miedo", "Falta de estructura", "Apego a los cambios", "Inconstancia", "Fanatismo", "Timidez", "Baja autoestima", "Desvalorización", "Padre ausente", "Ateísmo", "Inquietudes", "Preocupaciones", "Ansiedad"],
        descripcion: [
            'Después del largo viaje del 9, hecho de transformaciones, ciclos y renacimientos, encontramos, finalmente, al 10, que simboliza un nuevo comienzo y con el cual terminamos un ciclo y ponemos un punto y aparte. A partir de ahora, los números que aparezcan vendrán de dos en dos. El 1 vuelve, pero esta vez acompañado por un 0. El 0 tiene un trazado circular u oval que no tiene un principio ni un fin; es una línea continua, eterna y constante que representa el todo, el Universo, la colectividad y a Dios mismo. Nos recuerda el huevo cósmico por el cual nació el mundo como lo conocemos, y está asociado a un nuevo comienzo. Por lo tanto, siempre que nos encontremos con un 0 por acompañante, recordaremos esta cualidad añadida. Un cero tiene el poder de amplificar y expandir las cualidades del número que acompaña. Lo volveremos a encontrar en el 20, en el 30 y en el 40 también.',
            'Cuando el 1 —el individuo— encuentra al 0 —lo eterno— surge el arquetipo del hombre en comunión con Dios. Su gran potencial es recordar que es un ser divino y que puede lograr cualquier cosa porque Dios le acompaña en todo momento. Un 10 solo puede estar en armonía una vez que haya comprendido que está hecho a imagen y semejanza de Dios.',
            'Sin embargo, en la infancia y en la juventud, este arquetipo suele manifestar cualidades que le hacen percibir el mundo como peligroso e inseguro; de hecho, la inseguridad suele ser la primera expresión del 10 durante los primeros años de vida. Un 10 en la infancia o en la juventud, suele describir a una persona muy tímida, frágil y discreta. Pero vamos por orden.',
            'Entre los Arcanos Mayores del Tarot, La Rueda de la Fortuna representa la necesidad de desequilibrarse para estar en equilibrio y, por esta razón, suele generar cambios constantes. Por un lado, tenemos al elemento de la "Rueda" —algo circular como nuestro número 0— que nos recuerda que todo es cíclico y transitorio, que el mundo siempre está girando y evoluciona. La expresión Panta Rei, atribuida al filósofo griego Heráclito (siglo VI y V a.C.), expresa a la perfección el mensaje intrínseco de este arquetipo. Su significado del griego antiguo es:',
            'Todo fluye, todo está en cambio constante.',
            'Por otro lado, tenemos el componente de la "Fortuna", que está asociada al hado, al destino y a la divinidad de la cual provenimos. La divina Providencia nos asegura que nunca nos faltará nada y nos permitirá manifestar abundancia y prosperidad siempre que recordemos que no estamos separados de la divinidad, sino que somos una unidad con Dios.',
            'Por estas razones, siempre que haya un 10, estos dos elementos de "Rueda y Fortuna", están invariablemente presentes en todos sus innumerables matices.',
            'Con este arquetipo habrá una constante necesidad de cambio: el movimiento es vida y, si algo no muda, probablemente esté muerto. Una rueda parada es una rueda oxidada destinada a romperse y, por ende, habrá que encontrar la manera para que siempre esté funcionando.',
            'Esta rueda nos habla igualmente de la Ley del Karma y del Ciclo de Encarnación y, por esto, podría indicar personalidades con el don de recordar o conectar con vidas pasadas.',
            'Debido a su constante movimiento, nos habla de una inestabilidad necesaria para poder seguir viviendo y que en muchos casos puede ser percibida como negativa, si no está integrada en uno mismo.',
            'Este arquetipo crea una personalidad compleja, cuya infancia o adolescencia, suelen estar asociadas a elementos como la falta de confianza, la baja autoestima o la fragilidad frente al mundo. Esto suele pasar porque algo que nuestro ego no ama, en absoluto, es el cambio; y con el 10, todo es cambio. Nada es fijo ni estable con esta vibración; todo se mueve constantemente porque el 0 representa una rueda que nunca para y que genera constantes escenarios. La inmovilidad, hemos dicho, equivale a la muerte. La ley del movimiento nos lo enseña: todo cambia y crece, y aquello que no lo cumple, mengua y muere. Cuando no evolucionamos, nos estancamos. Y el 10 esto lo sabe muy bien.',
            'Un aspecto importantísimo que está siempre presente con este número, y que le influenciará toda su vida, es la figura ausente de su padre. Casi siempre, cuando nos encontramos con un 10 en un Mapa natal, hay una historia de un padre ausente, un progenitor que se fue, que murió joven o que estuvo, pero no actuó como lo requeríamos. En muchos casos, puede ser un padre que estaba presente, pero que no nos acompañó en la manera en la cual nosotros, en la infancia, lo necesitábamos. Si investigamos en profundidad la relación con nuestro padre, descubriremos algo que jamás habíamos visto en él: su humanidad. El rol del padre es, entre otros, enseñarnos en la infancia, cómo funciona el mundo, empezando por cogernos de la mano y llevarnos fuera del hogar, lejos de mamá. Un padre es aquel que corta el lazo natural que hay entre un bebé y su madre cuando ha llegado el momento; es aquel que corta el cordón umbilical en el momento del nacimiento y que tiene que volver a cortar simbólicamente alrededor de los 6 o 7 años de edad, para poner un fin al Complejo de Edipo natural que todos los niños experimentamos, con el objetivo de ayudarnos a convertirnos lentamente en adultos funcionales. Nuestro padre —o más bien el arquetipo paterno— nos tiene que enseñar a cruzar la calle mirando bien que no nos atropellen, nos tiene que enseñar a nadar, ir con la bici, trepar un árbol, conducir un coche. A nivel ancestral, un padre es el que nos enseña cómo enfrentarnos al mundo y a sus peligros, cómo ir a cazar el mamut, el bisonte o el oso, cómo sobrevivir en la jungla, en la sabana y a la furia de los elementos. Hoy en día, los peligros son diferentes, pero funcionamos exactamente igual. Actualmente, nuestro mamut, es el propio trabajo: si no soy capaz de cazar y de defenderme, percibiré el mundo como un lugar inseguro y peligroso y desarrollaré una personalidad frágil y débil. Por esta razón, la figura del padre es tan importante en nuestra vida.',
            'Como sabemos, el arquetipo del padre terrenal está comúnmente asociado al varón, pero siempre me gusta recordar que hablamos de energías, de arquetipos y de polaridades que pueden ser encarnados por cualquiera y en cualquier momento, sobre todo cuando en la sociedad en la que vivimos, los modelos de pareja, de familia y de educación han cambiado y están destinados a cambiar cada vez más.',
            'Lo importante, para este número, es descubrir que, aunque su padre terrenal puede que no haya estado ahí como lo necesitaba, su padre celestial sí que siempre estuvo, está y estará presente. El desafío de este arquetipo es trascender la figura paterna tal y como la conoció —o no conoció— y alegrarse, porque siempre tuvo un padre celestial y siempre lo tendrá: Dios/Consciencia/Universo. El siguiente paso será encontrar a esa divinidad dentro de sí mismo para, a continuación, convertirse en Dios mismo, encarnando así esa figura del padre que nunca tuvo, aquí en el mundo y ahí afuera.',
            'Continuando con el análisis de este arquetipo tan complejo, podemos observar cómo, al contrario que el 4, símbolo de estaticidad, estabilidad e inmovilidad, este arquetipo vive en un terreno cambiante e inestable, y deberá dar la bienvenida a muchos cambios a lo largo de su vida. Su propósito es encontrar estabilidad en el movimiento, por lo que tendrá que alejarse de la rutina y de la monotonía, ya que pueden ser letales para él. Si aprende a fluir, descubrirá su amor por la aventura y los riesgos, y se entregará a los caminos que Dios ha preparado para él.',
            'A menudo, se sentirá atraído por la energía de Dios y la espiritualidad y buscará lugares sagrados, símbolos de la conexión con Dios: iglesias, templos, monasterios, catedrales y mezquitas. Para vivir plenamente, este arquetipo necesita tener fe y perder el miedo a su propia grandeza. Si elimina cualquier aspecto divino de su vida o mantiene una visión limitada de sí mismo, no alcanzará nunca su máximo potencial.',
            'Si la inseguridad de la infancia persiste en la adultez, se recomienda sanar los episodios traumáticos del pasado. La inestabilidad e inseguridad típicas de la niñez deben ser transformadas en aspectos empoderantes en la adultez. El objetivo final de este arquetipo es crear de la nada, como hizo Dios. Solo debe recordar que está hecho a imagen y semejanza de Dios, y que tiene las mismas cualidades en potencia.',
            'Este personaje viene del 9 y, con lo cual, ama las conversaciones filosófica y espirituales, pudiendo comprender temas y lenguajes más sutiles y complejos. Un 10 puede manifestar perfectamente dones de clarividencia, visiones místicas o, como hemos anticipado antes, conectar con vidas pasadas para comprender su karma y descubrir lo que ha venido a corregir aquí en la Tierra. A diferencia del 4, que es tradicional y estructurado, el 10 ama las sorpresas, la acción y se adapta fácilmente a los cambios. Es una personalidad superflexible. Una vez superada su profunda inseguridad, trascendida su fragilidad y transmutadas su vergüenza y su timidez, nos encontraremos frente al arquetipo del aventurero por excelencia, una mezcla de Indiana Jones junto a todos los personajes de las novelas de Julio Verne. A menudo es un personaje bohemio, despreocupado, que tiene un estilo de vida poco convencional y anticonformista respecto a las normas. En su sangre hay memorias de nómada, de gitano y de espíritu errante y, en el momento en el que se activan, no tardará nada en hacer las maletas y desprenderse de todo. El 9 le enseñó a cambiar su identidad con facilidad y a seguir su corazón, confiando en la siempre presente Providencia.',
            'Cuando pienso en un 10, recuerdo al personaje de Vianne Rocher en la novela Chocolat, interpretado por una excelente Juliette Binoche en la versión cinematográfica del 2000.',
            'Profesionalmente, tendrá un trabajo dinámico y lejos de la rutina, posiblemente con horarios o tareas variables. Además, podría mantener también varias fuentes de ingresos. También puede ser que cambie constantemente de trabajo para aventurarse en nuevos proyectos, que compagine fácilmente más de un empleo o que su vocación esté relacionada con la espiritualidad o la religión. Un 10 puede ser perfectamente un sacerdote, un mago o un explorador, o tener un trabajo poco convencional. Lo que está claro es que tiene todas las cualidades y potencialidades del 1, exaltadas y expandidas por el 0 y, como es un arquetipo que está en constante movimiento, es muy difícil definirlo y que se autodefina porque, cuando se ha descubierto a sí mismo, ya está cambiando otra vez.',
            'La estabilidad, una vez alcanzada, le dura muy poco. Pronto querrá volver a dar un nuevo giro a la rueda y descubrir qué más aventuras le esperan.',
            'Suele ser una personalidad inquieta, curiosa y con ganas de conocer cada vez más. Si consigue superar todos sus miedos — que son muchos— puede tener una vida extraordinaria.',
            'En la esfera amorosa, puede también experimentar inseguridades profundas, especialmente en la juventud, pero estas dudas suelen suavizarse con el tiempo. Si persisten, es necesario investigar bloqueos o heridas no sanadas. En su madurez emocional, vivirá una pareja no necesariamente muy tradicional, abierta al cambio –¡a veces al intercambio!– y a las sorpresas. La pareja de un 10 es aventurera, quizás un poco bohemia, ligeramente atípica, sin normas clásicas preestablecidas. El 10 fluye en el momento presente, pero esto no significa que sea una personalidad promiscua o que huya de los compromisos. Un 10 es una pareja espiritual y no podría durar mucho con alguien que no tenga un sistema de creencias que contemple alguna manifestación de Dios en su vida.'
        ],
        sombra: [
            'Su dolor radica indudablemente en la falta de un padre: el gran ausente. Esta ausencia activa una herida que lo lleva a una sensación de desamparo, pues nadie le enseñó cómo funciona el mundo ni cómo enfrentar sus peligros fuera de su zona de confort. La figura paterna, ausente en la infancia, se refleja en la inseguridad del menor a medida que crece. En el caso del número 10, su poder reside en sublimar la ausencia de su padre terrenal mediante la presencia incondicional y constante de su padre celestial, aprendiendo que Dios será su único padre y referente, siempre presente dentro de sí y a su alrededor. Es fundamental que aquel que se encuentre un 10 en su Mapa desarrolle una relación con Dios, independientemente de sus creencias, religión o espiritualidad. De lo contrario, deberá convertirse en el padre que nunca tuvo, pero con mucha más dificultad.',
            'Cuando se identifica con el número 10, esta personalidad se percibe a sí misma como pequeña, demasiado pequeña para un mundo lleno de peligros. Sin embargo, esta es una percepción errónea. Como enseña la letra hebrea asociada,',
            'En lo más pequeño está oculto el mayor potencial.',
            'Una de sus grandes dificultades es reconocer la grandeza que tiene en su interior y descubrir que Dios, que es su padre también, reside dentro de sí. Hasta que no comprenda que está hecho a imagen y semejanza de Dios, este 10 tenderá a buscar ayuda externa, alimentando su propia desvalorización y victimismo. Como su mayor miedo es quedarse solo, su objetivo es recordar que tiene una conexión directa con el plano divino y que Dios/Universo/Padre/Consciencia nunca permitirá que esté solo.',
            'Frecuentemente, sus resistencias se deben a la incapacidad de aceptar los cambios que la vida le propone para su desarrollo y evolución, ya sea en su vida familiar, sentimental, laboral o social. La duda es muy frecuente en esta vibración, debido a la inseguridad por elegir el camino correcto, o por el miedo a equivocarse o fracasar.',
            'Tiene un gran sentido de la libertad y puede tener dificultades para crear una estructura firme en su vida. Sin embargo, debe recordar que su estructura no tiene que ver con la firmeza y estabilidad del número 4, sino con algo más fluido y flexible. Su estabilidad dependerá del movimiento constante.',
            'Como mencionamos antes, siendo amante de los lugares espirituales o energéticos, visitar y pasar tiempo en estos sitios le ayudará a recargarse y conectar con la energía de Dios. Instrumentos como la oración, los mantras religiosos o la meditación pueden ser de gran ayuda en situaciones de estrés o dolor.',
            'Para mantenerse en armonía, tenderá a huir de lo permanente, indefinido, estable y fijo, y podría tener dificultades para comprometerse a largo plazo o echar raíces. Por esta razón, debe tener cuidado con sus excesos y evitar que el cambio se convierta en un mecanismo de defensa emocional, especialmente si el número 10 está en el Pilar de Resistencia o en el tema central del Mes. Si esto ocurre, deberá hacer lo contrario: comprometerse, quedarse, estructurarse y echar raíces.',
            'En el Tema Central puede significar una dificultad para aprender cuándo tiene que parar o, por el contrario, en qué momento debe moverse, activarse o cambiar. Los malos hábitos, por ejemplo, pueden estar relacionados con una dificultad de este tipo.',
            'En el Nudo Emocional o de Dolor, puede contarnos una necesidad de aventuras a nivel emocional, una necesidad de cambios y sorpresas que nunca llegan. La monotonía en estos Pilares, podrá influir negativamente en todo el sistema psicoemocional y cargárselo por completo.',
            'Además, −y algo que es válido para todos los números−, tendrá que cuidar el exceso de su vibración, o bien el defecto de ella. O sea, mucho cuidado con el miedo a los cambios y la inflexibilidad, pero también mucho cuidado con el apego a los cambios y a la constante inconstancia.',
            'Un 10, cuando vibra desde la Máscara, es una persona frágil, débil y extremadamente insegura. Suele tener un carácter tímido y vergonzoso y puede somatizar en el cuerpo esa misma debilidad. A veces, es un niño que pasa mucho tiempo entre un hospital y otro, que sufre acoso escolar, que tiene un sistema de defensa interior y exterior demasiado delicado. Puede sufrir anemia y enfermarse fácilmente en todos sus sistemas biológicos. Su inconsciente tiene grabada la información de que el mundo está lleno de peligros, visibles e invisibles, que le vencerán. Sin embargo, esa información solo es una percepción errónea: deberá cambiarla si no quiere que la ansiedad tome el mando de su vida.',
            'Entre sus recursos y terapias más efectivas están el movimiento y el ejercicio físico moderado: caminar, bailar, correr, entrenar, pedalear, nadar y cualquier actividad que implique movimiento. La inmovilidad es sinónimo de estancamiento: el movimiento es vida.',
            'La meditación y la oración son grandes recursos para este arquetipo, ya que le vuelven a conectar con la energía de Dios a través de un diálogo interno.',
            'Meditación, oración y movimiento, son las primeras ayudas que un 10 tendrá que buscar para alejar la monotonía y el aburrimiento de su vida.',
            'A nivel energético, y en una perspectiva general, puede tener una estructura débil y todos sus chakras pueden verse afectados. Cualquier terapia energética que lo vuelva a armonizar y fortificar es fuertemente recomendada.',
            'Para entender el funcionamiento de este arquetipo, hay que observar el mecanismo de una bicicleta: para mantener el equilibrio, hay que pedalear y moverse continuamente; si paras, caes y te haces daño. Por lo tanto, el desafío de este arquetipo es cambiar o morir, recordando que estabilidad e inmovilidad no son lo mismo. El secreto de su estabilidad física, emocional y mental es, paradójicamente, girar la rueda y empezar de nuevo una vez más. Después de todo, ha aprendido del número 9 el arte de destruir y recrear universos.'
        ],
        astrologia: [
            'Cuando buscamos su relación con los elementos astrológicos, podemos ver cómo el 10 tiene cierta resonancia con el planeta Saturno, el astro de todos los miedos, sobre todo cuando vibra desde el mecanismo de defensa. Quizás en algún plano de nuestra mente, asociamos la rueda del arcano con uno de los anillos de Saturno. Sin embargo, en su armonía, y sobre todo cuando desata todo su potencial, el 10 tiene más relación con el transpersonal Urano, el planeta bohemio cuya originalidad invita a los cambios y a la libertad personal. Ambos planetas, Saturno y Urano, también evocan la arquetípica y difícil relación con la figura del padre, que nos cuentan los mitos relacionados con los dioses asociados. Acuario, además, signo regido por ambos planetas, es la mejor expresión de este arquetipo cuando se encuentra en perfecto equilibrio.',
            'La vibración de este número evoca un profundo sentimiento de destino y nos enfrenta a cambios, a veces repentinos, para comenzar de nuevo.'
        ],
        hebrea: [
            'La letra hebrea YOD, la más pequeña (y escondida en todas las demás), simboliza la necesidad de la energía divina para activarse. La esencia de esta letra nos recuerda lo pequeño que, a menudo, se siente el ser humano frente al mundo, antes de descubrir el Dios que vive dentro de él. Meditar con la Yod desata el potencial escondido en cada uno de nosotros, alimentando nuestro deseo de unión con el creador. La abundancia es el resultado final de esta comunión: el 1 en unión con el 0, el Yo con lo Eterno.'
        ]
    },
    11: {
        nombre: 'La Fuerza',
        hebreo: 'Kaf',
        imagen: 'Cartas Tarot/11.png',
        positivas: ["Extrasensorial", "Comunicación no verbal", "Reconocimiento", "Canalización", "Espíritus", "Energías", "Intuición profunda", "Enseñanza", "Gran líder", "Docencia", "Maestría", "Sabiduría", "Médium", "Sensibilidad", "Ángeles"],
        negativas: ["Violencia verbal", "Racionalización", "Reconocimiento", "Dependencia", "Mentiras", "Secretos", "Ira", "Gritos", "Silencio", "Desconexión", "Explicaciones", "Justificaciones", "Logorrea", "Ataques psíquicos", "Fantasmas"],
        descripcion: [
            'Este arquetipo representa el primer número maestro: es un 1 que mira a otro 1 en el espejo y representa al individuo que se mira a sí mismo. Con el 11, se empieza un nuevo ciclo de números y arquetipos. Si lo observamos bien, veremos que tiene integradas muchas de las características del 1, pero también del 2 (1+1).',
            'A partir de este momento, en nuestro recorrido progresivo por el estudio los números, tendremos siempre en cuenta su completud y entereza, como hemos hecho hasta ahora, ya que los arquetipos del 11 al 22, siguen siendo entidades y personalidades muy bien definidas y con vibraciones únicas. Sin embargo, en un nivel más profundo, tomaremos en consideración la suma de los dígitos que los componen, que también nos contará algo más de ellos. Por esta razón, de la misma manera que encontramos un 2 dentro de un 11, llegaremos a un 3 dentro de un 12, y así con todos los demás. Esto significa que el arquetipo principal tendrá ciertas cualidades del arquetipo en reducción del cual proviene, pero en un nivel superior o con matices diferentes.',
            'De todos modos, no te preocupes, no será tan complicado. Los vamos a conocer juntos, paso a paso, para que lo tengas claro.',
            'En primer lugar, cuando en el 11 sumamos los dos unos, obtendremos el 2, es decir, una personalidad en la cual la intuición, como bien recordarás, está en su máximo nivel. En efecto, este ser es pura intuición y, a menudo, sabe cosas que ni él mismo conoce por qué forman parte de su bagaje. Su conocimiento es innato, ya que llega a este mundo con un bagaje de experiencias y memorias de otras vidas y otros planos de la existencia. De alguna manera, es como si tuviera un canal directo y siempre abierto con la fuente superior; utilizando una analogía más moderna, es como si estuviera siempre conectado a Internet y, por ende, a todo conocimiento.',
            'Este arquetipo me recuerda siempre esa escena de la película Matrix, en la cual el protagonista, Neo, necesita aprender artes marciales y, en lugar de hacer una formación de décadas como la gente normal, simplemente se conecta a la misma Matriz y descarga en su mente, en cuestión de segundos, todo el conocimiento en artes marciales. Pues un 11, es un poco como Neo: no solo ha venido al mundo llevándose muchos conocimientos adquiridos de otras vidas, sino que además tiene la capacidad de conectarse al campo cuántico y descargar datos, conocimientos e informaciones que pueden resultarle muy útiles en el momento presente. Esto, por supuesto, es el potencial que tiene, y alcanzarlo dependerá de su trabajo interior y del nivel de consciencia en el cual se encuentre.',
            'Si miramos el trazado de este número, observamos que los dos 1 se asemejan a dos flechas que apuntan hacia el cielo, recordándonos su conexión con su Yo superior y con el plano divino con el cual está en constante comunicación. Por lo tanto, este personaje es como un receptor y transmisor de datos continuo, una especie de módem humano que recibe y emite señales en todo momento. Es como una radio: recibe a través de la antena y emite a través del altavoz.',
            'No obstante estos aspectos, la comunicación de un 11 no es necesariamente verbal, sino más bien sutil. Este arquetipo no necesita hablar mucho para hacerse entender: sus miradas, sus silencios y las vibraciones del ambiente serán suficientes para tener una conversación. Además, siente las energías y capta los movimientos en el aire, intuyendo las mentiras y los secretos que esconde.',
            'Siendo compuesto por un doble 1, las capacidades de liderazgo e independencia aquí son doblemente resaltadas.',
            'Como hemos dicho anteriormente, un 11 es un número maestro y, precisamente, los maestros tienen conocimientos para compartir y poner al servicio de los demás, de manera que las personalidades que lo lleven en su Mapa tendrán un don natural para la enseñanza y la docencia. Cualquier cosa que se proponga aprender, cuando la enseñe, la aprenderá aún más rápido porque simplemente la recordará. No resulta gratuito que se le considere el primer número maestro: para este arquetipo, enseñar y aprender son exactamente lo mismo.',
            'En una ocasión, el físico teórico estadounidense Richard Feynman dijo esta frase, que se aplica a la perfección a este número:',
            'Si quieres dominar algo, enséñalo. Cuanto más enseñas, mejor aprendes.',
            'Esta personalidad está en resonancia con la energía de los ángeles que, arquetípicamente, representan los mensajeros de Dios: los intermediarios entre el plano divino y lo terrenal. De esta forma, no nos sorprendería encontrar figuras o imágenes de ángeles en su casa o en su ropa, ya que se trata de su propia vibración plasmada en la materia. Sin embargo, según su estado de consciencia, su relación con estas entidades podría llegar a ser más real que simbólica. Conectar con ángeles o guías espirituales a través de la oración, la meditación o la canalización es uno de sus grandes dones, puesto que es un canal de comunicación directa entre el cielo y la tierra. En muchas ocasiones podrán desarrollar sin dificultad habilidades de médium y canalizar, fácilmente, desde otros planos o dimensiones de la consciencia.',
            'Cuando aparece un 11, ten mucho cuidado con que no haya una bruja volando sobre una escoba por encima de tu nariz. La brujería —en sus cualidades positivas y negativas— también pertenece al reino de este arquetipo. Aquí tratamos con personas que sienten las energías y pueden conectar fácilmente con el mundo de lo invisible, de los espíritus y del Más Allá. El 11, desde siempre, es considerado un número mágico y puede dar personalidades intensamente ligadas al mundo del espiritismo, las canalizaciones y el esoterismo, donde tiene un enorme potencial. Para un 11, es completamente natural ir y venir del mundo astral al mundo terrenal, y es fundamental que acepte e integre estos aspectos sin miedos y sin resistirse: si tienes este número en tu Mapa, esto es probablemente parte de lo que has venido a hacer, aprender o enseñar. Quizás, sea propio a través de una pizca de magia, que conseguirás mantener en equilibrio el Pilar donde aparezca: ¡racionalidad, la justa!',
            'Asimismo, estas personalidades, suelen tener siempre mucha energía y propulsión para muchas cosas. Eso se debe al hecho de estar día y noche simbólicamente enchufados a la fuente. Por lo tanto, siempre que estén en armonía, tendrán una fuente inagotable de energía.',
            'En los arcanos del Tarot, es representado por La Fuerza, que no es una fuerza física, sino espiritual. En la figura, podemos observar una elegante y tranquila mujer sujetando la boca abierta de un león. Ignoramos si es para abrirla o para cerrarla, pero viene a representar al ser humano que ha domesticado a la bestia terrenal interna. Sabe dominar los instintos y las pulsiones más terrenales, convirtiendo en sagrada su sexualidad. También representa a la mujer empoderada, al femenino en su máximo esplendor, a una sacerdotisa de un nivel superior que, finalmente, se mueve en la tierra y la domina, y ya no se queda detrás de las cortinas como la figura del Arquetipo 2. Tiene en su cabeza el mismo sombrero con forma de infinito que llevaba el Mago del arcano número 1, del cual hereda las cualidades de maga, bruja y hechicera.',
            'Quien tenga este arquetipo en su esquema personal, en el aspecto profesional, si no se dedica a la magia, también puede llegar a convertirse en un excelente emprendedor por sus conocimientos profundos y sus habilidades de independencia, autonomía, liderazgo e intuición. Por otro lado, quizás se vuelva un buen terapeuta por su extraordinaria capacidad de escuchar, comprender y enseñar. Su voz es suave, delicada, atractiva, magnética o angelical. Puede ser un maestro de primaria, un docente de secundaria, un catedrático de universidad, pero también un espiritista, un tarotista, un ilusionista. He visto a muchísimos trabajar con las energías o con técnicas energéticas; además, pueden ser artistas, poetas, escritores. Todo esto, siempre y cuando estén en armonía y en coherencia emocional y, por supuesto, se entreguen total e incondicionalmente a su intuición. Un 11 que no escucha su intuición, está destinado al fracaso y al sufrimiento.',
            'Podemos encontrar este arquetipo en los Mapas de muchos músicos y artistas, que canalizan desde otros planos de la consciencia melodías y vibraciones que nos tocan el alma, entre ellos, Beethoven, Chopin, Mozart o, ya en nuestra época, Ludovico Einaudi.',
            'A nivel terapéutico, este arquetipo no necesitará mucha información para sanar, ya que con muy pocos detalles tendrá la capacidad de conectar con el resto de la información y sacar sus propias conclusiones. Por esta razón, hay que recordar que, dentro de sí, se encuentra su propio maestro que, al mismo tiempo le hace de guía, mentor y terapeuta.'
        ],
        sombra: [
            'En el mundo de la Sombra, al tener un 2 encubierto (1+1), representa la necesidad de reconocimiento: un 1 que necesita a otro 1 para saber quién es. Por lo tanto, si no está armonizado, podría caer en la trampa de aceptar lo que los demás dicen como verdad, volviéndose sensible a los juicios ajenos y atrayendo circunstancias para satisfacer o reafirmar su deseo de reconocimiento. Es fundamental que encuentre y reconozca su propio valor inmutable e inestimable, independientemente de lo que otros opinen. Cuando hay un 11, igual que cuando hay un 2, la persona es llamada a trabajar sobre su amor propio y su necesidad profunda de aprobación por los demás. Es extremadamente importante que conozca y reconozca su propio valor, sin que nadie se lo exprese, sin que nadie lo comente o lo valide. La necesidad de la validación ajena, es una percepción errónea que este arquetipo ha venido a sanar.',
            'Un 11 en el Tema Central o en la Resistencia, nos cuenta a menudo historias de una búsqueda constante de un alma gemela, de una pareja perfecta y de alguien que nos amará para siempre. El camino a seguir supone recordar que el único reflejo que nos tiene que amar es nuestra propia imagen del otro lado del espejo y, asimismo, comprender que la pareja perfecta no existe, que la perfección es una cualidad divina, no humana. Si tienes esta necesidad, libérate de ella y conecta con tu yo superior: esa es tu verdadera alma gemela.',
            'En esos mismos Pilares, el sufrimiento de este arquetipo nos cuenta historias relacionadas con una posible pérdida de identidad. Un 11 que no ve reflejada su imagen en el espejo, que sienta que haya perdido su rol en la familia, su posición en la sociedad, su perfil profesional o su pareja, puede sentir cierta desorientación por no saber reconocerse a sí mismo en un nuevo rol. Cuando se identifica demasiado con la idea que tiene de sí mismo o hay apego a las etiquetas que le pone junto a su nombre, es posible que experimente mucho sufrimiento. La evolución y el crecimiento conllevan, ciertamente, etapas naturales de desorientación, y el 11 tendrá que aprender a aceptar su propia imagen que cambia y soltar las creencias ligadas a "lo que se supone que tiene que ser mi identidad".',
            'Un 11 que habla mucho es un síntoma de una herida oculta y de un gran dolor. Aunque sea un buen comunicador, este arquetipo no necesita hablar mucho, ni dar demasiadas explicaciones o justificaciones. Si lo hace, está cayendo en su Sombra. Si se pierde en la dialéctica, en la semántica y en la logorrea, significa que la comunicación no ha fluido, que hay terribles interferencias del ego y que habrá que buscar una herida inconsciente o algún tipo de bloqueo.',
            'En el dolor, el 11 alzará la voz, cambiará su tono y gritará para ser escuchado y entendido. En ese estado, puede volverse impaciente, déspota y no sabrá gestionar su ira, lo que le perjudicará más a él que a los demás. A menudo, tendrá dificultades para expresarse y sentirse comprendido, por lo que su gran don de la comunicación puede desaparecer o volverse en su contra.',
            'Debemos tener en cuenta que la mayoría de los problemas de este arquetipo se deben a ignorar su intuición, por no saber escucharse a sí mismo y por anteponer las necesidades de los demás a las propias. Es la misma historia del arquetipo 2 que se repite.',
            'Por favor, querido 11, escúchate más. No pienses.',
            '¡La mente racional es tu peor enemigo!',
            'Cuando un 11 aparece en el Pilar de Resistencia o en el Mes, es crucial observar si existe un exceso o una falta de este arquetipo, ya que los extremos nunca son síntomas de equilibrio, armonía y bienestar. Esto puede llevar a que las personas vivan desconectadas del plano terrenal y se vuelvan adictas a las dimensiones astrales o espirituales, o, por el contrario, vivan una vida demasiado material o mundana. En estos casos, es necesario investigar y poner orden para sanar y desplegar todo su potencial innato. En mi camino me he encontrado con personas demasiado etéreas que vivían fuera de su cuerpo, pero también con personas extremadamente ateas, terrenales y materialistas.',
            'En el 11, el Cielo y la Tierra están destinados a fusionarse. Un 11 que no esté en armonía, puede estar sujeto a ataques psíquicos o de entidades y energías del bajo astral y, si no aprende a fortalecer su estructura y filtrar estas energías, puede llegar a tener una vida como la del niño protagonista del film El Sexto Sentido (1999).',
            'Por otro lado, cuando un 11 reprime esta esfera de su personalidad, puede llegar a tener graves problemas de salud o de relaciones. El mejor favor que puede hacerse a sí mismo es abrir su canal y, por muy extraño que parezca, conciliar su vida en el mundo mundano con su vida en el mundo espiritual. En caso contrario, esa energía estancada y reprimida, podrá crear brotes de violencia explosiva y ataques de ira, desde mi interior hacia los demás, o desde afuera hacia mi persona.',
            'Con este arquetipo, las dolencias suelen ser más sutiles que físicas, y pueden aparecer altibajos emocionales, cambios de hábitos o comportamientos, o una extrema sensibilidad a las energías del entorno o de personas cercanas. En el cuerpo físico, su punto débil suele ser la garganta, debido a los conflictos de comunicación, y también el sistema gastrointestinal, si no sabe gestionar su ira o no puede asimilar cierta información.',
            'Los chakras más afectados suelen ser el primero, el quinto y el séptimo.'
        ],
        astrologia: [
            'En el universo astrológico y, en su dimensión más profunda, el 11 tiene una relación directa con el planeta Neptuno y el signo de Piscis, por sus capacidades místicas y espirituales. Asimismo, la figura de la bestia y del dominio de sí mismo, crean un vínculo directo con la energía de Leo, por su valentía y su fuerza interior. En otro plano, descubrimos también las influencias de Júpiter y de Sagitario, por su gran sabiduría y don en el campo de las enseñanzas y el conocimiento.'
        ],
        hebrea: [
            'La letra hebrea KAF nos recuerda que somos un canal y un receptor natural de la semilla divina. El destino de nuestra alma es que se convierta en un espacio purificado y apto para poder recibir el pensamiento profético y divino que nos dará la fuerza de modificar y dominar el mundo de la materia y el plano físico. Nos recuerda que la materia está sujeta al espíritu, y no al revés. Gracias a este arquetipo, conectamos con este potencial, y la meditación y el estudio de la Cábala y de esta letra nos ayudarán a alcanzarlo. Nuestra labor es mantener este canal siempre limpio y aprender a purificarlo día tras día, para poder recibir al divino.'
        ]
    },
    12: {
        nombre: 'El Colgado',
        hebreo: 'Lamed',
        imagen: 'Cartas Tarot/12.png',
        positivas: ["Ayudar", "Servicio", "Sacrificio", "Cuidar", "Generosidad", "Altruismo", "Devoción", "Salvar", "Voluntariado", "Perspectiva original", "Pensar fuera de la caja", "Sensibilidad", "Terapias", "Dar", "Hospitales"],
        negativas: ["No saber decir que no", "Esclavitud", "Complacencia", "Baja autoestima", "Desvalorización", "Obligaciones morales", "Enfermedad", "Silencio", "Mutismo", "Incapacidad", "Prostitución", "Dependencias", "Servidumbre", "Devaluación personal", "Pequeñez"],
        descripcion: [
            'Cuando el Universo dio a luz al Arquetipo 12, este fue recibido alegremente por once hermanos mayores —los arquetipos anteriores— que le dieron la bienvenida a esta familia cósmica. El nuevo recién nacido se sintió tan agradecido de haber recibido el don de la vida, que decidió ponerla al servicio de sus actuales hermanos y de todos los que nacerían después. Decidió que este sería su único propósito: vivir para los demás. De hecho, con este arquetipo, la palabra clave es ayudar.',
            'Cuando el 12 está en armonía, solo puede estar bien si ayuda a otras personas. Su estado natural es servir, cuidar y ayudar. Su creencia más profunda es:',
            'Los otros son más importantes que yo.',
            'Como bien veremos, es de extrema importancia entender este aspecto del arquetipo, no porque sea la realidad, sino porque será su verdad durante toda su vida, será su propia percepción del mundo. Ahí es donde radica el núcleo de su trabajo personal: llegar a comprender que él mismo es igual de importante que los otros.',
            'Desde la perspectiva del 12, lo más importante es estar al servicio de los demás, y es necesario que este aspecto se exprese desde el amor y el equilibrio. Ciertamente, los demás no son más importantes que uno mismo, ni uno mismo es más importante que los demás (como diría un 8); todos somos igualmente valiosos y todos necesitamos aprender a ayudar y a dejarnos ayudar. Los problemas empiezan cuando esta personalidad se va a los extremos de su vibración y se olvida de escucharse y de cuidar de sí mismo.',
            'Por tanto, el desafío del 12 es encontrar ese equilibrio, saber dónde termina uno y empieza el otro, saber dónde están los límites. Jamás deberá olvidar que la ayuda al prójimo le hace bien al corazón, pero volverse esclavo del otro es sin duda un exceso; decir siempre que sí también es un exceso. Por esta razón, entre todos los números corre el chiste de que siempre es bueno tener como amigo a un 12, porque cualquier cosa que se le pida, él siempre estará dispuesto a ayudar. Su gran dificultad es aprender a decir que no.',
            'En el arcano del Tarot, el 12 es representado por El Colgado, un hombre suspendido —boca abajo— por una cuerda ligada a sus tobillos. A pesar de lo que cualquiera pueda pensar, este hombre no ha sido colgado por ningún verdugo, sino que se ha colgado a sí mismo. Si observamos la expresión serena de su rostro, vemos que no hay sufrimiento, sino una suspensión voluntaria. Este arcano representa el servicio y el sacrificio, que se puede leer de dos maneras muy diferentes. Por un lado, desde su significado más contemporáneo, tenemos la acción de sacrificarse para los demás, una acción que implica cierto esfuerzo o sufrimiento. Cuando nos sacrificamos por el prójimo debido a un sentimiento de deber, a un sentimiento de culpa o, sencillamente, por obligación, vivimos el arquetipo desde sus matrices más oscuras, que analizaremos más adelante. Por otro lado, tenemos el verdadero sacrificio, cuyo significado etimológicamente más puro es "sagrado oficio". En este último caso, el acto de ayudar es resaltado por la nobleza de la acción y ayudar se convierte en sinónimo de amar al otro. Sin embargo, si olvido que "yo soy igual de importante que el otro", puedo llegar a renunciar a mí mismo para poner todo el foco en la otra persona, convirtiéndome en el sacrificio moderno.',
            'El gran propósito de este arquetipo es aprender, primero, a cuidarse y a servirse a sí mismo desde el amor, para luego poder ayudar y servir a los demás entregándose a su propósito más elevado. Por esta razón, su objetivo en esta vida será aprender a valorarse, a fortificar su personalidad y, sobre todo, a decir que no.',
            'Cuando me escucho a mí mismo y consigo satisfacer, en primer lugar, mis necesidades emocionales, todo mi Ser estará en plena armonía. Lo que más importa en cada arquetipo, es que la vibración de su esencia sea expresada y se manifieste. Cuando un 12 comprenda que escucharse a sí mismo, valorar sus necesidades, sus tiempos y sus deseos es igualmente importante que satisfacer las necesidades y deseos de los demás, también podrá expresar el arquetipo ayudándose a sí mismo, a su niño interior, o a su adulto herido. Haciendo esto podrá, finalmente, sanarse a sí mismo y estar disponible por entero, para ayudar a servir a los demás aún mejor que antes.',
            'Para un 12 en equilibrio, su estado natural del ser es la ayuda y el servicio, esto está claro. Debe servir, no puede hacer otra cosa. Así pues, sus capacidades y talentos se enfocarán en el servicio y entrega hacia los demás. Este arquetipo ha nacido para eso, brilla por su generosidad y su devoción al prójimo.',
            'La vibración predominante de esta personalidad nos recuerda a los doce apóstoles de Cristo, que lo dejaron todo y siguieron la llamada del Maestro.',
            'Si investigamos las profundidades de su corazón, veremos que su deseo más profundo es salvar al mundo y a toda la humanidad. Aunque parezca un objetivo noble, hay que tener en cuenta que, desde un punto de vista estrictamente espiritual, ni el mundo ni la humanidad necesitan ser salvados.',
            'El mundo y el universo entero están en perfecto equilibrio. No hay nada ahí fuera que haya que arreglar o salvar. El verdadero cambio se realiza en el interior. La verdadera e inevitable salvación es la de nuestra alma y, es más: ¡ya estamos salvados!',
            'Cuando comprendemos que lo de afuera es el reflejo de lo de adentro, comprendemos que el mundo es perfecto en su aparente imperfección. Lo que estamos constantemente observando no es la realidad "real", sino la realidad que nosotros hemos creado. Si veo algo que no me gusta ahí afuera, lo cambio en mí. El 12, y todos sus hermanos también, están destinados a entender esto.',
            'Afuera no hay error, sino perfección. El verdadero error, fue el acto que hemos venido aquí a rectificar, a reparar y a corregir a través de nuestro tikún.',
            'Si queremos cambiar lo que vemos en el mundo, el cambio tiene que ocurrir en nuestro interior, tuyo y mío. Pongamos un símil: sería como, de la misma manera en que, cuando vemos nuestra imagen reflejada en el espejo, no ponemos las manos en nuestro reflejo para peinarnos, maquillarnos o afeitarnos, sino que lo hacemos en nosotros mismos, nuestro pelo y nuestra cara, modificando lo que queremos cambiar. Solo haciendo esto veremos un cambio real e inmediato en la imagen que nos devuelve el espejo.',
            'El 12, más que nadie, tiene que aprender a aceptar el mundo que observa y a comprender que lo que está viendo no es la realidad, sino su realidad desde su propia perspectiva individual. Gracias al mecanismo de proyección, podrá entender que lo que verá en sus hermanos —dolor, fragilidad, miseria, marginación, pequeñez, debilidad— serán todas aquellas cualidades que no consigue reconocer en sí mismo y que justamente tendrá que fortalecer y equilibrar, sanando sus heridas profundas y su historia personal.',
            '¿Recuerdas que "el otro" no existe y que no es más que una imagen reflejada de nosotros?',
            '● Ese méndigo pidiendo dinero en la calle soy yo. ● Ese niño hambriento soy yo. ● Esa mujer maltratada soy yo. ● Ese hombre enfermo soy yo.',
            '● Ese perrito mojado soy yo. ● Ese asesino, ladrón, narcisista soy yo. ● Ese Presidente del Gobierno, también soy yo.',
            'Un sabio dijo en una ocasión que, aquel que quiera eliminar toda la pobreza de este mundo, debe hacer todo lo posible para dejar de ser pobre, y aumentar su calidad de vida, sin importar el nivel donde se encuentre. Si tú y yo dejamos de ser pobres, habrá dos pobres menos en el mundo. Ahora, imagínate esto pero a gran escala.',
            'La pobreza y la riqueza (no solo materiales) son dos polaridades del mismo elemento. La abundancia y la carencia son un reflejo del estado del ser y nada tienen que ver con la cantidad de dinero que uno tiene en el banco; eso, como mucho, es una consecuencia natural de su sistema de creencias. Cuando comprendamos el poder que tienen nuestras creencias sobre nuestra realidad, seremos capaces de cambiar el mundo en el cual vivimos. El objetivo para lograrlo es aprender a hackear nuestro sistema operativo, que es lo que estamos aprendiendo aquí y ahora a través de este libro.',
            'El arquetipo 12 suele llevar puestas unas gafas a través de las cuales observa un mundo lleno de pobres, marginados, enfermos, débiles y necesitados. Esta personalidad les necesita para poder satisfacer esa misma necesidad de ayudar y de servir al prójimo. Por esta razón, atraerá a su vida, una y otra vez, circunstancias donde puede amorosamente cumplir con su propósito. Sin embargo, cada vez que un 12 observe a un "excluido", tendrá la oportunidad de verse a sí mismo en esa persona que está mirando.',
            'La gran enseñanza que nos da esta personalidad es que, a través del servicio a los demás, aprendemos a servirnos a nosotros mismos; pero, a la inversa, también sucede, pues cuando nos servimos a nosotros mismos, alineándonos con nuestro propósito y haciéndonos lo que querríamos hacer a los demás, estamos participando en la eliminación de la pobreza, miseria y carencia del mundo.',
            'Para eliminar la pobreza del mundo, tendrás que dejar de ser tú mismo un pobre.',
            'Si quieres eliminar la miseria del mundo, ¡deja de ser un miserable!',
            'Si quieres que la enfermedad desaparezca de la faz de la tierra, por favor, cuida tu salud física, emocional y mental y ¡pon consciencia en la inconsciencia!',
            'En el momento en que un único individuo consigue salir de su estado de carencia, estará contribuyendo a reducir la pobreza del mundo rebajando la cantidad total de pobres acumulada, simplemente no estando él mismo dentro de ese listado. Eliminando un solo pobre de este mundo, habremos contribuido a reducir la pobreza global, incluso si ese pobre soy yo, o era yo.',
            'Volviendo al análisis de este arquetipo, veremos que muchas de estas personalidades, por las razones antes descritas, suelen ser grandes humanistas, ecologistas, utopistas y animalistas. Su deseo, es el de crear fundaciones, asociaciones y estructuras con el objetivo de salvar y ayudar a los colectivos más frágiles o en riesgo de exclusión. Este será el foco de atención principal de estas personalidades que, a menudo, junto con los 9 y los 33 (otros grandes humanistas y salvadores), participarán en el sagrado oficio del servicio al prójimo.',
            'El Arquetipo 12, junto con el 9, es el que más ama hacer regalos. Ambos números vibran con la energía del dar, y ambos tienen que vigilar que este aspecto siempre esté en armonía. Dar no es mejor que recibir. Dar y recibir, como ya mencionamos anteriormente, son lo mismo, pero cuando nos encontramos en la vibración del 12, a menudo, olvidamos que hay una sutil línea que separa la generosidad con una posible necesidad de atención o de amor. Si no cuida este aspecto y no aprende a darse también a sí mismo, un 12 puede caer fácilmente en el mecanismo de supervivencia y de dependencia.',
            'La voz de un 12 suele ser suave, delicada y sensible, como su alma. A través de su forma de hablar y de sus palabras, ayudan más de lo que ellos piensan. Este número en reducción nos da un 3, que es el reino de la comunicación, en este caso, puesta al servicio de los demás. El 1 y el 2 que lo componen, nos describen a veces a un individuo que escucha su intuición, o bien a una persona que se hace en dos para los demás y, en otras ocasiones, a un líder de su mundo interior. Como puedes ver, las claves de lectura pueden ser innumerables.',
            'Con frecuencia, se trata de personas tímidas, delicadas, frágiles y con una gran sensibilidad. Sufren el dolor del otro como si fuera suyo porque se identifican fácilmente con los demás, e intuyen que entre uno y otro no hay separación, que estamos todos conectados. Su reto es aprender que esto siempre es verdad, no solo con el dolor, sino también con el amor, la plenitud y la abundancia. Todos estamos conectados a través del amor.',
            'Por lo tanto, en lugar de enfocarse en el dolor o carencia del otro, un 12 en todo su potencial conseguirá transmitir sus más puras cualidades a los demás. En lugar de dejarse contagiar por el dolor y la miseria, será aquel que contagie e irradie amor, abundancia y prosperidad allá donde vaya.',
            'Así como el Colgado del arcano está puesto boca abajo, tendrá que afinar su gran talento para darle la vuelta a todo y aprender a ver las cosas desde una nueva y original perspectiva. Una de sus habilidades innatas es la de ofrecer una nueva visión alternativa de las circunstancias, visión de las circunstancias y enseñar a los demás a ver el mundo al revés, como hace el',
            'Colgado. Un 12 siempre tiene la habilidad de pensar fuera de la caja, de ver las cosas de manera diferente.',
            'Asimismo, esta personalidad tiene el don de ver los detalles de las cosas, más que todo su conjunto, como hará, por ejemplo, su número espejo, el 21, que analizaremos más adelante. Un 12, puesto frente a un bosque, tiene la capacidad y tendencia de fijarse en cada uno de los árboles; un 21, por el contrario, pierde esa capacidad enfocándose en una visión más global.',
            'En la vida amorosa, un 12 lo da absolutamente todo. A su amado o amada no le faltará nunca nada, ya que suele hacer de la necesidad emocional de su pareja, la suya propia. Por esto, suele ser un gran cuidador de su pareja y suele anteponer las necesidades del otro casi siempre. Su corazón de oro se vuelve feliz solo si su pareja es feliz. Sin embargo, siempre tendrá que tener cuidado de no pasar esa sutil línea entre el servicio y la esclavitud, entre entregarse al otro y anularse a sí mismo.',
            'Las profesiones que suelen elegir están obviamente enfocadas en los servicios. Son excelentes para trabajos de atención al cliente, voluntariado, enfermería, medicina, terapias, también pueden ser activistas, colaboradores de ONGs o, en general, dedicarse a cualquier oficio de ayuda al prójimo. No en vano, se les asocia también a la figura del superhéroe por excelencia, Superman, el salvador de la humanidad.',
            'Para un niño de 12 años, puede ser muy recomendable tener un gatito u otra mascota de la que encargarse, ya que esto, sin duda, le estimulará y activará la vibración de su arquetipo. El adulto deberá tomar consciencia de lo que ocurre en sus proyecciones y de la necesidad que percibe en los demás, actuando en consecuencia. Siempre es el último en darse cuenta de su exceso en el dar, o en su falta en darse a sí mismo. Es fundamental que, en su propósito de servicio a los demás, el otro le haya expresado claramente su necesidad de ayuda y se la haya pedido. Debe detenerse a reflexionar si esa persona realmente ha solicitado ayuda, a quién se la ha pedido y de qué manera, porque de lo contrario, deberá respetar sus procesos internos, sus tiempos y modalidades de aprendizaje sin interferir. No podemos ayudar a alguien que no nos está pidiendo ayuda, ni podemos acelerar o modificar su proceso. Esta es una regla fundamental para cualquier tipo de relación. Además, se le invita a integrar el concepto de que, por muy loco que le parezca, no todo el mundo quiere ser salvado. La responsabilidad es de uno mismo hacia uno mismo; eso es siempre el primer paso. No podemos ni debemos acelerar los procesos personales de nadie, sino aprender a aceptar al otro tal y como es.',
            'Recuerda: cuando tengas la necesidad de cambiar o ayudar al otro, para un momento y, antes de actuar, observa qué necesidad tuya hay ahí. Al otro lo puedo ayudar, pero jamás lo podré cambiar. Lo que puedo y tengo que hacer, será cambiar en mí lo que quiero cambiar en el otro, porque el otro, siempre es perfecto tal y como es.'
        ],
        sombra: [
            'Después de tantos años lidiando y jugando con los números, puedo afirmar, alto y claro, que el 99% de los problemas de esta personalidad dependen de su incapacidad de decir NO.',
            'La ausencia de esta palabra, tan difícil de pronunciar para este arquetipo, es la causa de todos sus males. En el momento que incorpora la sana, sanísima práctica de la negación y de la coherencia emocional, todos los problemas desaparecen.',
            'Cuando un 12 dice sí por obligación, por compromiso, por miedo al rechazo, por miedo a que otro sufra o se enfade, por sentimientos de culpa o por cualquier razón que no sea un coherente "sí, me apetece" o "no, no quiero", queda clarísimo que desatará todas las plagas de Egipto en su vida.',
            'Esto se debe a que un 12, lleva un 3 encubierto, y el 3 en la Sombra, como ya sabemos, nos da problemas de comunicación, de mutismo o de logorrea. En este caso, la dificultad es la de comunicar la santa y corta palabra de dos letras que ya suponemos.',
            'El Colgado del Tarot representa un oficio sagrado realizado con serenidad, y siempre desde el amor, nunca desde el miedo, la culpa o la obligación. Es consciente de que todo lo que da, se multiplica, y aquello en lo que pone su atención se amplifica: puede incrementar el dolor y la carencia, tanto como el amor y la prosperidad. Donde enfoca su atención, eso mismo reproducirá.',
            'Ya hemos aprendido que creamos la realidad a la cual prestamos atención. Aquello que observamos, lo multiplicamos. Por esta razón, ten mucho cuidado y cuida tu vista, tus oídos y todos tus sentidos, porque la mente es una multiplicadora de aquello que estás mirando y escuchando.',
            '● ¿Cuáles son las películas y series que sueles ver? ● ¿Cuál es la música que sueles escuchar? ● ¿Qué lenguaje utilizas cuando hablas? ● ¿Cómo te hablas a ti mismo en tu cabeza?',
            '¡Fíjate, y corrige lo que sea conveniente, antes de que sea demasiado tarde!',
            'En la Sombra, los 12 se vuelven esclavos de los demás, resistiéndose a cuidarse a sí mismos y a amarse. Son capaces de gastarlo todo para otros y nada para sí mismos, creyendo que su valor es menor que el de los demás. Pueden tener baja autoestima o atraer obligaciones que no les corresponden. Muchas veces, los niños con este arquetipo deben crecer rápidamente, encargarse de un enfermo o cuidar del hogar por la ausencia de un referente. Suelen ser niños con grandes responsabilidades, entregados al servicio del otro porque es lo único que saben hacer. Solo pueden equilibrar estos aspectos aprendiendo a decir "no" y amándose, primero, a sí mismos. Y aquellos que no estén de acuerdo, ¡que se lo trabajen!',
            'Estas personalidades pueden aprender mucho de los arquetipos 5 y 8, como cuidar su propio espacio personal, tiempo y dinero. También del número 14 pueden aprender la capacidad de soltar y de liberarse de las cadenas, como aprenderemos pronto.',
            'El gran recurso de este arquetipo es hacerse la pregunta que cada coach y terapeuta ama y que nos repiten al infinito: ¿para qué?',
            '● ¿Para qué quiero ayudar? ● ¿Qué obtengo cuando ayudo? ● ¿Cuál es el beneficio indirecto que obtengo? ● ¿Qué necesidades satisfago al ayudar?',
            'El "para qué" lleva a una mayor comprensión del conflicto de fondo y a una sanación más rápida. Nos conecta con el objetivo final de nuestra emoción.',
            'Cuando un 12 sacrifica sus prioridades por los demás debido a normas sociales, sentimientos de obligación, búsqueda de reconocimiento, o sin un real desapego en el resultado, puede convertirse en la Sombra de sí mismo. Recuerda en todo momento que este arquetipo lleva un 2 en su interior, y nos puede contar historias de apegos y dependencias.',
            'Muchas veces creen que deben sacrificarse para obtener el reconocimiento de su familia y sentir que pertenecen al clan. A menudo, lo hacen para demostrar algo a sus padres, hermanos o vecinos. Son los que llevan todo el peso de los problemas familiares que no pueden soltar. Solo serán libres cuando dejen ir esas cargas que no les corresponden.',
            'Querido 12, el No es bueno. El No es tu amigo.',
            'Ve a jugar con el No y, ¡ya verás qué bien te lo vas a pasar!',
            'En el dolor y la Sombra, estas personas pueden convertirse en verdaderos esclavos. Dependiendo de su percepción de la realidad, podrían sufrir sobrepeso u obesidad por la necesidad inconsciente de hacerse más grandes y llevar más cargas. Para el inconsciente biológico, cuanto más peso creen que necesitan llevar, más grande deberá ser su cuerpo para soportarlo. Al soltar ese peso "simbólico", su cuerpo se transforma: la grasa se disuelve, la joroba desaparece y la espalda se endereza. Ya no necesitarán llevar cargas ni protegerse del mundo que les da miedo.',
            'Querido 12, suelta las cargas que no te corresponden.',
            'Si analizamos la figura del Colgado, la cuerda en su tobillo indica una imposibilidad de movimiento, una atadura que le impide avanzar con libertad. Uno de sus dolores será la percepción de estar en una cárcel, una situación de la cual parece imposible salir. Sin embargo, hay que recordar que el Colgado no ha sido colgado por nadie más que por sí mismo.',
            'Para liberarse de esa cárcel ilusoria, debe tomar acción y aprender a cortar mentalmente la soga imaginaria que le impide moverse y que en realidad se ha puesto él mismo. La prisión en la que se ha metido es fruto de su sistema de creencias: solo cambiando sus creencias podrá liberarse.',
            'Un 12 que sobrevive, en lugar de vivir en armonía, suele ser una personalidad que agradece demasiado, que pide disculpas, incluso, por cosas que no ha hecho, o de las cuales no debería disculparse. Cuando recibe halagos y cumplidos, los rechaza o los minimiza porque, en verdad, no se cree en absoluto lo que le están diciendo. Su complacencia, puede llevarle a hacer pequeños (o grandes) regalos de forma proporcional a su necesidad de agradar y compensar alguna falta inconsciente. En los casos más graves, un 12 con programas de inexistencia tendrá que sanar, probablemente, programas de esclavitud e invisibilidad también.',
            'El número 12 evoca, además, las Doce Tribus de Israel, cuyos descendientes heredarían la Tierra Prometida. Si, por un lado, las memorias de su esclavitud bajo el dominio del faraón en Egipto siguen siendo una parte importante que puede reaparecer en la Máscara, por otro lado, este arquetipo, puede llegar a convertir las Doce Tribus en razas, juzgándolas y separándolas, habiendo olvidado que todas vienen de un mismo linaje: todas son hijas e hijos de Dios. Por este motivo, podría haber temas relacionados con la identidad de una nación, con la identidad personal y cultural y también casos de discriminación y racismo, junto con memorias de destierro y exilio.',
            'Dentro de su biología, pueden desarrollar problemas en los huesos, especialmente en la columna vertebral dorsal o cervical, y en las articulaciones, debido a la falta de valoración en sí mismos. Algunos pueden sentirse ahogados y asfixiados por las circunstancias, desarrollando problemas respiratorios como bronquitis o infecciones pulmonares. Todo depende de la percepción individual y del nivel de carga o sacrificio vivido. El sufrimiento se somatiza en el cuerpo dependiendo del matiz y de la intensidad con que se percibe.',
            'Procrastinación, inmovilidad, parálisis, egoísmo y masoquismo son otros aspectos que pueden surgir en caso de bloqueo o desarmonía. Prostitución (no solo sexual) y dependencias, pueden aparecer cuando son vividas con un sentimiento de esclavitud, más que de necesidad. La manera en la que un 12 se suele "prostituir", no es necesariamente a través del sexo, sino a través de la venta de su cuerpo, tiempo, presencia y talentos, a cambio de algo que le pueda permitir sobrevivir. A menudo nos prostituimos aceptando un trabajo que no amamos a cambio de un sueldo, o bien seguimos en una relación a cambio de cierta estabilidad económica, o de algún beneficio que nos mantiene en un bucle tóxico u opresivo.',
            'Los chakras más afectados a nivel energético suelen ser el tercero y el quinto.'
        ],
        astrologia: [
            'En Astrología, un 12 nos conecta con los elementos de salvación y sacrificio del signo de Piscis y con el planeta Neptuno. En un 12, se encarna el "salvador del mundo", pero también, como veremos en breve en su Sombra, aquel que necesita ser salvado. Asimismo, podemos encontrar ciertos elementos de este arquetipo, en el signo de Virgo, por su devoción al servicio y a la ayuda.'
        ],
        hebrea: [
            'En la Cábala, la letra LAMED, asociada a este arquetipo, nos invita a estudiar la tecnología de la realidad en la que vivimos para volvernos expertos en las leyes del mundo físico y espiritual. Nos recuerda que venimos de un sello divino y que aquí, en este mundo, somos una copia de ese sello. De ahí que, pareceremos, quizás, desteñidos e imperfectos, pero volviendo al origen, podemos recuperar la perfección con la que fuimos creados. Meditar y estudiar los secretos del mundo a través de esta letra, nos ayudará a alcanzar ese objetivo.'
        ]
    },
    13: {
        nombre: 'La Muerte',
        hebreo: 'Mem',
        imagen: 'Cartas Tarot/13.png',
        positivas: ["Transformación", "Cambio radical", "Crisis", "Crecimiento", "Renacimiento", "Muerte real o simbólica", "Dejar morir", "Fluir", "Resurrección", "Esqueleto", "Gran Fuerza Interior", "Resiliencia", "Fénix", "Evolución", "Revolución"],
        negativas: ["Muerte real o simbólica", "No aceptación", "Resistencia al cambio", "Vida dura y difícil", "Enfermedades", "Miedo al contagio", "Rigidez física y mental", "Parálisis", "Crisis", "Dificultades", "Desastres", "Tabúes", "Problemas en los huesos", "Miedo a envejecer", "Creencias limitantes"],
        descripcion: [
            'De todos los números que existen, este suele ser el más temido, porque su nombre es sinónimo de Muerte y sus apellidos son Crisis y Transformación. Sin embargo, ya hemos aprendido que la muerte solo es una ilusión y que lo único que realmente existe es la Vida. Por lo tanto, ese momento entre la vida y otra vida es simplemente un cambio de estado. Este arquetipo es, de hecho, el gran maestro de los cambios y es, al mismo tiempo, transformador y transformista.',
            'A pesar de su mala reputación, el arquetipo que ahora nos ocupa es esencial y necesario para el proceso de la vida. Esta no tendría sentido sin la existencia del número 13 y, es más, todo el sentido de la vida se expande y amplifica cuando su vibración entra en juego.',
            'Esta personalidad a veces puede ser difícil de reconocer: cuando se presenta, ya ha cambiado su rostro y nunca es lo que parece. A menudo, llega a nuestra vida como una mariposa; otras veces, como un tsunami. En ambos casos, la música que empieza a tocar a su llegada es la de un necesario e inminente cambio de estado: ha llegado la hora de transformar nuestra piel y mutar a algo diferente.',
            'Aunque la muerte sea el significado que la mayoría de las personas asocia al encontrarse con esta vibración, lo más interesante y enriquecedor es justo lo que viene después: la resurrección. Como el Ave Fénix que se enciende en llamas y resurge de sus propias cenizas, este número tiene que enfrentarse frecuentemente a duras pruebas, y pasar por ciertos dolores necesarios para poder evolucionar. Es llamado a procesar pequeñas y grandes muertes, reales o simbólicas, a lo largo de toda su vida: quizás la pérdida de un ser querido, o el fin de una relación o de una etapa importante que termina. En todos los casos en los que se necesite un proceso tan profundo, la forma más armoniosa de superar esta crisis es no resistirse, sino rendirse al cambio cuanto antes, y procesar el duelo real o simbólico de la mejor forma posible.',
            'La muerte, como sabemos, es lo más inevitable que hay. Somos conscientes de su presencia en cada instante y es fundamental para todos nosotros —y especialmente para este arquetipo— aprender a amarla, aceptarla e integrarla en nuestra vida. La crisis es, en realidad, una gran oportunidad de cambio. Sin ella, la oruga nunca podría llegar a ser mariposa, ni un bebé podría llegar al mundo a través del parto. Este arquetipo describe justo ese momento santo entre una vida y otra vida, entre un estado del ser y otro estado del ser diferente.',
            'El momento de nacimiento es la verdadera esencia del arquetipo 13. Antes de ese instante, el bebé vive en un paraíso simbólico que termina en el momento del parto. De forma similar, otro tipo de paraíso le espera después. El momento del nacimiento es, sin duda, una experiencia de crisis y transformación, una revolución de emociones amplificadas por este arquetipo. Una nueva información está luchando para entrar en nuestra vida y, si me resisto a darle la bienvenida, la crisis será mucho más dura de lo necesario.',
            'De la misma manera, el momento de la muerte es, en verdad, un nuevo nacimiento a un nuevo mundo: está la vida antes y está la vida después y, entre ellas, ese momento arquetípico de transición que pertenece al dominio del 13.',
            'El dolor que esta personalidad muchas veces puede sentir es parte de este proceso, y su recurso más valioso es aprender de ese lamento, ya que cada uno cuenta una historia diferente y representa un aprendizaje específico para su evolución. La persona que aparecerá después de integrar esa experiencia de transición será un ser renovado, más consciente y maduro, y observará el momento de crisis recién vivido con conciencia. Por consiguiente, el 13 aparecerá a menudo en los duros procesos mentales, emocionales y físicos de cambio de género, una experiencia que, a pesar de su gran dificultad, lleva literalmente a esa persona que lo transita, a una verdadera transformación de oruga a mariposa.',
            'Este arquetipo puede aprender del 10 las artes del cambio y del movimiento constante, y enseñará a su sucesor, el 14, a dejar ir y soltar lo que ya no es funcional y válido en su vida.',
            'A veces, esta vibración aparece en personajes que son amantes del transformismo y de los disfraces, y se asocia su cambio de vestuario con su cambio de identidad personal o artística. Solo por nombrar algunos, Madonna, Michael Jackson y Lady Gaga, tienen al menos un 13 en su Espejo.',
            'La armonía del 13 depende del conocimiento de sí mismo desde el principio de la gestación. En el útero, su primera casa, es donde aprendió a no temer a la muerte, transformándola en vida. Quizás haya tenido un viaje prenatal complicado, o un nacimiento difícil que le ha marcado para siempre. Por este motivo, habiendo superado pruebas muy duras incluso antes de su nacimiento o en su primera infancia, su crisis se convierte en el superpoder de transformarse y transformar cosas y personas. Cualquiera que se le acerque notará esa vibración, y muchos se querrán alejar, ya que, donde aparezca un 13, hay revoluciones y transformaciones, y ningún ego está dispuesto a cambiar fácilmente.',
            'Por todas estas razones, es fundamental comprender que el área de vida en la que aparezca esta vibración es la que está más destinada a sufrir un cambio profundo. Según el Pilar de tu',
            'Mapa natal donde aparezca un 13, ahí es donde la transformación se dará de manera natural, a veces en ti mismo y, en otras ocasiones, proyectando el arquetipo hacia fuera, revolucionando la vida de las personas de tu entorno.',
            'Esta personalidad necesita comprender e integrar que evolucionar puede ser difícil, pero solo si se elige que así sea. La vida es dolorosa solo cuando no nos escuchamos, cuando no somos coherentes con nosotros mismos, y esto el 13 lo sabe. Cuando el cambio llega como un tsunami, no lo podemos parar, o corremos el riesgo de ahogarnos y hundirnos en el intento. Tenemos que estar preparados, desapegarnos de todo y subir a lo alto, para que los daños y los dolores sean lo más suaves posible, con el fin de que un nuevo comienzo amanezca. Y, si no somos capaces de subir a lo alto, también podemos aprender a surfear la ola del tsunami. Lo más importante es reconocer que esa ola está llegando y nada será como antes después de su paso.',
            'Recordamos, en esta ocasión, las palabras del Dr. Bruce Lipton cuando dijo que:',
            'Las crisis son las precursoras de la evolución.',
            'En cada cambio de estado, una parte del 13 muere y un nuevo ser aparece: las etapas desde la infancia a la adolescencia, desde la edad adulta al matrimonio, desde ser hijo a ser padre, desde tener pareja a estar separado, pasando por mudanzas, cambios de relaciones, colegios, trabajos. En todos los cambios, una pequeña parte del 13 muere, pero un nuevo potencial brota y se desarrolla. Por esta razón, cuando este arquetipo observa su pasado, lo verá como etapas muy bien marcadas, como si fueran diferentes identidades que comienzan y terminan, una tras otra. El desapego total será la solución y la cura para todos los males.',
            'Si en el capítulo anterior hemos visto cómo el 12 sufre por su dificultad de decir que no, esta vez observamos cómo un 13 sufre cuando tiene dificultad a aceptar los cambios y dejar ir lo que está muerto.',
            'En parte, ya hemos aprendido a fluir con los cambios y con los movimientos del arquetipo 10 que, indudablemente, suelen ser más suaves. Sin embargo, con un 13, los cambios que estamos invitados a aceptar son cambios definitivos, radicales y para siempre.',
            'Asimismo, este arquetipo tiene una fuerza y una resistencia que nadie tiene. Es capaz de subir las montañas más altas solo por el placer de contemplar la vista más hermosa. Es capaz de Tiene la capacidad de acompañar a personas necesitadas, en sus situaciones límite donde cualquier otro no tendría la sensibilidad, ni la fortaleza para afrontarlas. El que es amigo íntimo de la Muerte, a nada ni a nadie le teme, porque comprendió que esta es sinónimo de vida y que la vida es eterna, aunque cambie de forma durante toda esa eternidad. Así es.',
            'Sus decisiones, una vez tomadas, serán definitivas, no habrá vuelta atrás. Quizás le cueste llegar a ellas, pero una vez tomadas, serán para siempre.',
            'En el ambiente laboral podrá relacionarse con procesos de cambios (psicología, psicoanálisis, PNL, cirugías), con la muerte real o simbólica, con lugares emocionalmente duros como hospitales, tanatorios, cárceles. Quizás trabaje con el esqueleto, los huesos, los rayos X o con enfermos terminales. Incluso, puede que se dedique a un oficio duro que nadie quiere o puede hacer, ya que solo un 13 suele tener las capacidades necesarias para hacerlo.',
            'Por ejemplo, recuerdo el caso de una mujer que trabajaba como enfermera en la unidad pediátrica de un hospital, y se relacionaba todo el tiempo con niños enfermos, así como con casos oncológicos y terminales. Pues, cuando llegaba el momento de preparar a un niño recién fallecido para el tanatorio y para su entierro, la persona a la que llamaban para lavarlo, vestirlo y prepararlo, era ella. Nadie más tenía la fuerza y la sensibilidad adecuadas para hacer un trabajo tan duro. Esta mujer tenía un 13 y un 12 en su área vocacional. Por muy duro que fuese ese trabajo, lo hacía con entrega y total devoción, con las lágrimas que siempre le bañaban los ojos, pero feliz de poder acompañar a esos niños durante esa última etapa.',
            'Un 13 en armonía puede llegar a ser un gran revolucionario, y cambiar la esencia y la estructura de cosas, personas, empresas y sociedades enteras. Si no encarna el arquetipo en sí mismo, podrá proyectarlo hacia fuera, transformando personas y lugares de manera sutil, ayudando a los demás a dejar morir lo muerto y a recordar que solo la vida existe.',
            'Entre los arcanos del Tarot, es el único personaje sin nombre, porque pronunciarlo es un tabú o quizás, porque cuando lo evocas, ya ha cambiado. La imagen del arcano describe un esqueleto vivo con huesos visibles o, tal vez, un cuerpo humano que se descompone; al fin y al cabo, no hay diferencia. Su guadaña recoge los miembros humanos de un rey y una reina hechos pedazos, indicando que la muerte no se olvida de nadie, que todo tiene que ser transformado para seguir el camino de la evolución. Incluso, aquel personaje que has creído que eras hasta ahora, tiene los días contados. Un 13 ya ha pasado por las etapas de la destrucción de la identidad del 9 y de los cambios necesarios del 10; gracias al 11, sabe que hay vida más allá de la muerte, y la entrega y devoción del 12, una vez integradas, le ayudan a abandonarse por completo a esa transformación. Todo cambia.',
            'El ego de un 13 tendrá, ciertamente, una vida poco fácil por esta razón, ya que, con esta vibración, nada dura mucho tiempo, ni siquiera la idea que uno tiene de sí mismo. Y eso está bien. A nuestro ego, lo tendremos que educar y acompañar en este proceso.',
            'Cuando el 13 aparece en tu vida, te susurra en el oído estas simples palabras:',
            'Déjate morir, deja que perezca esa idea que tienes de ti mismo… Tú no eres aquel que crees que eres, sino mucho más.',
            'Ha llegado la hora de renacer, déjate morir, déjate renacer. La mejor versión de ti está por llegar… a la vuelta de la esquina. Ahí está, en cuanto abras tus manos y sueltes todo aquello a lo que te aferras, renacerás. Cuando te liberes, cuando te desprendas, ya que nada te vas a llevar allá donde vas.',
            'Si este arquetipo se mirara a sí mismo en el microscopio, descubriría que, incluso cada célula de su cuerpo, no para de transformarse y regenerarse en cada momento y que, nada en el mundo de la materia (incluso biológica), está destinado a durar mucho. El mundo en el que vivimos está sujeto a la ley del cambio: todo fluye, todo pasa. Efímero es este mundo, como efímeros son sus habitantes. Esto es algo que, antes o después, tendremos que asumir.'
        ],
        sombra: [
            'En la Máscara, los dolores de este arquetipo se manifiestan principalmente como sentimientos de miedo o culpa, relacionados con un cambio o una muerte, ya sea real o simbólica. Sus enfermedades surgen cuando no acepta ese cambio, cuando se resiste a dejar morir algo, y cuando el dolor no se procesa desde el amor, sino desde el miedo. Aunque intuirá con anticipación el cambio necesario, el miedo a dar el salto le atrapará en un bucle sin fin. La única manera de liberar ese dolor es dejando de resistirse al cambio, y saltando con confianza hacia lo que va a llegar, independientemente de si quiere o no.',
            'El dolor aparece cuando se olvida que la muerte es sinónimo de vida, y que la eternidad es un viaje en el que, simplemente, cambiamos de vehículo, panorama y compañeros de aventura, según la etapa.',
            'La enfermedad y el temor al contagio pueden esconderse entre sus fobias, atrayendo situaciones paradójicas que reafirman esos mismos miedos. El miedo a la muerte, al final, evoca el miedo a la enfermedad y viceversa. La única manera de vencer estos miedos es transformando las creencias que los alimentan, entregándose al proceso de la vida con fe, porque, lo único real en este mundo es el amor. El miedo y la muerte pertenecen al sueño y a la ilusión: cuando despertemos, se disolverán en humo de inmediato.',
            'Un 13 en el Pilar de Resistencia, también nos puede hablar de una dificultad para cambiar la estructura de nuestras creencias más profundas. El cambio de esta estructura implica, para este arquetipo, la muerte de un entero y complejo sistema de creencias que suele alimentar un universo limitante y condicionante donde reina el dolor, el estrés, el esfuerzo y la esclavitud. Con frecuencia, me he encontrado con personalidades con un 13 en esta posición, y exhibían una gran dificultad para dejar morir y transformar una determinada circunstancia de su vida que solo le brindaba sufrimiento. En algunos de estos casos, las excusas y las justificaciones que la mente encontraba para seguir alimentando ese sistema disfuncional, eran al límite de la paradoja, pero siempre sostenidas por un programa biológico de supervivencia heredado, como suele ocurrir.',
            '¿Cuántas veces nos aferramos a algo que sabemos que nos está lentamente matando y, aun así, justificamos ese comportamiento, hábito o dinámica por el miedo a transformarnos por completo?',
            'Un 13 en esa posición nos habla de una resistencia a un cambio radical que puede darse en la esfera sentimental, familiar, profesional o en algún otro ámbito de la vida.',
            'Un 13 implica siempre una transformación que, por muy dolorosa que parezca, nos llevará a un renacimiento y a un estado mucho mejor, y más abundante y próspero, que el anterior.',
