            'Con un 13 en cualquier Pilar de la Máscara, experimentamos una vida dura, sacrificada y dolorosa, y la intensidad de nuestro sufrimiento será proporcional al esfuerzo que producimos para evitar el cambio.',
            'Por lo tanto, podríamos tener miedo a lo inevitable, al paso del tiempo o a envejecer, a la pérdida de nuestros apegos e identidad, a divorciarnos, a casarnos, a ser madres y padres y, en general, miedo a las etapas naturales de la vida. Para que la armonía vuelva a nuestra vida, debemos entregarnos al cambio, soltar, dejarnos llevar y desprendernos de aquello a lo que nos aferramos. El secreto está en que la Muerte implica la Vida. La Muerte es Vida.',
            'También hay más. Este arquetipo puede activar o despertar memorias kármicas de vidas pasadas que aún afectan al momento presente. Quizás, si en otra vida fui quemado en la hoguera, podría estar percibiendo ese dolor y miedo al fuego en esta vida o, tal vez, podría tener cierta dificultad para exponer públicamente mi rostro o mis ideas en este momento presente, por miedo a que vuelva a pasar otra vez por ese castigo del cual fui víctima en mi pasado.',
            'Lo mismo ocurre cuando nos obsesionamos con querer cambiar nuestro cuerpo, nuestra anatomía, nuestros tejidos y esqueleto. Si observamos con atención la figura de este arcano, vemos un cuerpo en descomposición o, según la perspectiva, en composición. La figura central de esta carta nos está mostrando los huesos, los músculos y parte de su cuerpo desnudo o descarnado. Este arquetipo puede llevarnos a querer transformar nuestro propio cuerpo como deseamos o, en caso de resistencia o dolor, a sucumbir a la Sombra de manera obsesiva.',
            'El miedo a envejecer con serenidad y dignidad puede activar una dificultad en aceptar los cambios naturales de la edad o desatar una obsesión para querer quedarnos jóvenes para siempre. Este tipo de obsesión se puede manifestar, por ejemplo, en el uso excesivo de la cirugía estética, de la cosmética o del ejercicio físico.',
            'En este sentido, podríamos tener dificultades también en el sentido contrario y resistirnos a adquirir nuevos hábitos saludables para la transformación de nuestro cuerpo o de nuestra mente. Para algunas personas con un 13 en su Sombra, adquirir hábitos sanos como cierta disciplina, una dieta equilibrada o hacer algo de ejercicio físico, puede resultar una grandísima dificultad: el esqueleto del arcano representa, en otro nivel, la rigidez cadavérica. Sin embargo, todo dependerá de cuánto nos resistamos a cambiar nuestras creencias al respecto. De hecho, lo más complicado para este número es soltar antiguas y obsoletas creencias que le impiden transformarse, y aprender a adquirir nuevas creencias empoderantes que faciliten los procesos de cambio, cualesquiera que sean.',
            'Otro elemento importante que se suele manifestar en la Sombra de este arquetipo es el tema de los tabúes. Si te fijas en el arcano del Tarot, esta es la única carta que no lleva nombre, porque ese nombre es impronunciable, nadie quiere hablar de aquello. La Muerte representa el mayor tabú humano. Tan grande que, en los tiempos medievales de la Peste Negra, se la exorcizaba con fiestas, máscaras y carnavales, para reprimir el miedo profundo generado por este arquetipo. De la misma manera, todo lo que se quede tabú en la vida de un 13, generará cierto hedor y pestilencia. Es extremadamente importante que estas personalidades hagan un trabajo consciente para liberarse de todo aquello que consideren tabú, o que esté reprimido en sus vidas. En realidad, nos encontramos todavía en el reino de las creencias obsoletas, aún no hemos salido de ahí, pero, en esta región del inconsciente, prestaremos especial atención a esos temas tan controvertidos, pertenecientes a nuestra propia manera de ver el mundo desde un punto de vista moral.',
            'Ahora, observa dónde tienes tus peores tabúes, aunque ya te anticipo que la mayoría los encontrarás donde todos solemos tenerlos, es decir, en las áreas dedicadas al sexo, a las relaciones sociales, a la pareja, a los comportamientos y hábitos que tenemos cuando nadie nos ve. Nuestros juicios se alimentan de nuestros propios tabúes y los proyectan, desde las noches de los tiempos, en los demás. Si aún no te has fijado, un 13 en reducción lleva un 4 encubierto, un emperador que, en su sombra puede llegar a tener una doble moral, y aplicar sus normas con dos pesos y dos medidas diferentes.',
            'Para aquellos que tengan dificultad en fluir en armonía con este arquetipo, os recomiendo, por un lado, investigar sobre la técnica metamórfica, una excelente herramienta de transformación que afecta positivamente a las etapas gestacionales, liberando nudos, emociones y creencias atrapadas desde los tiempos de la vida uterina. Por otro lado, la técnica de liberación emocional con imanes, desarrollada por el Dr. Bradley Nelson, también me parece una excelente y muy sencilla opción para quien se quiera regalar un salto a una vida mejor, extirpando desde la raíz, las creencias más limitantes que tenemos instaladas en nuestro inconsciente.',
            'Para aquellos que prefieran quedarse con su obsoleto sistema de creencias —que además me parece una opción válida para permanecer más tiempo con el mecanismo de supervivencia activado— les anticipo que las consecuencias pueden resultar en excelente estrés, asombrosos dolores emocionales y extraordinarias enfermedades físicas, especialmente en los huesos y las articulaciones.',
            'A nivel energético, tendrán también molestias evitables incluidas, gracias a nudos y presiones, sobre todo en el tercero o en el cuarto chakra, los cuales dejarán de funcionar con armonía, pero os regalarán un extenso abanico de quejas y lamentos.',
            'La elección, siempre es de uno mismo.',
            'Tú, ¿qué eliges?'
        ],
        astrologia: [
            'Con el número 13, nos encontramos, una vez más, con el planeta astrológico Plutón, elemento de crisis y transformación y dios del inframundo. Estamos en la casa 8 y nos relacionamos con la energía y la esencia de Escorpio, pero también tocamos la esencia de Urano, los cambios repentinos, la llamada a la evolución y a la revolución. Saturno, en cambio, aparece aquí especialmente en sus aspectos más negativos, aquellos que nos hablan de la dificultad de cambiar, de evolucionar y de explorar nuevos universos más allá de la zona de confort.'
        ],
        hebrea: [
            'MEM es la letra hebrea asociada a este arquetipo, y nos invita a profundizar en el estudio de nosotros mismos para aprender a transformarnos y regenerarnos continuamente, con el objetivo de comprender que lo único que nunca cambia en nosotros es la chispa divina. Todo lo demás está sujeto al cambio constante. Gracias a esta letra, descubrimos que somos seres eternos, divinos y multidimensionales, y que tenemos la capacidad de trasladarnos de una dimensión a otra, de un mundo a otro, de una vida a otra, simplemente transitando en ese momento sagrado llamado "transformación". Si nos resistimos al cambio, nunca podremos llegar a esa Tierra Prometida que nos espera.'
        ]
    },
    14: {
        nombre: 'La Templanza',
        hebreo: 'Nun',
        imagen: 'Cartas Tarot/14.png',
        positivas: ["Soltar", "Dejar ir", "Liberar", "Liberarse", "Dinamismo", "Movimiento", "Compromiso", "Libertad", "Calma", "Tranquilidad", "Diplomacia", "Suavizar", "Bálsamo", "Aguas", "Unión"],
        negativas: ["Manipulable", "Influenciable", "Falta de libertad", "Miedo al compromiso", "Dependencia", "Falta de movimiento", "Claustrofobia", "Fantasmas", "Espíritus", "Ambigüedad", "Lazos", "Ataduras", "Retener", "Acumular", "Falta de autocontrol"],
        descripcion: [
            'La palabra clave de este arquetipo es soltar. Pero ¿soltar qué? La cuestión es es entender qué hay que dejar y qué no, cuándo hacerlo y cuándo no. Los temas del arquetipo 14 giran en torno a este argumento. Lo que queda claro es que, para seguir manteniendo la armonía, deberá evitar a toda costa cualquier tipo de apego —a cosas, personas y situaciones— y aprender a desprenderme de todo desde el amor.',
            'El 14 ha aprendido de su predecesor que, a la tumba, no nos vamos a llevar nada, que desnudos nacemos y desnudos morimos. Lo material, para este arquetipo, tiene una importancia relativa porque vibra sobre todo con lo inmaterial. El Papa de su reducción —el 5— le recuerda la importancia de la vida espiritual sobre la vida material. Por lo tanto, tendrá que trabajar bastante sobre sus necesidades mundanas, y aprender que todo lo que posee es un regalo, pero que nada le pertenece.',
            'Este personaje, nace de base con un gran desapego y desconoce las palabras posesión o posesividad. Cuando está en armonía, es un ser libre que necesita movimiento y se desprende fácilmente de todo lo que haga falta para seguir su camino, ya sea un hogar, un trabajo o una relación. Sabe que todo es pasajero y reconoce la funcionalidad de las cosas en relación con su contexto. Lo material es efímero y, siempre con un gran sentimiento de gratitud en el corazón, usa y bendice todo lo que la vida le brinde, sin necesidad de poseer y acumular nada.',
            'En equilibrio, es el maestro absoluto del dejar ir pero, para alcanzar esta maestría, enfrentará repetidas veces situaciones que le exigirán practicarla. Como viene directamente del número',
            '13, aún tiene una inclinación hacia los cambios y las transformaciones pero, en este arquetipo, el dolor del proceso se integra, comprendiendo que la muerte es seguida por un nuevo nacimiento y nuevos retos. Además, también por esta razón, se asocia a menudo con la transmigración de las almas, ya que tiene una excelente capacidad para acompañar a los espíritus hacia el siguiente escenario.',
            'Dejar ir, en este sentido, es el fluir de la vida y con la vida, y también nos conecta con el flujo constante de vidas entre un mundo y otro. Su vibración nos habla del proceso en el cual los difuntos cruzan de un plano a otro de la existencia, y un 14 tiene no solo un don para acompañar a las personas en su estado terminal, sino también a los difuntos, hacia el estado siguiente. Tiene el potencial de ver y guiar a los espíritus de la cuarta dimensión hacia un nuevo nivel de consciencia, puesto que ha aprendido del arquetipo anterior a conocer a la muerte y a integrarla en todos los procesos de la vida. Es el símbolo del barquero que ayuda a las almas a cruzar de una orilla a otra, de la muerte a la vida, y de la vida a otra vida.',
            'En el Tarot, su arcano correspondiente es La Templanza, una figura femenina y angelical que sostiene dos jarras de las cuales fluyen aguas que se mezclan en una sola. Esta imagen simboliza, por un lado, la transmigración de las almas y el concepto de reencarnación de un cuerpo a otro y, por otro lado, nos habla de su don para la unificación y la facilitación de encuentros. La figura del ángel evoca estatuas funerarias, subrayando su capacidad para ayudar a los muertos a dejar este plano y seguir su camino hacia la luz. Además, los ángeles, como mensajeros de Dios, pueden aparecer en sueños premonitorios y visiones. Por estas razones, sus habilidades tendrán que ver, además de contactar con el mundo de los espíritus, también con la interpretación de los sueños y con la unión de dos elementos.',
            'Este arquetipo es excelente para unir entidades que se buscan mutuamente, facilitando contratos, acuerdos y encuentros. Su habilidad para conectar a personas que se necesitan entre sí por algún propósito puede manifestarse en profesiones como agencias de empleo o matrimoniales, o simplemente con la capacidad de sentir cuándo dos elementos se tienen que encontrar por alguna razón.',
            'En ocasiones, también firmará contratos reales o simbólicos, enfrentando sus miedos al apego y al compromiso, y aprendiendo nuevas lecciones espirituales. Para un 14, la firma de los contratos evoca el compromiso con la vida, con lo cual, esta vibración tendrá que estar siempre presente en los acuerdos, comercios e intercambios. El 14 tiene que cuidarse de los acuerdos verbales y ambiguos, y es ideal que preste atención a todos los detalles antes de confirmar cualquier tipo de acto. La claridad en la comunicación y poner siempre todo por escrito, le facilitarán a la hora de fluir con la vida. No es el caso de que el 14 represente, también, las falanges de una mano, ya que, veremos, enseguida que las manos las utilizará no solo para firmar contratos.',
            'En las relaciones, el 14 no se deja atar fácilmente y puede confundir el compromiso con la falta de libertad. En una relación sana, la libertad se convierte en sinónimo de amor incondicional y desapego. Este arquetipo necesita espacio para moverse y mantener su estructura personal. Los dígitos que lo componen, 1 y 4, representan individualidad y estructura, respectivamente. A un 14 en pareja la ahuyentan los celos, la posesividad y el exceso de tiempo juntos, prefiriendo un acuerdo mutuo entre dos almas libres, pero comprometidas entre sí. Como nos sugiere el agua de La Templanza, la unión de dos aguas en una nos habla de una unión verdadera, de una fusión de dos individualidades, pero manteniendo y conservando cada una su propio jarrón.',
            'Profesionalmente, puede destacar en las ventas, con las firmas de contratos, o como terapeuta en procesos de duelo. Sus habilidades con las manos pueden llevarlo a prácticas como pranoterapia, reiki, técnicas energéticas y masajes.',
            'El 14 conecta con la energía de la tierra como lo hace el 5. Su magnetismo atrae a las personas suave y dulcemente y actúa como un bálsamo y calmante en las personas atrapadas en sus dramas e intensidades. Este arquetipo es conocido por su gran capacidad de calmar los corazones de la gente, y para generar una vibración dulce y bonita allá donde vaya. Su esencia es pacificadora, conciliadora, y representa las aguas de los bomberos durante los "incendios" emocionales y mentales de la vida.',
            'A diferencia del magnetismo del número 8, que es más intenso y de naturaleza más sexual, este arquetipo atrae como el aroma de una flor de azahar, o la belleza de una flor de loto. Irradia tranquilidad, flexibilidad y se adapta a todas las circunstancias del mundo como el agua de la Templanza se adapta a cualquier tipo de contenedor.',
            'Su frase favorita, si tuviera una, sería:',
            'Vive y deja vivir, fluye y deja fluir.',
            'Las aguas del arcano también simbolizan el flujo de energía e información, lo que podría hacer que este arquetipo desarrolle cierta sensibilidad a las modas y tendencias del momento, ya que es capaz de captar la vibración que circula en el aire, y usarla para por algún propósito. En este sentido puede engendrar personalidades que se dediquen a la moda o las últimas tendencias, pero también excelentes divulgadores e influencers. Los demás números que aparezcan en el Mapa natal nos darán más detalles sobre los gustos, intereses y temas que habrá que divulgar y recomendar.',
            'Recuerdo muy bien a una mujer con un 14 en su Nudo Emocional. Era gracioso ver cómo las personas a su alrededor escuchaban sus palabras como si fuesen oro y, dijera lo que dijese, terminaban haciendo lo que ella aconsejaba o invitaba a hacer. Si ella iba a la derecha, todos iban a la derecha; si ella iba a la izquierda, todos a la izquierda. Embaucaba con sus palabras, sus cuentos y sus historias. Sin embargo, no se trataba tanto de lo que decía, sino más bien de la energía que acompañaba a sus palabras. Cuando comunicamos algo, más que las palabras, habla la vibración con la que las acompañamos. Todos los grandes comunicadores lo saben.',
            'Afortunadamente, este tipo de habilidad no puede ser usada desde la Sombra y con fines oscuros. El poder de manipulación les pertenece más a los arquetipos 7 y 8. En el 14, la capacidad de influir en los demás, brota desde una pureza del corazón y desde una conexión con un plano superior de consciencia.',
            'Las aguas de este arquetipo nos evocan una vez más a la figura de Moisés que ya vimos en el arquetipo 7. En este caso, este 7+7, tiene la habilidad de separar las aguas del mar para poder cruzarlo y volver a unirlas una vez cruzadas. En la vida diaria, este arquetipo, estando en su estado armónico, puede vivir circunstancias muy parecidas, sintiendo cómo la vida fluye sin obstáculos, las sincronicidades aparecen y no hay elementos de interferencias por el camino. Las personas y las cosas parecen abrir el paso a esta personalidad para que pueda cruzar de un lugar a otro, los coches se apartan, y la muchedumbre crea un espacio para que cruce sin problema de un lugar a otro. El 14 es el barquero que cruza de una orilla a otra del río, un aspecto que se manifiesta simbólicamente en todos los ríos de la vida.',
            'Igual que la figura central del Tarot a la cual es asociada, esta personalidad es representada por un ángel en la tierra, así pues, su vibración celestial —que le permite acceder a otros planos de la existencia— está en perfecto equilibrio con su energía terrestre, mundana y terrenal. La esencia del 14 nos invita a movernos, a dar elasticidad a nuestro cuerpo, a nuestras emociones y a nuestros pensamientos; nos invita a ser como el agua, para adaptarnos a cada circunstancia que la vida nos brinda.',
            'Esta personalidad, como hemos visto, vibra y resuena con todo lo que es fluir, dejar ir, liberar, soltar y todos sus sinónimos. Así que, en otros contextos, encontrará paz en lugares con aguas que fluyen, cerca de ríos, fuentes, cascadas y cataratas. Si el estrés se asomara a su vida, solo tendría que buscar esta vibración, acercarse a las aguas, abrir las manos, dejar de aferrarse, soltar y confiar en la vida. Además, puede hacer algo tan simple como dejarse caer al suelo en el césped, o dejarse caer hacia atrás con los ojos cerrados y con alguien preparado para sujetarlo. No importa lo que haga, más bien importa la vibración con la que se impregne: dejar ir, dejarse ir. Sólo de esta manera, podrá restablecer el orden y la armonía.'
        ],
        sombra: [
            'En su Sombra, el 14 puede volverse muy ingenuo, influenciable, manipulable e inconstante. Su capacidad de adaptar su agua a cualquier tipo de jarrón, puede ser un arma de doble filo: el agua adopta la forma del recipiente en el que se vierte y, por esta razón, hay que tener cuidado con el "contenedor" en donde vertemos esa agua. Si en el Espejo es un excelente influencer, en la Máscara se convierte en un excelente influenciado, con lo cual, tendrá que cuidar las compañías que elija y los ambientes que decida frecuentar, no olvidando usar siempre su cabeza.',
            'A veces puede ser una persona en concreto, una relación, un trabajo, una circunstancia especial que puede hacer de contenedor. Así pues, necesitará aprender del 7 cómo volver a tomar el control de su independencia y libertad, y del 8 cómo cortar cabezas y ataduras para siempre, desarrollando un poco más de amor propio. La dependencia de algo o de alguien es completamente antinatural para este número.',
            'Sus habilidades comunicativas, normalmente muy elevadas, pueden verse afectadas, y todas sus cualidades pueden bascular a su exacto opuesto. Obtendremos, de esta manera, una personalidad rígida, descontrolada física y emocionalmente, e incapaz de soltar. Igualmente, así como en armonía es el calmante universal, en desarmonía su estado interno podría provocar huracanes y tormentas energéticas a su alrededor. En el momento que observe que su vida se está volviendo una montaña rusa emocional, tendrá que parar y hacer unos cuantos ajustes para volver a la armonía.',
            'Entre sus miedos más profundos podría aparecer la claustrofobia o la imposibilidad de moverse por sentirse atado. Las ataduras podrán ser reales (cuerdas y sogas) o simbólicas (miedo al compromiso o ciertos tipos de acuerdos). También podría tener miedos latentes hacia temas relacionados con el espiritismo y las energías del plano astral.',
            'Su mecanismo de defensa puede crear una personalidad avariciosa, llena de prejuicios o amante de las críticas y de los cotilleos. Las modas se pueden volver una obsesión y el pensamiento propio, crítico y constructivo puede verse afectado.',
            'A nivel físico, los síntomas que podría manifestar en caso de resistencias pueden darse a través de intolerancias alimentarias, estreñimiento (dificultad para soltar), afecciones del sistema circulatorio, retención de líquidos, problemas en los omóplatos o muñecas —símbolos respectivamente, de las alas de la libertad y de las esposas de los prisioneros— y también de los tejidos de las manos (recordemos las 14 falanges).',

        descripcion: [
            'Después de atravesar las aguas del arquetipo 14, ha llegado el momento de entrar en el reino del fuego del arquetipo 15, un lugar donde una llama inextinguible arde continuamente y calienta —o incendia— todo lo que está a su alcance. Estas llamas siempre vivas son lo que permitirá mantener una perfecta armonía y una vida emocionante y plena.',
            'El fuego de este arquetipo representa una enorme cantidad de energía que podrá manifestarse en diferentes vibraciones. Por un lado, irradia una mezcla de intensa pasión y pulsión sexual que las personas a su alrededor pueden percibir fácilmente. Cuando este personaje entra en un lugar y se nos acerca, los demás somos capaces de percibir una ola de energía que nos golpea y —según la intensidad— nos puede dejar aturdidos. La vibración del número 15 activa nuestro cerebro reptiliano, esa parte primitiva del ser humano desde la cual se emiten descargas eléctricas hacia todas las células del organismo a través del sistema nervioso central, despertando instintos que creíamos dormidos. La energía que desprende esta personalidad es casi palpable y estimula nuestras pulsiones más biológicas, a menudo de naturaleza sexual.',
            'Hay dos palabras claves para describir a esta vibración: una es intensidad y, la otra, pasión.',
            'El arcano del Tarot asociado, El Diablo, nos cuenta la historia de un aparente demonio que, en realidad, no es un ser infernal en un sentido judeocristiano, sino que representa la parte más carnal y primitiva de nuestro ser, vinculada a nuestros deseos, pulsiones y necesidades más profundas. El ángel de la Templanza, distribuidor de calma y de tranquilidad a través de sus aguas, se ha convertido en un diablillo que incendia y aviva nuestros fuegos interiores, estimulando nuestras partes más carnales y terrenales.',
            'La energía del número 15 despierta al animal que duerme dentro de nosotros y nos conecta con nuestros instintos puramente biológicos. Las energías con las cuales se comunica son la sensualidad, la energía sexual y la pasión. En armonía, este arquetipo maneja estas energías a través de la expresión de sus intensas pasiones o de una intensa y necesaria vida sexual. Esta personalidad es como una central nuclear de energía inagotable, un fuego que nunca se apaga, pero que es necesario descargar y canalizar para que no reviente todo el sistema. Esta enorme bola de energía que se encuentra dentro del arquetipo 15 está en perfecta resonancia con el núcleo central de la Tierra, un lugar donde se origina el campo magnético del planeta.',
            'La forma más natural para que esta energía se descargue es a través de una vida sexual activa y pasional. Con un 15 tenemos personas que, consciente o inconscientemente, mueven el campo de la energía sexual que hay en el ambiente: ahí nos damos cuenta por qué, de repente, pareciera que el aire se llenara de feromonas.',
            'A veces, resulta muy divertido observar cómo una persona con este arquetipo en su esquema, sin darse cuenta, entra en una habitación y agita las energías sexuales del ambiente como si estuviera en un recinto de pavos reales o en un gallinero. El lenguaje no verbal de las reacciones instintivas de los presentes es, sin duda, todo un espectáculo.',
            'Me viene en mente una chica que conocí hace unos años, que tenía en su Mapa natal tres 15, aunque yo, en aquel entonces, no conocía aún la numerología de los arquetipos. Cada vez que nos juntábamos en nuestro grupo de amigos, podía ver cómo a todos los hombres nos tocaba justo esa fibra. Es como si tuviera un imán que nos obligaba a prestarle atención solo a ella. Incluso, otras mujeres del grupo podían percibir esa tensión sexual en el aire, y hasta dos chicos gay de la pandilla empezaron a dudar de sí mismos. Esto es lo que a veces ocurre con un 15 en un Mapa. Esa chica, en este caso concreto, llevaba bien tres, o sea, podía haber hecho dudar fácilmente a cualquier hombre homosexual en el radio de 3 kilómetros.',
            'Las personalidades que tienen esta habilidad, muchas veces, no se dan cuenta de lo que son capaces de hacer simplemente con su vibración. Su reto es aprender a conectar profundamente con esta energía creativa y creadora, para poder canalizarla y plasmarla en el mundo físico desde la consciencia y el amor. La energía sexual no es ni buena ni mala, solo es energía: lo más importante es la intención que lleva consigo. De la misma manera que la energía de una central nuclear no es ni buena ni mala, pero puede ser aplicada para crear bombas, o con fines más nobles para la humanidad y el planeta.',
            'Si el ángel del arquetipo anterior nos daba calma y tranquilidad, este diablo hace justo todo lo contrario, despertando en nosotros la vida, la creatividad y la pasionalidad, haciendo que nuestra sangre circule más rápidamente. Con un 15 cerca, es imposible quedarse quietos y tranquilos. Esto ocurre porque la esencia del arquetipo de su reducción, el 6 (1+5), ha subido de nivel. Un 15 eleva la satisfacción del placer inocente del número 6 a un nivel superior y carnal, convirtiendo a esta personalidad en un gran amante dentro y fuera de la cama, pero rozando el libertinaje desenfrenado en casos de exceso. El 1 y el 5 reflejan el liderazgo (1) de los espacios (5), y nos hablan de ese 15 que entra en un lugar, cambiando toda la energía del espacio y de las personas que allí se encuentran, captando toda la atención para sí mismo. En el 15, la inquietud de los niños se vuelve mayor, y el poder de seducción del 6 ha madurado hacia una seducción pasional y carnal.',
            'Cuando la energía nuclear de este arquetipo no se canaliza a través de la energía sexual, a menudo encuentra otra manera de salir hacia fuera mediante la actividad física intensa o actividades de riesgo que liberen adrenalina, dopamina y endorfinas. La palabra clave siempre será "intensidad". El deporte extremo o de riesgo hace que esta energía se libere en el ambiente y el sistema psicoemocional de la persona pueda mantenerse en armonía. Actividades como CrossFit, spinning, escalada, culturismo, triatlón, paracaidismo y similares, suelen ser bastante comunes para esta vibración.',
            'Para un 15, es fundamental expresar su energía pasional, ya sea física, intelectual o emocionalmente; de lo contrario, la armonía no durará mucho. Sin pasión, no hay trato. Es de extrema importancia que un 15 conecte con sus pasiones y que, en el área de su vida donde aparece, pueda manifestarse libremente ese entusiasmo, ese placer y esa intensidad.',
            'Personal y profesionalmente, pueden sentirse atraídos por disciplinas que se relacionen con este tipo de vibración, o bien, evoquen la energía sexual o primitiva. El mundo de la música está lleno de este arquetipo: ritmos tribales, danza del vientre, flamenco, tango, tambores chamánicos, solo por nombrar algunos ejemplos. Además, en el ámbito de sus intereses y habilidades, pueden llegar a practicar Tantra, Kamasutra y Yoga Kundalini, como las ya mencionadas actividades físicas o deportivas de intensidad.',
            'Asimismo, ha aprendido del arquetipo 14 a tocar realidades que van más allá de este mundo. El transmigrador de almas se convierte, aquí, en el mitológico Caronte, barquero del inframundo, con cualidades de psicopompo también, aunque de naturaleza más chamánica. Las energías y las entidades que se mueven en el inframundo, tienen una vibración bastante diferente de las energías del mundo astral de la Templanza. Aquí no hay ángeles, sino entidades de una naturaleza más intensa — unos demonios simbólicos — que solo un Diablo-Chamán, tiene la capacidad de gestionar.',
            'Los nacidos bajo la vibración de este arquetipo suelen ser personas activas, energéticas, vibrantes y en constante movimiento. Tienen muchas inquietudes y pasiones y su energía es contagiosa. Según el Pilar donde se encuentre este número, sus necesidades serán plasmadas en esas áreas concretas de la vida.',
            'Un 15 en el Pilar de la intimidad, ya podemos intuir qué es lo que querrá compartir, dar y recibir dentro de la pareja. Un 15 en el Pilar vocacional, tendrá que entregarse a su labor con entusiasmo, conectar con sus pasiones o dedicarse a actividades deportivas o relacionadas con la sexualidad, el Tantra, etc.'

        sombra: [
            'Si este arquetipo no manifestase las cualidades descritas anteriormente, es muy probable que exista una profunda castración parental o un trauma no sanado. En su Sombra, puede caer en la total apatía y en la falta de energía. En su complemento contrario, tendrá demasiada energía o será incapaz de controlarla, reaccionando con descargas excesivas de tipo sexual o físico, manifestando rasgos brutales y violentos (contra los demás o sí mismo), excesos de posesividad y celos, o bien dificultades en la gestión de la ira.',
            'Simbólicamente, las aventuras del apasionado Casanova, se pueden convertir en las travesuras del Marqués de Sade, crear adicción al sexo o, al contario, generar bloqueos o disfunciones en el sistema genital o reproductivo.',
            'En el 15, esa energía nuclear de la que hablamos anteriormente, puede hacerse inestable y crear personalidades explosivas, incapaces de canalizarla de una manera constructiva o creativa.',
            'Sus resistencias y dolores pueden asociarse, también, al consumo de sustancias estimulantes debido a la falta de estímulos, y también podría tener dificultades para desarrollar, o conectar, con sus talentos e intereses, o sentirse desconectado de los placeres en general.',
            'La falta de pasión, etimológicamente, tiene un significado de falta de pathos, o sea, de emociones, sentimientos y estímulos. Esto es lo que puede ocurrir con un 15 en la Sombra.',
            'En algunos casos, podrían surgir también problemas con temas de dinero. Como hemos observado en el análisis de otros arquetipos, la sexualidad y el dinero son dos energías que se acompañan mutuamente a nivel inconsciente. Por lo tanto, cuando este arquetipo se encuentra en equilibrio, tiene cierta maestría en gestionar ambos elementos, pero en su defecto, pueden aparecer desarmonías en estos dos aspectos de la vida.',
            'El primer paso para sanar una herida y resolver traumas es reabrir ese canal de descarga y canalización. Si estuviera cerrado por una prohibición inconsciente o por algún tipo de bloqueo, lo más importante es conectar con el arquetipo a través de alguna de sus manifestaciones: sexo de calidad, deporte intenso, danza tribal, yoga kundalini, sea lo que fuera, hay que activar y recuperar esa energía y volver a equilibrar los excesos.',
            'Uno de sus desafíos es localizar y cambiar las creencias limitantes heredadas por sus ancestros o por su propio karma personal en relación con la vida sexual, la creatividad y la libertad de crear, incluso biológicamente. Sus dos recursos principales son, una vez más, la investigación y comprensión de su árbol genealógico y, eventualmente, la hipnosis. Se le recomienda volver a conectar con sus antiguas pasiones, cualesquiera que fueran, y despertar el sentido del placer en caso de ausencia o bloqueo.',
            'Sus síntomas físicos se manifiestan, principalmente en el aparato reproductor y sexual y, por consiguiente, en el segundo chakra, relacionado con el aspecto creador y creativo del ser humano.'

    16: {
        nombre: 'La Torre',
        hebreo: 'Ayin',
        imagen: 'Cartas Tarot/16.png',
        positivas: ["Objetivos", "Metas", "Riesgos", "Desafíos", "Premios", "Medallas", "Perfeccionismo", "Matemáticas", "Arquitectura", "Ingeniería", "Construcciones", "Edificios", "Autoexigente", "Estímulos", "Propósitos"],
        negativas: ["Obsesión", "Conspiración", "Paranoia", "Destrucción", "Crisis", "Catastrofismo", "Orgullo", "Obstinación", "Megalomanía", "Ludopatía", "Inquietud", "Tocs", "Castillos en el aire", "Colapso", "Caída de los sistemas"],
        descripcion: [
            'La energía que el número 15 acumula en su interior es canalizada, de manera más ordenada y consciente, en el arquetipo 16. Esta personalidad necesita tener las ideas claras para dirigir su fuerza hacia un objetivo concreto. El 16, solo está en equilibrio cuando tiene un propósito bien definido. Mientras tenga una brújula apuntando hacia el norte, estará bien. Por consiguiente, dependiendo de su nivel de conciencia, este arquetipo necesita moverse en base a objetivos y desafíos constantes desde temprana edad. Si las cosas son fáciles o regaladas, no hay juego ni satisfacción, por lo que siempre tenderá a estar ocupado.',
            'Al igual que el arquetipo 7 (1+6), estamos ante una vibración de acción continua, por lo que no es aconsejable que se quede quieto por mucho tiempo. Su percepción es que, si no produce, no logra o no hace, está perdiendo el tiempo y puede frustrarse y desequilibrarse. En el ámbito deportivo, podríamos ver a este arquetipo en un atleta que busca superarse constantemente, siempre yendo más allá de sus logros, una vez alcanzados. En un gimnasio, no seguirá rutinas de mantenimiento monótonas, sino que preferirá circuitos con objetivos concretos (perder grasa, ganar masa, definir, aumentar la flexibilidad, etc.) o necesitará competitividad con alguien. En todo caso, una vez conseguido un objetivo, otro surgirá pronto sin ni siquiera tener el tiempo de celebrar el logro recién alcanzado.',
            'Esta dinámica nos recuerda al arquetipo 7, pero mientras este busca solucionar problemas, el 16 ve los contratiempos como desafíos. Por lo tanto, siempre estará desarrollando alguna actividad física o intelectual, adaptándose a los números de los Pilares a su alrededor. Si, por ejemplo, el 16 se expresa junto a un 9, sus objetivos estarán relacionados con la naturaleza, los idiomas, los experimentos o los sentidos. Si se asocia con un 4, sus objetivos podrían incluir construir una casa desde sus cimientos, crear una estructura o establecer normas.',
            'En el ámbito académico, estudiará con el fin de pasar exámenes, obtener un título, o adquirir conocimientos para un trabajo o proyecto. Estudiar por puro placer, como el arquetipo 3, no le motiva mucho. En el caso de los niños, es recomendable ofrecerles un estímulo o premio para que estudien y para que cumplan, por ejemplo, las normas de la casa, haciéndoles sentir que lo que hacen tiene un propósito mayor.',
            'En relaciones amorosas, el 16 necesita metas en común con su pareja, como, por ejemplo, casarse, tener hijos o ir a vivir en una caravana y dar la vuelta al mundo. Si no hay objetivos compartidos, la relación durará poco o se desequilibrará. También puede ser importante, en una relación, tener actividades juntos, algún tipo de tarea y desafío compartido: apuntarse a una carrera, a un curso de idiomas o algo así. Estamos en el arquetipo de la competición.',
            'Como decimos, este arquetipo es muy competitivo, muy exigente y perfeccionista. En un nivel profundo, refleja la proporción áurea (1,618…), también asociada al código Fibonacci, base de muchas obras de arte y construcciones por su perfección y belleza matemática.',
            'En la baraja del Tarot, el arcano asociado es uno de los más enigmáticos. La Torre es una libre traducción e interpretación del titular francés La Maison Dieu (literalmente, "La Casa Dios"), y su diseño representa una torre cuya "corona", en la cima está abierta por el golpe de un rayo, o desde el cual sale un rayo, dependiendo de la lectura. Esto, por un lado, representa la tendencia humana a construir "torres en el aire", sin bases sólidas y destinadas a derrumbarse. Por lo tanto, esa atalaya puede representar los castillos en el aire que nos montamos, la altivez de nuestro ego, la estructura de creencias basadas en el miedo y destinadas a un hundimiento. Por otro lado, nos recuerda también el objetivo último y más importante del ser humano: volver a unirnos con Dios, la casa de la cual venimos. En este sentido, el único hogar que necesita construir, tiene sus cimientos en el cielo, no en la tierra. En este último caso, el hombre que se acerca a Dios es el que, sin llegar nunca a ser perfecto en este plano físico, tiende sí a la perfección y a la iluminación, el objetivo máximo del ser humano.',
            'El simbolismo de la torre lo encontramos también en muchos cuentos folclóricos que se han transmitido de una generación a otra. El héroe protagonista suele tener que superar varias pruebas para poder finalmente subir a la torre y liberar a la princesa o doncella prisionera. Todos aquellos obstáculos que se encuentra por el camino (los enemigos, los monstruos o los dragones que le dificultan su propósito), representan simbólicamente esa fuerza necesaria para poder finalmente merecer el premio final: el amor de la princesa. Sin ese esfuerzo no hay merecimiento, no hay valor y no existe la posibilidad de conseguir el amor más elevado que se encuentra en la cumbre de la torre: el amor divino.',
            'El arquetipo 16 es un escalador que, con paciencia y disciplina, alcanza la cima de una montaña y disfruta de una vista asombrosa. Su valor será proporcional al esfuerzo invertido. No es lo mismo llegar a Santiago de Compostela tras un largo camino, que en una hora de avión o de coche. Esta personalidad se exige mucho a sí misma, buscando superarse constantemente. Es tozuda y detallista, con habilidades para trabajos de precisión. Para un 16, nada es imposible y siempre buscará alcanzar sus metas en el plano físico, emocional, intelectual o espiritual.',
            'Atraído por la construcción, la ingeniería, la arquitectura o la geometría, el 16 es un doble 8, y este último, un doble 4, simbolizando la evolución de una casa a un gran inmueble y, finalmente, a un conjunto de edificios: las torres.',
            'Por todas estas razones, esta personalidad puede tener pasión y gran capacidad por las matemáticas, los números, la economía y los juegos de azar. Sin embargo, debe tener cuidado, ya que las torres que construye pueden derrumbarse, generando grandes pérdidas.'
        ],
        sombra: [
            'Como podemos imaginar, la ausencia de objetivos o la falta de recursos para conseguirlos, puede ser muy perjudicial para este arquetipo. Si existiera un bloqueo emocional, sería crucial identificar el momento clave en el que se perdió la dirección o no se logró un objetivo: un proyecto fallido, un examen no aprobado, una medalla no ganada.',
            'Quizás haya sufrido un conflicto de dirección, generando el síndrome de la oveja perdida. Cuando nos sentimos perdidos, el inconsciente biológico actúa para evitar que nos desviemos aún más. Los síntomas típicos de este síndrome incluyen fatiga, apatía, pérdida de energía o desorientación. Para nuestro inconsciente, en la naturaleza, perderse equivale a morir, por lo que la solución más rápida es quedarse quieto donde estamos, esperando que nuestro rebaño simbólico nos encuentre y así salvar nuestra vida. Por esta razón, un arquetipo 16 sin rumbo ni objetivos puede tener serios problemas. Es esencial aprender a procesar los desafíos de la vida, convirtiendo los fracasos en lecciones y aprendizajes. Debe retroceder, identificar el momento en que tomó una decisión basada en el miedo o en la culpa, y permitirse ser auténtico.',
            'Un 16, más que otros individuos, necesita tener una razón para levantarse cada día. Si no hay un objetivo, si no hay nada que hacer, la vida no tiene ningún sentido.',
            'En la Sombra y el dolor, estas personalidades, además de apáticas, pueden volverse ludópatas. Si en el arquetipo 6 el tema principal es jugar por jugar, aquí se trata de jugar para ganar. La ludopatía es esa expresión de la Sombra que tiene que ver con las apuestas. Estas, para el inconsciente, son una meta, y obsesionarse con ganar algo puede convertirse en una adicción, porque ganar significará lograr y alcanzar una aspiración.',
            'El arcano de La Torre, nos cuenta historias de arquitectura e ingeniería pero, desde la Sombra, estas construcciones del ego, pueden ser, como veremos, edificios reales o simbólicos de nuestras máscaras.',
            'La megalomanía y el delirio de grandeza harán que el ego del 16 se crea más grande de lo que es. Esta característica deriva de la construcción de la torre interior: cuanto más alto y grande, más importancia tendrá. Este arquetipo lo encontramos en la construcción de las ciudades y de sus edificios. Erigir obeliscos y rascacielos simboliza la grandeza de una civilización y la capacidad de alcanzar a Dios en el cielo. Hoy en día, muchos países aún se empeñan en construir el edificio más alto del mundo para demostrar inconscientemente su superioridad, en lugar de invertir en mejorar ciertos aspectos más importantes de su sociedad. La construcción de las catedrales llevaba el sello de este arquetipo: el poder religioso, en este caso, tenía que demostrar su superioridad. Una catedral era el símbolo de riqueza y poder de una ciudad y su altura y belleza, simbolizan su cercanía con Dios.',
            'El obelisco y el rascacielos, en un sentido más profundo, representan también el símbolo fálico y su grandeza, fuerza y virilidad, se convierten, en la Sombra, en prepotencia, arrogancia y megalomanía.',
            'En el mecanismo de supervivencia, un 16 puede ser un gran catastrofista. Su máscara reflejará y alimentará sus profundas paranoias y miedos a la conspiración, retroalimentándose con imágenes apocalípticas y destructivas de lo que podría ocurrir o que ya está ocurriendo. Todos los temas que se conectan con estas vibraciones —independientemente de su veracidad— se conectan con la Sombra del 16.',
            'En el Pilar de Resistencia o en los Pilares de Dolor, se genera una personalidad que vive en el miedo constante de que algo terrible esté pasando o vaya a pasar. Es el miedo a que la torre se venga abajo, que el castillo en el aire que he formado se caiga, que el sistema social, económico y político se derrumbe y que el mundo de pronto se termine. Algunos de los significados profundos del arcano de La Torre, de hecho, tienen que ver con destrucción, caída de estructuras, crisis y fin de una época.',
            'El 16 en la Máscara puede estar asociado a patologías cerebrales, trastornos obsesivos-compulsivos, adicción al trabajo o sobrecarga de responsabilidad. Uno de los aspectos más duros que puede aparecer es, además, la obsesión: cuando se obceca con algo, puede generar y generarse un gran estrés. La magia negra, el vudú y el mal de ojo, en su universo, serán muy reales. Su única opción de salvación es recordar su poder divino: no es víctima de los eventos y nadie puede hacerle daño. Su gran dificultad es comprender que su peor enemigo es uno mismo. A estas alturas, ya hemos aprendido que el otro no existe, y que solo nos relacionamos con nosotros mismos. Al retomar el poder y asumir el rol de protagonista en nuestra vida, el amor comienza a iluminar la Sombra, desmaterializando monstruos e ilusiones.',
            'El 16, es el despertar del sueño y la iluminación, es nuestra torre de luz que alcanza a la Consciencia Divina, nuestro objetivo final. El más pequeño sentimiento de amor convierte en humo el miedo más grande.',
            'Solo hay una pregunta a la que responder:',
            '¿Hoy, quiero vibrar desde el amor o desde el miedo?',
            'En el mecanismo de supervivencia, la Torre del arcano es destruida por el relámpago divino, recordándonos el destino de la Torre de Babel y la destrucción de Sodoma y Gomorra. Percibimos cómo la estructura de nuestro ego se derrumba una y otra vez, dejándonos con sensación de impotencia. El aprendizaje consiste en comprender que la única estructura indestructible es la casa de Dios (La Maison Dieu). Nuestro objetivo es construir una casa eterna y divina en el cielo, recordando quiénes somos, y que las torres de ladrillos aquí en la Tierra, están destinadas a derrumbarse y a desaparecer.',
            'Energéticamente, sus chakras más sensibles suelen ser el tercero y el sexto.'
        ],
        astrologia: [
            'La esencia del arquetipo número 16 nos recuerda el trabajo incansable, pero constante y diligente del signo de Capricornio y de su regente Saturno. Nos conecta con un gran constructor y trabajador, una personalidad leal, práctica y responsable que está dispuesta siempre a persistir para lograr sus metas, por muy duro que sea.'
        ],
        hebrea: [
            'La letra hebrea AYIN es un recordatorio para que aprendamos a unificar e integrar la realidad que observamos. El trato de esta letra nos recuerda la estructura del nervio óptico: dos ojos separados reciben la información visual desde el exterior, pero unifican en el interior del cerebro la imagen observada. Meditando con Ayin volvemos a recordar que, en la realidad que observamos, la separación es aparente y que solo existe la unión. Nuestro objetivo es el de unificar nuestros fragmentos perdidos en el espacio-tiempo, reconstruyendo nuestra alma y recordando que somos todos parte de un único espíritu y un solo único cuerpo.'
        ]
    },
    17: {
        nombre: 'La Estrella',
        hebreo: 'Peh',
        imagen: 'Cartas Tarot/17.png',
        positivas: ["Piel", "Contacto", "Amigos", "Simpatía", "Atracción", "Confianza", "Abrazo", "Caricia", "Masajes", "Memoria epidérmica", "Pertenencia", "Manada", "Clan", "Familia simbólica", "Estrellas"],
        negativas: ["Separación", "Abuso", "Falta de contacto", "Ausencia de amigos", "Problemas en la piel", "Hipersensibilidad", "Exilio", "Destierro", "Falta de tacto", "Desconexión de la realidad", "Gemelo solitario", "Problemas familiares", "Separaciones familiares", "Alienígenas", "Exhibicionismo"],
        descripcion: [
            'En el arcano número 17 —La Estrella— observamos por la primera vez la figura humana entera de un personaje femenino completamente desnudo, que arroja el agua desde dos jarrones hacia un río mientras, encima de ella, una brillante y gran estrella es rodeada por otras siete más pequeñas. Esto nos sugiere su conexión con los subarquetipos que lo conforman y de los cuales ha heredado (y transmutado) ciertas cualidades: el 1, el 7 y el 8.',
            'Lo que nos llama la atención en este arquetipo, más que la estrella en la parte superior de la imagen, que da el nombre al arcano, es la serena desnudez de la figura humana que es diseñada en su totalidad. Por primera vez desde el Mago, la figura central del dibujo, se encuentra tal y como vino al mundo, desnuda. Se ha despojado de sus trajes, de sus telas y de las imágenes mentales a ellos asociadas. En esta lámina, la piel es la protagonista absoluta y, entre todos los arquetipos es, sin duda, el más epidérmico.',
            'Esta vez, hablamos de una personalidad que no tiene tabúes, pudor o vergüenza de su cuerpo, por lo menos cuando está en armonía. Ama y se expresa a través del contacto físico, de las caricias y de los abrazos. Su forma de comunicarse es mediante el tacto, su sentido más desarrollado, sin duda, en comparación con los demás. La piel se vuelve su mayor recurso. Su desnudez representa su sinceridad, su total transparencia y también la búsqueda y revelación de la Verdad.',
            'En esencia, el 8, que surge de la suma de los dígitos del 17 y también representa la totalidad de las estrellas del arcano asociado, eclosiona y se expande. Donde uno cierra y delimita su territorio personal, el otro se abre para compartirlo en una polaridad opuesta. El 17 no marca ni delimita; ama compartir y da la bienvenida a lo nuevo con una sonrisa y los brazos abiertos, todo lo contrario que nuestro amigo el 8. Para un 17, los desconocidos están ahí para ser conocidos, tocados y abrazados, y su círculo social es amplio, jugando un papel esencial en su armonía y bienestar. Esto nos lleva a la observación de la gran estrella rodeada de estrellas más pequeñas, que simbolizan la familia estelar, el clúster de pertenencia. Su brillo es cálido y atrae más luces en su camino, iluminando sus noches oscuras. Por lo tanto, para esta personalidad, sus amigos y contactos son como esas luces, esenciales y sagradas, llegando a representar una familia aún más importante que la de sangre.',
            'Para aquellos que tengan un 17 en su Mapa, especialmente en la adolescencia, los amigos pueden tener un papel mucho más relevante que el de sus propios padres. De hecho, la amistad es el valor que más resalta en este personaje, y su tacto se convierte en contacto que, a su vez, se transforma en una red de vínculos y amistades extremadamente amplia y activa.',
            'Además, este ser es un gran soñador, soliendo tener una profunda sensibilidad y una dulzura que encantan a primera vista; de hecho, es inusual que esta personalidad no caiga bien "a primera vista" o "a piel", describiendo casi siempre un carácter sociable y simpático. La forma en la que esta figura se arrodilla en el Tarot, nos habla de una personalidad flexible, elástica y acomodable, que se adapta con gusto delante de los demás. Igual que el signo astrológico de Libra, desea que todos a su alrededor estén bien y en armonía, proyectando el sentimiento de justicia y equilibrio del 8 en las necesidades de los demás, de las cuales suele estar pendiente todo el tiempo. Asimismo, ama la belleza, tiene un gran sentido estético y es conocido por ser una personalidad siempre positiva, optimista y también un gran soñador.',
            'La búsqueda de su "familia" y el sentimiento de pertenencia a su "manada" serán elementos importantísimos a lo largo de su vida. Llegar a satisfacer su sentimiento de integración en un grupo, es uno de los trabajos personales de este arquetipo. La estrella central del arcano está rodeada de otras estrellas para indicar ese grupo de pertenencia. Un 17 sin amigos, puede sufrir mucho.',
            'El tema del propósito, ya muy importante para su predecesor —el 16— en este arquetipo, se vuelve aún más existencial. Un 17 necesita, más que otros, conocer y comprender a fondo su propósito de vida, la razón de su existencia. En su interior, este arquetipo sabe que nació en la Tierra, pero que no es de la Tierra. Esta semilla estelar ha caído en este planeta para un trabajo concreto, y tendrá que descubrir poco a poco cómo realizarlo. Al fin y al cabo, todos hemos venido a este mundo con el objetivo de unificar el Cielo con la Tierra, y la Tierra con el Cielo. Un 17, en su estado de consciencia más amplio, lo sabe, pero puede tener dificultad para concretar este propósito.',
            'Las estrellas de este arcano le recuerdan el lugar del cual proviene y, a menudo, gracias a su pasión por la Astronomía o la Astrología, puede ir en búsqueda de sus orígenes ahí arriba. Así como el 8 buscaba el significado de su existencia en las raíces profundas de su árbol genealógico, el 17 va recorriendo unas raíces que, en lugar de ir hacia abajo, suben hacia el cielo, hacia la "Casa Dios" que el arcano de la Torre le indicó.',
            'En varias ocasiones me encontré con personas, con algún 17 en su Mapa, que recordaban su vida en otro planeta o —mejor dicho— en otra estrella. Curiosamente, el sentimiento de pertenencia no estaba vinculado a un planeta como Marte o Júpiter, sino a estrellas como Sirio, Arcturus o las Pléyades, entre otras. Por lo visto, según las fuentes akáshicas y las memorias heredadas, todos los rincones del Universo pueden ser habitados y convertirse en "nuestro hogar". Estos recuerdos, evidentemente, no son demostrables ni medibles y, desde luego, no están basados en experiencias que la ciencia pueda comprobar y confirmar, todavía. Lo que importa es el sentimiento que hace real la experiencia para estas personas. Al fin y al cabo, ya hemos dicho y aprendido que la realidad que observamos, no tiene nada de "real": todo es pura percepción subjetiva.',
            'Este 17 descubrirá, además, la importancia de los encuentros en su camino. Cada amigo será para él un maestro y una bendición (o una maldición en algunos casos). Sin duda, sus amistades no pasarán desapercibidas, llegando a marcar puntos de no retorno para su propio aprendizaje y crecimiento a lo largo de toda su vida. Algunos encuentros marcarán para siempre su personalidad porque este arquetipo evoluciona gracias a los amigos y a los encuentros.',
            'En las profesiones, se puede expresar con oficios relacionados con la piel (masajes, tatuajes, cosmética, dermatología…), o con la "segunda" piel (costura, sastrería, telas y tejidos). Además, con un 17 puede haber un deseo de trabajar o colaborar con sus amigos o una necesidad de que sus compañeros de trabajo se conviertan en amigos. Igual que para el arquetipo 9, es muy importante el sentimiento de compañerismo y hermandad. Los compañeros y colaboradores se convierten fácilmente en una familia simbólica para él, y proyectará en ese grupo, todas las dinámicas inconscientes no resueltas en su familia de origen. Quizás, sea gracias a sus amigos y contactos que su negocio o profesión se expanda y crezca, así pues, será preciso mantener una vida social sana y activa para que esta área de la vida esté siempre en equilibrio.',
            'En la vida amorosa, esta personalidad manifestará su cariño y afecto a través del contacto físico, de los besos y de los abrazos. Los preliminares serán una parte fundamental en la intimidad, mientras los masajes podrían estimular, o activar, las memorias grabadas en la piel o liberar emociones bloqueadas desde hace tiempo. En su dermis están grabadas innumerables memorias y es por eso que, tocarle, puede provocar diferentes reacciones y despertarles emociones e imágenes guardadas en su inconsciente. Cuanto más equilibrado esté el arquetipo, más suaves y placenteros serán los contactos físicos. Es como si este arquetipo canalizara información a través de su piel.',
            'Asimismo, una pareja potencial podría surgir de su entorno social o estar conectada a la vida social del otro. Desde luego, compartir una amistad profunda con el otro, o compartir amistades mutuas podría revelarse como la mejor cura para que la relación funcione. Sin duda, su pareja será también su mejor amigo o amiga.',
            'Por todas estas razones, intuimos que, para esta personalidad, es imprescindible el contacto humano, la cercanía, la tranquilidad, el respeto y el compañerismo. Si alguno de estos componentes faltara, podría haber algún problema.'
        ],
        sombra: [
            'En el caso de este número, casi todos sus dolores y recursos se encuentran, desde luego, en el ámbito de la piel y de las relaciones con sus amigos. Por un lado, evitará el contacto físico, huirá de las caricias y de los abrazos y, en general, de todas las muestras físicas de afecto. Por otro lado, se alejará de sus contactos y de sus amigos, se aislará a causa de su 1, levantará las barreras defensivas que el 8 le ha enseñado a construir y se dirá, a sí mismo, que no necesita a nadie, igual que el 7, para estar bien.',
            'En la Máscara, su desnudez lo hace vulnerable, indefenso, frágil, y puede convertirse en una persona insegura y con muchos miedos que le impedirán salir de su zona de confort y crecer.',
            'Asimismo, nos habla del contacto real y simbólico con la tierra. Si te fijas en la imagen del arcano, la figura de esta mujer se encuentra arrodillada en el suelo, sus pies descalzos y su rodilla desnuda tocan la tierra, pero la punta de su cabeza roza las estrellas. Esto nos recuerda la importancia de su propósito en la Tierra, el cual, si no es encontrado, puede generar un grandísimo dolor. Vivir una vida sin sentido le conectará con una nostalgia tan profunda y un sentimiento de añoranza hacia su "casa" fuera de este mundo, hacia un hogar que percibe, que apenas recuerda, y que no está aquí. La melancolía, la pena y la depresión pueden aparecer en la vida de un 17, desconectándolo por completo de la realidad.',
            'Cuando este arquetipo no está en armonía, habrá mucho sufrimiento en las separaciones, que pueden convertirse en verdaderos traumas. Por un lado, su piel somatiza el conflicto emocional relacionado con la falta de contacto con la persona amada; por otro lado, un contacto no deseado o impuesto, como un abuso físico o sexual, puede activar de inmediato el mecanismo de defensa de esta persona: una caricia mal recibida puede ser vivida como un puñetazo en plena cara, una agresión o un ataque a la integridad. Del mismo modo, puede sufrir por un exceso de contacto real o simbólico en el caso de que se obligue (o le obliguen) a mantener un contacto social que no le agrada. Su piel recuerda traumas que solo su inconsciente guarda: por esta razón, se activarán mecanismos de defensa para que nadie, nunca más, le toque, y convertirá su piel en su coraza y armadura. En caso contrario, su epidermis se hará más fina, más sensible y se abrirá para conseguir "tocar más" a esa persona tan distante.',
            'En muchas ocasiones, si observamos la superficie de un cuerpo, descubrimos una historia detrás de la historia, puesto que para aquellos ojos que saben mirar, puede convertirse en un universo entero lleno de colores, cicatrices, lunares, manchas y tatuajes cargados de significados y memorias. La epidermis de un ser humano es, literalmente, un "mapa del tesoro": solo hay que aprender a leerlo e interpretar su código.',
            'Por todas estas razones, sus patologías físicas más comunes, se concentran en el ámbito de la epidermis, a menudo muy sensible: dermatitis, eccemas, erupciones, granos y demás.',
            'Sus trastornos del comportamiento podrán esconder, fácilmente, historias de separaciones dolorosas, contactos impuestos, abusos físicos, falta de tacto o de sensibilidad. Del mismo modo, puede atraer patrones repetitivos en sus historias sentimentales y enamorarse de personas no disponibles geográfica o emocionalmente. Es muy común que un 17 haya heredado programas de abandono, de separación y de abuso, que se somatizarán, posiblemente, en la superficie cutánea. El autolesionismo puede ser una de las expresiones de este arquetipo cuando vive en el dolor, especialmente si se trata de generar heridas o quemaduras en la piel. Desde la lógica del trastorno, abrirse la piel, sirve para intentar "sentir más", a causa del dolor de una separación inconsciente o de una memoria heredada. El objetivo del mecanismo de defensa es "encontrar ese contacto perdido". El síndrome del gemelo perdido, a menudo, puede generar este tipo de dolor y de autolesión. Por lo tanto, te invito a investigar este tema, si fuera el caso.',
            'Asimismo, no poder encontrar ese propósito relacionado con su viaje, aquí en la Tierra, le llevará a buscar, inconscientemente, su propio, espacio en este mundo, de un lugar a otro, ese territorio que no pudo marcar y hacer suyo. Este dolor podría crear continuas mudanzas de un sitio a otro, falta de compromiso en las relaciones o cambios cíclicos de trabajos y de amigos, por esa búsqueda inconsciente de su "hogar" simbólico y de ese sentimiento de pertenencia que tanto le cuesta encontrar y satisfacer. Su dolor podría llevarle a buscar continuamente a su manada, a su clúster, a su familia estelar aquí en la Tierra.',
            'La única manera de salvarse de este dolor es no caer en la trampa del ego, creyendo en la separación. Con el tiempo, este melancólico 17 tendrá que aprender que las estrellas que parecen separadas, son todas parte de una única constelación. Gracias a ese dolor, quizás, recuerde su origen celestial y podrá creer por esto que no pertenece a este mundo. Y así es: ni él ni nadie pertenecemos aquí. No somos dueños de este mundo, ni este mundo es dueño de nosotros, pero llegaremos pronto a comprender, como nos enseña el Evangelio, que:',
            'No somos del mundo, pero estamos en el mundo, y eso está bien. Sin embargo, a un 17 le dolerá el desarraigo, el destierro, el exilio y buscará en el cielo estrellado su casa, más que en la Tierra, añorando a su familia de allí, más que a la de aquí.',
            'Todo esto ocurre porque, estas personalidades, suelen nacer en familias a las cuales no sienten pertenecer. Las memorias transgeneracionales heredadas que han venido a sanar tienen que ver con ancestros que han sufrido cierta marginación, han sido olvidados por alguna razón o han sido exiliados y relegados en el inconsciente familiar. Su trabajo será encontrarlos y darles, a cada uno, su correspondiente y legítimo lugar, dentro de la familia. Se trata de un trabajo profundo que es muy importante que se haga con la ayuda de un buen terapeuta. Las constelaciones familiares son una excelente herramienta de sanación para estas personas, aunque hoy en día hay muchas opciones que pueden ayudar a sanar y liberar estas memorias, para que dejen de influenciar negativamente nuestras vidas.',
            'Sus dolores, muy a menudo, se llaman desorientación y separación y, cuando hay desequilibrio, son los primeros aspectos que aparecen. Del número 1 hereda el aislamiento y la soledad, porque en la Sombra, acercarse a su piel (que es más que su corazón) puede hacerle sufrir; mientras que, del número 7, como anticipamos anteriormente, hereda la mentira de no necesitar a nadie, que "él puede solo", que "estando solo, dolerá menos".',
            'Su desnudez, en la Sombra, se puede convertir en exhibicionismo, en exposición peligrosa, indefensión o fragilidad. En caso de una herida no sanada, su sexualidad puede ser completamente ausente, ya que implica "tocar". El exceso de ropa y vestimenta puede ser una manera de esconderse, y defenderse, de algún peligro simbólico.',
            'En casos extremos, y también dependiendo de cierta disposición dentro del Mapa, un 17 puede llegar a tener experiencias negativas y traumáticas con "seres de las estrellas", alienígenas o entidades de otros mundos lejanos. Una vez más, quiero hacer hincapié en la experiencia emocional de la personalidad, más que en el fenómeno en sí, cuya demostrabilidad es totalmente irrelevante.',
            'Sus recursos se esconden allí justo donde sus problemas nacen: en su piel y en sus amigos. Un abrazo o una caricia aliviará ese dolor. Un masaje relajante o metamórfico, será de gran ayuda para aliviar el corazón y liberar tensiones y emociones atrapadas. Además, un momento en compañía de sus mejores amigos, le ayudará a restablecer y restaurar todo su sistema psicoemocional. Sus amigos son, literalmente, su salvación.',
            'Este arquetipo te invita a investigar y localizar el momento exacto en que se dio una separación, y que pasó desapercibida a nivel consciente: la ausencia de un referente, la pérdida de un ser querido, la distancia de un amigo o amante. Una vez localizado el trauma central, desde ahí, podrás ser reconducido, a través del hilo de Ariadna, fuera de tu laberinto mental.',
            'En su estructura energética, los desequilibrios se pueden dar sobre todo en el primero o en el séptimo chakra, por su conexión/desconexión de la Tierra o del Cielo, respectivamente.'
        ],
        astrologia: [
            'Los elementos de Libra los encontramos en las manifestaciones del arquetipo 17, en su inmediata apertura y sociabilidad, en su sensibilidad y en su necesidad de armonía en el entorno. Asimismo, por su cariño, generosidad e interés hacia los demás. La tranquilidad y la simpatía suelen ser dos elementos siempre presentes. Si un 17 cae mal o inspira rechazo, algo pasa. El 8 de su reducción suele generar personalidades que atraen emocionalmente e inspiran confianza. Venus, además, regente del signo de Libra, nos reafirma todas estas cualidades.'
        ],
        hebrea: [
            'Entre las letras hebreas, la PEH es la encargada de enseñarnos cómo trascender el mundo de los sentidos, para ayudarnos a comprender y profundizar el significado de la realidad en la que vivimos. Si observamos atentamente esta letra, nos recordará la silueta de una cabeza con la boca abierta. Esta abertura corresponde a la cualidad receptiva de esta personalidad que, en sus estados meditativos, tiene el potencial de canalizar palabras proféticas de gran valor, con el fin de enseñarnos a hacernos las preguntas correctas para una mayor comprensión de la esencia de las cosas.'
        ]
    },
    18: {
        nombre: 'La Luna',
        hebreo: 'Tzadè',
        imagen: 'Cartas Tarot/18.png',
        positivas: ["Luna", "Madre", "Intuición", "Magia", "Esoterismo", "Pasado", "Memorias", "Registros Akáshicos", "Recuerdos", "Vidas Pasadas", "Infancia", "Regresión", "Paisajes lunares", "Lugares abandonados", "Ruinas"],
        negativas: ["Ocultar", "Esconderse", "Melancolía", "Tristeza", "Drama", "Abandono", "Dejadez", "Esponja psíquica", "Vampiros energéticos", "Fidelidad familiar", "Inexistencia", "Invisibilidad", "Falta de creatividad", "Falta de imaginación", "Ateísmo"],
        descripcion: [
            'El arquetipo 18 en la baraja del Tarot está asociado con el arcano de La Luna. Por esta razón, su personalidad tendrá características y comportamientos con matices lunares. Esto significa que su forma de expresarse resonará con el comportamiento de nuestro querido satélite.',
            'A menudo, esta personalidad se siente conectada con las fases y los ciclos lunares. Incluso, su organismo y su psique pueden funcionar mejor cuando están sincronizados con ellos. Desde la juventud, puede haber una atracción hacia las actividades nocturnas, donde su creatividad se expande más que durante el día. Por un lado, puede sentir afinidad con la oscuridad y el mundo de la noche, mientras que, por otro lado, le fascinan los paisajes lunares, los espacios abandonados y los lugares en ruinas. Estos sitios decadentes representan para esta personalidad una fuente de vida oculta que sigue presente, aunque no sea visible.',
            'Entre sus habilidades, observamos su capacidad para dar nueva vida a lugares del pasado, a objetos tirados, rotos o descartados. Al mismo tiempo, siente una llamada hacia lo invisible, hacia lo que no se ve con los ojos del cuerpo, sino con los de la mente. Así como la luna a veces se esconde, la invisibilidad puede ser una gran habilidad o una maldición, dependiendo de su armonía o desarmonía. De esta manera, puede aprovecharla en cualquier contexto en el que necesite percibir sin ser percibido.',
            'Las diferentes fases lunares y los cambios de rostros de este astro, se convierten en un cambio de caras y máscaras para este arquetipo. Por esta razón, un individuo con el número 18 puede tener, fácilmente, habilidades o intereses relacionados con el transformismo, los disfraces, la actuación o el teatro.',
            'Con esta personalidad, nos encontramos cara a cara con el arquetipo del inconsciente colectivo, algo que afecta a todos continuamente. La sensibilidad y la percepción son aspectos sobresalientes de este carácter, similar al número 11, que es capaz de captar las energías del entorno. Esta personalidad ha llevado la empatía del 9 (1+8) a un nivel superior, sintiendo y dejándose influenciar profundamente por las energías y emociones del entorno. Es importante recordar esto al enfrentar altibajos emocionales. A veces, lo que experimentamos no será una experiencia personal directa, sino una resonancia con los movimientos subterráneos del inconsciente colectivo. En tales momentos, no será necesario investigar o liberar memorias transgeneracionales o impactos emocionales, ya que las emociones o energías que causan esos movimientos probablemente provengan del exterior. Este arquetipo tiene la capacidad natural de transmutar y liberar esas energías en beneficio de la colectividad.',
            'El cangrejo en la figura del arcano asociado se encuentra en medio del elemento agua, símbolo por excelencia de las emociones. El 18 es una personalidad sensible, reflexiva, compasiva, intuitiva y empática, habiendo heredado y amplificado todas estas cualidades del número 9, la fusión de sus dígitos.',
            'El cangrejo, como sabemos, camina de lado, pero también hacia atrás. Esto significa que este número también está en resonancia con la energía que hemos dejado atrás y con todo aquello que pertenece al pasado, a lo olvidado, a las memorias y las tradiciones antiguas. Por esta razón, esta personalidad puede convertirse en un gran investigador del pasado y de las cosas no dichas, especialmente en relación con el pasado de su familia. La luna, símbolo de la nostalgia, siempre mira hacia atrás y nos ayuda a conectar con nuestras memorias más antiguas.',
            'Dependiendo de su estado de conciencia, se mantendrá en equilibrio recordando o hablando de su infancia, o adolescencia, o mirando antiguas fotos de su juventud. La palabra clave de esta expresión es "pasado". Por otra parte, tendrá la capacidad de ir más allá, accediendo a sus vidas pasadas o conectando con los Registros Akáshicos, que corresponden a las memorias del Universo y del pasado de la humanidad. Con el Akasha, tienen sin duda un grandísimo potencial para desarrollar y poner al servicio de todos. Para un 18, el pasado y el presente se entrelazan, las vidas pasadas y presentes se sobreponen. Por eso, hablar de sus recuerdos del pasado es terapéutico, ya que, al recordarlos, comenzará a comprenderlos, a sanarse y equilibrarse.',
            'Del arquetipo 9 también ha heredado la habilidad de fluir con grandes sincronicidades, y, si se lo permite, aprenderá que siempre se encuentra en el lugar correcto y en el momento adecuado. Al igual que el 9, este 18 necesita experimentar a través de sus sentidos, convirtiendo todos los aspectos de la vida en constantes experimentos y exploraciones. Además, si para el 9, la naturaleza es una hermana, para el 18, esa misma naturaleza se convierte en madre, y su conexión con la Madre Tierra, con la Pachamama, será fundamental.',
            'Para esta personalidad, la Luna se convierte en el símbolo de lo femenino y de la madre por excelencia. Al igual que ella, la cercanía con este arquetipo abraza, nutre y calienta el corazón. Dondequiera que se encuentre un 18, también encontraremos a esa madre simbólica y, con frecuencia e inconscientemente, terminará encarnando ese rol en sus relaciones, círculos sociales o profesionales, según el contexto en el que aparezca. Sin darse cuenta, transformará los lugares por los que pasa en ambientes cálidos y familiares, y la atmósfera se volverá cómoda, cercana y maternal en su presencia. Como una madre, intuirá las necesidades de los demás, prestando mayor atención a los colectivos más débiles y frágiles.',
            'Por consiguiente, este arquetipo está inconscientemente asociado con el alimento y la nutrición. A través de la leche materna, el bebé experimenta el amor y la conexión con su madre y con la vida. Por lo tanto, en presencia del número 18, pueden surgir temas, habilidades o intereses relacionados con la alimentación y la nutrición en general.',
            'El aspecto maternal también se puede manifestar en un deseo de tener hijos o adoptarlos. Además, muchas personas con este arquetipo en su Mapa —junto con el Arquetipo 12— sienten la necesidad de rescatar cachorros abandonados para cuidarlos y alimentarlos. Estos rasgos suelen manifestarse desde una edad temprana, por lo que, regalar una mascota o unas plantitas a los niños que tengan este número en su esquema, puede ser una forma armoniosa de fomentar su cuidado y responsabilidad.',
            'Si profundizamos en el análisis de este complejo arquetipo, observamos que las personas con el número 18 tienden a interiorizar sus experiencias de manera emocional. También suelen llevar consigo una especie de "transmutador energético" interno, lo que les facilita asimilar y procesar sus vivencias, pero es importante que se tomen el tiempo necesario para digerir y procesar cada experiencia.',
            'Además, estos individuos suelen sentirse atraídos por las enseñanzas esotéricas y las artes mágicas. Estas les permiten acceder a códigos ocultos y decodificarlos, algo que comparten con su "hermano", el número 9. Uno de los grandes potenciales del 18 es la interpretación de los sueños, el lenguaje arquetípico de nuestro inconsciente.',
            'En el ámbito amoroso, se caracteriza por un romanticismo, a veces desmesurado. En ocasiones, tiende a idealizar el concepto clásico del romanticismo del siglo XIX, enfatizando la fantasía, la imaginación y los sentimientos, por encima de la racionalidad y el pragmatismo. En la moderación, se encuentra el equilibrio de todo. La originalidad y la espontaneidad son protagonistas en sus relaciones, desafiando los antiguos cánones sociales. Les encantan las sorpresas, los experimentos, las experiencias nuevas en el mundo de los sentidos. Un 18, igual que un 9, es sensorial y experimental, y ama explorar y explorarse. Otro aspecto que se puede observar en sus relaciones es su desinterés total por los formalismos sociales, expresando siempre un carácter naturalmente relajado en cada circunstancia y carente de cualquier tipo de tabúes. Con el 18, nos encontramos muy lejos de las normas sociales, tradicionales y racionales del arquetipo 4.',
            'En las profesiones, habrá una tendencia a expresar algunas de estas cualidades lunares que hemos descrito, trabajos por fases o que se relacionen con la imaginación y la creatividad, con el teatro, las máscaras o el mundo del espectáculo. Todo lo que esté relacionado con la Seguridad Social (la madre simbólica) y los temas sociales suelen atraer a estos tipos de personalidad. Asimismo, podría haber también psicólogos o terapeutas por su relación con la mente inconsciente, o bien personalidades que se dediquen al reciclaje, al dar una segunda vida a viejos objetos, a la reestructuración de edificios o recuperación de lugares abandonados. Pueden apasionarse, igualmente, con todo lo relacionado con la arqueología, con las bibliotecas, con los ciclos, con la maternidad, con la alimentación o la restauración e, incluso, con la magia, la brujería y el esoterismo.',
            'Con este arquetipo en posiciones importantes de su Mapa, me he encontrado —entre otros— directores de teatro, lectores y maestros de Registros Akáshicos, excelentes cocineros, y emprendedores que invierten en la compra de un pueblo abandonado para devolverle una nueva vida. Como puedes ver, en ningún momento el arquetipo te dice lo que tienes que hacer, pero sí te revela qué vibración tiene que estar presente para vivir y expresarte en perfecta armonía y fluir con tu propósito.'
        ],
        sombra: [
            'La empatía equilibrada del 9 puede llegar, en el 18, a descontrolarse si no aprende a filtrar las energías invisibles y emociones ajenas, en lugar de absorberlas en su interior. De hecho, podría convertirse en lo que se conoce como "esponja psíquica", y tendrá que estar alerta sobre los movimientos del inconsciente colectivo y, sobre todo, respecto a los "vampiros energéticos" (conscientes e inconscientes) que podrían orbitar a su alrededor.',
            'Entre sus temas más comunes, nos encontramos con la herencia de la soledad del 1 y las injusticias sociales del 8. Si en un sentido puede llegar a sentirse solo y abandonado estando lejos de su madre o de su madre-tierra, en el otro podría sufrir por injusticias vividas en primera persona u observadas en su entorno social.',
            'Del 8 también hereda la importancia de la integración en el clan, sin embargo, en el 18 este sentido de pertenencia le podrá crear problemas a la hora de trascender su extrema fidelidad familiar. Esto significa que un 18 puede ser capaz de alejarse de su familia y buscar su propio camino, pero en su inconsciente seguirán siempre activos los patrones, creencias y dinámicas familiares limitantes, a no ser que tome conciencia y haga un trabajo de investigación, comprensión y liberación de las memorias condicionantes de su árbol transgeneracional. En caso contrario, podría tener problemas a la hora de realizarse, porque de alguna manera las creencias del clan tendrán una influencia poderosa en la toma de sus decisiones en los varios aspectos de la vida y en todas sus relaciones. En estas circunstancias, suele haber programas heredados de no-existencia, de invisibilidad o un proyecto sentido muy limitante que tendrá que descodificar y liberar.',
            'Asimismo, en caso de desequilibrio, esta personalidad se puede esconder, ocultar o simplemente desaparecer durante un tiempo, propio como la luna de su arcano asociado. En la Sombra, puede sufrir mentiras y engaños, pero también puede, paradójicamente, activar su mecanismo de defensa justo mintiendo y engañando él mismo.',
            'Sus dolores y resistencias hablan también de un pasado que todavía duele, de una madre ausente o castradora, de un Complejo de Edipo sin resolver o de un síndrome de abandono heredado por sus ancestros. Tal vez sufra por sentirse invisible, por no importar a nadie, por haber estado en familias donde la fantasía ha muerto y la imaginación, es un pecado capital. Por esta razón, cuando sufre, podría ponerse la máscara de la alegría para esconder sus tristezas y ocultar así sus dolores.',
            'En la Sombra, su comportamiento puede también hacerse misterioso, enigmático o lunático, y podría haber personalidades que tengan la tendencia a hacer las cosas a escondidas, a espiar o a ocultar la verdad. La dramatización y el victimismo reflejan con frecuencia su mecanismo de supervivencia, llevándolo a vivir la vida como uno de sus personajes teatrales: en el Espejo logra dirigir cada gesto con gran habilidad y control, mientras que, en la Máscara, estos mismos rasgos pueden hacer que sucumba al drama y a la excesiva emotividad. Esta habilidad le permite, por lo general, gestionar el entorno y afrontar situaciones emocionalmente complejas sin sentirse abrumado; sin embargo, en caso de un bloqueo o desequilibrio dentro de un Pilar, corre el riesgo de verse dominado por sus propios dramas.',
            'En el ámbito de la nutrición, podrían concretarse trastornos de la alimentación o intolerancias alimentarias, sobre todo a alimentos asociados al arquetipo materno como leche y derivados.',
            'Sus principales patologías suelen ser la depresión y la tristeza crónica. Puede tener tendencias a evadir la realidad, queriéndose "quedar en la luna" o refugiándose en su inmensa imaginación. En este sentido, podría haber casos de autismo o, en su extremo, trastornos del comportamiento y pérdida de la identidad. Las drogas y el alcohol, pueden ser sus medios favoritos para huir de la dura realidad.',
