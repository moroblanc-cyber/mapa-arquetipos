            'Recuerda que el Pilar de Resistencia te contará la causa del dolor y de la contradicción, mientras los Nudos de Dolor describirán el comportamiento que se activará en ti cuando permanezcas en estado de desorden interior.',
            'Si esto ocurriera, notarías un cambio en tu forma de sentir cuando las cualidades positivas de tu Nudo Emocional desaparezcan, y sean reemplazadas por las cualidades negativas del Nudo de Dolor. En otras palabras, tu inconsciente activaría un protocolo de defensa en el caso se sienta amenazado durante un cortocircuito emocional. Es importante entender que esto no es algo que hagas conscientemente; más bien, funcionarás desde el miedo y el dolor, de manera repentina. Dejarías de actuar desde tu Ser y, en cambio, empezarías a reaccionar desde las dinámicas del Ego.',
            'A partir de ese momento, la vida podrá volverse gris, difícil y triste, y percibiría el mundo y las circunstancias desde las cualidades negativas asociadas al arquetipo de este Pilar. Progresivamente, lo que antes te beneficiaba y satisfacía emocionalmente, ya no lo haría. En este estado, tu Nudo Emocional dejaría de funcionar como solía hacerlo. Ahora, lo que creerías necesitar serán las vibraciones de tu Nudo de Dolor.',
            'Para restablecer la armonía y reactivar tu Nudo Emocional, necesitarás investigar el "desde cuándo" te encuentras en este estado, y qué conflicto tuviste justo antes de ese estado relacionado con el arquetipo de tu Resistencia. Una vez localizado ese evento, tendrás que corregir ese "error", dejando de obligarte a hacer algo que no quieres, expresando lo que sientes, o bien dejando de resistirte a algo que es inevitable, aceptando la realidad, amándote a ti mismo y eligiéndote por encima de todos.',
            'En algunos casos, un profesional que te acompañe en este proceso, podría revelarse de gran ayuda, sobre todo al principio o en los casos más graves. Recuerda que, en ningún caso, este manual sustituye a un psicólogo o un médico. Simplemente, hará que la comprensión de tus mecanismos internos y la toma de consciencia de tus errores, mejoren la calidad de tu vida y aceleren todos los procesos de sanación.'
        ]
    },
    'cid': {
        titulo: 'CID — Comportamiento Interior de Dolor',
        categoria: 'Máscara',
        parrafos: [
            'Este arquetipo se encuentra calculando la resta entre los números del Día y Mes, el mayor de los dos con el menor. El CID corresponde a la misma posición del CIS, pero en su contraparte negativa.',
            'Ejemplos:',
            '22/12/1945 = 22/12/19 = 22 - 12 = 10',
            '28/11/1959 = 10/11/6 = 11 - 10 = 1',
            'Significado del Comportamiento Interior de Dolor',
            'Imagina lo que sucede cuando experimentas un choque emocional y, de repente o de manera progresiva, la serenidad desaparece. Tu Resistencia se cortocircuita y tu corazón pierde latidos y vitalidad. Te sientes herido, y la tristeza y el sufrimiento comienzan a manifestarse en tu vida. En este momento, experimentarás las cualidades negativas de tu Nudo de Dolor y te identificarás con las emociones y necesidades que vibran desde ese nudo.',
            'Cuando esto ocurre, tu inconsciente activa todos los pasos del protocolo de supervivencia hasta que se resuelva o sane el impacto inicial. Tu carácter y comportamiento se adaptan a la nueva situación. El miedo y el sufrimiento ingresan en el sistema, y las señales más visibles se manifiestan, al principio, en esta columna: Día-CIS-CID.',
            'Cuando sufres un impacto emocional, la Resistencia se activa y el primer Pilar afectado es el más cercano, el Día, que comienza a oscurecerse y cambia tu carácter interno. Si no se soluciona rápidamente, tu CIS también se bloqueará y desaparecerá por completo, dando paso al comportamiento interior de dolor, también conocido como CID.',
            'Si te fijas, cuando sucede algo malo, o sientes tristeza o una leve depresión, las primeras personas que lo notan son tu pareja, tus amigos cercanos y tus familiares. Estas señales provienen de tu nuevo comportamiento de dolor, que es lo que ellos percibirían. Tu serenidad se ha ido, y ahora actúas, automáticamente, de manera diferente. La forma en que te comportas está influenciada por el arquetipo presente en el CID.',
            'Aquí, en primer lugar, los aspectos de tu carácter y comportamiento interior desde la Sombra, se hacen visibles en tu entorno cercano. Empiezas a cambiar tu forma de relacionarte y estás a la defensiva. Tus palabras, tus miradas, los tonos de tu voz y todas tus expresiones verbales y no verbales tendrán los matices negativos de este arquetipo.',
            'Por otro lado, muchas veces no te darás cuenta de aquellos momentos en los cuales sentiste un ataque o una herida. Quizás no le hayas dado importancia en ese momento o, tu desvalorización te haya llevado a normalizar ese comportamiento, ese maltrato o ese hábito malsano. Pero no te preocupes, si no te percataste de aquel golpe bajo o esa subida de tensión en tu sistema: tu Resistencia funcionará como un salvavidas, y desconectará el cuadro general de la corriente eléctrica para que no haya problemas. Es este el momento en el que la luz de tu comportamiento interior —el CIS— desaparece y te quedas en la oscuridad del CID.',
            'Es muy importante recordar que, al principio del protocolo de supervivencia, las primeras señales de desarmonías las manifestarás en tu corazón y Nudo emocional y, casi enseguida, en tu entorno cercano. Es muy probable que aún no se note ese desequilibrio en los Pilares exteriores sociales y profesionales, que veremos a continuación. Tal vez, aún puedas seguir sufriendo en tu interior, pero cuando te pones tu máscara social (el arquetipo de tu Año) o en tu esfera profesional (el arquetipo de tu PES), puede que todo aún esté, o parezca, en orden y armonía. Sin embargo, si el choque emocional no se soluciona pronto o se acumula un nuevo cortocircuito, puede haber una ulterior sobrecarga en todo el sistema y los demás Pilares también se podrían venir abajo. Si este fuera el caso, aparecerían síntomas físicos, emocionales o mentales posteriores.',
            'Por esta razón, es muy importante que observes y comprendas cómo funcionas, de qué manera te mueves y expresas con tu familia y en la esfera sentimental, con tu pareja y amigos íntimos. Que nadie cohíba, impida o menosprecie tus necesidades en ese entorno. Es importantísimo que puedas sentirte libre de expresar las cualidades positivas de tus arquetipos en todo momento: en caso contrario, busca aquello que puedes, y tienes, que cambiar en tus relaciones o, directamente, cambia de relaciones. Si te encuentras en un entorno tóxico que no permite la libre expresión, el responsable siempre eres tú, nunca el otro. Tu pareja nunca te limita, y tus padres y hermanos, jamás te castran o te maltratan. Tú eres el que se limita y se maltrata a través de ellos todos los días, eligiendo circunstancias que no son acordes a tu esencia. El objetivo es madurar hasta el punto de transformar por completo nuestras relaciones.',
            '¿Quién elige, diariamente, a esa pareja tóxica, a ese jefe abusivo, a ese amigo que se aprovecha de ti en todo momento? Cuando entiendas que el poder de cambiar tus relaciones y tus circunstancias, lo tienes tú, el mundo y el universo entero cambiarán.',
            'Toma nuevas decisiones para obtener diferentes resultados. Otro aspecto importante a considerar es la manifestación de las cualidades negativas de este Pilar en tu entorno laboral. Así como el CIS representa una vibración armoniosa, el CID se convierte en uno de los "ingredientes" de tu profesión cuando no fluye naturalmente, cuando requiere esfuerzo y se siente como una obligación. Los aspectos desfavorables de este arquetipo se manifiestan en el momento en que no te sientes en sintonía con tu entorno laboral, tus tareas, compañeros, jefes, salario o cualquier otro aspecto que te resulte difícil aceptar. Esto también puede ser una consecuencia de haber sobrecargado tu Resistencia.',

    'huida': {
        titulo: 'Huida',
        categoria: 'Máscara',
        parrafos: [
            'Calcula la resta entre tu Personalidad Profunda y tu Personalidad Exterior de Dolor, y tomarás consciencia de tu válvula de escape, que es aquel círculo que se encuentra abajo a la derecha, también conocido como Huida.',
            'Significado de la Huida',
            'Nuestro objetivo es permanecer el mayor tiempo posible funcionando con los arquetipos de nuestro Espejo, sin caer en el mecanismo de supervivencia. Cuando algunos de los Pilares inferiores se activan, significa que nos estamos desalineando de nuestro Ser y alejándonos de nuestro propósito.',
            'Este Pilar, como otros que ya hemos analizado, tiene una doble interpretación. Por un lado, representa nuestra forma de huir de los problemas y nuestra incapacidad de enfrentarlos y resolverlos conscientemente. Por otro lado, este arquetipo se transforma en un recurso en caso de necesidad; sin embargo, solo se activará cuando estemos en una fase avanzada de dolor, miedo y sombra.',
            'Si llevas demasiado tiempo funcionando con el mecanismo de supervivencia en la mayoría de los Pilares —y lo sabrás porque el estrés o la enfermedad estarán presentes— ya no podrás armonizarte con la ayuda de los arquetipos presentes en los tres Pilares que aparecen en el Espejo y que hemos visto antes:',
            '● Búsqueda Emocional ● Armonía ● Emergencia',
            'Estos "comodines" dejarán de serte útiles cuando lleves demasiado tiempo vagando por la Sombra. Presionarás esos botones y se quedarán apagados y desconectados. Los arquetipos que ahí aparezcan ya no te proporcionarán alivio, y todo lo que antes te gustaba, te estimulaba y te apasionaba, en relación con esos arquetipos, de repente ya no tendrá efecto. Es demasiado tarde. La Resistencia se ha fundido, ha habido un gran cortocircuito y te has (sobre) cargado tu propio sistema emocional. Estas tres soluciones del Espejo se quedan momentáneamente desconectadas, porque tu personalidad ha activado el mecanismo de supervivencia, tu piloto automático: la Máscara.',
            'Si en algún momento de tu vida has tenido depresión o has pasado por una mala racha, podrás recordar que todas aquellas cosas que antes te emocionaban o estimulaban, en ese periodo de tiempo en el que estás de bajón, ya no te apasionan. Así es la depresión, entre otras cosas. Cuando estás mal, te duele algo o vives con miedo, muchas veces no hay espacio para aficiones, pasiones y alegría. Estos elementos pertenecen al mundo de la armonía y del Espejo.',
            'El arquetipo del Pilar de Huida lo buscarás inconscientemente para aliviar la presión en tu vida —de-presión precisamente—, ya que describe lo que buscas para evadirte, aguantar o desconectar. Cuando te sientes como una olla a presión, este',
            'Pilar representa la válvula que libera esa tensión acumulada y evita que explotes, permitiéndote respirar un poco.',
            'Si vives en armonía todo el tiempo, este arquetipo jamás lo utilizarás.',
            'En muchos casos, esta posición describe tus adicciones o aquellas cosas que haces para "no pensar". Sabes que estás mal, eres consciente de que hay un problema grande en tu vida, pero no quieres —o no sabes cómo solucionarlo— (generalmente por miedo o culpa). Esto lo hacemos tú, yo y todos: es un mecanismo de defensa. En general, este Pilar nos muestra exactamente cómo escapamos de nuestros problemas.',
            'Si el arquetipo que aparece en esta posición es igual al que aparece en algún lugar del Espejo o en la Personalidad Profunda, notarás la diferencia entre los dos porque, en este Pilar, ese arquetipo manifestará sus cualidades más negativas o, incluso, aparentemente positivas, pero mal gestionadas. En este Pilar de escape, lo que aparece no es una solución definitiva a tus problemas, sino una solución temporal: es tu distracción respecto a las complicaciones, es tu propia manera de procrastinar.',
            'Si realmente quieres sanar, comprender, equilibrar, resolver, integrar y trascender, el camino es otro y no pasa por aquí. Lo que sí puedes hacer es utilizar este Pilar conscientemente. Como ya he mencionado, esta posición también tiene un doble significado: o lo utilizamos para huir, o bien lo aprovechamos como un "salvavidas", similar al de la Emergencia. En lugar de dejarte arrastrar por los aspectos negativos de este arquetipo — que es lo que suele ocurrir automáticamente— busca y estimula sus aspectos positivos, con el fin de no hundirte por completo en la Sombra y volver, progresivamente, a un estado de armonía.',
            'Si tienes un número en este punto, que también se repite en algún Pilar del Espejo, ten cuidado de no engañarte a ti mismo.',
            'Si esta posición estuviera activa, podrías creer que estés vibrando en tu estado natural porque ese arquetipo también está en la parte superior y armónica de tu Mapa pero, en realidad, es tu Pilar de Huida. He observado con frecuencia este autoengaño, en mi propia experiencia directa.',
            'Por ejemplo, si tienes un 8 en el Nudo Emocional y un 8 en el Pilar de Huida, podrías estar distrayéndote con el sexo y el dinero, o huyendo de una situación al crear altas barreras y aislarte de la sociedad y la gente. Quizás creas que eso es normal porque piensas que tu 8 emocional lo busca, pero no te engañes. Un 8 valora la sexualidad, el flujo del dinero y su territorio personal, pero lo hace desde la paz y la calma interior, no desde la necesidad, la inquietud o el miedo encubierto.',
            'En el caso de un 9 en la Personalidad Profunda y un 9 en el Pilar de Huida, hay dos maneras muy diferentes de querer viajar lejos. En el primer caso, viajas para buscar aventura, experimentar, explorar, conocerte y conectar contigo mismo. En el segundo, viajas para desconectar de una realidad estresante que has generado y no sabes gestionar, para posponer una decisión que no quieres tomar o, simplemente, para huir de una circunstancia concreta a la cual tienes miedo a enfrentarte.',
            'Cada vez que pienso en este Pilar, recuerdo una escena traumática de mi infancia en una de mis películas favoritas: La Historia Interminable (1984). En un momento de la historia, Atreyu y su caballo atraviesan el Pantano de la Tristeza. Este lugar representa perfectamente nuestra percepción de la vida cuando funcionamos desde la Sombra. Cualquiera que lo atraviese, se hundirá cada vez más en sus arenas movedizas y, si no sale de su tristeza y depresión, terminará hundido y desaparecerá. Las cualidades negativas del arquetipo que se encuentran en esta posición nos hunden cada vez más pero, si actuamos con sus cualidades positivas, podemos rescatarnos del bucle de toxicidad y procrastinación, y salvarnos.',
            'Si has visto la reciente y popular serie Stranger Things (2016), el Mundo del Revés (Upside Down) es otra perfecta representación de nuestra realidad cuando operamos desde la Sombra. La realidad que percibimos desde la Máscara se parece mucho al del Espejo, pero tiene matices oscuros, es denso, sin vida y hay entidades y energías que quieren destruirnos. Cuando todo nuestro sistema psicoemocional se mueve desde esta dimensión, percibirás un mundo de este tipo, pero gracias al Mapa de los Arquetipos, tenemos ahora la capacidad de transformar nuestra personalidad y de hackearla por completo.',
            'El Espejo y la Máscara representan diferentes maneras de vivir y percibir la vida. Tú y yo tenemos el poder de elegir en todo momento cómo queremos vivirla.',
            '¿Tú, qué eliges?'
        ]

    'ultimoRecurso': {
        titulo: 'Último Recurso',
        categoria: 'Máscara',
        parrafos: [
            'Para encontrar el arquetipo que se esconde en ese círculo abajo a la izquierda de tu Mapa, tendrás que restar los números entre tu Resistencia y tu Personalidad Exterior de Dolor.',
            'Significado del Último Recurso',
            'A este arquetipo, al igual que al de tu Pilar de Huida, no tendrás que prestarle mucha atención siempre que vivas en coherencia contigo mismo, respetándote y escuchándote en cada momento. Estos dos últimos recursos son comodines a los que nunca tendrás que recurrir, si has aprendido a llevar una vida en armonía y alineación con tu verdadero Ser y propósito.',
            'Si este no fuera tu caso y aún estás aprendiendo a vivir desde el amor, pero el estrés, el dolor y la enfermedad parecen no querer dejarte, este Pilar es tu salvación. Literalmente. Cuando ya lo has intentado todo y no encuentras manera de volver a la vida, al bienestar, a la salud y a la prosperidad, tu último recurso es activar conscientemente este arquetipo.',
            'La vibración que emana esta posición desvela cuál es la última opción que tienes para salvarte. Describe, de hecho, tu cuarentena ideal, aquel lugar donde, alejado del ambiente en el que te enfermaste, puedes permitirte resetear tu sistema operativo interior y volver a un estado de bienestar total.',
            'A lo largo de la historia, en muchas culturas, al enfermo grave se le ponía en cuarentena, no solo para evitar contagios, sino también para darle un periodo de descanso y mantenerlo alejado de estímulos negativos y estrés que pudieran dominar su cotidianidad. Hoy en día, hay lugares del mundo donde aún se valora esta práctica.',
            'Actualmente, conocemos los beneficios de diversos tipos de cuarentenas y aislamientos recomendados para mejorar nuestro bienestar físico, emocional y mental. Una escapada de fin de semana, o unas vacaciones de unos días, nos permiten desconectar del posible ambiente estresante o tóxico en el que vivimos todo el año. Nos alejamos para recuperarnos, descansar y restaurar nuestro sistema. Lo mismo ocurre cuando nos permitimos ir a un retiro espiritual, donde practicamos yoga, comemos sano, meditamos y nos aislamos temporalmente del estrés generado por las redes sociales, la familia o el trabajo. Esto nos permite restablecernos de la tensón acumulada durante el año. Lo que suele pasar en estos momentos de descanso puntuales es que, al principio, nuestro sistema nervioso central, que suele estar muy solicitado durante largos periodos de estrés, finalmente se relaja, y permite que el sistema nervioso vagotónico o periférico entre en acción. En ese momento, justo durante los primeros días de descanso, ocurre que nos sentimos agotados o, incluso, llegamos a enfermar o tener algún tipo de síntoma como migrañas, resfriado o inflamación. Esto sucede porque la primera parte de una sanación, muchas veces, empieza con un reajuste general a nivel físico, psíquico y emocional. Si todo nuestro sistema ha estado sobrecargado durante mucho tiempo, cuando finalmente paremos, será cuando sintamos todos los efectos de ese desgaste.',
            'Este proceso es similar a esos momentos en los que vamos al gimnasio y realizamos alguna actividad física intensa, como levantar pesas o correr. Durante la fase de actividad, sentimos que tenemos fuerza y resistencia, y no nos damos cuenta del gasto energético que producimos. Sin embargo, a las 24 horas, comenzamos a sentir agujetas y dolores en los músculos que utilizamos. Esto mismo ocurre con todos los tejidos de nuestro cuerpo humano y, además, con todas las fibras de nuestro cuerpo emocional y mental también.',
            'Cuando llevamos una sobrecarga excesiva, eventualmente nos damos cuenta de ello y la liberamos. En ese momento, nuestro cuerpo comienza un proceso de restablecimiento y sanación. Si nos permitimos un tiempo suficientemente largo, al menos 40 días, todo el sistema tiene la posibilidad de restablecer su armonía. Desafortunadamente, los descansos y las vacaciones a menudo son mucho más cortos y, además, volvemos a sumergirnos en el mismo ambiente que nos ha causado enfermedad y estrés, reiniciando un nuevo ciclo de toxicidad.',
            'Este Pilar te ayudará a comprender cuál es tu tipo de cuarentena ideal y cómo llevarla a cabo. Este espacio de sanación, es el lugar perfecto para ocuparse de uno mismo y de nadie más. Es aquella isla a la que necesitamos ir cuando estamos en un estado avanzado de dolor físico, emocional o mental. Representa aquel lugar sagrado donde permitimos que muera lo que tiene que morir, para que volvamos lentamente a la vida. En este espacio no se recomienda llevar nada que no sea esencial: aire, comida, agua y asegurarnos de tener un techo sobre nuestra cabeza. Todo lo demás sobra: nada de móviles, llamadas, correos electrónicos, fotos o cosas que evoquen recuerdos de ese ambiente tóxico del cual te estás desintoxicando. Nada de hablar de problemas o circunstancias negativas relacionadas con ese lugar donde vives en estrés todo el año.',
            'La cuarentena ideal, como su nombre indica, dura aproximadamente 40 días, el tiempo necesario para que nuestro inconsciente, sistema nervioso y conexiones neuronales desconecten y se reconecten de una manera más sana y equilibrada. Durante este tiempo, nuestro sistema se desintoxica de todo veneno (del cuerpo y de la mente) y se reajusta a sus estándares.',
            'En los lugares de rehabilitación de adicciones te dirán algo similar: un periodo de aislamiento de uno o dos meses, sin contacto con el mundo exterior, familiares o amigos, y la integración de nuevos hábitos más sanos, suelen ser la clave esencial para una verdadera transformación y rehabilitación. Cuando nos debilitamos, cualquier tipo de impacto emocional nos puede afectar mucho y debe de ser evitado a toda costa. Ya no importan la familia, los amigos o la pareja. Cuando se trata de nuestra vida —o de nuestra posible muerte— nada más tiene que importar.',
            'Lo que no nos suelen contar es que vivimos adictos a las sustancias más peligrosas y mortales de todas: el miedo y la culpa. Estos monarcas del reino de la Máscara harán lo posible por mantenerte en tu zona de confort, por muy tóxica que sea. Sin embargo, en este Pilar encontrarás la manera de ayudarte a ti mismo.',
            'Gracias a este último recurso, podrás permitirte alejarte de ese ambiente donde caíste enfermo, para irte a tu personal "isla de sanación". En este espacio podrás, por fin, disipar las nieblas que confunden y ciegan tu mente cuando te sientes perdido o en un estado de no-vida.',
            'Observa el arquetipo que tienes en esta posición y mira qué modelo de cuarentena personalizada se te recomienda según tu estructura.',

// ===================== LOGICA DE CALCULO =====================

const ESPECIALES = { 26: 8, 30: 3, 33: 6, 40: 4, 44: 8 };

function sumaDigitos(n) {
    return String(n).split('').reduce((s, d) => s + parseInt(d), 0);
}

function reducir(n) {
    if (n === 0) return { base: 22, especial: null };
    if (n >= 1 && n <= 22) return { base: n, especial: null };
    if (ESPECIALES[n] !== undefined) return { base: ESPECIALES[n], especial: n };
    let suma = sumaDigitos(n);
    if (ESPECIALES[suma] !== undefined) return { base: ESPECIALES[suma], especial: suma };
    if (suma >= 1 && suma <= 22) return { base: suma, especial: null };
    return reducir(suma);
}

function formatValor(p) {
    return p.especial ? p.especial + '/' + p.base : String(p.base);
}

function calcularResistencia(dia, mes, ano) {
    const nums = [dia, mes, ano].sort((a, b) => b - a);
    let r = nums[0] - nums[1];
    r = Math.abs(r - nums[2]);
    if (r === 0) return { base: 22, especial: null };
    return reducir(r);
}

function restar(a, b) {
    const r = Math.abs(a - b);
    if (r === 0) return { base: 22, especial: null };
    return reducir(r);
}

function sumar(a, b) { return reducir(a + b); }

function calcularMapa(diaRaw, mesRaw, anoRaw) {
    const dia = reducir(diaRaw);
    const mes = { base: mesRaw, especial: null };
    const ano = reducir(sumaDigitos(anoRaw));
    const pp = reducir(dia.base + mes.base + ano.base);
    const resistencia = calcularResistencia(dia.base, mes.base, ano.base);
    const nudoEmocional = sumar(dia.base, ano.base);
    const cis = sumar(dia.base, mes.base);
    const ces = sumar(mes.base, ano.base);
    const pes = sumar(cis.base, ces.base);
    const armonia = sumar(pp.base, pes.base);
    const emergencia = sumar(pes.base, resistencia.base);
    const busqEmocional = sumar(pp.base, nudoEmocional.base);
    const busqEspiritual = sumar(pp.base, mes.base);
    const nudoDolor = restar(dia.base, ano.base);
    const cid = restar(dia.base, mes.base);
    const ced = restar(mes.base, ano.base);
    const ped = restar(cid.base, ced.base);
    const huida = restar(pp.base, ped.base);
    const ultimoRecurso = restar(resistencia.base, ped.base);

    return {
        dia, mes, ano, pp, resistencia,
        nudoEmocional, cis, ces, pes,
        armonia, emergencia, busqEmocional, busqEspiritual,
        nudoDolor, cid, ced, ped, huida, ultimoRecurso
    };
}

        sub += (sub ? ' · ' : '') + '<span class="modal-pilar-badge"' + badgeAttrs + '>' + pilarNombre + '</span>';
    }
    document.getElementById('modal-sub').innerHTML = sub;

    // Cualidades en luz

    // Cualidades en sombra
    const sombraEl = document.getElementById('modal-sombra');
    sombraEl.innerHTML = arq.negativas.map(n => '<span class="modal-tag sombra">' + n + '</span>').join('');

    // Síntesis: estructurada en 4 bloques (descripcion / sombra / astrologia / hebrea)
    // o, si no existe la versión estructurada, fallback al texto único `sintesis`.
    const cont = document.getElementById('modal-sintesis-cont');
    cont.innerHTML = '';

    function renderParrafos(arr) {
        if (!arr) return '';
        const parrafos = Array.isArray(arr) ? arr : [arr];
        return '<div class="modal-sintesis">' +
            parrafos.map(p => '<p>' + p + '</p>').join('') +
            '</div>';
    }

    function bloque(titulo, contenido) {
        if (!contenido || (Array.isArray(contenido) && contenido.length === 0)) return '';
        return '<div class="modal-bloque">' +
            '<h4>' + titulo + '</h4>' +
            renderParrafos(contenido) +
            '</div>';

    if (arq.descripcion || arq.sombra || arq.astrologia || arq.hebrea) {
        let html = '';
        html += bloque('Descripción', arq.descripcion);
        html += bloque('Sombra', arq.sombra);
        html += bloque('Correspondencia con la Astrología', arq.astrologia);
        html += bloque('Correspondencia con la Letra Hebrea', arq.hebrea);

    } else if (arq.sintesis) {
        cont.innerHTML = renderParrafos(arq.sintesis);
    }

    document.getElementById('modal-overlay').classList.add('active');
    document.body.style.overflow = 'hidden';
}

function renderPilarContenido(parrafos) {
    const blocks = [];
    let i = 0;
    const n = parrafos.length;
    while (i < n) {
        const p = parrafos[i];
        const pTrim = p.trim();

        // 1) Título principal: "Significado del/de la ..."
        if (/^Significado\s+(del|de la|de los|de las)\s+/i.test(p) && p.length < 120) {
            blocks.push('<h3 class="pilar-seccion">' + p + '</h3>');
            i++;
            continue;
        }

        // 2) Lista numerada: marcador "1." / "2." solo, seguido de contenido en el siguiente párrafo
        if (/^\d+\.?$/.test(pTrim) && i + 1 < n) {
            const items = [];
            while (i + 1 < n && /^\d+\.?$/.test(parrafos[i].trim())) {
                items.push(parrafos[i + 1]);
                i += 2;
            }
            blocks.push('<ol class="pilar-ol">' + items.map(it => '<li>' + it + '</li>').join('') + '</ol>');
            continue;
        }

        // 3) Lista de viñetas: párrafos que empiezan por ● o •
        if (/^[●•]\s*/.test(p)) {
            const items = [];
            while (i < n && /^[●•]\s*/.test(parrafos[i])) {
                // Un mismo párrafo puede contener varias viñetas concatenadas
                const sub = parrafos[i].split(/\s*[●•]\s*/).map(s => s.trim()).filter(Boolean);
                items.push(...sub);
                i++;
            }
            blocks.push('<ul class="pilar-ul">' + items.map(it => '<li>' + it + '</li>').join('') + '</ul>');
            continue;
        }

        // 4) Sub-sección: línea corta acabada en ":" (ej. "Ejemplos:", "La pregunta importante es:")
        if (pTrim.length > 0 && pTrim.length < 70 && /:$/.test(pTrim) && !/^\d/.test(pTrim)) {
            blocks.push('<h4 class="pilar-subseccion">' + p + '</h4>');
            i++;
            continue;
        }

        // 5) Párrafo normal
        blocks.push('<p>' + p + '</p>');
        i++;
    }
    return blocks.join('');
}

function abrirPilarModal(pilarKey) {
    const pil = PILARES[pilarKey];
    if (!pil) return;
    document.getElementById('pilar-modal-titulo').textContent = pil.titulo;
    document.getElementById('pilar-modal-categoria').innerHTML = pil.categoria ? '<span>' + pil.categoria + '</span>' : '';
    const cont = document.getElementById('pilar-modal-cont');
    cont.innerHTML = renderPilarContenido(pil.parrafos || []);
    document.getElementById('pilar-modal-overlay').classList.add('active');
    document.body.style.overflow = 'hidden';
    // Scroll al top del contenido
    const modalEl = document.querySelector('#pilar-modal-overlay .modal');
    if (modalEl) modalEl.scrollTop = 0;
}

function cerrarPilarModal() {
    document.getElementById('pilar-modal-overlay').classList.remove('active');
    // Si el modal de arquetipo sigue abierto, mantén el overflow bloqueado
    if (!document.getElementById('modal-overlay').classList.contains('active')) {
        document.body.style.overflow = '';
    }
}

    biblioteca.personas.splice(insertIdx, 0, drag);

    guardarBiblioteca();
    renderBiblioteca();

    const nombreCarpeta = (biblioteca.carpetas.find(c => c.id === targetCarpetaId) || {}).nombre || 'carpeta';
    mostrarToast(desdeCarpeta !== targetCarpetaId
        ? 'Movido a "' + nombreCarpeta + '"'
        : 'Reordenado');
}

function moverAcarpeta(dragId, carpetaId) {
    const drag = biblioteca.personas.find(p => p.id === dragId);
    if (!drag || drag.carpetaId === carpetaId) return;
    drag.carpetaId = carpetaId;
    guardarBiblioteca();
    renderBiblioteca();
    const nombreCarpeta = (biblioteca.carpetas.find(c => c.id === carpetaId) || {}).nombre || 'carpeta';
    mostrarToast('Movido a "' + nombreCarpeta + '"');
}

function cargarBiblioteca() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            biblioteca = JSON.parse(raw);
        }
    } catch (e) {
        console.error('Error cargando biblioteca:', e);
        biblioteca = { carpetas: [], personas: [] };
    }
    if (!biblioteca.carpetas) biblioteca.carpetas = [];
    if (!biblioteca.personas) biblioteca.personas = [];
    // Garantiza la carpeta por defecto
    if (!biblioteca.carpetas.find(c => c.id === CARPETA_DEFECTO_ID)) {
        biblioteca.carpetas.unshift({
            id: CARPETA_DEFECTO_ID,
            nombre: 'Sin clasificar',
            orden: 0,
            protegida: true,
        });
    }
}

function guardarBiblioteca() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(biblioteca));
    } catch (e) {
        console.error('Error guardando biblioteca:', e);
        mostrarToast('Error al guardar en el almacenamiento');
    }
}

function nuevoId() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
    return 'id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9);
}

function construirNombreCompleto(persona) {
    if (persona) {
        return [persona.nombre, persona.apellido1, persona.apellido2].filter(Boolean).join(' ').trim();
    }
    const n = document.getElementById('nombre').value.trim();
    const a1 = document.getElementById('apellido1').value.trim();
    const a2 = document.getElementById('apellido2').value.trim();
    return [n, a1, a2].filter(Boolean).join(' ');
}

function formatFechaCorta(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-');
    return parseInt(d) + '/' + parseInt(m) + '/' + y;
}

function marcarSucio() { estadoSucio = true; }
function marcarLimpio() { estadoSucio = false; }

// --- Panel ---

function abrirBiblioteca() {
    document.getElementById('biblio-panel').classList.add('active');
    document.getElementById('biblio-overlay').classList.add('active');
    renderBiblioteca();
}

function cerrarBiblioteca() {
    document.getElementById('biblio-panel').classList.remove('active');
    document.getElementById('biblio-overlay').classList.remove('active');
}

function exportarBiblioteca() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) { mostrarToast('No hay datos que exportar'); return; }
    const fecha = new Date().toISOString().slice(0, 10);
    const blob = new Blob([raw], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `biblioteca_arquetipos_${fecha}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
}

function importarBiblioteca(input) {
    const file = input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
        try {
            const data = JSON.parse(e.target.result);
            if (!data.personas || !data.carpetas) throw new Error('Formato inválido');
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            cargarBiblioteca();
            renderBiblioteca();
            mostrarToast('Biblioteca importada correctamente');
        } catch {
            mostrarToast('Error: el archivo no es válido');
        }
        input.value = '';
    };
    reader.readAsText(file);
}

function renderBiblioteca() {
    const cont = document.getElementById('biblio-contenido');
    cont.innerHTML = '';

    if (biblioteca.personas.length === 0 && biblioteca.carpetas.length <= 1) {
        cont.innerHTML = '<div class="biblio-vacio">Tu biblioteca está vacía.<br>Crea una carpeta o guarda un árbol para empezar.</div>';
        return;
    }

    // Ordena carpetas: la protegida al final, el resto por orden alfabético
    const carpetasOrdenadas = [...biblioteca.carpetas].sort((a, b) => {
        if (a.protegida && !b.protegida) return 1;
        if (!a.protegida && b.protegida) return -1;
        return a.nombre.localeCompare(b.nombre, 'es');
    });

    for (const carpeta of carpetasOrdenadas) {
        // Personas en orden de inserción (no alfabético: el usuario las ordena por drag)
        const personasEnCarpeta = biblioteca.personas
            .filter(p => p.carpetaId === carpeta.id);

        if (carpeta.protegida && personasEnCarpeta.length === 0) continue;

        const divCarpeta = document.createElement('div');
        divCarpeta.className = 'biblio-carpeta';
        divCarpeta.dataset.carpetaId = carpeta.id;

        const header = document.createElement('div');
        header.className = 'biblio-carpeta-header';
        header.innerHTML =
            '<span class="biblio-carpeta-flecha">▼</span>' +
            '<span class="biblio-carpeta-icono">📁</span>' +
            '<span class="biblio-carpeta-nombre">' + escaparHtml(carpeta.nombre) + '</span>' +
            '<span class="biblio-carpeta-contador">' + personasEnCarpeta.length + '</span>' +
            '<span class="biblio-carpeta-acciones">' +
                (carpeta.protegida ? '' : '<button title="Renombrar" data-accion="renombrar-carpeta">✎</button>') +
                (carpeta.protegida ? '' : '<button title="Eliminar" data-accion="eliminar-carpeta">✕</button>') +
            '</span>';

        header.addEventListener('click', (e) => {
            if (e.target.closest('button')) return;
            if (e.target.closest('[contenteditable="true"]')) return;
            divCarpeta.classList.toggle('colapsada');
        });

        const btnRenombrar = header.querySelector('[data-accion="renombrar-carpeta"]');
        if (btnRenombrar) {
            btnRenombrar.addEventListener('click', (e) => {
                e.stopPropagation();
                renombrarCarpetaInline(header.querySelector('.biblio-carpeta-nombre'), carpeta.id);
            });
        }
        const btnEliminar = header.querySelector('[data-accion="eliminar-carpeta"]');
        if (btnEliminar) {
            btnEliminar.addEventListener('click', (e) => {
                e.stopPropagation();
                eliminarCarpeta(carpeta.id);
            });
        }

        // Drop sobre la cabecera de la carpeta → mover persona a esta carpeta
        header.addEventListener('dragover', (e) => {
            if (!dragPersonaId) return;
            // Verificar que la persona no sea ya de esta carpeta
            const p = biblioteca.personas.find(x => x.id === dragPersonaId);
            if (p && p.carpetaId === carpeta.id) return;
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            document.querySelectorAll('.drop-target-folder').forEach(el => {
                if (el !== header) el.classList.remove('drop-target-folder');
            });
            header.classList.add('drop-target-folder');
        });
        header.addEventListener('dragleave', (e) => {
            if (!header.contains(e.relatedTarget)) {
                header.classList.remove('drop-target-folder');
            }
        });
        header.addEventListener('drop', (e) => {
            e.preventDefault();
            e.stopPropagation();
            header.classList.remove('drop-target-folder');
            if (!dragPersonaId) return;
            moverAcarpeta(dragPersonaId, carpeta.id);
        });

        divCarpeta.appendChild(header);

        const lista = document.createElement('div');
        lista.className = 'biblio-carpeta-lista';

        for (const persona of personasEnCarpeta) {
            lista.appendChild(crearFilaPersona(persona));
        }

        divCarpeta.appendChild(lista);
        cont.appendChild(divCarpeta);
    }
}

function crearFilaPersona(persona) {
    const fila = document.createElement('div');
    fila.className = 'biblio-persona';
    if (persona.id === personaCargadaId) fila.classList.add('activa');
    fila.dataset.personaId = persona.id;
    fila.draggable = true;

    const nombreCompleto = construirNombreCompleto(persona) || '(sin nombre)';

    fila.innerHTML =
        '<div class="drag-handle" title="Arrastrar">⠿</div>' +
        '<div class="biblio-persona-info">' +
            '<div class="biblio-persona-nombre">' + escaparHtml(nombreCompleto) + '</div>' +
            '<div class="biblio-persona-fecha">' + formatFechaCorta(persona.fecha) + '</div>' +
        '</div>' +
        '<div class="biblio-persona-acciones">' +
            '<button title="Renombrar" data-accion="renombrar-persona">✎</button>' +
            '<button title="Eliminar" data-accion="eliminar-persona">✕</button>' +
        '</div>';

    // Click para cargar
    fila.addEventListener('click', (e) => {
        if (e.target.closest('button')) return;
        if (e.target.closest('[contenteditable="true"]')) return;
        if (e.target.closest('.drag-handle')) return;
        cargarPersona(persona.id);
    });

    fila.querySelector('[data-accion="renombrar-persona"]').addEventListener('click', (e) => {
        e.stopPropagation();
        renombrarPersonaInline(fila.querySelector('.biblio-persona-nombre'), persona.id);
    });
    fila.querySelector('[data-accion="eliminar-persona"]').addEventListener('click', (e) => {
        e.stopPropagation();
        eliminarPersona(persona.id);
    });

    // --- Drag & Drop ---
    fila.addEventListener('dragstart', (e) => {
        dragPersonaId = persona.id;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', persona.id);
        // Delay para que se vea el ghost antes de aplicar el estilo dimmed
        requestAnimationFrame(() => fila.classList.add('dragging'));
    });

    fila.addEventListener('dragend', () => {
        dragPersonaId = null;
        fila.classList.remove('dragging');
        limpiarIndicadoresDrag();
    });

    fila.addEventListener('dragover', (e) => {
        if (!dragPersonaId || dragPersonaId === persona.id) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        // Determinar mitad superior/inferior
        const rect = fila.getBoundingClientRect();
        const half = e.clientY < rect.top + rect.height / 2 ? 'above' : 'below';
        // Limpiar indicadores en otras filas
        document.querySelectorAll('.biblio-persona').forEach(el => {
            if (el !== fila) el.classList.remove('drop-above', 'drop-below');
        });
        fila.classList.toggle('drop-above', half === 'above');
        fila.classList.toggle('drop-below', half === 'below');
        dragOverPersonaId = persona.id;
        dragOverHalf = half;
    });

    fila.addEventListener('dragleave', (e) => {
        if (!fila.contains(e.relatedTarget)) {
            fila.classList.remove('drop-above', 'drop-below');
        }
    });

    fila.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        fila.classList.remove('drop-above', 'drop-below');
        if (!dragPersonaId || dragPersonaId === persona.id) return;
        const rect = fila.getBoundingClientRect();
        const half = e.clientY < rect.top + rect.height / 2 ? 'above' : 'below';
        reordenarOmover(dragPersonaId, persona.id, half, persona.carpetaId);
    });

    return fila;
}

function escaparHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
}

// --- Crear / renombrar / eliminar carpetas ---

function crearCarpeta() {
    const nombre = prompt('Nombre de la nueva carpeta:');
    if (!nombre || !nombre.trim()) return;
    biblioteca.carpetas.push({
        id: nuevoId(),
        nombre: nombre.trim(),
        orden: biblioteca.carpetas.length,
    });
    guardarBiblioteca();
    renderBiblioteca();
    mostrarToast('Carpeta creada');
}

function renombrarCarpetaInline(spanEl, carpetaId) {
    spanEl.contentEditable = 'true';
    spanEl.focus();
    // Seleccionar todo el contenido
    const sel = window.getSelection();
    const range = document.createRange();
    range.selectNodeContents(spanEl);
    sel.removeAllRanges();
    sel.addRange(range);

    const terminar = (guardar) => {
        spanEl.contentEditable = 'false';
        const nuevo = spanEl.textContent.trim();
        if (guardar && nuevo) {
            const c = biblioteca.carpetas.find(x => x.id === carpetaId);
            if (c) {
                c.nombre = nuevo;
                guardarBiblioteca();
                renderBiblioteca();
            }
        } else {
            renderBiblioteca();
        }
    };

    spanEl.addEventListener('blur', () => terminar(true), { once: true });
    spanEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); spanEl.blur(); }
        if (e.key === 'Escape') { e.preventDefault(); terminar(false); }
    });
}

function eliminarCarpeta(carpetaId) {
    const carpeta = biblioteca.carpetas.find(c => c.id === carpetaId);
    if (!carpeta || carpeta.protegida) return;
    const personasEn = biblioteca.personas.filter(p => p.carpetaId === carpetaId);
    const msg = personasEn.length
        ? '¿Eliminar la carpeta "' + carpeta.nombre + '" y mover sus ' + personasEn.length + ' persona(s) a "Sin clasificar"?'
        : '¿Eliminar la carpeta "' + carpeta.nombre + '"?';
    if (!confirm(msg)) return;
    personasEn.forEach(p => p.carpetaId = CARPETA_DEFECTO_ID);
    biblioteca.carpetas = biblioteca.carpetas.filter(c => c.id !== carpetaId);
    guardarBiblioteca();
    renderBiblioteca();
    mostrarToast('Carpeta eliminada');
}

// --- Renombrar / mover / eliminar personas ---

function renombrarPersonaInline(spanEl, personaId) {
    spanEl.contentEditable = 'true';
    spanEl.focus();
    const sel = window.getSelection();
    const range = document.createRange();
    range.selectNodeContents(spanEl);
    sel.removeAllRanges();
    sel.addRange(range);

    const terminar = (guardar) => {
        spanEl.contentEditable = 'false';
        const nuevo = spanEl.textContent.trim();
        if (guardar && nuevo) {
            const p = biblioteca.personas.find(x => x.id === personaId);
            if (p) {
                // Parseo simple: primera palabra = nombre, las demás = apellidos
                const partes = nuevo.split(/\s+/);
                p.nombre = partes[0] || '';
                p.apellido1 = partes[1] || '';
                p.apellido2 = partes.slice(2).join(' ') || '';
                guardarBiblioteca();
                renderBiblioteca();
                // Si la persona está cargada, refresca el título
                if (personaCargadaId === personaId) {
                    const tn = document.getElementById('titulo-nombre');
                    tn.textContent = construirNombreCompleto(p);
                    tn.hidden = !tn.textContent;
                }
            }
        } else {
            renderBiblioteca();
        }
    };

    spanEl.addEventListener('blur', () => terminar(true), { once: true });
    spanEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); spanEl.blur(); }
        if (e.key === 'Escape') { e.preventDefault(); terminar(false); }
    });
}


function eliminarPersona(personaId) {
    const p = biblioteca.personas.find(x => x.id === personaId);
    if (!p) return;
    if (!confirm('¿Eliminar "' + (construirNombreCompleto(p) || 'persona sin nombre') + '"?')) return;
    biblioteca.personas = biblioteca.personas.filter(x => x.id !== personaId);
    if (personaCargadaId === personaId) personaCargadaId = null;
    guardarBiblioteca();
    renderBiblioteca();
    mostrarToast('Eliminado');
}

// --- Guardar árbol actual ---

function guardarPersonaActual() {
    const fecha = document.getElementById('fecha').value;
    if (!fecha) {
        mostrarToast('Calcula un árbol antes de guardar');
        return;
    }
    abrirGuardarModal();
}

function abrirGuardarModal() {
    const overlay = document.getElementById('guardar-modal-overlay');
    const inputNombre = document.getElementById('guardar-nombre');
    const select = document.getElementById('guardar-carpeta');
    const titulo = document.getElementById('guardar-modal-titulo');

    // Prerellenar nombre con lo que haya en el formulario
    inputNombre.value = construirNombreCompleto();

    // Poblar el selector de carpetas
    select.innerHTML = '';
    const carpetasOrden = [...biblioteca.carpetas].sort((a, b) => {
        if (a.protegida) return 1;
        if (b.protegida) return -1;
        return a.nombre.localeCompare(b.nombre, 'es');
    });
    for (const c of carpetasOrden) {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.nombre;
        select.appendChild(opt);
    }

    // Si estamos editando una persona ya cargada
    if (personaCargadaId) {
        const p = biblioteca.personas.find(x => x.id === personaCargadaId);
        if (p) {
            titulo.textContent = 'Actualizar árbol';
            select.value = p.carpetaId;
        }
    } else {
        titulo.textContent = 'Guardar árbol';
        // Por defecto: Sin clasificar
        select.value = CARPETA_DEFECTO_ID;
    }

    overlay.classList.add('active');
    setTimeout(() => inputNombre.focus(), 50);
}

function cerrarGuardarModal() {
    document.getElementById('guardar-modal-overlay').classList.remove('active');
}

function confirmarGuardar() {
    const nombreCompleto = document.getElementById('guardar-nombre').value.trim();
    if (!nombreCompleto) {
        mostrarToast('Introduce un nombre');
        return;
    }
    const carpetaId = document.getElementById('guardar-carpeta').value;
    const fecha = document.getElementById('fecha').value;

    // Parse nombre: primera palabra = nombre, resto apellidos
    const partes = nombreCompleto.split(/\s+/);
    const nombre = partes[0] || '';
    const apellido1 = partes[1] || '';
    const apellido2 = partes.slice(2).join(' ') || '';

    // Sincroniza el formulario principal
    document.getElementById('nombre').value = nombre;
    document.getElementById('apellido1').value = apellido1;
    document.getElementById('apellido2').value = apellido2;

    if (personaCargadaId) {
        // Actualiza la persona cargada
        const p = biblioteca.personas.find(x => x.id === personaCargadaId);
        if (p) {
            p.nombre = nombre;
            p.apellido1 = apellido1;
            p.apellido2 = apellido2;
            p.fecha = fecha;
            p.carpetaId = carpetaId;
            p.fechaGuardado = new Date().toISOString();
        }
    } else {
        // Nueva persona
        const nueva = {
            id: nuevoId(),
            carpetaId: carpetaId,
            nombre, apellido1, apellido2,
            fecha,
            fechaGuardado: new Date().toISOString(),
        };
        biblioteca.personas.push(nueva);
        personaCargadaId = nueva.id;
    }

    guardarBiblioteca();
    cerrarGuardarModal();

    // Refresca el título del mapa
    const tn = document.getElementById('titulo-nombre');
    tn.textContent = nombreCompleto;
    tn.hidden = false;

    const carpeta = biblioteca.carpetas.find(c => c.id === carpetaId);
    mostrarToast('Guardado en "' + (carpeta ? carpeta.nombre : 'Sin clasificar') + '"');
    marcarLimpio();
    renderBiblioteca();
}

// --- Cargar persona ---

function cargarPersona(personaId) {
    const p = biblioteca.personas.find(x => x.id === personaId);
    if (!p) return;

    if (estadoSucio && personaCargadaId !== personaId) {
        if (!confirm('Tienes un árbol sin guardar. ¿Descartarlo y cargar "' + (construirNombreCompleto(p) || 'persona') + '"?')) {
            return;
        }
    }

    document.getElementById('nombre').value = p.nombre || '';
    document.getElementById('apellido1').value = p.apellido1 || '';
    document.getElementById('apellido2').value = p.apellido2 || '';
    document.getElementById('fecha').value = p.fecha;

    personaCargadaId = p.id;

    // Generar el mapa (marcará sucio, pero lo limpiamos después)
    generarMapa();
    marcarLimpio();

    renderBiblioteca();
    cerrarBiblioteca();
}

// --- Toast ---

let toastTimer = null;
function mostrarToast(mensaje) {
    const toast = document.getElementById('toast');
    toast.textContent = mensaje;
    toast.classList.add('active');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('active'), 2600);
}

// --- Detectar cambios en los campos ---

['nombre', 'apellido1', 'apellido2', 'fecha'].forEach(id => {
    document.addEventListener('DOMContentLoaded', () => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', () => {
            marcarSucio();
            // Si los campos cambian, ya no coincide con la persona cargada
            if (personaCargadaId) {
                // comprobamos si los valores siguen coincidiendo
                const p = biblioteca.personas.find(x => x.id === personaCargadaId);
                if (p) {
                    const iguales = (p.nombre || '') === document.getElementById('nombre').value.trim() &&
                                    (p.apellido1 || '') === document.getElementById('apellido1').value.trim() &&
                                    (p.apellido2 || '') === document.getElementById('apellido2').value.trim() &&
                                    p.fecha === document.getElementById('fecha').value;
                    if (!iguales) personaCargadaId = null;
                }
            }
        });
    });
});

// Init
cargarBiblioteca();
</script>
