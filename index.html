        positivas: ["Salud", "Bienestar físico", "Dieta", "Nutrición", "Ejercicio físico", "Medicina", "Enfermería", "Crecimiento personal", "Deporte", "Cuidar", "Coaching", "Despertar espiritual", "Equilibrio", "Entrega"],
        negativas: ["Enfermedad", "Estrés", "Malos hábitos alimentarios", "Falta de ejercicio físico", "Sedentarismo", "Síndrome del Salvador", "Salud mental", "Sanación", "Terapia", "Psicología", "Yoga", "Servicio", "Autoexigencia"],
        descripcion: [
            'El número 26 es uno de los cinco elementos especiales, del cual derivará el número 8, mediante la suma de sus dígitos. Por lo tanto, cuando aparece en un contexto específico, representa un potencial adicional relacionado con el 8. En ese Pilar particular donde se manifiesta, la personalidad básica se expresará a través de las características y cualidades que ya conocemos del número 8. Sin embargo, llegará un momento, durante su propia evolución interior, en el que la vibración se elevará y se producirá un cambio de conciencia, marcando el inicio de la influencia del 26. Todo dependerá de su camino personal y de su capacidad de entregarse a la vida.',
            'Las primeras señales de esta transformación del 8 al 26 se manifestarán en un mayor interés por el bienestar y la salud del cuerpo. Gradualmente, esta personalidad comenzará a comprender mejor el funcionamiento del cuerpo humano y prestará una mayor atención a la hora de cuidarlo. Este lento y progresivo despertar del Arquetipo 26, suele empezar con la aparición de intereses sobre dietas saludables y rutinas de ejercicio físico, para, posteriormente, profundizar sobre la medicina alopática, natural, complementaria y alternativa. El tema de la salud y del bienestar se volverá cada vez más importante y, a medida que expanda su conciencia, profundizará aún más estos intereses, descubriendo la correlación entre el cuerpo físico y su salud emocional y mental.',
            'Este proceso hará que la persona desarrolle un mayor interés en la salud física, y también comprenda cómo el cuerpo emocional y mental, están intrínsecamente ligados al cuerpo físico. Irá descubriendo qué emociones, pensamientos y creencias influirán en su biología y en su comportamiento, y comenzará a cuidar también estos aspectos. Este proceso podrá aplicarse tanto a nivel personal como hacia el cuidado de los demás. Aquellos que experimenten esta transformación pueden convertirse en excelentes cuidadores, enfermeros, nutricionistas y especialistas en la salud y el bienestar en general. De hecho, para que el 26 pueda brotar y crecer, se encontrarán, a veces, al lado de la enfermedad —quizás cuidando a un familiar o a una persona cercana— con el objetivo de comprenderla mejor. Toda dolencia se convierte, para este arquetipo, en una oportunidad de sanación y liberación.',
            'En su penúltima fase, el 26 comprenderá la importancia que tiene la espiritualidad en la salud y el equilibrio del cuerpo y la mente. Tomará conciencia de que la causa de toda enfermedad reside en la mente y que, solo a través de un cambio espiritual, se podrá lograr una verdadera —y definitiva— sanación.',
            'Finalmente, comprenderá su mayor potencial: el despertar espiritual y la liberación de la Matrix. Una vez despierto, su propósito principal será el de despertar a sus hermanos y a toda la humanidad. Su única misión de vida será "rescatar almas" de la inconsciencia y guiarlas hacia la luz de la conciencia.',
            'Un 26, cuando aparece, nos recuerda la importancia del cuidado y del servicio del arquetipo 12, pero siempre que, primeramente, se haya aprendido a cuidar (y sanar) a sí mismo para, luego, enseñar a los demás a hacerlo.'
        ],
        sombra: [
            'Si su Sombra se manifiesta, experimentará en su propio cuerpo la ausencia de salud. Podrían aparecer malos hábitos alimentarios o falta de ejercicio físico, es decir, puede dejar de cuidarse. Sin embargo, será gracias a esto por lo que tomará consciencia de la importancia de la salud, y su enfermedad le dará una gran oportunidad para evolucionar y dar un salto hacia un mayor entendimiento.',
            'Cuando aún no haya integrado plenamente su vibración, en lugar de salvarse a sí mismo, querrá rescatar y ayudar a todo el mundo, proyectando hacia fuera su propia necesidad. En este caso, tendrá que volver a dirigir la atención hacia dentro, y aprender que, la salvación de los demás, depende primero de la salvación de uno mismo y, finalmente, de la comprensión profunda de que no hay necesidad de salvación porque en el plano espiritual ya estamos todos salvados.',
            'La Madre Teresa de Calcuta es un ejemplo idóneo para entender mejor este arquetipo, teniendo, ella misma en su propio Mapa, no uno, sino dos 26.'
        ]

    30: {
        nombre: 'Comunicación Global (30/3)',
        hebreo: null,
        imagen: 'Cartas Tarot/3.png',
        positivas: ["Comunicación global", "Grandes masas", "Público", "Audiencia", "Radio", "Internet", "Canto", "Docencia", "Expresión", "Escritura", "Poesía", "Libros", "Estudio", "Redes sociales", "Conferencias"],
        negativas: ["Trastornos del lenguaje", "Mutismo", "Logorrea", "Sordera", "Miedo a hablar en público", "Manipulación", "Problemas de comunicación", "Rechazo a la informática", "Rechazo de la tecnología", "Comunicación no verbal", "Bibliotecas", "Estudios superiores", "Tecnología", "Entrevistas", "Diálogo"],
        descripcion: [
            'Las cualidades del número 30 descienden directamente del arquetipo 3, por lo tanto, todo lo relacionado con el 3 se eleva exponencialmente a nivel global y colectivo. El 3 es el tercer número que encontramos después del 10 y el 20, que está acompañado por un 0. Por esta razón, para expresarse de manera equilibrada, este arquetipo necesita relacionarse con un gran número de personas, ya que el 0 representa el todo, la colectividad.',
            'El máximo potencial del 30 se manifiesta a través de la expresión y la comunicación a nivel mundial, sin importar el canal o la forma en que se alcance. Una vez trascendido el 3, su don de la palabra se amplifica en todos los medios de comunicación: televisión, radio, prensa, Internet y redes sociales. Esto crea excelentes oradores y comunicadores. Además, se expande a través de sus habilidades para la literatura, la poesía, el canto y todas las formas de arte, con el objetivo de transmitir un mensaje. Estas personalidades no solo desarrollan excelentes habilidades comunicativas, sino que el impacto de sus palabras es enorme en las masas. El 30 se dirige al gran público, trascendiendo los límites de los continentes. Ya sea mediante la palabra hablada o escrita, sus mensajes llegan con claridad y fuerza a los corazones y mentes de las personas. Representa, esencialmente, al mensajero de Dios y, si está en perfecto equilibrio, puede ser un gran canal de sabiduría y un excelente divulgador.',
            'Al igual que la base de la cual provienen, estas personalidades aman leer, estudiar, conocer y aprender pero, sobre todo, les apasiona hablar. El 30 puede manifestarse en perfiles de políticos, profesores, maestros, filósofos, escritores de libros de autoayuda, periodistas e influencers. Se les reconoce porque no se dirigen al público pequeño, sino a las grandes masas.',
            'El potencial de un 30 empieza a brotar cuando la persona que lo lleva ha integrado totalmente las cualidades del 3. Esto quiere decir que debe haber aprendido a comunicar en armonía, a expresarse con asertividad, a no tener miedo a abrir la boca. Una vez que supere sus resistencias hacia la tecnología y la informática (recursos modernos que amplifican su vibración), una vez que haya sanado la relación con su padre, una vez que haya aprendido a no callarse las cosas, el arquetipo 30 desatará progresivamente todas sus cualidades.',
            'El don de la palabra está intrínsecamente ligado al Verbo desde el cual todo se generó, y que nos cuenta Juan en su Evangelio:',
            'En el principio era el Verbo, y el Verbo era con Dios, y el Verbo era Dios.',
            'El Verbo, el sonido y la palabra se convierten en los instrumentos de Dios/Universo/Consciencia para divinizar y espiritualizar el mundo. El momento en el cual este arquetipo aparezca en tu Mapa, sabrás que hay una llamada a un despertar espiritual desde la comunicación y la expresión.',
            'Todos los tonos desarmónicos del arquetipo de su base tendrán que desaparecer, para que el 30 pueda desarrollarse. La palabra tiene que fluir y ponerse al servicio de la humanidad.',
            'Con el tiempo, estas personalidades aprenderán a conocer todas las posibles maneras de expresar las cualidades del arquetipo. Hoy en día, gracias a las nuevas tecnologías, tiene una infinidad de elementos con los cuales jugar y divertirse.',
            'Ahora nos encontramos en un momento histórico en el cual podemos hablar a millones de personas en el mundo, simultáneamente, desde el sofá de nuestra casa. Tenemos dispositivos que nos permiten conectarnos, prácticamente, con cualquier habitante del planeta en un instante; tenemos herramientas que trascienden las barreras de la comunicación, como los traductores simultáneos o la conversión en texto escrito para las personas con dificultades auditivas, solo por nombrar algunos. Hoy en día, el que no escucha es porque no quiere y, el que no habla, tres cuartos de lo mismo. Las únicas barreras que nos impiden comunicarnos unos con otros, están en nuestras mentes y en nuestros corazones. Cuando superemos nuestros miedos y nuestras culpas, seremos el instrumento perfecto para que el divino se manifieste a través de nosotros.',
            'Si tienes un 30, habla, cuenta, canta, escribe, comparte. Usa las redes sociales, los podcasts, la inteligencia artificial, el teatro, el arte, los escenarios, los micrófonos y todos los medios que la vida te brinde para llegar a los corazones y a las mentes de las personas. Todo lo que existe, está al servicio del ser humano. Tú decides cómo utilizar esas herramientas.',
            'Usa la emoción como vehículo para expresarte, sírvete de la imaginación, utiliza el humor. Encuentra tu propia manera de contar tu historia, compartir tu experiencia y transmitir tus conocimientos. Conecta con el poder creativo de este arquetipo para elevar la consciencia del planeta y la humanidad.'
        ],
        sombra: [
            'En su Sombra, sus palabras pueden envenenar las mentes y sus discursos pueden influenciar negativamente a sus oyentes.',
            'Esencialmente, puede manifestar todas las cualidades negativas del 3, pero no solo a nivel personal, sino también colectivo.'
        ]
    },
    33: {
        nombre: 'Vibración Crística (33/6)',
        hebreo: null,
        imagen: 'Cartas Tarot/6.png',
        positivas: ["Guía espiritual", "Vibración crística", "Líder mundial", "Amor incondicional", "Pureza", "Gran sensibilidad", "Conexión profunda", "Enseñanza", "Canalizar", "Servicio", "Ayuda", "Humanismo", "Ecología", "Energía", "Inocencia"],
        negativas: ["Fragilidad", "Victimismo", "Dramatismo", "Vulnerabilidad", "Sacrificio", "Hipersensibilidad", "Crisis", "Inmadurez", "Irresponsabilidad", "Ausencia de emociones", "Neutralidad", "Dolor emocional", "Crisis de identidad", "Inadecuación", "Familia tóxica"],
        descripcion: [
            'Sinónimo de sacrificio, paz, devoción e iluminación, este arquetipo ha heredado todas las capacidades del 11 y del 22, superándolas y convirtiéndose en el tercer gran maestro. Su corazón vibra con amor incondicional puro. Cuando está en armonía e integra la esencia del número 6, del cual proviene, es fácil seguirlo y enamorarse de él. Puede influenciar a las masas solo con su mirada o su voz. También se le llama "número crístico" porque tiene el potencial de encarnar la esencia de Cristo si se lo permite. Dondequiera que vaya, parece que Dios le acompaña, inspirando a la gente con sus palabras, actos y vibración, como hacía Jesús con los apóstoles.',
            'El 33 refleja todo el potencial del número 6, sublimando el niño interior en esencia crística. No se puede alcanzar el 33 hasta que no se haya resuelto, sanado, superado e integrado cada aspecto del 6, lo cual no es fácil. Este arquetipo nos recuerda las palabras de Jesús:',

            'Si naciste en agosto, el 8 querrá que aprendas a valorarte, a ser asertivo, a hacer respetar tus tiempos, tu espacio, tus opiniones. Un 8 te recuerda lo importante que eres, no lo importante que son los demás. Ese 8, quizás, te quiera enseñar a decirte a ti mismo que eres importante y que dejes de darte menos valor de lo que tienes. Para esto, tal vez, te encuentres una y otra vez, frente a personalidades que son justo lo opuesto tuyo, que tienen mucho ego, son presumidas, engreídas, egoístas e individualistas. A través de la polaridad opuesta estarías aprendiendo a poner orden. Sin embargo, mucho cuidado si la persona egoísta y narcisista eres tú, ya que, en este caso, ese 8 puede que esté en exceso y tendrás que adquirir más humildad, aprendiendo el altruismo y el servicio a los demás.',
            '¿Vas entendiendo cómo funciona el Pilar de tu tema central? Tu trabajo es equilibrar esa vibración en tu vida restringiendo los excesos y manifestando aquello que está en defecto.'
        ]
    },
    'ano': {
        titulo: 'Año de Nacimiento',
        categoria: 'Espejo',
        parrafos: [
            'Para encontrar el arquetipo del Pilar de tu Año, tendrás que sumar los 4 dígitos que lo componen. Si el resultado es mayor de 22, tendrás que volver a reducirlo hasta encontrar un número comprendido entre 1 y 22, siempre prestando atención si aparece algún número especial.',
            'Ejemplos:',
            '1980 = 1+9+8+0 =18',
            '1977 = 1+9+7+7 = 24 = 2+4 = 6',
            '1997 = 1+9+9+7 = 26 = 26/8',
            'Significado del Año de nacimiento',
            'El arquetipo que aparece en esta posición representa el aspecto más visible de tu carácter, esa parte de ti que la gente nota nada más conocerte. Es como una máscara social que te pones cuando sales de casa. Esta primera impresión es lo que queda en la mente de las personas cuando te ven por primera vez, antes de que te conozcan a fondo. Es un aspecto bastante evidente de tu personalidad y se destaca, especialmente, cuando estás fuera de tu hogar y sales de tu zona de confort.',
            'Si el Arquetipo del Día describe cómo eres dentro de casa y en la intimidad, el Arquetipo del Año, describe tu aspecto más social y cómo te abres al mundo. No necesariamente tenemos el mismo carácter dentro que fuera de casa. Sin embargo, si tuvieras el mismo número en ambos Pilares, es probable que las diferencias sean mínimas, a menos que uno de los dos Pilares esté bloqueado o desequilibrado, manifestando, en uno, las cualidades positivas del arquetipo y, en el otro, las cualidades negativas. Incluso, podría ser que, en el Pilar del Día, muestres una característica específica de ese arquetipo, mientras que en el del Año expreses otra cualidad de la misma vibración, pero en una tonalidad diferente. Es decir, el mismo color, pero con diferentes matices. Esto lo veremos más adelante, a medida que avancemos.',
            'Es cierto que los aspectos de este arquetipo pueden ser iguales, similares o muy diferentes a los de nuestro carácter interior. Esto significa que la forma en que actúas en casa y en la intimidad, puede ser igual a la que utilizas fuera de casa, si los números coinciden. Sin embargo, si aparecen dos arquetipos diferentes en el Día y en el Año (lo cual suele ser lo más probable), tendrás dos caracteres bien definidos: uno con tu familia, pareja y amigos íntimos (carácter interior), y otro muy diferente en la sociedad (carácter exterior). Esto también se traduce en que, al comienzo de cualquier relación, naturalmente mostrarás las cualidades del arquetipo de tu Año y, a medida que profundices en esa relación, transitarás hacia las cualidades y expresiones del arquetipo del Día. Todo esto ocurre de manera automática, sin pensarlo demasiado.',
            'Si alguna vez tuviste una primera cita con alguien, en dicho encuentro mostrarías ciertos aspectos de ti a esa persona. Sin embargo, con el tiempo y en la intimidad, se revelarán naturalmente nuevos y profundos rasgos de tu personalidad. De manera similar, esa persona que, al inicio, es prácticamente una desconocida, se irá desvelando y mostrando, poco a poco, frente a tus ojos.',
            'Al principio, percibiremos y mostraremos el Arquetipo del Año (nuestro carácter exterior). Luego, de manera natural, nos abriremos a enseñar y percibir el Arquetipo del Día (nuestro carácter interior).',
            'No obstante, si debido a un bloqueo o herida emocional no puedes expresar los aspectos positivos, automáticamente aparecerán las cualidades negativas de ese mismo arquetipo. Sin darte cuenta, caerás en un mecanismo de defensa y manifestarás la Sombra de ese número en tu vida social. La gente a tu alrededor percibirá esa máscara negativa que has adoptado. Solo te darás cuenta cuando escuches críticas, o comentarios, de los demás sobre ti. En ese momento, tomarás conciencia de que has caído en el Pilar de la Sombra. Pero no te preocupes: podrás realizar los ajustes necesarios, que analizaremos en los siguientes capítulos y durante el estudio de la Máscara.',
            'Además, la posición del Año en el Mapa también puede describir un mandato familiar que tu genealogía espera que cumplas. Así como el Pilar del Día refleja tu propósito personal, el Pilar del Año revela más sobre tu propósito familiar y lo que "el clan" espera de ti. Así que, presta atención para asegurarte de estar cumpliendo con tu tarea.',
            'Si profundizamos un poco más, también veremos que el Pilar del Año representa la herencia inconsciente paterna, así como el Pilar del Día describe la materna. El arquetipo que aquí aparece es la solución a las heridas emocionales de tu padre, es la manera en la que el inconsciente paterno intenta solucionar heridas no sanadas, dramas no resueltos y sueños no realizados de tu papá. De algún modo, lo que tu padre no pudo expresar o manifestar en su vida, a ti se te refuerza o se te entrega más fácilmente. Cuando conozcas el significado profundo del arquetipo que tienes en este Pilar, conocerás mejor la historia emocional de tu padre y cómo el inconsciente familiar intenta equilibrar, sanar y resolver a través de ti. Recuerda, una vez más, que nosotros somos el resultado de nuestros padres, somos la solución ideal a sus dramas y las respuestas a sus preguntas.',
            'Si en este Pilar tuvieras un 20, es muy probable que tu padre nunca fue reconocido por el suyo, o bien, tuvo un progenitor ausente, fue abandonado o tuvo que vivir alguna historia de "falta de reconocimiento". A través de ese 20, tú buscarás ese reconocimiento y querrás hacerte visible, querrás investigar lo que tu padre no pudo. Quizás, si tuvieras un 6, tu padre tuvo una infancia muy dura o, simplemente, no la tuvo porque debió de crecer rápido, por algún drama familiar, una guerra o una falta de referente. A lo mejor, desde muy pequeño, se tuvo que encargar de sus hermanos menores, y hacerse adulto de una vez, sin tener tiempo para el juego, las risas y los placeres de la vida. En este caso, tú por él, vivirás todas esas risas, juegos y bromas, que él no pudo vivir.',
            'En el caso de que haya aparecido un 5 en este Pilar, puede que tu padre no tuviera nunca un espacio suyo para él, que haya memorias de pérdida de hogar o mucha gente viviendo bajo el mismo techo. Seguramente, ese 5 te recuerda la importancia de marcar el territorio e imponer tus valores y principios porque tu padre, quizás, nunca pudo vivir una vida basada en sus valores y necesidades, y tuvo que doblarse a la voluntad de otra persona, de un tutor o del Estado.',
            'De manera diferente, si tuvieras un 17 en esta posición, a lo mejor deberás sanar historias de caricias y afectos que tu padre nunca tuvo, o bien, memorias de abusos, tocamientos impropios, que nunca pudo sanar. La falta de muestras de cariño y afecto que él tuvo que vivir en su historia familiar, toma importancia en tu linaje y, a través de ti y del 17 que has heredado, podrás manifestarlas y expresarlas libremente y con más facilidad.',
            'Así funcionan los dones de nuestros padres. Lo que ellos no pudieron, a nosotros se nos concede por ley de compensación.'
        ]
    },
    'pp': {
        titulo: 'Personalidad Profunda',
        categoria: 'Espejo',
        parrafos: [
            'Para encontrar el arquetipo de tu Personalidad Profunda –que en nuestro Mapa corresponde al triángulo de la derecha– tendrás que sumar los 3 resultados de tu Día, Mes y Año y, si es necesario, reducir la suma a un número comprendido entre 1 y 22.',
            'Ejemplos:',
            '23/11/1968 = 5 + 11 + 6 = 22',
            '20/09/1997 = 20 + 9 + 8 = 37 = 3 + 7 = 10',
            '30/12/1988 = 30/3 + 12 + 26/8 = 3 + 12 + 8 = 23 = 2 + 3 = 5',
            'En el tercer ejemplo, puedes observar que aparecen dos números especiales en el Día y en el Año: por este motivo, se escribirán fraccionados dentro de sus respectivos Pilares. Sin embargo, a la hora de calcular el número del Pilar de la Personalidad Profunda, y de los demás que veremos a continuación, solo sumaremos el número del arquetipo de base sin considerar el número especial. Por esto, nunca sumaremos un 30 ni un 26, más bien el 3 o el 8, que son sus respectivas bases.',
            'Siempre que aparezca en cualquier Pilar del esquema un número especial como resultado, lo escribirás como fracción, indicando también la base. Sin embargo, a la hora de hacer las sumas y las restas de todo el esquema que estamos creando, tendrás que recordar que se utilizará el número base, no su potencial. Ese potencial lo tendremos en cuenta solo durante el análisis de los Pilares, pero no durante las operaciones.',
            'Significado de la Personalidad Profunda',
            'Imagina que eres una casa muy grande, y en su interior viven varios inquilinos, cada uno ocupando una habitación o zona específica. Además, hay áreas comunes donde a veces se encuentran o coinciden. Estos inquilinos tienen sus propias necesidades, intereses, aficiones, miedos y habilidades. Aunque sus caracteres y aspectos pueden ser diferentes e, incluso, contrastantes, todos conviven en el mismo espacio, respetando las reglas principales establecidas por el dueño de la casa.',
            'Ahora bien, ¿quién es ese dueño? Ese dueño es tu Personalidad Profunda, el personaje principal que impregna todo tu ser y tu vida. Es quien decide la energía general de la casa (las reglas, la decoración, etc.) y deja su huella en cada rincón, mueble y detalle. Aunque su vibración está presente en toda la casa, los inquilinos (las subpersonalidades de tu inconsciente) actúan según sus propias necesidades y deseos, siempre dentro de las reglas establecidas por el dueño.',
            'La Personalidad Profunda representa la esencia con la que más te identificas, lo que crees que eres en tu núcleo interior. Es la base de tu ser, manifestándose en todos los aspectos de tu vida. La idea que tienes de ti mismo. Sin embargo, no siempre es visible para los demás. No es algo que muestres fácilmente a cualquiera; solo aquellos que están cerca de ti pueden conocerla: por eso es "profunda", no está en la superficie y no se ve a primera vista, como en el caso del Pilar del Año.',
            'Al observar las dinámicas de los diferentes Pilares, siempre debes considerar el arquetipo presente en esta posición. Representa el "Yo Soy" encarnado, tu ser fundamental. Por ejemplo, si encuentras el arquetipo 9 en este Pilar, dirás: "Yo soy un 9". Las cualidades y características asociadas a ese número marcarán tu camino de vida de manera esencial.',
            'Si conoces un poco de Astrología y has visto alguna vez una carta astral, podrás ver cómo el Sol, en el signo y casa en el cual aparece, representa tu esencia, tu personalidad profunda, y los demás planetas, otros aspectos de tu personalidad, pero todos al servicio de tu signo solar.',
            'En la Numerología de los Arquetipos, es algo muy parecido. Tu Personalidad Profunda es la que está al mando en todo momento; por mucho que quiera o sepa delegar a otros perfiles determinadas áreas de la vida, es la que siempre tendrá la última palabra.',
            'En algunos casos podrías, incluso, tener en este Pilar un arquetipo que esté aparentemente en antítesis con otra posición. Por ejemplo, el 8 y el 12 representan dos personalidades muy diferentes. Un 8 equilibrado tiene mucho amor propio, es muy asertivo y sus necesidades son, ciertamente, más importantes que las de los demás. Sin embargo, el 12 antepone siempre las necesidades de los demás a las suyas propias, está contento sólo cuando ayuda, está al servicio de los demás y, muchas veces, tiene dificultad para decir que no y ocuparse de sí mismo. Si tenemos un 8 en la Personalidad Profunda y un 12 en Pilar del Día, hay que tener muy claros los contextos en los que esas características se manifiestan. Esta personalidad será, generalmente, muy asertiva y pensará "yo soy más importante que los demás". No obstante, a la hora de una relación íntima (o en el ámbito familiar), hará descansar el 8 y actuará con el 12, anteponiendo las necesidades de su pareja, hermano o madre, y estará contento de estar a su servicio y cuidarles. En caso contrario, un 12 en la personalidad y un 8 en el Día, nos hablará de una persona dedicada al servicio de los demás constantemente, siempre entregada y disponible para todos, aunque no tanto en su familia o relaciones sentimentales, donde parece que el arquetipo que se manifiesta resulta ser mucho menos entregado, con más desapego y distancia. Y todo tiene su "por qué" y "para qué".',
            'Con respecto a este Pilar, es aquí donde encontrarás tus capacidades y habilidades profundas, tus conocimientos innatos y tu especial forma de vivir en el mundo. Además, tu mayor potencial es aquí donde se esconde. Por lo tanto, el arquetipo que se encuentre en este lugar, te ayudará incluso a desarrollar los diferentes potenciales en los otros Pilares y áreas de vida que irás, poco a poco, desplegando. Algunos llaman a esta posición "misión de vida" o "camino de vida", para que te hagas una idea. La armonía de este Pilar es tan crucial como el hecho que Atlas continúe sosteniendo el cielo sobre nuestras cabezas.',
            'Si este Pilar tuviera algún bloqueo, empezarás a vibrar con las cualidades negativas de este arquetipo, caerás en la Sombra y en el mecanismo de supervivencia y pondrás en riesgo todos los demás Pilares. Por esta razón, es fundamental, tanto que te escuches a ti mismo en cada momento, como el hecho de no alejarte nunca del sendero de la coherencia emocional.'
        ]
    },
    'resistencia': {
        titulo: 'Resistencia',
        categoria: 'Espejo',
        parrafos: [
            'Para averiguar cuál es el número de tu Pilar de Resistencia (el triangulito de la izquierda), sigue estos pasos:',
            '1.',
            'Toma los tres números de tu fecha de nacimiento: el Día, el Mes y el Año.',
            '2.',
            'Resta (no sumes) el primer número mayor con el segundo número mayor.',
            '3.',
            'Luego, resta el resultado obtenido con el tercer número.',
            '4.',
            'El último número obtenido de la resta debe estar incluido entre 1 y 22.',
            'Si no te ha quedado claro, vuelve a leer el párrafo anterior lentamente. Solo en el caso de que el resultado final de tu resta sea 0, ese 0 se transformará en 22. Así que, si aparece un 0, simplemente colocarás un 22 en el triángulo a la izquierda del Mapa. Esto sucede porque el arquetipo 22 representa tanto el último como el primero de la serie; es el arcano sin número, el inicio y el cierre de un ciclo.',
            'Ejemplos:',
            '25/12/1970 = 7/12/17 = 17-12 = 5, luego 7-5 = 2',
            '10/01/1991 = 10/1/20 = 20-10 = 10, luego 10-1 = 9 31/12/1979 = 4/12/8 = 12-8 = 4, luego 4-4 = 0 = 22',
            '30/12/1988 = 30/12/26 = 3/12/8 = 12-8 = 4, luego 4-3',
            '= 1',
            'En el último ejemplo, así como vimos en el Pilar de la Personalidad Profunda, aparecen dos números especiales en el Día y en el Año. Por esta razón, se escribirán fraccionados, así como hemos visto antes; sin embargo, a la hora de calcular la resta, utilizaremos los números de la base.',
            'Significado de la Resistencia',
            'Al igual que cada dictadura tiene su "resistencia", la tiranía de nuestro ego, también posee la suya. Aunque sea un aliado la mayor parte del tiempo, nuestro ego a veces se comporta como un verdadero dictador, obligándonos a hacer, decir y vivir cosas que no deseamos. Parece que no hay manera de rebelarse contra él. Afortunadamente, la sabia naturaleza ha colocado un Pilar de Resistencia en este ingenioso Mapa.',
            'Este Pilar es fundamental y debes observarlo constantemente, ya que representa tu "salvavidas". Funciona como una alarma que suena cuando te desvías del camino de la coherencia emocional y te alejas, inadvertidamente, del Ser y la vida, para entrar en los dominios del ego y la supervivencia.',
            'En primer lugar, te invito a estudiar y comprender a fondo todos los aspectos del arquetipo que tienes en esta posición. El número que aparezca aquí representa aquello a lo que más te resistes, así como lo que te causa sufrimiento. En otras palabras, es la causa inconsciente detrás de todos los problemas en tu vida, desde los más insignificantes hasta los más graves. Identificar esta causa lo antes posible te permitirá sanar y equilibrar tu sistema.',
            'Para que lo entiendas mejor, aquí tienes un ejemplo de cómo usarlo.',
            'Piensa en un problema de cualquier tipo que tengas en tu vida en este momento o que hayas experimentado recientemente. Puede ser una enfermedad, un síntoma, un accidente, un problema financiero, un despido o la ruptura con una pareja, entre otros. Ahora, reflexiona sobre tu estado emocional y mental justo antes de que apareciera ese estrés, conflicto, accidente o síntoma.',
            'Siempre existe un dolor o sufrimiento latente que, a veces, damos por normalizado o, incluso, pasamos por alto. Puede haber sido un impacto emocional de un momento específico, quizás unos segundos antes del evento, o incluso horas antes. También podría tratarse de un sufrimiento más constante que has llevado dentro durante días, o semanas, antes de que surgiera el problema actual.',
            'Es importante considerar que, cuanto más leve sea el problema presente, más breve será el período de sufrimiento que has experimentado. Por ejemplo, una enfermedad terminal o un accidente grave no son comparables a un esguince de tobillo o al hurto de una bicicleta. Así pues, cuanto más grave sea el problema, más tiempo has mantenido activada la "alarma" en tu Pilar de Resistencia y más ha durado tu modo de supervivencia.',
            'La pregunta clave que debes hacerte para restablecer el equilibrio interno y resolver el problema, es la siguiente:',
            '¿Qué ocurrió justo antes de la aparición de mi problema, en relación con el arquetipo que tengo en mi Pilar de Resistencia?',
            'Mira qué número te ha salido en ese Pilar y fíjate que no hayas hecho ningún error de cálculo. Lee, estudia y reflexiona sobre el significado profundo de ese arquetipo en el capítulo correspondiente. Allí encontrarás la clave para encontrar la respuesta a tu pregunta.',
            '● ¿Qué incoherencia has tenido en relación con uno, o más, aspectos de tu arquetipo?',
            '● ¿Qué has pensado y sentido cuando te dijeron, o te hicieron tal cosa?',
            '● ¿Qué has hecho, que no querías hacer, en relación a ese arquetipo?',
            '● ¿Qué has deseado hacer, y no has podido, en relación a ese arquetipo? ● ¿Qué has dicho, que no querías decir, en relación con ese arquetipo? ● ¿Qué te has tragado, que no querías tolerar, en relación a ese arquetipo? ● ¿Qué hubieras querido hacer (o decir) y no te has permitido?',
            'Identifica el evento que produjo el choque emocional y restablece la armonía tomando acción desde el Ser, no desde el Ego. En otras palabras: vuelve a la coherencia emocional. Piensa, habla y actúa con base en lo que sientes.',
            'Cuando tomes consciencia de la manera en la que funcionas y te comportas, tendrás más recursos para poner orden en tu vida y volver al sendero de la coherencia emocional.',
            'El hecho de que tengas un determinado arquetipo en el Pilar de Resistencia, quiere decir que eres más sensible que otra persona a ese arquetipo y que has venido a este mundo a trabajar ese tema, entre otras cosas.',
            'Aquello a lo que te resistes, persiste, decía Jung.',
            'El término \'resistencia\' se refiere a aquello a lo que nos resistimos, lo que nos cuesta aceptar, integrar, sanar y comprender. Cuando dejamos de resistirnos, nos entregamos al ser.',
            'El Ser nos coloca, periódicamente, en situaciones incómodas para nuestro crecimiento y evolución. Resistirse a esa evolución es un acto contrario a la naturaleza y a la vida. El ego, por su parte, es conservador y se aferra a mantener su estado actual. Su única preocupación es sobrevivir.',
            'Lamentablemente, no estamos acostumbrados a vivir en coherencia emocional durante mucho tiempo, y esto provoca que nuestro sistema colapse. Cuando nuestro Pilar de Resistencia se debilita, todo el sistema se ve afectado, y caemos en los mecanismos de la Máscara y la Sombra. Es en ese lugar donde aparecen el sufrimiento, el dolor, las enfermedades y la falta de plenitud.',
            '¿Cuántas veces habrás dicho que sí, cuando en realidad querías decir que no, o al revés?',
            'Este Pilar representa esa "resistencia" que necesitamos para estar en equilibrio todo el tiempo, ya que nos avisa y nos da señales en todo momento.',
            'Si te fijas en una estufa, un calentador, una tostadora o un aparato eléctrico cualquiera, todos tienen una resistencia que es necesaria para su perfecto funcionamiento. La energía pasa a través de esa resistencia para producir calor, electricidad o lo que sea que produzca. Sin este dispositivo, ese aparato no funcionaría. La clave está en no sobrepasar la cantidad de energía necesaria para su funcionamiento, lo que produciría un cortocircuito del sistema eléctrico, si no una explosión o un incendio, en los casos más graves. Así pues, la resistencia en el ser humano funciona exactamente igual: siempre hay que estar alerta para que no "reviente" el sistema psicoemocional.',
            'Por esta razón, es esencial que conozcas el arquetipo que tienes en este Pilar y que sepas que todos tenemos una resistencia adecuada para cada uno de nosotros. ¿O crees acaso que la Consciencia solo creó tostadoras? Cada individuo tiene una estructura y una historia personal que son únicas. En todo el universo y en todos los tiempos nunca hubo, ni habrá, otra persona igual que tú. De hecho, como hemos comentado antes, aquellas personas que nazcan el mismo día, mes y año compartirán los mismos números y arquetipos, pero cada uno de ellos se manifestará con tonos y cualidades diferentes en cada situación y según el nivel de consciencia de la persona. Aun teniendo el mismo arquetipo en la Resistencia, puede que dos personas puedan sufrir por dos razones diferentes aparentemente, pero en su esencia, esas razones estarán ligadas a los aspectos de esa vibración.',
            'El 9, por ejemplo, está relacionado, entre otras cosas, con viajes, idiomas, naturaleza, libertad y empatía. El 9 de mi Resistencia puede avisarme de que me he obligado (o me han forzado) a hacer un viaje que no quería hacer, o a estudiar un idioma que no me gusta. Sin embargo, el mismo número en la Resistencia de otra persona, podría avisarle de que está sufriendo porque se siente atrapada en una situación, una relación o un país, y que le falta libertad. Ambos, podemos estar experimentando un malestar, una enfermedad, una depresión a causa de esa incoherencia. Cuando ponemos orden y hacemos lo que sentimos, liberándonos de los programas y creencias limitantes, todo vuelve a funcionar en armonía.',
            'La idea central de este Pilar es que te acostumbres a observar y vigilar todo el tiempo este termostato emocional. Se te invita a hacer de esto un hábito, para que comprendas las diferentes formas y frecuencias en las que este arquetipo se manifiesta. Y si te estás preguntando cómo y cuándo se manifiesta en tu vida, la respuesta es simple: cuando sufres.',
            'Por todas estas razones, podrás considerar el arquetipo del Pilar de tu Resistencia como tu punto débil pero, también, como una luz que alumbra el camino. Según como lo quieras mirar, ahí aparecerán los temas que serán tus "talones de Aquiles". Sin embargo, te invito a que te acostumbres a ver esta posición como un faro que ilumina el sendero de tu coherencia emocional, y que te recuerda en cada momento quién eres y quién no eres.',
            'Es fundamental recordar que el estado natural del ser humano es la armonía. Todo lo que se aparta de esa armonía se manifiesta como ego, sufrimiento y dolor en diferentes niveles. Por lo tanto, en el momento en que un problema o dolor aparece en tu vida, es como si este Pilar de Resistencia sonara como una alarma. No importa si el problema es físico, emocional, psicológico o si se trata de un imprevisto financiero, laboral o un accidente. En resumen: cualquier problema representa una falta de armonía, y esa falta de armonía nos indica que hemos ignorado este Pilar desequilibrando nuestro sistema.',
            'El desafío radica en comprender que nuestras creencias heredadas de nuestro árbol genealógico influyen constantemente en nuestras decisiones, pensamientos, sentimientos y comportamientos. Las creencias limitantes son esas voces internas que nos hacen decir "sí" cuando queremos decir "no". Esta incoherencia emocional es una consecuencia del miedo, a menudo inconsciente, que el ego utiliza para dominarnos, junto con pensamientos y sentimientos que nos invalidan y nos desvalorizan.',
            'Aquí te presento solo algunos ejemplos para que tengas una idea:',
            '● No merezco el éxito. ● No soy lo suficientemente bueno/a. ● No puedo confiar en los demás. ● El mundo es peligroso. ● No puedo expresar mis emociones libremente. ● Me sabe mal. ● No estoy a la altura. ● No valgo. ● Soy un inútil. ● Quizás, si hago esto, me querrán. ● Soy menos que el otro. ● El otro es mejor que yo. ● El otro es más que yo. ● No puedo. ● Pobre de mí. ● Mejor me callo. ● ¿Qué pensará de mí? ● Todo (lo malo) me pasa a mí.',
            'Identificar y cuestionar estas creencias limitantes es esencial para recuperar la armonía y sanar nuestro sistema.',
            'Este conjunto de creencias limitantes forma parte, como yo lo llamo, del \'síndrome del pobrecito\'. Estas creencias son las que constantemente nos fastidian la vida. Lo que quiero decir es que, cuando nos dejamos llevar por nuestras creencias limitantes y nuestros miedos inconscientes, comenzamos a manifestar las primeras señales de alarma en nuestra vida. En ese momento, el \'ladrón\' se acerca, aunque aún no ha cometido el delito. Si no prestamos atención a estas señales (que se manifiestan a través de intuiciones, pensamientos, emociones e, incluso, eventos claros en nuestro entorno), la Resistencia se sobrecalienta y puede hacer que nuestro sistema psicoemocional colapse. El ladrón cometerá el delito, y los síntomas pueden ser leves —o graves— según la intensidad del cortocircuito.',
            'Además, si seguimos por el mismo camino de la incoherencia a pesar de tener el sistema roto, corremos el riesgo de caer completamente en la Sombra y en los mecanismos de defensa relacionados con otros Pilares de dolor. Esto podría empeorar todo el proceso, llevándonos a una explosión o un incendio, que son sinónimos de enfermedad y caos.',
            'A veces, nos dicen que tenemos libre albedrío, y quizás lo tengamos, pero es innegable que estamos constantemente condicionados por una cantidad de información de la que ni siquiera somos conscientes.',
            'Lo que suele ocurrir es que, el arquetipo que tienes en este Pilar, ha sido ignorado durante un tiempo, debido a las creencias limitantes instaladas en tu inconsciente, las cuales te han llevado por un camino de miedo, culpa, carencia y desvalorización. Cuando vuelvas a equilibrar ese \'evento desencadenante\' relacionado con los aspectos importantes del arquetipo en cuestión, tu estructura comenzará a restablecerse: la serenidad volverá a tu vida.',
            'Otro aspecto importante que no debes pasar por alto en este Pilar, es que siempre está en funcionamiento. Es como una cámara de seguridad que graba las 24 horas y está conectada a una alarma central. En cuanto se cuele un \'ladrón\' (el ego), la alarma empieza a sonar (aparece el síntoma o el problema). Además, la maravilla de este sistema \'anti-ego\' es que, incluso te avisa cuando el ladrón está acercándose, es decir, antes de que se produzca el delito. Por esta razón, es importante aprender a ver con los ojos del Ser, para poder interpretar las señales que nos envía la Consciencia en todo momento. Las sincronicidades son como mensajes divinos. El Universo es creativo y nos habla constantemente.',
            'La pregunta importante es:',
            '¿Estás escuchándote?'
        ]
    },
    'nudoEmocional': {
        titulo: 'Nudo Emocional',
        categoria: 'Espejo',
        parrafos: [
            'Este número, tan importante para tu sistema psicoemocional, se encuentra sumando el arquetipo de tu Día de nacimiento con el de tu Año. Como siempre, si el resultado de la suma es un número superior a 22, lo reducirás a un número igual o inferior, y prestarás también atención, en el caso de que aparezca un número especial.',
            'Ejemplos:',
            '21/04/1976 = 21/4/5 = 21 + 5 = 26/8',
            '29/03/1959 = 11/3/6 = 11 + 6 = 17',
            'Significado del Nudo Emocional',
            'El arquetipo que se encuentra en este Pilar describe tus necesidades emocionales, cómo te emocionas y para qué late tu corazón. En otras palabras, te dice lo que necesitas para sentirte feliz, estar bien y alimentar tu motor emocional. Cuando amas algo o a alguien, lo haces a través de los matices y cualidades del número que aparece en este lugar. Este arquetipo describe en detalle lo que necesitas satisfacer y expresar, a nivel emocional, para mantener en todo momento tranquilidad, estabilidad y paz interior; representa las necesidades más profundas que necesitan ser satisfechas, antes de cualquier otra cosa, para no caer en el mecanismo de supervivencia.',
            'Una vez que conozcas este arquetipo, tomarás conciencia de lo importante que siempre ha sido para ti alimentar esta parte de tu personalidad. Al fin y al cabo, amar y sentirnos queridos son aspectos fundamentales de la vida. Para algunos, incluso, son el centro y la base de todo. La vida, sin este Pilar, no tendría ningún sentido. Este arquetipo refleja las cualidades y características que asociamos naturalmente al amor hacia los demás, las cosas y respecto a nosotros mismos.',
            'En primer lugar, te darás cuenta de lo que es verdaderamente importante para tu corazón. Evocarás todos aquellos momentos de plenitud que has vivido hasta ahora y descubrirás que, todos y cada uno de ellos, estaban relacionados con la vibración del arquetipo presente en este lugar. Pero,',
            '¿Qué ocurre cuando no le hacemos caso a nuestro corazón y dejamos de escucharlo?',
            'Para responder a esta pregunta, debemos dar un paso atrás y recordar lo que hemos visto anteriormente en relación con el número de Resistencia. Cuando entramos en incoherencia emocional y saltan las alarmas de nuestro sistema interno, el primer Pilar que empieza a temblar es nuestro Nudo emocional, junto con el Pilar del Día de nacimiento y nuestro comportamiento con la familia, amigos íntimos y pareja. En otras palabras, cuando nos resistimos al cambio y salimos del sendero de la coherencia interna, los primeros aspectos de nuestro comportamiento que se ven afectados son aquellos relacionados con el Pilar del Día (nuestras relaciones íntimas) y nuestro Nudo emocional. Estos dos Pilares son los primeros en sentirse afectados, debido a la alta tensión de la Resistencia.',
            'Piensa esto: cuando algo empieza a ir mal en nuestra vida, cuando el dolor o el estrés aparecen de repente o de manera gradual, la esfera más afectada y donde se manifiesta más claramente esa desarmonía, es la esfera íntima y familiar. Todos a nuestro alrededor pueden percibir esos cambios, y nosotros mismos nos permitimos reflejarlos en esa área porque nos encontramos en nuestra zona de confort. Sin embargo, si no solucionamos el conflicto y no buscamos la coherencia, el dolor y el estrés se extenderán a otros ámbitos de nuestra vida, como el trabajo y la esfera social.',
            'Siempre que experimentemos un bloqueo en cualquiera de los Pilares de nuestro esquema personal, debemos examinar nuestra Resistencia. Algo ocurrió en relación con ese Pilar, pero quizás no nos dimos cuenta, y ahora estamos sufriendo las consecuencias. Nuestro Nudo Emocional, nuestro corazón simbólico, comienza a dejar de funcionar gradualmente, y el nivel de plenitud y amor disminuye considerablemente. Las cosas que antes nos emocionaban ya no nos estimulan de la misma manera, y la serenidad parece haber desaparecido de nuestro corazón, que se cierra lentamente.',
            'Este es el momento en el que se forma un bloqueo en el Nudo emocional, y se activa el mecanismo automático de supervivencia y defensa, que exploraremos durante el estudio de la Máscara. Cuando el Nudo emocional está bloqueado, dejamos de vivir plenamente y comenzamos a sobrevivir. Nada nos emociona o, al menos, no como antes. El arquetipo de este Pilar, que solía brindarnos felicidad, ya no nos proporciona placer. Ahora, lo que necesitamos es sobrevivir. Para comprender cómo hacerlo, debemos identificar el arquetipo de nuestro Nudo de Dolor, que es el equivalente del Nudo Emocional, pero en el mecanismo de supervivencia. Más tarde analizaremos este aspecto juntos.',
            'Como habrás intuido, este Pilar es extremadamente importante. Siempre tiene que estar en armonía. Si este falla, todo el sistema se irá para abajo y la Sombra aparecerá en todos los Pilares y áreas de tu vida. Así que, déjate de tonterías, abandona el síndrome del pobrecito —si es que aún no lo has hecho— y empieza a quererte un poco, a valorarte y a prescindir de las opiniones y necesidades ajenas.',
            'Tú eres el único autor y protagonista de tu vida, tú decides cómo escribir tu historia.'
        ]
    },
    'cis': {
        titulo: 'CIS — Comportamiento Interior Social',
        categoria: 'Espejo',
        parrafos: [
            'El número del CIS lo encuentras haciendo la suma de los números de tu Día y de tu Mes de nacimiento y, como siempre, el resultado tendrá que ser un número comprendido entre 1 y 22.',
            'Ejemplos:',
            '15/01/1978 = 15/1/7 = 15 + 1 = 16',
            '29/10/1967 = 11/10/5 = 11 + 10 = 21',
            '26/03/2002 = 26/3/4 = 8/3/4 = 8 + 3 = 11',
            'Significado del CIS',
            'Si tu Día de nacimiento representa tu carácter en la intimidad (con pareja, familia y amigos íntimos), este Pilar describe tu comportamiento en esa misma esfera de tu vida. Esto significa que, en esta área específica, te expresarás de forma natural con las cualidades y necesidades del arquetipo que se encuentre aquí. A diferencia del Día de nacimiento y de tu carácter (que no pueden cambiar, pero pueden oscilar entre la luz y la sombra), tu comportamiento puede transformarse por completo.',
            'Los arquetipos de los Pilares del Día, Mes, Año y Personalidad Profunda, al estar en la línea divisoria horizontal entre el Espejo y la Máscara, pueden fluctuar entre la claridad y la oscuridad en cualquier momento, si hay bloqueos o desequilibrios. El arquetipo permanece idéntico, pero manifestará sus cualidades positivas o negativas según la armonía o desarmonía presente. Sin embargo, esto no ocurre con el CIS, que desaparecerá por completo en caso de bloqueo, y en su lugar podría aparecer un arquetipo totalmente diferente, que se activaría en la Máscara.',
            'Desde una perspectiva psicológica, la gran diferencia entre el carácter y el comportamiento es que, el primero, tiene una estructura firme e inmutable. Una persona nace con un carácter específico, y eso no cambia. Lo que sí puede variar son las cualidades positivas o negativas de ese carácter, como mencionamos anteriormente. Por otro lado, el comportamiento puede mejorar, empeorar, actualizarse o transformarse completamente con el tiempo, y según nuestra evolución personal y crecimiento interior.',
            'Por un lado, el arquetipo del CIS representa los aspectos fundamentales que necesitas expresar en tu vida íntima, dentro de tu hogar, con familiares y pareja. Es el arquetipo con el que te comportas de manera natural en ese ámbito, y es reconocible para quienes te rodean. Por otro lado, junto con tu Día de nacimiento, también describe el tipo de personas (amigos y parejas) que te atraen y buscas en tu entorno. En otras palabras, el Día y el CIS comparten el mismo ámbito de vida: la intimidad y el interior del hogar. Son dos arquetipos que se suelen expresar en conjunto en esa área.',
            'Un aspecto interesante de este Pilar es que también revela uno de los tres ingredientes principales de tu área profesional. Si prestas atención a este arquetipo, notarás que sus cualidades y características están relacionadas con aspectos importantes para ti en tu trabajo. Cuando estás en armonía, disfrutas de tu labor y sientes satisfacción personal: esto indica que estás alineado con este arquetipo y todo fluye. Si no es así, la vibración de este Pilar desaparecerá y se manifestará la esencia del CID (Comportamiento Interior de Dolor), que exploraremos en el estudio del mecanismo de supervivencia.',
            'Un ulterior dato interesante sobre este Pilar es que el arquetipo que aquí aparece refleja, asimismo, uno de los dones heredados por linaje materno, igual que el del Día. Aquí tenemos almacenada más información sobre nuestro Proyecto Sentido materno: el "para qué existo" desde la perspectiva de mamá, el resultado de sus sueños, deseos, miedos, dudas, preguntas y aspiraciones, conscientes y, sobre todo, inconscientes, de nuestra dadora de vida. Ambos, el Día y el CIS, nos hablan de esa herencia materna: todo aquello que nuestra madre proyectó en nosotros involuntariamente.'
        ]
    },
    'ces': {
        titulo: 'CES — Comportamiento Exterior Social',
        categoria: 'Espejo',
        parrafos: [
            'Encontrarás el arquetipo del CES sumando los números del Mes y del Año de nacimiento. El resultado final será siempre un número incluido entre 1 y 22, teniendo en cuenta posibles números especiales, no lo olvides.',
            'Ejemplos:',
            '22/12/1945 = 22/12/19 = 12 + 19 = 31 = 3 + 1 = 4',
            '28/11/1959 = 10/11/6 = 11 + 6 = 16',
            'Significado del CES',
            'El arquetipo que se encuentra en este Pilar corresponde a la prolongación del carácter exterior, es decir, el Pilar del Año. Por lo tanto, aquí se describe ese aspecto de tu personalidad que es fácilmente visible por los demás, esa parte de ti más sociable que irradias de forma natural. Junto con el arquetipo de tu Año de nacimiento, aquí encontramos el segundo aspecto de tu máscara social, la que te pones en cuanto salgas de casa.',
            'Así como hemos visto por el comportamiento interior, el comportamiento exterior también puede cambiar por completo cuando no estás en armonía o se ha generado una herida o un bloqueo.',
            'Este Pilar, igual que el de tu Año, es importante conocerlo porque representa la cara visible de nuestro ser, cómo nos "vendemos" a los demás, qué es lo primero que ve la gente en nosotros, qué cara queremos enseñar a la gente para gustar de manera automática. Si la gente de tu entorno no ve o percibe algunos de los temas de este Pilar, es muy probable que esté bloqueado y que te encuentres funcionando con el mecanismo de supervivencia. Cuando se apaga un Pilar del Espejo, se enciende automáticamente su correspondiente Pilar de la Máscara.',
            'Adicionalmente, junto con el CIS, este arquetipo representa el segundo ingrediente de tu Pilar profesional. La vibración que aquí resulte, será un aspecto necesario, un interés especial, una habilidad o talento innato que, de manera natural, podrás (y tendrás) que desarrollar en tu entorno laboral y vocacional. En otras palabras, podemos afirmar que, independientemente de tu perfil profesional (que enseguida veremos), tendrás que prestarles mucha atención a estos dos arquetipos, el CIS y el CES, para que siempre estén presentes en tu profesión y en tus proyectos laborales. Si así no fuera y el arquetipo de tu comportamiento exterior desapareciera por algún tipo de bloqueo, empezarías a funcionar en automático con el arquetipo del comportamiento exterior de dolor, que estudiaremos después.'
        ]
    },
    'pes': {
        titulo: 'PES — Personalidad Exterior Social',
        categoria: 'Espejo',
        parrafos: [
            'Toma tu CIS, súmale tu CES, y así tendrás el arquetipo de tu Pilar profesional, oficialmente conocido con el nombre de Personalidad Exterior Social.',
            'Significado del PES',
            'Este arquetipo es la suma de todos tus talentos, habilidades, deseos, pasiones, capacidades y potencial de tu vida profesional. Representa lo que has venido a hacer para la comunidad y para toda la humanidad, el Pilar del servicio y del trabajo.',
            'Ya hemos visto cómo el CIS y el CES, entre otros aspectos que manifiestan, nos hablan de dos ingredientes fundamentales para nuestra esfera laboral. Sea lo que sea que decidamos hacer con nuestras vidas, estos dos arquetipos tendrán que estar presentes en algunas de sus manifestaciones, dentro de lo que llamamos profesión. Sin embargo, el arquetipo protagonista e insustituible para esta área tan importante de la vida es, precisamente, la suma de ambos, que, al igual que dos elementos químicos, se fusionan creando una nueva aleación.',
            'Pero, fíjate en el nombre de este Pilar: Personalidad Exterior Social. Aquí, no se trata realmente de "trabajar", sino de manifestar un aspecto natural de tu personalidad, pero hacia la sociedad. En este Pilar, volvemos a recordar que el ser humano es un ser social que no puede vivir fuera de su tribu, y que la tribu y él son interdependientes. Cada individuo, sin su grupo, fuera de su clan, está muerto. La Biología lo sabe muy bien y, en el reino animal, la manada es sinónimo de vida, mientras que el aislamiento, equivale a la muerte.',
            'La palabra \'trabajo\' fue inventada por el ser humano en algún momento de su evolución y, aún hoy en día, evoca sentimientos y pensamientos relacionados con el esfuerzo, la obligación, la opresión, el sacrificio, el cansancio o el deber. Por una parte, esto es cierto, sin duda, para algunos: si queremos sobrevivir, tenemos que trabajar. Estoy seguro de que muchos de nosotros hemos estado de acuerdo con esta afirmación hasta hoy. Yo, desde luego, lo estaba hasta hace unos años.',
            'Tenemos que trabajar (duramente) para ganarnos la vida.',
            'Esta creencia la tenemos, o la hemos tenido todos (o casi todos) instalada en nuestro "software" interno, nada más nacer. Es una de las creencias más limitantes y más poderosas al mismo tiempo.',
            'Pero, tú y yo, ya aprendimos, que no estamos aquí para sobrevivir, ¿verdad?',
            'Estoy seguro de que, si has llegado a leer hasta esta página, es porque quizás hayas redescubierto tus ganas de vivir, más que de sobrevivir. Pues aquí tienes un arquetipo magnífico para que puedas empezar a hacerlo.',
            'Cuando dejes de escuchar la voz de tu dictador interno cargada de miedo, y de creencias desvalorizantes y limitantes, descubres que has venido al mundo con un talento inmenso para compartir con la comunidad, con tu tribu. Este talento, esta gran habilidad que posees de una manera única, porque único es lo que eres y único es lo que guardas en este Pilar.',
            'Esta vibración nos habla del servicio a la comunidad. El arquetipo que aparezca en esta posición te revela lo que tu Ser desea, y sabe hacer, para su tribu, para su entorno, para sus hermanos y para el mundo entero.',
            'Hemos venido a este mundo para dar y recibir, así como para aprender que, dar y recibir son, efectivamente, lo mismo.',
            'Cuando damos al otro, nos estamos dando a nosotros mismos. La Ley del Espejo nos lo recuerda en cada momento. Todo lo que ocurre entre tú y otra persona, revela tu manera de relacionarte contigo mismo. El otro solo te puede dar, decir y hacer lo que tú te das, te dices y te haces a ti mismo, en los niveles más profundos de tu inconsciente, según las creencias y memorias que estén activas en ese momento. Si esta relación individual la proyectamos al colectivo, la norma universal del Espejo seguirá permaneciendo. Lo que yo ofrezco y doy felizmente a los demás, eso mismo recibo a cambio.',
            'Si prestas atención a aquellas pocas tribus que aún quedan en el mundo, y que aún viven en armonía con la naturaleza y más aislados de la contaminación del mundo moderno, observarás que, en cada comunidad, todo el mundo tiene un rol bien definido según sus posibilidades y capacidades. En estos sistemas de convivencia, cada uno obtiene, a cambio, un beneficio de parte de su comunidad por ese servicio que ofrece, ya sea en alimento, agua, amparo, cuidado u otro tipo de servicio.',
            'Este intercambio sagrado se perdió en algún momento de la historia, quizás incluso el mismo día en el que Adán y Eva fueron expulsados del Edén. Nuestros progenitores vivían en un paraíso terrenal y lo perdieron. Lo extraviamos también todos los humanos.',
            'El arquetipo que encuentres en esta posición, te ayudará a recuperar ese paraíso: un servicio para tu comunidad que no sea un trabajo, en el que no haya esfuerzo, sacrificio, cansancio, ni explotación. Esta vibración habla de tu talento natural y todos tenemos uno, o más de uno. ¡No te creas tan especial como para no poseer ninguno! Para que brote y florezca en ti este talento, escucha tu corazón, pon en orden tu vida, alinéate con tus sentimientos más profundos, vuelve al sendero de la coherencia emocional. Escúchate, permítele a tu maestro interno guiarte y sigue cada una de tus intuiciones. Este arquetipo no te dice nada nuevo de ti, sino que te recuerda quién eres, de qué eres capaz, qué es lo que más te apasiona y cuál o cuáles son aquellas tareas que estarías horas y horas desarrollando, sin ni siquiera mirar el reloj. Cuando vibras con tu esencia y con tus pasiones, vuelves a conectar con tu propósito social, con tu don para la comunidad, de la cual recibirás a cambio y sin duda alguna, su contraparte. Recuerda que, si das, recibes al mismo tiempo. Simplemente, observa qué es lo que estás recibiendo, y sabrás lo que estás dando.',
            'Cuando este arquetipo está presente en esta área de tu vida, ya dejarás de quejarte por tu salario, tu jefe, tus horarios o tus compañeros. Tu frecuencia ya no estará anclada en el miedo, la carencia y la supervivencia. Romperás las cadenas de la explotación y esclavitud que has vivido hasta ahora, y la palabra',
            '"sacrificio" evocará solo un sueño del que, finalmente, despertaste.',
            'Además, te cuenta la manera en la que dejarás de "prostituirte" por un salario, porque lo vas a manifestar con todo su potencial cuando salgas de la Sombra, comenzando a vivir en la abundancia, en la prosperidad y en la plenitud. Una vez que te hayas alineado con tu propósito de vida, que es lo que te recuerda este arquetipo, finalmente dejarás de "ganarte la vida", y empezarás a manifestar y materializar de manera natural, desde el centro de tu corazón. Poniendo al servicio tus dones, habilidades y talentos para los demás, recibirás, a cambio, mucho más que un salario, sin esfuerzos, sin fatiga, sin sufrimiento, pero con acciones conscientes y coherentes de manera natural y en perfecta resonancia con tu Ser.',
            'Ahora, recuerda y conecta con tus pasiones, con tus habilidades y con lo que más amas. Imagina esas actividades con las cuales pasarías horas y días sin mirar el reloj, que en lugar de cansarte, te llenarían de alegría, energía y te inspirarían. Imagina un trabajo del cual no necesites vacaciones, porque lo haces libremente y disfrutando, según tus propios tiempos, ritmos, reglas y normas. Imagínate un lugar donde ofreces lo que eres y lo que sabes, un espacio donde, simplemente, puedes ser tú mismo, y hacer lo que sabes hacer y te gusta hacer y, además, generando dinero, abundancia y prosperidad, para ti y para los demás. Un lugar donde tu valor se multiplique y sea contagioso. Todo esto es lo que nos cuenta el arquetipo guardado en este Pilar.',
            'Te cuento un secreto:',
            'No necesitas ganarte la vida. La vida se te entregó el día de tu nacimiento y ya te la ganaste.',
            'Ahora, ha llegado el momento de expandir esa vida en tu entorno e irradiar desde tu Ser lo que has venido a hacer: tu propósito. A partir de este momento, ya no dependes del paradigma de la vieja escuela del Ego, que es el siguiente:',
            'HACER-TENER-SER: Primero, hay que hacer algo, para obtener otra cosa a cambio — dinero/alimento— y, solo al final del día, si es que queda tiempo y energía, ser tú mismo.',
            'Este Pilar nos enseña a poner orden en nuestra vida, volviendo primero al SER y reformulando el paradigma, así como era en sus orígenes:',
            'SER-HACER-TENER Descubre, primero, quién eres, alinéate con tu verdadero Ser y, solo después, haz y actúa, desde el Ser, según lo que eres y sientes de verdad. Haciendo esto, vuelves a tu estado natural y lo de tener, u obtener, se transforma en una consecuencia natural y espontánea de aquella alineación.',
            'Lo que vas a conseguir cuando vuelvas a vivir —y a trabajar— desde el Ser, es mucho más que un salario, porque el dinero solo es una de las expresiones de la abundancia y de la prosperidad que llegará a tu vida cuando vuelvas a equilibrar este Pilar y todos los Pilares de tu Mapa. El estado natural del ser humano es salud, abundancia y prosperidad. Si nos faltan estos elementos, es porque hemos perdido el camino del amor y hemos estado vagabundeando por el camino del miedo o la culpa.',
            'Este Pilar te recuerda que, la abundancia de otros, es tu abundancia. Si tienes un negocio y explotas a tus empleados, jamás brillarás o tendrás éxito. La abundancia de tus empleados, de tus compañeros y de tu "familia profesional", es tu propia abundancia: si participas de ella y ayudas a tus hermanos a crecer y prosperar, estarás generando tu propia prosperidad.',
            'La abundancia es un tema de enfoque: si creo que la abundancia de otro es mi miseria, estaré generando más miseria en mi vida. Sin embargo, si pongo el foco en la abundancia del otro, multiplicaré ese foco en el otro y en mí, porque el inconsciente sabe que el Ser del otro y mi Ser son un único Ser. ¿Recuerdas?',
            'Una vez más, te pido que no me hagas caso a mí, sino a esa voz que tienes en tu interior. Descubre cada uno de tus arquetipos, lee, estudia y medita todos los aspectos y significados de cada uno de ellos y observa cómo te sientes cuando conectas con esa vibración. En realidad, no te estoy contando nada nuevo, más bien descubrirás que, lo que los arquetipos cuentan, es tu historia personal. Te recuerdan quién eres y a qué has venido a este mundo.',
            'Así que ya no tienes excusas. Ponte a trabajar de verdad… pero en ti mismo. Desaloja los programas limitantes y desahucia todos tus miedos, uno por uno. Estúdiate, investiga, conócete y haz todo lo posible por desinstalar todas tus creencias limitantes y condicionantes. Creo que no te has enterado, pero ya no estamos en 1998: tu sistema operativo está obsoleto y oxidado.',
            'Ahora, tienes el Mapa de los Arquetipos para poner en orden tu vida y volver a ese paraíso del que te autoexpulsaste. Y también dispones de infinitos instrumentos de estudios, y enseñanzas, en cada esquina. Hoy tienes, y tenemos, acceso a una fuente de conocimiento ilimitado y el saber lo llevas, literalmente, en tu bolsillo.',
            'Y con estas palabras, nos despedimos de este Pilar:',
            'En el siglo XXI, no hay excusas para ser ignorante.'
        ]
    },
    'armonia': {
        titulo: 'Armonía',
        categoria: 'Espejo',
        parrafos: [
            'Lo que encontrarás en este Pilar será la suma de tu Personalidad Profunda y de tu PES.',

            'Recuerda tomar este arquetipo todos los días, al menos tres veces al día.'

    'emergencia': {
        titulo: 'Emergencia',
        categoria: 'Espejo',
        parrafos: [
            'Para encontrar el arquetipo de esta posición, suma tu PES con tu Resistencia, y lo descubrirás.',

            'Si consideramos que la armonía es tu medicamento natural personalizado, este Pilar sería como un "hospital natural" al que acudirías cuando esa medicina parece no ser suficiente. Tal vez has pasado demasiados días en incoherencia contigo mismo, o bien has estado sin tomar tu dosis de armonía durante demasiado tiempo. En este caso, el estrés ha llegado a tu vida y necesitas algo más que una simple píldora; necesitas un buen flotador para no ahogarte en alta mar, para evitar hundirte en la miseria que, lentamente, ha aparecido en tu vida.',
            'Cada vez que te haces pasar por alguien que no eres, te hundes un poco más. Te recomiendo que observes atentamente tus pensamientos, palabras y acciones, y que seas lo suficientemente valiente como para enfrentarte a la verdad: ¿estás actuando con coherencia en todo momento? Si la armonía ha desaparecido temporalmente de tu vida, puedes estar seguro de que tu Pilar de Resistencia se ha activado, y algún tema relacionado con el arquetipo presente allí te ha causado dolor o ha reactivado una antigua herida.',

            'Afortunadamente, cuentas con el Pilar de Emergencia para actuar de inmediato. El arquetipo en esta posición se asemeja a nuestras "urgencias hospitalarias"; los temas asociados con este número son tu salvación para mantener la salud, la armonía y eliminar ese estrés.',
            'Aquí tienes algunos ejemplos prácticos, para que puedas entender cómo actuar "en caso de emergencia".',
            '● Emergencia 17: queda con tus amigos, date un masaje, abraza. ● Emergencia 5: ciérrate en casa un tiempo y descansa, ordena o reordena el espacio, decora, sé coherente con tus principios. ● Emergencia 9: haz un viaje, pasa un tiempo en la naturaleza, habla o estudia otro idioma, cocina, experimenta o explora algo nuevo. ● Emergencia 15: haz un poco de deporte intenso, recupera antiguas pasiones, practica sexo de calidad. ● Emergencia 3: habla de lo que piensas y sientes con alguien, lee un libro, estudia, aprende algo nuevo. ● Emergencia 22: materializa un proyecto que tenías en mente, haz algo creativo y artístico, rebélate a las normas impuestas. ● Emergencia 21: haz una escapada fuera, prepara un plan cultural, sal a tomar una copa o a cenar en un restaurante, ve a una conferencia, haz un viaje astral. ● Emergencia 6: haz algo divertido, queda con amigos para reírte y pasarlo bien, ve una película o serie de risas, suspende el trabajo y las responsabilidades. ● Emergencia 19: haz actividad física intensa, retírate a un lugar tranquilo y silencioso, recupera tu paz y armonía.',

        ]

    'busqEmocional': {
        titulo: 'Búsqueda Emocional',
        categoria: 'Espejo',
        parrafos: [
            'Este lugar lo encontrarás en el lado derecho del esquema, justo fuera del Mapa, aun perteneciendo al mismo. Para calcularlo, tendrás que sumar el arquetipo de tu Personalidad Profunda con el de tu Nudo Emocional.',
            'Significado de la Búsqueda Emocional',
            'A este Pilar, lo dibujamos fuera del rectángulo principal porque, de alguna manera, representa la puerta de entrada y salida de tu personalidad, y tiene diferentes explicaciones.',
            'Un poco como el Pilar de la Armonía, el arquetipo que aquí se encuentra permite que tu sistema psicoemocional esté siempre en su mejor estado. Si te fijas, aparece una línea que lo conecta directamente a tu Nudo Emocional, y no es por casualidad.',
            'Esta posición describe aquellos aspectos que hacen que tu Nudo funcione de la mejor manera y que no sufra demasiados bloqueos. Se parece un poco al lubricante que le pones a los mecanismos de hierro para que no se oxiden, como el aceite en las cadenas de una bici o en un viejo cerrojo. Para que tu corazón/nudo no se oxide, este arquetipo es aquel aceite que le tienes que aplicar de vez en cuando para que siga funcionando bien. Por esta razón, aquí también encontraremos aquellas actividades y temas que te relajan y con los que te gusta pasar el tiempo. Sin embargo, a veces nos olvidamos de recortar ese tiempo para relajarnos, para disfrutar de la vida, y este arquetipo nos recuerda que hay que parar para poder disfrutar de nuestros placeres.',
            'Como te he mencionado, en este lugar está puesta la puerta de tu casa, y la atraviesas cuando quieres salir de ti mismo, cuando quieres descansar, relajarte, desconectar o, mejor dicho, reconectar con tu Ser.',
            'El arquetipo que aquí aparece —junto con los de la Armonía y de la Emergencia— describe aquel gran recurso contra el estrés y el dolor en tu vida. Haz que estos tres arquetipos estén siempre presentes y activos para mejorar, y mantener, la calidad de tu salud y tu bienestar físico, emocional y mental.',
            'Otro aspecto interesante de esta "puerta" es que puedes utilizarla para comprender mejor a los demás y, sobre todo, para acercarte a ellos. Es como cuando vas a visitar a alguien en su casa: primero llamas a la puerta o tocas el timbre, y solo en ese momento alguien se acerca a la puerta y tal vez la abre para dejarte entrar. De manera similar, este Pilar representa ese "timbre" que te permite acercarte a la persona que tienes delante y que te abra su "casa"',
            'Cuando conoces el arquetipo que una persona tiene en esta posición, te resultarà, mucho más fácil, acercarte a ella. Al estimular y evocar los aspectos relacionados con este Pilar, logramos que la otra persona se relaje y se sienta cómoda en nuestra presencia. A nivel terapéutico, conocer este número en el Mapa de tus pacientes te ayudará a que se sientan más a gusto y confíen más fácilmente en ti. De hecho, podrán abrir, literalmente, la puerta de su mundo interior.',
            'Imagina que acabas de conocer a un potencial cliente y descubres que su número en esta posición es el 17. En ese caso, buscarás un contacto físico: un apretón de manos, un toque en el hombro o, incluso, un abrazo al despedirte. Sin embargo, si el número fuera 8, mantendrás las distancias y nunca invadirás su espacio personal. Con un 18 podrías preguntar sobre su pasado, su infancia y sus recuerdos y, quizás, si supieras cómo, acompañarle, incluso, en una regresión. En el caso de un 15, le podrías preguntar sobre lo que más le apasiona, mientras que con un 5, mejor pregúntale sobre su casa, cómo es la decoración, si es suya, si vive ahí con alguien. Y si el número que apareciera fuera un 21, podrías indagar sobre sus planes de viajes o si, acaso, cree en la existencia de vida en otros planetas.',
            'Como ves, cuando comprendas a fondo tus mecanismos internos, todas tus relaciones mejorarán sin duda, porque sabrás que cada uno de nosotros tenemos una sensibilidad y un funcionamiento diferentes, además de una historia detrás de la historia que te estamos contando. Cuando conozcas en profundidad los arquetipos, comprenderás las necesidades emocionales de los demás y sabrás qué podrás hacer exactamente en el caso de que te pidan ayuda.',
            'Piensa en unos padres que conozcan el arquetipo que su hijo pequeño tiene en esta posición: de manera inmediata, sabrán cómo tranquilizarlo y calmarlo, en caso de necesidad, simplemente estimulando y evocando las vibraciones de su Búsqueda Emocional.',
            'O quizás acabas de conocer a una chica o a un chico que te atrae y no sabes cómo acercarte. Con que conozcas la fecha de su nacimiento, tienes la mitad del camino despejado. Háblale de los temas de su Búsqueda Emocional: observa cómo reacciona y cómo se acerca a ti.',
            'Sin embargo, no pienses en ningún momento que el Mapa de los Arquetipos pueda ser de utilidad alguna en el caso de que se te ocurra controlar o manipular a alguien con segundas intenciones. La Consciencia nunca lo permitiría. Cuando vibras en el amor, lo haces de manera natural con todos los arquetipos de tu Espejo, y ahí no hay espacio para el control ni la manipulación. En ningún momento podrás usar estos conocimientos con intenciones que no estén guiadas por el amor, y tampoco nadie podrá emplearlos en tu contra.'
        ]
    },
    'busqEspiritual': {
        titulo: 'Búsqueda Espiritual',
        categoria: 'Espejo',
        parrafos: [
            'Ese círculo flotante en la parte alta del esquema corresponde a tu evolución espiritual. El número que aquí aparece es el resultado de la suma de tu Personalidad Profunda y tu Mes de nacimiento.',
            'Significado de la Búsqueda Espiritual',
            'Este Pilar nos muestra cómo evolucionamos como seres espirituales. Representa, en cierta medida, el viaje de nuestra alma, espíritu o conciencia, como prefieras llamarlo. El arquetipo que aquí se encuentre puede ser muy diferente de aquel de la Personalidad Profunda, y nos invita, a través de esa vibración, a crecer y a evolucionar.',
            'Sin crecimiento, hay estancamiento; si no evolucionamos, involucionamos y, tarde o temprano, sentiremos un gran estado de insatisfacción que podría llevarnos a una progresiva caída en la Sombra.',
            'De vez en cuando, debemos prestar atención a este arquetipo, ya que nos dirá si nos hemos alejado de nuestro camino principal y de nuestra misión de vida. La historia que nos cuenta es la nuestra propia, lo que estamos destinados a ser y desarrollar. Es el mayor potencial que llevamos dentro listo para ser desatado, pero solo si así lo deseamos.',
            'La palabra "destinado" nunca debe sonar como una obligación; más bien, es una invitación o un recordatorio. Cuanto más en armonía esté nuestra estructura psicoemocional, más alineados estaremos con nuestro propósito de vida.',
            'En muchas ocasiones, el arquetipo que encontramos aquí será el mismo que aparecerá en nuestro PES. Esto ocurre porque, aunque no siempre, nuestra vocación, profesión o trabajo en el mundo está relacionado con nuestro propósito espiritual. Cuando los números de estos dos Pilares coinciden y la tríada PES-CIS-CES está en perfecta armonía, podemos estar seguros de que también estamos cumpliendo con nuestra Búsqueda Espiritual a través de nuestra profesión. Sin embargo, el arquetipo de este Pilar también se proyecta en todas las áreas de nuestra vida, ya que nuestro propósito y evolución no están limitados a nuestra profesión o servicio a la comunidad. Nuestro propósito de vida se manifiesta en cada minuto y hora de nuestros días, tanto dentro como fuera del trabajo, dentro y fuera de casa, en soledad o en compañía.',
            'Este arquetipo atraerá circunstancias, situaciones y personas que estimularán algunos, o todos, los matices que le corresponden, favoreciendo nuestra evolución personal. Al igual que todos los demás, nunca nos exigirá que seamos o hagamos algo que no queramos. Estas vibraciones hablan de nosotros en todo momento, de lo que amamos, de lo que somos y de nuestros deseos más profundos, incluso aquellos que aún no conocemos.',
            'Gracias a este Pilar, miraremos al cielo y diremos:',
            '¡Hágase tu voluntad, que también coincide con la mía! …aunque, aún, no seas consciente de tu voluntad más profunda.'

    'nudoDolor': {
        titulo: 'Nudo de Dolor',
        categoria: 'Máscara',
        parrafos: [
            'De la misma manera en la que utilizaste los números de tu Día y de tu Año para encontrar tu Nudo Emocional, te servirás de aquellos mismos Pilares pero, en este caso, en lugar de sumarlos entre ellos, al número mayor le restarás el número menor.',
            'Ejemplos:',

            'En el último ejemplo te fijarás una vez más que, aunque aparezca un número especial en el Pilar del Día —el 30— la suma o la resta siempre se hará utilizando su base, en este caso el 3.',
